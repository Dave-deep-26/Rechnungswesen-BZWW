."},{id:"b6-3-A1",label:"A1 \u00B7 Lohnzahlung verbuchen",text:"Verbuche die Lohnzahlung des Bruttolohns CHF 6'000 vollst\u00E4ndig: Personalaufwand an Verbindlichkeiten Sozialversicherungen, Verbindlichkeiten Personalvorsorge, Verbindlichkeiten Quellensteuer und Bank. (4 Buchungen)",anzahlBuchungen:4,loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:468},{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitenvorsorge"],betrag:300},{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitenquellensteuer"],betrag:480},{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:4752}]]},{typ:"abschnitt",label:"Teil B \u00B7 Einfacher Fall (Bruttolohn CHF 4'000)",farbe:"#1D4ED8",intro:"Zweiter Mitarbeitender ohne BVG und ohne Quellensteuer. Abz\u00FCge: AHV/IV/EO 212, ALV 44, NBU 56 (zusammen 312). Nettolohn 3'688."},{id:"b6-3-B1",label:"B1 \u00B7 Lohnzahlung verbuchen",text:"Verbuche die Lohnzahlung des Bruttolohns CHF 4'000: Personalaufwand an Verbindlichkeiten Sozialversicherungen (312) und Bank (3'688). (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:312},{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:3688}]]},{typ:"abschnitt",label:"Teil C \u00B7 Reflexion",farbe:"#A85930"},{id:"b6-3-C1",typ:"interpretation",label:"C1 \u00B7 Warum voller Bruttolohn als Aufwand?",text:"Warum wird der volle Bruttolohn als Personalaufwand gebucht und nicht nur der ausbezahlte Nettolohn?",musterloesung:["Der gesamte Bruttolohn ist die Gegenleistung f\u00FCr die geleistete Arbeit und damit der tats\u00E4chliche Aufwand des Unternehmens.","Die Arbeitnehmerabz\u00FCge sind wirtschaftlich Lohnbestandteile, die das Unternehmen treuh\u00E4nderisch einbeh\u00E4lt und an die Sozialwerke weiterleitet. Sie werden zu Verbindlichkeiten, nicht zu einer Aufwandsminderung.","W\u00FCrde nur der Nettolohn als Aufwand gebucht, w\u00E4re der Personalaufwand zu tief ausgewiesen und der Gewinn zu hoch.","Die Verbindlichkeiten zeigen, dass das Unternehmen den Sozialwerken noch Geld schuldet, bis die Abrechnung erfolgt.","So bleibt das Bruttoprinzip gewahrt: Aufwand und Schulden werden vollst\u00E4ndig und unverrechnet ausgewiesen."]}]},b6_aufgabe4={title:"Aufgabe 4: Arbeitgeberbeitr\u00E4ge",subtitle:"Den Arbeitgeberanteil als zus\u00E4tzlichen Aufwand verbuchen",tabLabel:"Aufgabe 4",context:"Zus\u00E4tzlich zum Bruttolohn tr\u00E4gt der Arbeitgeber seine eigenen Beitr\u00E4ge. Sie werden als Sozialversicherungsaufwand gebucht und erh\u00F6hen die effektiven Personalkosten \u00FCber den Bruttolohn hinaus. F\u00FCr diese Aufgabe gelten Arbeitgebers\u00E4tze: AHV/IV/EO 5.3%, ALV 1.1%, BU 0.8%, FAK 1.5%; BVG-Arbeitgeberanteil als Betrag.",theorie:{title:"Theorie: Arbeitgeberbeitr\u00E4ge",blocks:[{type:"text",text:"Der Arbeitgeber zahlt parit\u00E4tisch dieselben S\u00E4tze wie der Arbeitnehmer bei AHV/IV/EO und ALV, dazu allein BU und FAK. Diese Beitr\u00E4ge sind ein eigener Aufwand und werden nicht vom Lohn abgezogen."},{type:"formel",text:"Arbeitgeberbeitr\u00E4ge = AHV/IV/EO 5.3% + ALV 1.1% + BU 0.8% + FAK 1.5% (auf Bruttolohn) + BVG-Arbeitgeberanteil"},{type:"beispiel",text:"Bruttolohn CHF 6'000. Arbeitgeber: AHV/IV/EO 318, ALV 66, BU 48, FAK 90, zusammen 522 (Sozialversicherungen). BVG-Arbeitgeberanteil 300 (Personalvorsorge). Buchung: Sozialversicherungsaufwand an Verbindlichkeiten Sozialversicherungen 522 und an Verbindlichkeiten Personalvorsorge 300."},{type:"merksatz",text:"Der Arbeitgeberanteil ist Aufwand, kein Lohnabzug. Er macht die echten Personalkosten (Vollkosten) sichtbar, die deutlich \u00FCber dem Bruttolohn liegen."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Berechnung (Bruttolohn CHF 6'000)",farbe:"#1B6B63"},{id:"b6-4-A1",typ:"kennzahl",label:"A1 \u00B7 Arbeitgeber Sozialversicherungen",text:"Berechne den Arbeitgeberbeitrag f\u00FCr AHV/IV/EO (5.3%), ALV (1.1%), BU (0.8%) und FAK (1.5%) zusammen auf CHF 6'000 (CHF).",erwartet:522,einheit:"CHF",toleranz:.5,loesung:"6'000 \u00D7 (5.3% + 1.1% + 0.8% + 1.5%) = 6'000 \u00D7 8.7% = CHF 522.00."},{id:"b6-4-A2",typ:"kennzahl",label:"A2 \u00B7 Total Arbeitgeberbeitr\u00E4ge",text:"Inklusive BVG-Arbeitgeberanteil von CHF 300: Wie hoch sind die gesamten Arbeitgeberbeitr\u00E4ge (CHF)?",erwartet:822,einheit:"CHF",toleranz:.5,loesung:"522 (Sozialversicherungen) + 300 (BVG) = CHF 822.00."},{typ:"abschnitt",label:"Teil B \u00B7 Verbuchung",farbe:"#0F766E",intro:"Der Arbeitgeberanteil wird als Sozialversicherungsaufwand gebucht, gegen die jeweiligen Verbindlichkeiten."},{id:"b6-4-B1",label:"B1 \u00B7 Arbeitgeberbeitr\u00E4ge verbuchen",text:"Verbuche die Arbeitgeberbeitr\u00E4ge: Sozialversicherungsaufwand an Verbindlichkeiten Sozialversicherungen (522) und an Verbindlichkeiten Personalvorsorge (300). (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["sozialversicherungsaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:522},{sollKeys:["sozialversicherungsaufwand"],habenKeys:["verbindlichkeitenvorsorge"],betrag:300}]]},{typ:"abschnitt",label:"Teil C \u00B7 Reflexion",farbe:"#A85930"},{id:"b6-4-C1",typ:"interpretation",label:"C1 \u00B7 Lohnnebenkosten",text:"Was bedeutet der Arbeitgeberanteil f\u00FCr die echten Personalkosten? Rechne am Beispiel und ziehe eine Schlussfolgerung.",musterloesung:["Bruttolohn CHF 6'000, Arbeitgeberbeitr\u00E4ge CHF 822. Vollkosten = 6'000 + 822 = CHF 6'822.","Die Lohnnebenkosten betragen hier 822 / 6'000 = 13.7% des Bruttolohns.","Schlussfolgerung: Ein Mitarbeitender mit CHF 6'000 Bruttolohn kostet das Unternehmen rund CHF 6'822 pro Monat, also deutlich mehr als der Bruttolohn.","Bei Kalkulationen, Stundens\u00E4tzen und Budgets muss immer mit den Vollkosten gerechnet werden, nicht nur mit dem Bruttolohn.","Bei Dienstleistungsbetrieben, wo Personal das Hauptproduktionsmittel ist, sind diese Vollkosten der gr\u00F6sste Aufwandsblock \u00FCberhaupt."]}]},b6_aufgabe5={title:"Aufgabe 5: Abrechnung mit den Sozialwerken",subtitle:"Verbindlichkeiten begleichen und Abgrenzung am Bilanzstichtag",tabLabel:"Aufgabe 5",context:"Periodisch werden die angesammelten Verbindlichkeiten an die Sozialwerke \u00FCberwiesen: an die Ausgleichskasse (AHV/IV/EO/ALV) und den Unfallversicherer (Sozialversicherungen), an die Pensionskasse (Personalvorsorge) und ans Steueramt (Quellensteuer). Am Bilanzstichtag noch offene Betr\u00E4ge bleiben als Verbindlichkeiten stehen.",theorie:{title:"Theorie: Abrechnung und Abgrenzung",blocks:[{type:"text",text:"W\u00E4hrend des Jahres sammeln sich auf den Verbindlichkeitskonten die Arbeitnehmer- und Arbeitgeberanteile an. Bei der Abrechnung werden diese Konten gegen die Bank ausgeglichen."},{type:"list",items:["Verbindlichkeiten Sozialversicherungen / Bank: AHV/IV/EO, ALV, NBU und BU an Ausgleichskasse und Unfallversicherer.","Verbindlichkeiten Personalvorsorge / Bank: BVG an die Pensionskasse.","Verbindlichkeiten Quellensteuer / Bank: Quellensteuer ans Steueramt."]},{type:"subtitle",text:"Abgrenzung am Bilanzstichtag"},{type:"text",text:"Sind am 31.12. Beitr\u00E4ge geschuldet, aber noch nicht \u00FCberwiesen (z.B. Dezemberl\u00F6hne, deren Beitr\u00E4ge erst im Januar bezahlt werden), bleiben sie als Verbindlichkeiten in der Bilanz. Wirtschaftlich sind das transitorische Passiven: Aufwand des alten Jahres, Zahlung im neuen Jahr. Dieses Prinzip vertieft Block 6B (Rechnungsabgrenzung)."},{type:"merksatz",text:"Die Verbindlichkeiten gegen\u00FCber den Sozialwerken sind kurzfristiges Fremdkapital. Erst die Zahlung l\u00F6st sie auf. Offene Betr\u00E4ge am Jahresende geh\u00F6ren periodengerecht ins alte Jahr."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Zahlungen an die Sozialwerke",farbe:"#0F766E",intro:"Aus den Aufgaben 3 und 4: Sozialversicherungen total Arbeitnehmer 468 + Arbeitgeber 522 = 990. Personalvorsorge total Arbeitnehmer 300 + Arbeitgeber 300 = 600. Quellensteuer 480."},{id:"b6-5-A1",label:"A1 \u00B7 Zahlung Ausgleichskasse und Unfallversicherer",text:"Die Verbindlichkeiten Sozialversicherungen von CHF 990 werden ab Bank \u00FCberwiesen.",loesungen:[[{sollKeys:["verbindlichkeitensozial"],habenKeys:["bank"],betrag:990}]]},{id:"b6-5-A2",label:"A2 \u00B7 Zahlung Pensionskasse",text:"Die Verbindlichkeiten Personalvorsorge von CHF 600 werden ab Bank an die Pensionskasse \u00FCberwiesen.",loesungen:[[{sollKeys:["verbindlichkeitenvorsorge"],habenKeys:["bank"],betrag:600}]]},{id:"b6-5-A3",label:"A3 \u00B7 Zahlung Quellensteuer",text:"Die Verbindlichkeiten Quellensteuer von CHF 480 werden ab Bank ans Steueramt \u00FCberwiesen.",loesungen:[[{sollKeys:["verbindlichkeitenquellensteuer"],habenKeys:["bank"],betrag:480}]]},{typ:"abschnitt",label:"Teil B \u00B7 Abgrenzung und Reflexion",farbe:"#A85930"},{id:"b6-5-B1",typ:"multiplechoice",label:"B1 \u00B7 Offene Beitr\u00E4ge am 31.12.",text:"Die Beitr\u00E4ge auf den Dezemberl\u00F6hnen werden erst im Januar an die Sozialwerke \u00FCberwiesen. Wie sind sie am 31.12. zu behandeln?",antworten:["Als Aufwand des neuen Jahres, weil erst im Januar bezahlt","Als Verbindlichkeit in der Bilanz, weil Aufwand des alten Jahres (transitorisch)","Gar nicht, bis die Zahlung erfolgt","Als Ertrag, weil noch Geld vorhanden ist"],korrekt:1,loesung:"Sie bleiben als Verbindlichkeit in der Bilanz. Der Aufwand geh\u00F6rt periodengerecht ins alte Jahr (Dezemberl\u00F6hne), die Zahlung erfolgt im neuen Jahr. Das ist eine Passive Rechnungsabgrenzung, vertieft in Block 6B."},{id:"b6-5-B2",typ:"interpretation",label:"B2 \u00B7 Warum periodengerecht abgrenzen?",text:"Warum m\u00FCssen die noch nicht bezahlten Sozialversicherungsbeitr\u00E4ge am Jahresende trotzdem dem alten Jahr belastet werden?",musterloesung:["Der Personalaufwand und die darauf entfallenden Arbeitgeberbeitr\u00E4ge sind im alten Jahr entstanden (die Arbeit wurde im Dezember geleistet).","Nach dem Prinzip der periodengerechten Abgrenzung (Accrual) geh\u00F6rt der Aufwand in die Periode der Verursachung, nicht in die Periode der Zahlung.","W\u00FCrde man den Aufwand erst bei Zahlung im Januar erfassen, w\u00E4re der Gewinn des alten Jahres zu hoch und der des neuen Jahres zu tief.","Die offene Schuld erscheint als Verbindlichkeit (transitorische Passive) in der Bilanz des alten Jahres.","So bleibt die Erfolgsrechnung verl\u00E4sslich und vergleichbar \u00FCber die Jahre."]}]},b6_aufgabe6={title:"Aufgabe 6: Synthese \u00B7 Velowerk GmbH",subtitle:"Eine vollst\u00E4ndige Lohnabrechnung von Brutto bis Vollkosten",tabLabel:"Aufgabe 6",context:"Synthese zu Block 6: Die Velowerk GmbH rechnet den Monatslohn eines Mitarbeitenden ab. Du berechnest die Vollkosten, verbuchst Lohnzahlung und Arbeitgeberbeitr\u00E4ge und ordnest das Resultat ein. Bruttolohn CHF 6'000. Arbeitnehmerabz\u00FCge: Sozialversicherungen 468, BVG 300, Quellensteuer 480. Arbeitgeberbeitr\u00E4ge: Sozialversicherungen 522, BVG 300.",theorie:{title:"Theorie: Was diese Aufgabe verbindet",blocks:[{type:"text",text:"Diese Aufgabe vereint die Themen von Block 6: Brutto zu Netto, Verbuchung der Lohnzahlung, Arbeitgeberbeitr\u00E4ge und die Berechnung der Vollkosten."},{type:"vergleich",left:{title:"Lohnzahlung",text:"Personalaufwand (Bruttolohn) an Verbindlichkeiten der Sozialwerke und Bank (Nettolohn). Die Abz\u00FCge mindern nicht den Aufwand."},right:{title:"Arbeitgeberbeitr\u00E4ge",text:"Sozialversicherungsaufwand an Verbindlichkeiten. Zus\u00E4tzlicher Aufwand, der die Vollkosten \u00FCber den Bruttolohn hebt."}},{type:"merksatz",text:"Wer diesen Fall sauber rechnet und verbucht, beherrscht den Kern von Block 6: Brutto, Netto, Arbeitgeberanteil und Vollkosten."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Berechnung der Vollkosten",farbe:"#7E22CE"},{id:"b6-6-A1",typ:"kennzahl",label:"A1 \u00B7 Nettolohn",text:"Bruttolohn 6'000 minus Sozialversicherungen 468, BVG 300 und Quellensteuer 480. Wie hoch ist der Nettolohn (CHF)?",erwartet:4752,einheit:"CHF",toleranz:.5,loesung:"6'000 \u2212 468 \u2212 300 \u2212 480 = CHF 4'752.00."},{id:"b6-6-A2",typ:"kennzahl",label:"A2 \u00B7 Vollkosten (Personalaufwand total)",text:"Wie hoch sind die echten Personalkosten f\u00FCr Velowerk: Bruttolohn 6'000 plus Arbeitgeberbeitr\u00E4ge (522 + 300)?",erwartet:6822,einheit:"CHF",toleranz:.5,loesung:"6'000 + 522 + 300 = CHF 6'822.00. Das sind die Vollkosten inklusive Lohnnebenkosten."},{typ:"abschnitt",label:"Teil B \u00B7 Verbuchung",farbe:"#0F766E",intro:"Erst die Lohnzahlung (4 Buchungen), dann die Arbeitgeberbeitr\u00E4ge (2 Buchungen)."},{id:"b6-6-B1",label:"B1 \u00B7 Lohnzahlung",text:"Verbuche die Lohnzahlung: Personalaufwand 6'000 an Verbindlichkeiten Sozialversicherungen 468, Verbindlichkeiten Personalvorsorge 300, Verbindlichkeiten Quellensteuer 480 und Bank 4'752. (4 Buchungen)",anzahlBuchungen:4,loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:468},{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitenvorsorge"],betrag:300},{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitenquellensteuer"],betrag:480},{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:4752}]]},{id:"b6-6-B2",label:"B2 \u00B7 Arbeitgeberbeitr\u00E4ge",text:"Verbuche die Arbeitgeberbeitr\u00E4ge: Sozialversicherungsaufwand an Verbindlichkeiten Sozialversicherungen 522 und Verbindlichkeiten Personalvorsorge 300. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["sozialversicherungsaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:522},{sollKeys:["sozialversicherungsaufwand"],habenKeys:["verbindlichkeitenvorsorge"],betrag:300}]]},{typ:"abschnitt",label:"Teil C \u00B7 Synthese und Reflexion",farbe:"#A85930"},{id:"b6-6-C1",typ:"interpretation",label:"C1 \u00B7 Vom Bruttolohn zu den Vollkosten",text:"Fasse zusammen: Wie kommt man vom Bruttolohn CHF 6'000 zu den Vollkosten CHF 6'822, und was bedeutet das f\u00FCr die Velowerk GmbH?",musterloesung:["Der Bruttolohn CHF 6'000 ist der Ausgangspunkt und die Gegenleistung f\u00FCr die Arbeit.","Die Arbeitnehmerabz\u00FCge (Sozialversicherungen 468, BVG 300, Quellensteuer 480 = 1'248) werden im Bruttolohn einbehalten. Der Nettolohn ist 4'752.","Zus\u00E4tzlich zahlt Velowerk die Arbeitgeberbeitr\u00E4ge (Sozialversicherungen 522, BVG 300 = 822). Diese kommen obendrauf.","Die Vollkosten sind damit 6'000 + 822 = CHF 6'822, rund 13.7% \u00FCber dem Bruttolohn.","Bedeutung: Velowerk muss bei Budget, Stundenkalkulation und Preisgestaltung immer mit 6'822 rechnen, nicht mit 6'000. Personal ist nach dem Warenaufwand ein zentraler Kostenblock."]},{id:"b6-6-C2",typ:"multiplechoice",label:"C2 \u00B7 Kontozuordnung",text:"Auf welches Konto wird der Arbeitgeberanteil an AHV/IV/EO gebucht?",antworten:["Personalaufwand","Sozialversicherungsaufwand","Verbindlichkeiten Quellensteuer","Bank"],korrekt:1,loesung:"Sozialversicherungsaufwand. Der Arbeitgeberanteil ist ein eigener Aufwand zus\u00E4tzlich zum Bruttolohn. Gegenkonto ist die Verbindlichkeit Sozialversicherungen, bis die Abrechnung mit der Ausgleichskasse erfolgt."}]},b6b_aufgabe1={title:"Aufgabe 1: Periodengerechtigkeit und die vier Grundf\u00E4lle",subtitle:"ARA und PRA \u00B7 Vortrag und Nachtrag von Aufwand und Ertrag",tabLabel:"Aufgabe 1",context:"Die Erfolgsrechnung muss den Erfolg der richtigen Periode zeigen. Zahlungen und Leistungen fallen aber oft in verschiedene Jahre. Die Rechnungsabgrenzung korrigiert das \u00FCber die Konten Aktive und Passive Rechnungsabgrenzung.",theorie:{title:"Theorie: Rechnungsabgrenzung",blocks:[{type:"text",text:"Das OR verlangt die zeitliche Abgrenzung von Aufwand und Ertrag: Jede Periode tr\u00E4gt genau den Aufwand und den Ertrag, der wirtschaftlich zu ihr geh\u00F6rt, unabh\u00E4ngig vom Zahlungszeitpunkt (Periodengerechtigkeit, Art. 958b OR). Am Bilanzstichtag werden deshalb alle F\u00E4lle korrigiert, bei denen Zahlung und Leistung in verschiedene Perioden fallen."},{type:"subtitle",text:"Die zwei Abgrenzungskonten"},{type:"list",items:["Aktive Rechnungsabgrenzung (ARA): Aktivkonto. Ein Guthaben gegen\u00FCber der Folgeperiode, traditionell Transitorische Aktiven (TA) genannt.","Passive Rechnungsabgrenzung (PRA): Passivkonto. Eine Schuld gegen\u00FCber der Folgeperiode, traditionell Transitorische Passiven (TP) genannt."]},{type:"text",text:"ARA/PRA ist die Bezeichnung des Gesetzes (Art. 959a/959b OR) und des Lehrmittels. TA/TP meint dasselbe. Die deutschen Begriffe ARAP/PRAP stammen aus dem deutschen HGB und werden in der Schweiz nicht verwendet."},{type:"subtitle",text:"Die vier Grundf\u00E4lle"},{type:"list",items:["Aufwandsvortrag (ARA): Aufwand im alten Jahr bezahlt, geh\u00F6rt aber ins neue Jahr. Beispiel: Versicherungspr\u00E4mie f\u00FCr das Folgejahr bereits bezahlt. Buchung: ARA / Aufwand.","Ertragsnachtrag (ARA): Ertrag geh\u00F6rt ins alte Jahr, Zahlung folgt im neuen Jahr. Beispiel: Guthabenzins des alten Jahres, Gutschrift im Januar. Buchung: ARA / Ertrag.","Ertragsvortrag (PRA): Ertrag im alten Jahr erhalten, geh\u00F6rt aber ins neue Jahr. Beispiel: Januarmiete im Dezember erhalten. Buchung: Ertrag / PRA.","Aufwandsnachtrag (PRA): Aufwand geh\u00F6rt ins alte Jahr, Zahlung folgt im neuen Jahr. Beispiel: Darlehenszins des 4. Quartals, zahlbar im Januar. Buchung: Aufwand / PRA."]},{type:"vergleich",left:{title:"ARA (Aktivkonto)",text:"Vorausbezahlter Aufwand oder noch nicht erhaltener Ertrag. Die Folgeperiode schuldet uns etwas: eine Leistung oder eine Zahlung. Merkhilfe: Vortrag von Aufwand, Nachtrag von Ertrag."},right:{title:"PRA (Passivkonto)",text:"Vorauserhaltener Ertrag oder noch nicht bezahlter Aufwand. Wir schulden der Folgeperiode etwas: eine Leistung oder eine Zahlung. Merkhilfe: Vortrag von Ertrag, Nachtrag von Aufwand."}},{type:"merksatz",text:"Massgebend ist nie der Zahlungszeitpunkt, sondern die wirtschaftliche Zugeh\u00F6rigkeit. ARA = Guthaben gegen\u00FCber der Folgeperiode (Aktivseite), PRA = Schuld gegen\u00FCber der Folgeperiode (Passivseite)."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 System verstehen",farbe:"#1B6B63"},{id:"b6b-1-A1",typ:"multiplechoice",label:"A1 \u00B7 Warum abgrenzen?",text:"Warum verlangt das OR die Rechnungsabgrenzung?",antworten:["Damit weniger Steuern anfallen","Damit jede Periode genau den Aufwand und Ertrag tr\u00E4gt, der wirtschaftlich zu ihr geh\u00F6rt","Damit die Bilanz k\u00FCrzer wird","Damit keine Zahlungen vergessen gehen"],korrekt:1,loesung:"Periodengerechtigkeit (Art. 958b OR): Die Erfolgsrechnung soll den Erfolg der Periode zeigen, nicht die zuf\u00E4llige Verteilung der Zahlungen. Abgegrenzt wird immer dann, wenn Zahlung und wirtschaftliche Zugeh\u00F6rigkeit auseinanderfallen."},{id:"b6b-1-A2",typ:"multiplechoice",label:"A2 \u00B7 Charakter der ARA",text:"Was ist die Aktive Rechnungsabgrenzung (ARA) ihrem Wesen nach?",antworten:["Ein Aufwandskonto","Eine Schuld gegen\u00FCber der Folgeperiode","Ein Guthaben gegen\u00FCber der Folgeperiode (Aktivkonto)","Ein Eigenkapitalkonto"],korrekt:2,loesung:"Die ARA ist ein Aktivkonto: Wir haben entweder Aufwand vorausbezahlt (die Folgeperiode schuldet uns die Leistung) oder Ertrag erarbeitet, dessen Zahlung noch aussteht. Beides ist wirtschaftlich ein Guthaben. Traditioneller Name: Transitorische Aktiven."},{id:"b6b-1-A3",typ:"multiplechoice",label:"A3 \u00B7 Aufwandsvortrag zuordnen",text:"Velowerk bezahlt im Oktober die Versicherungspr\u00E4mie, die zur H\u00E4lfte das Folgejahr betrifft. Welcher Grundfall liegt per 31.12. vor?",antworten:["Aufwandsnachtrag (PRA)","Aufwandsvortrag (ARA)","Ertragsvortrag (PRA)","Ertragsnachtrag (ARA)"],korrekt:1,loesung:"Aufwand ist bezahlt, geh\u00F6rt aber teilweise ins neue Jahr: Aufwandsvortrag. Der Anteil des Folgejahres wird per 31.12. auf die ARA \u00FCbertragen (ARA / Versicherungsaufwand)."},{id:"b6b-1-A4",typ:"multiplechoice",label:"A4 \u00B7 Aufwandsnachtrag zuordnen",text:"Der Darlehenszins f\u00FCr Oktober bis Dezember wird erst im Januar belastet. Welcher Grundfall liegt per 31.12. vor?",antworten:["Aufwandsvortrag (ARA)","Ertragsnachtrag (ARA)","Aufwandsnachtrag (PRA)","Ertragsvortrag (PRA)"],korrekt:2,loesung:"Der Zinsaufwand geh\u00F6rt ins alte Jahr, die Zahlung folgt im neuen: Aufwandsnachtrag. Buchung per 31.12.: Zinsaufwand / PRA. Die PRA zeigt die Schuld gegen\u00FCber der Folgeperiode."},{id:"b6b-1-A5",typ:"multiplechoice",label:"A5 \u00B7 Ertragsvortrag zuordnen",text:"Ein Mieter \u00FCberweist die Januarmiete bereits am 28. Dezember. Welcher Grundfall liegt per 31.12. vor?",antworten:["Ertragsvortrag (PRA)","Ertragsnachtrag (ARA)","Aufwandsvortrag (ARA)","Kein Abgrenzungsfall"],korrekt:0,loesung:"Der Ertrag ist erhalten, geh\u00F6rt aber ins neue Jahr: Ertragsvortrag. Buchung: Mietertrag / PRA. Das Geld ist da, die Leistung (Wohnungs\u00FCberlassung im Januar) schulden wir noch."},{typ:"abschnitt",label:"Teil B \u00B7 Vertiefung",farbe:"#1D4ED8"},{id:"b6b-1-B1",typ:"multiplechoice",label:"B1 \u00B7 Ertragsnachtrag zuordnen",text:"Velowerk hat im alten Jahr Guthabenzinsen verdient, die Bank schreibt sie erst im Januar gut. Welcher Grundfall liegt vor?",antworten:["Ertragsvortrag (PRA)","Ertragsnachtrag (ARA)","Aufwandsnachtrag (PRA)","Aufwandsvortrag (ARA)"],korrekt:1,loesung:"Der Ertrag geh\u00F6rt ins alte Jahr, das Geld folgt sp\u00E4ter: Ertragsnachtrag. Buchung per 31.12.: ARA / Zinsertrag. Die ARA zeigt das Guthaben gegen\u00FCber der Folgeperiode."},{id:"b6b-1-B2",typ:"interpretation",label:"B2 \u00B7 Leitfrage: Warum ist Vorauskasse noch kein Ertrag?",text:"Warum ist eine im Voraus erhaltene Zahlung (z.B. die Januarmiete im Dezember) eine Schuld und noch kein Ertrag?",musterloesung:["Ertrag entsteht durch das Erbringen der Leistung, nicht durch den Geldeingang. Die Wohnungs\u00FCberlassung im Januar ist noch nicht erfolgt.","Bis zur Leistungserbringung schulden wir dem Mieter die Gegenleistung. Diese Verpflichtung geh\u00F6rt als PRA auf die Passivseite.","W\u00FCrde die Zahlung sofort als Ertrag gebucht, w\u00E4re der Gewinn des alten Jahres zu hoch und der des neuen Jahres zu tief: Verletzung der Periodengerechtigkeit.","Erst im Januar wird die PRA aufgel\u00F6st und der Ertrag dort gezeigt, wo die Leistung erbracht wird.","Gleiches Prinzip wie beim Realisationsprinzip: Erfolg folgt der Leistung, nicht dem Geldfluss."]}]},b6b_aufgabe2={title:"Aufgabe 2: Aktive Rechnungsabgrenzung verbuchen",subtitle:"Aufwandsvortrag und Ertragsnachtrag \u00B7 Velowerk GmbH per 31.12.",tabLabel:"Aufgabe 2",context:"Die beiden ARA-F\u00E4lle in der Praxis: vorausbezahlter Aufwand und noch nicht eingegangener Ertrag. Du berechnest die Abgrenzungsbetr\u00E4ge und verbuchst sie per 31.12. bei der Velowerk GmbH.",theorie:{title:"Theorie: ARA verbuchen",blocks:[{type:"subtitle",text:"Aufwandsvortrag"},{type:"text",text:"W\u00E4hrend des Jahres wurde die ganze Zahlung als Aufwand gebucht. Per 31.12. wird der Anteil des Folgejahres herausgel\u00F6st: Er verl\u00E4sst den Aufwand und wandert als Guthaben in die Bilanz."},{type:"formel",text:"Aufwandsvortrag per 31.12.: ARA / Aufwandskonto (Anteil Folgejahr)"},{type:"subtitle",text:"Ertragsnachtrag"},{type:"text",text:"Ein Ertrag des alten Jahres ist noch nicht eingegangen und noch nirgends gebucht. Per 31.12. wird er nachgetragen: als Ertrag des alten Jahres und als Guthaben in der Bilanz."},{type:"formel",text:"Ertragsnachtrag per 31.12.: ARA / Ertragskonto (Anteil altes Jahr)"},{type:"beispiel",text:"Velowerk bezahlt am 1.7. die Jahrespr\u00E4mie der Betriebsversicherung von CHF 3'600 (Laufzeit 1.7. bis 30.6.). Per 31.12. geh\u00F6ren 6 von 12 Monaten ins Folgejahr: 3'600 \u00D7 6/12 = CHF 1'800. Buchung: ARA / Versicherungsaufwand CHF 1'800."},{type:"merksatz",text:"Beide ARA-F\u00E4lle erh\u00F6hen den Gewinn des alten Jahres: Der Aufwandsvortrag nimmt Aufwand heraus, der Ertragsnachtrag f\u00FCgt Ertrag hinzu. Die ARA steht anschliessend als Aktivum in der Schlussbilanz."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Aufwandsvortrag (Versicherung)",farbe:"#1B6B63",intro:"Velowerk bezahlt am 1.7. die Jahrespr\u00E4mie der Betriebsversicherung: CHF 3'600 f\u00FCr die Laufzeit 1.7. bis 30.6. Die Zahlung wurde vollst\u00E4ndig als Versicherungsaufwand gebucht."},{id:"b6b-2-A1",typ:"kennzahl",label:"A1 \u00B7 Abzugrenzender Betrag",text:"Wie viel der Pr\u00E4mie geh\u00F6rt ins Folgejahr (CHF)?",erwartet:18e2,einheit:"CHF",toleranz:.5,loesung:"6 von 12 Monaten (Januar bis Juni) geh\u00F6ren ins Folgejahr: 3'600 \u00D7 6/12 = CHF 1'800."},{id:"b6b-2-A2",label:"A2 \u00B7 Abgrenzung verbuchen",text:"Verbuche die Abgrenzung der Versicherungspr\u00E4mie per 31.12.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischeaktiven"],habenKeys:["versicherungsaufwand"],betrag:18e2}]]},{id:"b6b-2-A3",typ:"multiplechoice",label:"A3 \u00B7 Wirkung auf den Gewinn",text:"Wie wirkt sich diese Abgrenzung auf den Gewinn des alten Jahres aus?",antworten:["Der Gewinn sinkt um CHF 1'800","Der Gewinn steigt um CHF 1'800, weil Aufwand ins Folgejahr verschoben wird","Keine Wirkung","Der Gewinn steigt um CHF 3'600"],korrekt:1,loesung:"Der Versicherungsaufwand des alten Jahres sinkt um CHF 1'800 (Haben-Buchung auf dem Aufwandskonto), also steigt der Gewinn um CHF 1'800. Das alte Jahr tr\u00E4gt nur noch die 6 Monate, die es betreffen."},{typ:"abschnitt",label:"Teil B \u00B7 Ertragsnachtrag (Zins und Miete)",farbe:"#1D4ED8",intro:"Die Bank schreibt Velowerk den Guthabenzins des zweiten Halbjahres von CHF 500 erst Anfang Januar gut. Zus\u00E4tzlich steht die Dezembermiete eines Untermieters von CHF 900 noch aus (Zahlung im Januar)."},{id:"b6b-2-B1",label:"B1 \u00B7 Zinsertrag nachtragen",text:"Verbuche den Ertragsnachtrag f\u00FCr den Guthabenzins von CHF 500 per 31.12.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischeaktiven"],habenKeys:["zinsertrag"],betrag:500}]]},{id:"b6b-2-B2",typ:"multiplechoice",label:"B2 \u00B7 Warum auf die ARA?",text:"Warum wird der ausstehende Zinsertrag auf der ARA erfasst?",antworten:["Weil die Bank einen Fehler gemacht hat","Weil die Leistung erbracht ist und uns die Zahlung noch zusteht: ein Guthaben gegen\u00FCber der Folgeperiode","Weil Zinsen immer passiv abgegrenzt werden","Weil der Betrag unter CHF 1'000 liegt"],korrekt:1,loesung:"Der Zins ist im alten Jahr wirtschaftlich verdient (Leistung erbracht), das Geld folgt erst im Januar. Dieses Guthaben gegen\u00FCber der Folgeperiode geh\u00F6rt auf die ARA, der Ertrag ins alte Jahr."},{id:"b6b-2-B3",label:"B3 \u00B7 Mietertrag nachtragen",text:"Verbuche den Ertragsnachtrag f\u00FCr die ausstehende Dezembermiete von CHF 900 per 31.12.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischeaktiven"],habenKeys:["mietertrag"],betrag:900}]]},{id:"b6b-2-B4",typ:"kennzahl",label:"B4 \u00B7 ARA in der Schlussbilanz",text:"Wie hoch ist der Bestand der ARA in der Schlussbilanz der Velowerk GmbH (alle drei F\u00E4lle, CHF)?",erwartet:32e2,einheit:"CHF",toleranz:.5,loesung:"1'800 (Versicherung) + 500 (Zins) + 900 (Miete) = CHF 3'200 auf der Aktivseite der Schlussbilanz."},{id:"b6b-2-B5",typ:"multiplechoice",label:"B5 \u00B7 Ausweis in der Bilanz",text:"Wo erscheint die ARA in der Bilanz?",antworten:["Im Anlageverm\u00F6gen","Im kurzfristigen Fremdkapital","Im Umlaufverm\u00F6gen auf der Aktivseite","Im Eigenkapital"],korrekt:2,loesung:"Die ARA geh\u00F6rt zum Umlaufverm\u00F6gen (Aktivseite): Sie l\u00F6st sich in der Folgeperiode auf. Art. 959a OR f\u00FChrt die Aktiven Rechnungsabgrenzungen als eigene Position des Umlaufverm\u00F6gens auf."}]},b6b_aufgabe3={title:"Aufgabe 3: Passive Rechnungsabgrenzung verbuchen",subtitle:"Aufwandsnachtrag und Ertragsvortrag \u00B7 Velowerk GmbH per 31.12.",tabLabel:"Aufgabe 3",context:"Die beiden PRA-F\u00E4lle: Aufwand, der noch nicht bezahlt ist, aber ins alte Jahr geh\u00F6rt, und Ertrag, der schon erhalten ist, aber ins neue Jahr geh\u00F6rt. Beides sind Schulden gegen\u00FCber der Folgeperiode.",theorie:{title:"Theorie: PRA verbuchen",blocks:[{type:"subtitle",text:"Aufwandsnachtrag"},{type:"text",text:"Ein Aufwand des alten Jahres ist noch nicht bezahlt und noch nirgends gebucht. Per 31.12. wird er nachgetragen: als Aufwand des alten Jahres und als Schuld in der Bilanz."},{type:"formel",text:"Aufwandsnachtrag per 31.12.: Aufwandskonto / PRA (Anteil altes Jahr)"},{type:"subtitle",text:"Ertragsvortrag"},{type:"text",text:"Ein bereits erhaltener und als Ertrag gebuchter Betrag geh\u00F6rt ins Folgejahr. Per 31.12. wird er aus dem Ertrag herausgel\u00F6st und als Schuld (noch zu erbringende Leistung) passiviert."},{type:"formel",text:"Ertragsvortrag per 31.12.: Ertragskonto / PRA (Anteil Folgejahr)"},{type:"beispiel",text:"Velowerk schuldet auf einem Darlehen den Zins f\u00FCr Oktober bis Dezember: CHF 750, zahlbar im Januar. Buchung per 31.12.: Zinsaufwand / PRA CHF 750. Der Aufwand landet im alten Jahr, die Schuld in der Bilanz."},{type:"merksatz",text:"Beide PRA-F\u00E4lle senken den Gewinn des alten Jahres: Der Aufwandsnachtrag f\u00FCgt Aufwand hinzu, der Ertragsvortrag nimmt Ertrag heraus. Die PRA steht anschliessend als kurzfristiges Fremdkapital in der Schlussbilanz."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Aufwandsnachtrag (Zins und Miete)",farbe:"#1B6B63",intro:"Velowerk schuldet den Darlehenszins f\u00FCr Oktober bis Dezember von CHF 750 (Belastung im Januar). Zus\u00E4tzlich ist die Dezembermiete f\u00FCr das externe Ersatzteillager von CHF 1'500 noch nicht bezahlt (Zahlung im Januar)."},{id:"b6b-3-A1",label:"A1 \u00B7 Darlehenszins nachtragen",text:"Verbuche den Aufwandsnachtrag f\u00FCr den Darlehenszins von CHF 750 per 31.12.",anzahlBuchungen:1,loesungen:[[{sollKeys:["zinsaufwand"],habenKeys:["transitorischepassiven"],betrag:750}]]},{id:"b6b-3-A2",typ:"multiplechoice",label:"A2 \u00B7 Wirkung auf den Gewinn",text:"Wie wirkt sich der Aufwandsnachtrag von CHF 750 auf den Gewinn des alten Jahres aus?",antworten:["Der Gewinn steigt um CHF 750","Der Gewinn sinkt um CHF 750, weil zus\u00E4tzlicher Aufwand erfasst wird","Keine Wirkung, da noch nicht bezahlt","Der Gewinn sinkt erst im neuen Jahr"],korrekt:1,loesung:"Der Zinsaufwand des alten Jahres steigt um CHF 750, der Gewinn sinkt entsprechend. Dass die Zahlung erst im Januar erfolgt, spielt keine Rolle: Massgebend ist die wirtschaftliche Zugeh\u00F6rigkeit."},{id:"b6b-3-A3",label:"A3 \u00B7 Lagermiete nachtragen",text:"Verbuche den Aufwandsnachtrag f\u00FCr die ausstehende Dezembermiete des Lagers von CHF 1'500 per 31.12.",anzahlBuchungen:1,loesungen:[[{sollKeys:["raumaufwand"],habenKeys:["transitorischepassiven"],betrag:15e2}]]},{typ:"abschnitt",label:"Teil B \u00B7 Ertragsvortrag (Miete) und Bilanzsicht",farbe:"#1D4ED8",intro:"Ein Untermieter \u00FCberweist die Januarmiete von CHF 1'200 bereits am 28. Dezember. Die Zahlung wurde als Mietertrag gebucht."},{id:"b6b-3-B1",label:"B1 \u00B7 Ertragsvortrag verbuchen",text:"Verbuche den Ertragsvortrag f\u00FCr die vorauserhaltene Januarmiete von CHF 1'200 per 31.12.",anzahlBuchungen:1,loesungen:[[{sollKeys:["mietertrag"],habenKeys:["transitorischepassiven"],betrag:12e2}]]},{id:"b6b-3-B2",typ:"kennzahl",label:"B2 \u00B7 PRA in der Schlussbilanz",text:"Wie hoch ist der Bestand der PRA in der Schlussbilanz (alle drei F\u00E4lle, CHF)?",erwartet:3450,einheit:"CHF",toleranz:.5,loesung:"750 (Darlehenszins) + 1'500 (Lagermiete) + 1'200 (vorauserhaltene Miete) = CHF 3'450 auf der Passivseite."},{id:"b6b-3-B3",typ:"multiplechoice",label:"B3 \u00B7 Ausweis in der Bilanz",text:"Wo erscheint die PRA in der Bilanz?",antworten:["Im Umlaufverm\u00F6gen","Im kurzfristigen Fremdkapital auf der Passivseite","Im langfristigen Fremdkapital","Im Eigenkapital"],korrekt:1,loesung:"Die PRA ist kurzfristiges Fremdkapital: eine Schuld gegen\u00FCber der Folgeperiode, die sich dort aufl\u00F6st. Art. 959a OR f\u00FChrt die Passiven Rechnungsabgrenzungen als eigene Position des kurzfristigen Fremdkapitals auf."},{id:"b6b-3-B4",typ:"kennzahl",label:"B4 \u00B7 Nettowirkung aller Abgrenzungen",text:"Aufgabe 2 und 3 zusammen: Die ARA-F\u00E4lle erh\u00F6hen den Gewinn um CHF 3'200, die PRA-F\u00E4lle senken ihn um CHF 3'450. Um wie viel sinkt der Gewinn des alten Jahres netto (CHF)?",erwartet:250,einheit:"CHF",toleranz:.5,loesung:"3'450 \u2212 3'200 = CHF 250 Nettosenkung. Wichtig: Die Abgrenzungen ver\u00E4ndern nur die zeitliche Zuordnung. \u00DCber beide Jahre zusammen ist die Wirkung null (erfolgsneutral \u00FCber die Gesamtdauer)."},{id:"b6b-3-B5",typ:"multiplechoice",label:"B5 \u00B7 Merkhilfe ARA vs. PRA",text:"Welche Merkhilfe ist korrekt?",antworten:["ARA = Schuld, PRA = Guthaben","ARA = Vortrag von Aufwand und Nachtrag von Ertrag \u00B7 PRA = Vortrag von Ertrag und Nachtrag von Aufwand","ARA und PRA sind Erfolgskonten","ARA = nur Zinsen, PRA = nur Mieten"],korrekt:1,loesung:"ARA sammelt Aufwandsvortr\u00E4ge und Ertragsnachtr\u00E4ge (beides Guthaben gegen\u00FCber der Folgeperiode). PRA sammelt Ertragsvortr\u00E4ge und Aufwandsnachtr\u00E4ge (beides Schulden gegen\u00FCber der Folgeperiode)."}]},b6b_aufgabe4={title:"Aufgabe 4: R\u00FCckbuchung und Methoden",subtitle:"Abgrenzungen im neuen Jahr aufl\u00F6sen \u00B7 mit oder ohne R\u00FCckbuchung",tabLabel:"Aufgabe 4",context:"Abgrenzungen sind Hilfskonstruktionen \u00FCber den Bilanzstichtag. Im neuen Jahr m\u00FCssen sie wieder verschwinden. Daf\u00FCr gibt es zwei Methoden: die R\u00FCckbuchung per 1.1. oder die direkte Verrechnung bei der Zahlung.",theorie:{title:"Theorie: Aufl\u00F6sung der Abgrenzungen",blocks:[{type:"subtitle",text:"Methode 1: R\u00FCckbuchung per 1.1. (Standard)"},{type:"text",text:"Zu Beginn des neuen Jahres wird jede Abgrenzung exakt umgekehrt zur\u00FCckgebucht. Die ARA- und PRA-Konten stehen danach auf null, und alle Zahlungen des neuen Jahres werden ganz normal auf den Aufwands- und Ertragskonten verbucht. Die Erfolgsverlagerung geschieht automatisch."},{type:"formel",text:"R\u00FCckbuchung = exakt umgekehrter Buchungssatz der Abgrenzung. Beispiel: aus ARA / Versicherungsaufwand wird Versicherungsaufwand / ARA"},{type:"subtitle",text:"Methode 2: Ohne R\u00FCckbuchung"},{type:"text",text:"Die Abgrenzung bleibt stehen. Bei der Zahlung im neuen Jahr wird direkt gegen das Abgrenzungskonto gebucht, nur ein allf\u00E4lliger Anteil des neuen Jahres l\u00E4uft \u00FCber Aufwand oder Ertrag. Das verlangt, dass man sich bei jeder Zahlung an die bestehende Abgrenzung erinnert."},{type:"vergleich",left:{title:"Mit R\u00FCckbuchung",text:"Vorteil: Laufende Buchhaltung bleibt einfach, jede Zahlung wird normal verbucht, kein Erinnern n\u00F6tig. Standard in der Praxis und in Buchhaltungssoftware. Nachteil: Aufwands- und Ertragskonten zeigen unter dem Jahr kurzzeitig verzerrte Werte (Habensaldo m\u00F6glich)."},right:{title:"Ohne R\u00FCckbuchung",text:"Vorteil: Keine zus\u00E4tzlichen Buchungen am Jahresanfang. Nachteil: Fehleranf\u00E4llig, weil bei jeder Zahlung an die Abgrenzung gedacht werden muss; bei vielen Abgrenzungen un\u00FCbersichtlich."}},{type:"beispiel",text:"PRA Darlehenszins CHF 750. Mit R\u00FCckbuchung: per 1.1. PRA / Zinsaufwand 750; die Januarzahlung von CHF 1'000 (Oktober bis Januar) wird normal als Zinsaufwand / Bank 1'000 gebucht. Netto belastet das neue Jahr 1'000 \u2212 750 = CHF 250, genau der Januaranteil."},{type:"merksatz",text:"R\u00FCckbuchung per 1.1. ist der Praxisstandard: Abgrenzung exakt umkehren, danach alles normal verbuchen. Die Periodenzuordnung stimmt automatisch, und die Abgrenzungskonten sind sauber geleert."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 R\u00FCckbuchungen per 1.1.",farbe:"#1B6B63",intro:"Aus dem Jahresabschluss bestehen: ARA Versicherung CHF 1'800 und PRA Darlehenszins CHF 750."},{id:"b6b-4-A1",label:"A1 \u00B7 R\u00FCckbuchung der ARA",text:"Verbuche die R\u00FCckbuchung der ARA Versicherung von CHF 1'800 per 1.1.",anzahlBuchungen:1,loesungen:[[{sollKeys:["versicherungsaufwand"],habenKeys:["transitorischeaktiven"],betrag:18e2}]]},{id:"b6b-4-A2",label:"A2 \u00B7 R\u00FCckbuchung der PRA",text:"Verbuche die R\u00FCckbuchung der PRA Darlehenszins von CHF 750 per 1.1.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischepassiven"],habenKeys:["zinsaufwand"],betrag:750}]]},{id:"b6b-4-A3",typ:"multiplechoice",label:"A3 \u00B7 Zweck der R\u00FCckbuchung",text:"Was bewirkt die R\u00FCckbuchung per 1.1.?",antworten:["Sie macht den Jahresabschluss r\u00FCckg\u00E4ngig","Sie leert die Abgrenzungskonten und verlagert den Erfolg automatisch in die richtige Periode","Sie erh\u00F6ht den Gewinn des neuen Jahres dauerhaft","Sie ersetzt die Zahlung"],korrekt:1,loesung:"Die R\u00FCckbuchung stellt ARA und PRA auf null und bucht die abgegrenzten Betr\u00E4ge auf die Erfolgskonten des neuen Jahres (mit umgekehrtem Vorzeichen). Zusammen mit den normalen Zahlungsbuchungen tr\u00E4gt jede Periode automatisch genau ihren Anteil."},{id:"b6b-4-A4",typ:"kennzahl",label:"A4 \u00B7 Nettobelastung neues Jahr",text:"Nach der R\u00FCckbuchung der PRA (CHF 750) wird im Januar der Zins von CHF 1'000 f\u00FCr Oktober bis Januar bezahlt (Zinsaufwand / Bank 1'000). Wie viel Zinsaufwand tr\u00E4gt das neue Jahr netto (CHF)?",erwartet:250,einheit:"CHF",toleranz:.5,loesung:"1'000 (Zahlung) \u2212 750 (R\u00FCckbuchung im Haben des Zinsaufwands) = CHF 250: genau der Januaranteil. Die 750 f\u00FCr Oktober bis Dezember hat das alte Jahr \u00FCber den Aufwandsnachtrag getragen."},{typ:"abschnitt",label:"Teil B \u00B7 Methode ohne R\u00FCckbuchung und Beurteilung",farbe:"#1D4ED8"},{id:"b6b-4-B1",label:"B1 \u00B7 Zahlung ohne R\u00FCckbuchung verbuchen",text:"Ohne R\u00FCckbuchung: Die Januarzahlung des Zinses von CHF 1'000 (davon CHF 750 altes Jahr via PRA, CHF 250 Januaranteil) wird direkt verbucht. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["transitorischepassiven"],habenKeys:["bank"],betrag:750},{sollKeys:["zinsaufwand"],habenKeys:["bank"],betrag:250}]]},{id:"b6b-4-B2",typ:"multiplechoice",label:"B2 \u00B7 Risiko der Methode ohne R\u00FCckbuchung",text:"Was ist das Hauptrisiko der Methode ohne R\u00FCckbuchung?",antworten:["Sie ist gesetzlich verboten","Bei der Zahlung wird die bestehende Abgrenzung vergessen und der volle Betrag als Aufwand gebucht: doppelte Erfassung im neuen Jahr","Die Bilanz geht nicht mehr auf","Sie funktioniert nur bei Ertr\u00E4gen"],korrekt:1,loesung:"Wer bei der Zahlung nicht an die PRA denkt, bucht die vollen CHF 1'000 als Zinsaufwand: Das neue Jahr tr\u00E4gt dann 1'000 statt 250, und die PRA bleibt f\u00E4lschlich stehen. Genau deshalb ist die R\u00FCckbuchung der Praxisstandard."},{id:"b6b-4-B3",typ:"interpretation",label:"B3 \u00B7 Methoden beurteilen",text:"Beurteile die beiden Methoden im Hinblick auf ihre Praxisrelevanz: Welche empfiehlst du einem KMU wie der Velowerk GmbH und warum?",musterloesung:["Empfehlung: R\u00FCckbuchung per 1.1. Sie ist der Standard in der Praxis und in g\u00E4ngiger Buchhaltungssoftware (oft automatisiert).","Hauptargument: Die laufende Buchhaltung bleibt einfach. Jede Zahlung wird normal verbucht, niemand muss sich an bestehende Abgrenzungen erinnern.","Fehlerrisiko: Ohne R\u00FCckbuchung droht die Doppelbelastung des neuen Jahres, wenn die Abgrenzung bei der Zahlung vergessen geht. Bei vielen Abgrenzungen steigt dieses Risiko stark.","Nachteil der R\u00FCckbuchung (verkraftbar): Unter dem Jahr k\u00F6nnen Erfolgskonten kurzzeitig verzerrte Salden zeigen, z.B. einen Habensaldo auf einem Aufwandskonto. Am Jahresende stimmt es wieder.","Ohne R\u00FCckbuchung ist h\u00F6chstens bei sehr wenigen, gut \u00FCberwachten Abgrenzungen vertretbar. Massstab ist immer: korrekte Periodenzuordnung mit m\u00F6glichst geringem Fehlerrisiko."]},{id:"b6b-4-B4",typ:"interpretation",label:"B4 \u00B7 Leitfrage: Warum ist die ARA ein Guthaben?",text:"Was bedeutet die Aktive Rechnungsabgrenzung wirtschaftlich: Warum ist sie ein Guthaben?",musterloesung:["Beim Aufwandsvortrag haben wir bereits bezahlt, die Gegenleistung (z.B. Versicherungsschutz Januar bis Juni) steht noch aus: Die Folgeperiode schuldet uns eine Leistung.","Beim Ertragsnachtrag haben wir die Leistung erbracht, das Geld steht noch aus: Der Schuldner (z.B. die Bank beim Zins) schuldet uns eine Zahlung.","In beiden F\u00E4llen besitzt Velowerk am 31.12. einen wirtschaftlichen Anspruch: entweder auf eine Leistung oder auf Geld. Anspr\u00FCche sind Verm\u00F6genswerte und geh\u00F6ren auf die Aktivseite.","Die ARA verschwindet, sobald der Anspruch erf\u00FCllt ist: Der Versicherungsschutz l\u00E4uft, der Zins geht ein. Deshalb ist sie Umlaufverm\u00F6gen.","Spiegelbildlich ist die PRA eine Schuld: Dort schulden wir der Folgeperiode eine Leistung oder eine Zahlung."]}]},b7_aufgabe1={title:"Aufgabe 1: Rückstellungen \u00B7 Grundlagen",subtitle:"Definition, Beispiele, Abgrenzung zu Reserven \u00B7 Wirkung auf das Jahresergebnis",tabLabel:"Aufgabe 1",context:"Rückstellungen sichern das Unternehmen gegen wahrscheinliche, aber noch unsichere Verpflichtungen ab. Diese Aufgabe klärt, was eine Rückstellung ist, wofür sie gebildet wird und wie sie sich von Reserven unterscheidet.",theorie:{title:"Theorie: Rückstellungen",blocks:[{type:"text",text:"Eine Rückstellung wird gebildet, wenn ein vergangenes Ereignis voraussichtlich zu einer Verpflichtung führt, deren Höhe oder Fälligkeit noch ungewiss ist. Sie gehört zum Fremdkapital und folgt dem Vorsichtsprinzip: Erwartete Belastungen werden erfasst, sobald sie wahrscheinlich sind, nicht erst bei Zahlung."},{type:"subtitle",text:"Drei Merkmale einer Rückstellung"},{type:"list",items:["Die Ursache liegt in der Vergangenheit (z.B. verkaufte Produkte mit Garantie, ein laufender Rechtsstreit).","Ein Mittelabfluss ist wahrscheinlich.","Höhe und/oder Zeitpunkt sind noch ungewiss und müssen geschätzt werden."]},{type:"subtitle",text:"Typische Beispiele"},{type:"list",items:["Garantierückstellungen für verkaufte Produkte","Prozessrückstellungen für laufende Rechtsstreitigkeiten","Steuerrückstellungen für noch nicht veranlagte Steuern","Rückstellungen für Restrukturierungen oder Sanierungen","Rückstellungen für Umweltrisiken und Rückbauverpflichtungen"]},{type:"vergleich",left:{title:"Rückstellungen (Fremdkapital)",text:"Verpflichtung gegenüber Dritten. Höhe oder Fälligkeit ungewiss. Die Bildung belastet die Erfolgsrechnung und senkt das Jahresergebnis."},right:{title:"Reserven (Eigenkapital)",text:"Zurückbehaltene Gewinne, die dem Unternehmen selbst gehören. Keine Verpflichtung gegenüber Dritten. Entstehen aus der Gewinnverwendung, nicht über Aufwand."}},{type:"subtitle",text:"Rückstellungen und stille Reserven"},{type:"text",text:"Wird eine Rückstellung bewusst höher angesetzt als betriebswirtschaftlich nötig, entsteht in der Differenz eine stille Reserve: Das Fremdkapital ist überbewertet, das Eigenkapital erscheint zu tief. Das OR lässt dies im Rahmen des Vorsichtsprinzips zu."},{type:"beispiel",text:"Die Velowerk GmbH verkauft E-Bikes mit 2 Jahren Garantie. Erfahrungsgemäss fallen 2 Prozent des Nettoerlöses als Garantiekosten an. Am Jahresende ist unklar, welche Bikes betroffen sein werden und wie teuer die Reparaturen ausfallen. Genau dafür wird eine Garantierückstellung gebildet."},{type:"merksatz",text:"Rückstellung = wahrscheinliche Verpflichtung mit ungewisser Höhe oder Fälligkeit, Ursache in der Vergangenheit. Sie ist Fremdkapital. Die Bildung senkt das Jahresergebnis: bei der Garantie als Ertragsminderung, bei Prozess und Steuern als Aufwand. Reserven dagegen sind Eigenkapital aus einbehaltenen Gewinnen."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Begriff und Beispiele",farbe:"#1B6B63"},{id:"b7-1-A1",typ:"multiplechoice",label:"A1 \u00B7 Definition",text:"Welche Aussage beschreibt eine Rückstellung korrekt?",antworten:["Ein zurückbehaltener Gewinnanteil im Eigenkapital","Eine wahrscheinliche Verpflichtung, deren Höhe oder Fälligkeit noch ungewiss ist","Eine bereits fakturierte Lieferantenrechnung","Ein Sparkonto für künftige Investitionen"],korrekt:1,loesung:"Eine Rückstellung ist eine wahrscheinliche Verpflichtung mit ungewisser Höhe oder Fälligkeit, deren Ursache in der Vergangenheit liegt. Fakturierte Rechnungen sind gewöhnliche Verbindlichkeiten, zurückbehaltene Gewinne sind Reserven (Eigenkapital)."},{id:"b7-1-A2",typ:"multiplechoice",label:"A2 \u00B7 Beispiel erkennen",text:"Für welchen Sachverhalt bildet die Velowerk GmbH eine Rückstellung?",antworten:["Offene Lieferantenrechnung über CHF 15'000","Bankdarlehen mit fixem Rückzahlungsplan","Erwartete Garantiereparaturen auf verkauften E-Bikes","Geplanter Kauf einer neuen Maschine im Folgejahr"],korrekt:2,loesung:"Erwartete Garantiereparaturen erfüllen alle Merkmale: Ursache in der Vergangenheit (Verkauf), Mittelabfluss wahrscheinlich, Höhe ungewiss. Die Lieferantenrechnung und das Darlehen sind der Höhe nach bestimmt, ein geplanter Kauf ist keine Verpflichtung."},{id:"b7-1-A3",typ:"multiplechoice",label:"A3 \u00B7 Rückstellung vs. Reserve",text:"Worin liegt der zentrale Unterschied zwischen Rückstellungen und Reserven?",antworten:["Rückstellungen sind Fremdkapital, Reserven sind Eigenkapital","Reserven sind Fremdkapital, Rückstellungen sind Eigenkapital","Beide gehören zum Eigenkapital","Es gibt keinen Unterschied"],korrekt:0,loesung:"Rückstellungen sind Fremdkapital (Verpflichtung gegenüber Dritten), Reserven sind Eigenkapital (einbehaltene Gewinne). Rückstellungen entstehen erfolgswirksam über Aufwand oder Ertragsminderung, Reserven über die Gewinnverwendung."},{id:"b7-1-A4",typ:"multiplechoice",label:"A4 \u00B7 Wirkung auf das Jahresergebnis",text:"Wie wirkt sich die Bildung einer Rückstellung auf das Jahresergebnis aus?",antworten:["Das Jahresergebnis steigt","Das Jahresergebnis sinkt, weil die Bildung erfolgswirksam belastet","Keine Wirkung, da nur die Bilanz betroffen ist","Das Jahresergebnis sinkt erst bei der Zahlung"],korrekt:1,loesung:"Die Bildung ist erfolgswirksam und senkt das Jahresergebnis im Jahr der Bildung. Bei der Garantierückstellung geschieht das als Ertragsminderung (Verkaufsertrag an Rückstellungen), bei Prozess und Steuerrückstellungen über ein Aufwandkonto. Genau das ist der Sinn: Der Aufwand wird periodengerecht dem Jahr zugeordnet, in dem die Ursache liegt, nicht dem Jahr der Zahlung."},{typ:"abschnitt",label:"Teil B \u00B7 Beurteilung",farbe:"#1D4ED8"},{id:"b7-1-B1",typ:"interpretation",label:"B1 \u00B7 Betriebswirtschaftliche Beurteilung",text:"Beurteile die Rückstellungsbildung aus betriebswirtschaftlicher Sicht: Warum ist sie sinnvoll, und welche Risiken bestehen bei zu hohen oder zu tiefen Rückstellungen?",musterloesung:["Sinnvoll: Rückstellungen ordnen den Aufwand periodengerecht dem Verursachungsjahr zu und zeigen ein vorsichtiges, realistisches Bild der Verpflichtungen.","Sie schützen vor bösen Überraschungen: Künftige Zahlungen sind bereits im Ergebnis berücksichtigt und gefährden die Liquiditätsplanung weniger.","Zu tiefe Rückstellungen: Das Ergebnis erscheint zu gut, künftige Jahre werden mit Aufwand belastet, der ins alte Jahr gehört. Gefahr überhöhter Gewinnausschüttungen.","Zu hohe Rückstellungen: Es entstehen stille Reserven. Das Ergebnis erscheint zu schlecht, die Aussagekraft der Jahresrechnung für Aussenstehende sinkt.","Massstab ist eine realistische, begründbare Schätzung, z.B. anhand von Erfahrungswerten (Garantiequote) oder Einschätzungen von Fachpersonen (Anwalt beim Prozess)."]},{id:"b7-1-B2",typ:"multiplechoice",label:"B2 \u00B7 Stille Reserven",text:"Die Velowerk GmbH schätzt die nötige Garantierückstellung auf CHF 36'000, bildet aber bewusst CHF 90'000. Was entsteht dadurch?",antworten:["Eine offene Gewinnreserve von CHF 54'000","Eine stille Reserve von CHF 54'000","Ein ausserordentlicher Ertrag von CHF 54'000","Nichts, die Höhe ist frei wählbar ohne Wirkung"],korrekt:1,loesung:"Die Differenz von CHF 54'000 ist eine stille Reserve: Das Fremdkapital ist um CHF 54'000 überbewertet, das ausgewiesene Eigenkapital und der Gewinn sind entsprechend zu tief. Das OR lässt dies im Rahmen des Vorsichtsprinzips zu."}]},b7_aufgabe2={title:"Aufgabe 2: Rückstellungen verbuchen",subtitle:"Bildung, Verwendung und Auflösung \u00B7 Velowerk GmbH",tabLabel:"Aufgabe 2",context:"Der Lebenszyklus einer Rückstellung umfasst drei Schritte: Bildung am Jahresende, Verwendung im Schadenfall und Auflösung des nicht benötigten Teils. Hier verbuchst du alle drei am Beispiel der Velowerk GmbH.",theorie:{title:"Theorie: Verbuchung von Rückstellungen",blocks:[{type:"text",text:"Rückstellungen werden über ein passives Bestandeskonto Rückstellungen geführt. Das Gegenkonto bei der Bildung richtet sich nach der Ursache: Garantierückstellungen entstehen direkt aus dem Umsatz und werden deshalb als Ertragsminderung gegen den Verkaufsertrag gebucht. Prozess und Steuerrückstellungen haben keinen Umsatzbezug und werden über das passende Aufwandkonto gebildet."},{type:"subtitle",text:"Die drei Buchungsschritte"},{type:"list",items:["Bildung Garantie (am Jahresende): Verkaufsertrag an Rückstellungen. Der Ertrag wird gekürzt, das Ergebnis sinkt.","Bildung Prozess und Steuern: Aufwand an Rückstellungen. Das Ergebnis sinkt.","Verwendung (im Schadenfall): Rückstellungen an Bank (oder Verbindlichkeiten). Erfolgsneutral, da die Belastung bereits im Bildungsjahr erfasst wurde.","Auflösung Garantie (nicht benötigter Teil): Rückstellungen an Verkaufsertrag. Der gekürzte Ertrag wird wieder gutgeschrieben, das Ergebnis steigt.","Auflösung Prozess und Steuern: Rückstellungen an übriger betrieblicher Ertrag."]},{type:"formel",text:"Garantie \u00B7 Bildung: Verkaufsertrag / Rückstellungen \u00B7 Verwendung: Rückstellungen / Bank \u00B7 Auflösung: Rückstellungen / Verkaufsertrag"},{type:"beispiel",text:"Velowerk bildet Ende 20_1 eine Garantierückstellung von CHF 36'000 (Verkaufsertrag an Rückstellungen). In 20_2 kosten die effektiven Garantiefälle CHF 28'000 (Rückstellungen an Bank). Die restlichen CHF 8'000 werden nicht mehr benötigt und aufgelöst (Rückstellungen an Verkaufsertrag)."},{type:"merksatz",text:"Nur Bildung und Auflösung sind erfolgswirksam. Die Verwendung ist erfolgsneutral: Sie tauscht lediglich die Rückstellung gegen den Mittelabfluss, die Belastung wurde schon bei der Bildung erfasst."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Garantierückstellung Velowerk GmbH",farbe:"#1B6B63",intro:"Der Nettoerlös 20_1 beträgt CHF 1'800'000. Erfahrungsgemäss fallen 2 Prozent davon als Garantiekosten an, also CHF 36'000. In 20_2 fallen effektiv CHF 28'000 an (Zahlung per Bank), der Rest wird aufgelöst. Wichtig: Velowerk bucht die Garantierückstellung als Ertragsminderung über den Verkaufsertrag, nicht über ein Aufwandkonto."},{id:"b7-2-A1",label:"A1 \u00B7 Bildung der Rückstellung",text:"Verbuche die Bildung der Garantierückstellung von CHF 36'000 per Ende 20_1 als Ertragsminderung.",anzahlBuchungen:1,loesungen:[[{sollKeys:["verkaufsertrag"],habenKeys:["rueckstellungen"],betrag:36e3}]]},{id:"b7-2-A2",label:"A2 \u00B7 Verwendung im Garantiefall",text:"In 20_2 bezahlt Velowerk Garantiereparaturen von CHF 28'000 per Bank. Verbuche die Verwendung der Rückstellung.",anzahlBuchungen:1,loesungen:[[{sollKeys:["rueckstellungen"],habenKeys:["bank"],betrag:28e3}]]},{id:"b7-2-A3",label:"A3 \u00B7 Auflösung des Restbetrags",text:"Die restlichen CHF 8'000 werden per Ende 20_2 nicht mehr benötigt. Verbuche die Auflösung (Gegenbuchung zur Bildung).",anzahlBuchungen:1,loesungen:[[{sollKeys:["rueckstellungen"],habenKeys:["verkaufsertrag"],betrag:8e3}]]},{id:"b7-2-A4",typ:"kennzahl",label:"A4 \u00B7 Wirkung im Bildungsjahr",text:"Um wie viele CHF sinkt das Jahresergebnis 20_1 durch die Bildung der Garantierückstellung?",erwartet:36e3,einheit:"CHF",toleranz:.5,loesung:"Die Bildung von CHF 36'000 kürzt den Verkaufsertrag des Jahres 20_1 und senkt das Ergebnis um genau diesen Betrag. Die spätere Zahlung in 20_2 ist erfolgsneutral."},{typ:"abschnitt",label:"Teil B \u00B7 Prozessrückstellung",farbe:"#1D4ED8",intro:"Velowerk ist in einen Rechtsstreit mit einem Lieferanten verwickelt. Der Anwalt schätzt die wahrscheinliche Belastung per Ende 20_1 auf CHF 20'000. In 20_2 verurteilt das Gericht Velowerk zur Zahlung von CHF 24'000 (Zahlung per Bank)."},{id:"b7-2-B1",label:"B1 \u00B7 Bildung der Prozessrückstellung",text:"Verbuche die Bildung der Prozessrückstellung von CHF 20'000 per Ende 20_1 (übriger Betriebsaufwand).",anzahlBuchungen:1,loesungen:[[{sollKeys:["uebrigeraufwand"],habenKeys:["rueckstellungen"],betrag:2e4}]]},{id:"b7-2-B2",label:"B2 \u00B7 Urteil übersteigt die Rückstellung",text:"In 20_2 bezahlt Velowerk gemäss Urteil CHF 24'000 per Bank. Die Rückstellung von CHF 20'000 wird vollständig verwendet, der Mehrbetrag belastet den übrigen Betriebsaufwand. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["rueckstellungen"],habenKeys:["bank"],betrag:2e4},{sollKeys:["uebrigeraufwand"],habenKeys:["bank"],betrag:4e3}]]},{id:"b7-2-B3",typ:"multiplechoice",label:"B3 \u00B7 Erfolgswirkung der Verwendung",text:"Wie wirkt sich die Verwendung einer Rückstellung (Rückstellungen an Bank) auf das Jahresergebnis aus?",antworten:["Das Ergebnis sinkt um den vollen Betrag","Das Ergebnis steigt","Erfolgsneutral, der Aufwand wurde bereits bei der Bildung erfasst","Das Ergebnis sinkt um die Hälfte"],korrekt:2,loesung:"Die Verwendung ist erfolgsneutral: Es wird nur die passive Rückstellung gegen den Bankabfluss getauscht. Erfolgswirksam waren die Bildung (Ertragsminderung bzw. Aufwand) und wären eine Auflösung oder ein die Rückstellung übersteigender Mehrbetrag."}]},b7_aufgabe3={title:"Aufgabe 3: Abschreibungen \u00B7 Grundlagen und Berechnung",subtitle:"Abschreibungsarten \u00B7 lineare und degressive Methode \u00B7 Rechendrill",tabLabel:"Aufgabe 3",context:"Anlagevermögen verliert durch Nutzung, Alter und technischen Fortschritt an Wert. Abschreibungen erfassen diese Wertverminderung als Aufwand. Hier klärst du zuerst die Abschreibungsart und trainierst danach die Berechnung nach der linearen und der degressiven Methode.",theorie:{title:"Theorie: Wertverminderung des Anlagevermögens",blocks:[{type:"text",text:"Abschreibungen verteilen den Anschaffungswert einer Anlage auf ihre Nutzungsdauer. Sie sind Aufwand und senken das Jahresergebnis, ohne dass Geld abfliesst. Grundlagen der Berechnung sind der Anschaffungswert, die geschätzte Nutzungsdauer und ein allfälliger Restwert am Ende der Nutzung."},{type:"subtitle",text:"Zuerst die Abschreibungsart, dann die Methode"},{type:"text",text:"Bevor gerechnet wird, ist zu klären, was den Wertverlust überhaupt verursacht. Danach richtet sich die Abschreibungsart."},{type:"list",items:["Zeitproportional: Allein die Alterswertminderung ist entscheidend. Der Wert sinkt mit dem Alter, unabhängig von der tatsächlichen Nutzung. Linear und degressiv sind beides zeitproportionale Verfahren und decken den Normalfall ab.","Leistungsproportional: Entscheidend ist die verrichtete Leistung, gemessen in Betriebsstunden oder gefahrenen Kilometern. Sinnvoll bei stark schwankender Nutzung, zum Beispiel beim Lieferwagen der Velowerk GmbH.","Substanzwertabschreibung: Die Substanz eines Wirtschaftsguts nimmt tatsächlich ab. Typisch bei einem Steinbruch oder einer Kiesgrube, wo mit jedem Abbau die vorhandene Restmenge sinkt."]},{type:"formel",text:"Leistungsproportional: (Anschaffungswert \u2212 Restwert) \u00F7 geschätzte Gesamtleistung \u00D7 Leistung des Jahres"},{type:"subtitle",text:"Die Abschreibungsverfahren im \u00DCberblick"},{type:"text",text:"Innerhalb der zeitproportionalen Art gibt es mehrere Verfahren. In der Finanzbuchhaltung dominiert die lineare Methode, die \u00fcbrigen Verfahren geh\u00f6ren \u00fcberwiegend in die Betriebsbuchhaltung."},{type:"list",items:["Linear: gleicher Betrag pro Jahr vom Anschaffungswert.","Geometrisch degressiv: gleicher Prozentsatz vom Buchwert, sinkende Betr\u00e4ge, der Buchwert erreicht rechnerisch nie null. Gemeint ist dieses Verfahren, wenn von degressiver Abschreibung die Rede ist.","Arithmetisch degressiv: der Betrag sinkt jedes Jahr um einen festen Degressionsbetrag (Anschaffungswert geteilt durch die Summe der Nutzungsjahre). Am Ende ist voll abgeschrieben.","Progressiv: steigende Betr\u00e4ge. Nur dort sinnvoll, wo die Nutzung erst \u00fcber die Jahre anl\u00e4uft, etwa bei Kulturen in der Landwirtschaft.","Leistungsproportional und substanzwertproportional: nach Leistung beziehungsweise abgebauter Menge, siehe oben."]},{type:"subtitle",text:"Lineare Berechnung (vom Anschaffungswert)"},{type:"formel",text:"Jährliche Abschreibung = (Anschaffungswert \u2212 Restwert) \u00F7 Nutzungsdauer"},{type:"text",text:"Jedes Jahr wird der gleiche Betrag abgeschrieben. Der Buchwert sinkt in gleichmässigen Schritten bis auf den Restwert."},{type:"subtitle",text:"Degressive Berechnung (vom Buchwert)"},{type:"formel",text:"Jährliche Abschreibung = fester Prozentsatz \u00D7 Buchwert am Jahresanfang"},{type:"text",text:"Die Abschreibungsbeträge sind am Anfang hoch und werden jedes Jahr kleiner, weil der Prozentsatz immer auf den bereits reduzierten Buchwert angewendet wird. Der Buchwert erreicht rechnerisch nie null."},{type:"vergleich",left:{title:"Linear",text:"Gleicher Betrag pro Jahr. Einfach und planbar. Basis: Anschaffungswert. Typisch für Anlagen mit gleichmässiger Abnutzung."},right:{title:"Degressiv",text:"Sinkende Beträge, anfangs hoch. Basis: Buchwert. Bildet hohen Wertverlust in den ersten Jahren ab (z.B. Fahrzeuge) und ist steuerlich oft attraktiv."}},{type:"beispiel",text:"Lieferwagen der Velowerk GmbH: Anschaffungswert CHF 48'000, Nutzungsdauer 6 Jahre, kein Restwert. Linear: 48'000 \u00F7 6 = CHF 8'000 pro Jahr. Degressiv mit 25%: Jahr 1 = 25% von 48'000 = CHF 12'000, Jahr 2 = 25% von 36'000 = CHF 9'000."},{type:"subtitle",text:"Handelsrecht und Steuerrecht"},{type:"text",text:"Handelsrechtlich verlangt das OR Abschreibungen nach dem tats\u00e4chlichen Wertverlust, l\u00e4sst aus Vorsicht aber mehr zu. Steuerrechtlich geben die Steuer\u00e4mter Normals\u00e4tze vor (ESTV Merkblatt A 1995). Diese S\u00e4tze gelten in Prozent des Buchwertes, also degressiv. Wer linear vom Anschaffungswert abschreibt, muss den Satz halbieren. Was dar\u00fcber hinausgeht, wird als \u00dcberabschreibung aufgerechnet und f\u00fchrt zu einer versteuerten stillen Reserve."},{type:"formel",text:"Linearer Satz = Normalsatz \u00F7 2   \u00b7   Beispiel: 45 Prozent degressiv entsprechen 22.5 Prozent linear"},{type:"merksatz",text:"Zuerst die Art, dann die Methode: zeitproportional ist der Standardfall, leistungsproportional passt bei stark schwankender Nutzung, Substanzwert nur bei echtem Abbau. Innerhalb der zeitproportionalen Art gilt: Linear rechnet vom Anschaffungswert, degressiv vom Buchwert. Degressiv beginnt höher, linear bleibt konstant. Bewusst überhöhte Abschreibungen führen zu stillen Reserven."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Lineare Methode",farbe:"#1B6B63",intro:"Lieferwagen Velowerk GmbH: Anschaffungswert CHF 48'000, Nutzungsdauer 6 Jahre, kein Restwert."},{id:"b7-3-A1",typ:"kennzahl",label:"A1 \u00B7 Jährliche lineare Abschreibung",text:"Wie hoch ist die jährliche lineare Abschreibung des Lieferwagens (CHF)?",erwartet:8e3,einheit:"CHF",toleranz:.5,loesung:"48'000 \u00F7 6 Jahre = CHF 8'000 pro Jahr. Bei der linearen Methode ist der Betrag jedes Jahr gleich hoch."},{id:"b7-3-A2",typ:"kennzahl",label:"A2 \u00B7 Buchwert nach 2 Jahren",text:"Wie hoch ist der Buchwert des Lieferwagens nach 2 Jahren linearer Abschreibung (CHF)?",erwartet:32e3,einheit:"CHF",toleranz:.5,loesung:"48'000 \u2212 (2 \u00D7 8'000) = CHF 32'000. Der Buchwert sinkt linear in gleichen Schritten."},{id:"b7-3-A3",typ:"kennzahl",label:"A3 \u00B7 Linear mit Restwert",text:"Eine Montagemaschine kostet CHF 60'000, Nutzungsdauer 5 Jahre, Restwert CHF 10'000. Wie hoch ist die jährliche lineare Abschreibung (CHF)?",erwartet:1e4,einheit:"CHF",toleranz:.5,loesung:"(60'000 \u2212 10'000) \u00F7 5 = CHF 10'000 pro Jahr. Der Restwert wird nicht abgeschrieben, weil die Maschine am Ende noch zu diesem Wert verkauft werden kann."},{typ:"abschnitt",label:"Teil B \u00B7 Degressive Methode",farbe:"#1D4ED8",intro:"Gleicher Lieferwagen (Anschaffungswert CHF 48'000), jetzt degressiv mit 25% vom Buchwert."},{id:"b7-3-B1",typ:"kennzahl",label:"B1 \u00B7 Degressive Abschreibung Jahr 1",text:"Wie hoch ist die degressive Abschreibung im Jahr 1 (CHF)?",erwartet:12e3,einheit:"CHF",toleranz:.5,loesung:"25% von 48'000 = CHF 12'000. Im ersten Jahr entspricht der Buchwert dem Anschaffungswert."},{id:"b7-3-B2",typ:"kennzahl",label:"B2 \u00B7 Degressive Abschreibung Jahr 2",text:"Wie hoch ist die degressive Abschreibung im Jahr 2 (CHF)?",erwartet:9e3,einheit:"CHF",toleranz:.5,loesung:"Buchwert nach Jahr 1: 48'000 \u2212 12'000 = 36'000. Abschreibung Jahr 2: 25% von 36'000 = CHF 9'000. Die Basis ist immer der aktuelle Buchwert, nicht der Anschaffungswert."},{id:"b7-3-B3",typ:"kennzahl",label:"B3 \u00B7 Buchwert nach 2 Jahren degressiv",text:"Wie hoch ist der Buchwert nach 2 Jahren degressiver Abschreibung (CHF)?",erwartet:27e3,einheit:"CHF",toleranz:.5,loesung:"48'000 \u2212 12'000 \u2212 9'000 = CHF 27'000. Alternativ: 48'000 \u00D7 0.75 \u00D7 0.75 = 27'000."},{id:"b7-3-B4",typ:"multiplechoice",label:"B4 \u00B7 Methodenvergleich",text:"Welche Aussage zum Vergleich der beiden Methoden ist korrekt?",antworten:["Die lineare Methode rechnet vom Buchwert, die degressive vom Anschaffungswert","Die degressive Methode ergibt anfangs höhere Abschreibungen und rechnet vom Buchwert","Beide Methoden ergeben jedes Jahr denselben Betrag","Die degressive Methode erreicht den Buchwert null nach der halben Nutzungsdauer"],korrekt:1,loesung:"Degressiv rechnet mit einem festen Prozentsatz vom Buchwert: anfangs hohe, dann sinkende Beträge, der Buchwert erreicht rechnerisch nie null. Linear rechnet vom Anschaffungswert mit konstanten Beträgen."},{typ:"abschnitt",label:"Teil C \u00B7 Abschreibungsarten",farbe:"#1E3A5F",intro:"Die Velowerk GmbH prüft für zwei Anlagen, welche Abschreibungsart sachgerecht ist. Lieferwagen: Anschaffungswert CHF 48'000, geschätzte Gesamtleistung 300'000 km, kein Restwert. Zusätzlich beurteilst du einen Fall aus dem Rohstoffabbau."},{id:"b7-3-C1",typ:"multiplechoice",label:"C1 \u00B7 Abschreibungsart bestimmen",text:"Bei welcher Abschreibungsart ist allein die Alterswertminderung für die Höhe der Abschreibung entscheidend?",antworten:["Leistungsproportionale Abschreibung","Zeitproportionale Abschreibung","Substanzwertabschreibung","Indirekte Abschreibung"],korrekt:1,loesung:"Zeitproportional. Der Wertverlust hängt allein vom Zeitablauf ab, nicht von der tatsächlichen Nutzung. Linear und degressiv sind beides zeitproportionale Verfahren. Direkt und indirekt sind dagegen keine Abschreibungsarten, sondern Verbuchungsformen."},{id:"b7-3-C2",typ:"kennzahl",label:"C2 \u00B7 Leistungsproportional: Ansatz pro Kilometer",text:"Wie hoch ist der Abschreibungsbetrag pro gefahrenen Kilometer (CHF)?",erwartet:.16,einheit:"CHF",toleranz:.005,loesung:"48'000 \u00F7 300'000 km = CHF 0.16 pro Kilometer. Der Anschaffungswert wird nicht auf Jahre, sondern auf die geschätzte Gesamtleistung verteilt."},{id:"b7-3-C3",typ:"kennzahl",label:"C3 \u00B7 Abschreibung Jahr 1",text:"Im Jahr 20_1 fährt der Lieferwagen 45'000 km. Wie hoch ist die Abschreibung 20_1 (CHF)?",erwartet:7200,einheit:"CHF",toleranz:.5,loesung:"0.16 \u00D7 45'000 km = CHF 7'200. Zum Vergleich: linear über 6 Jahre wären es CHF 8'000. In einem schwachen Jahr fällt die leistungsproportionale Abschreibung tiefer aus."},{id:"b7-3-C4",typ:"kennzahl",label:"C4 \u00B7 Buchwert nach zwei Jahren",text:"Im Jahr 20_2 fährt der Lieferwagen 60'000 km. Wie hoch ist der Buchwert per Ende 20_2 (CHF)?",erwartet:31200,einheit:"CHF",toleranz:.5,loesung:"Abschreibung 20_2: 0.16 \u00D7 60'000 = CHF 9'600. Buchwert: 48'000 \u2212 7'200 \u2212 9'600 = CHF 31'200. Die Beträge schwanken mit der Nutzung, genau das ist der Zweck dieser Art."},{id:"b7-3-C5",typ:"kennzahl",label:"C5 \u00B7 Substanzwertabschreibung",text:"Eine Kiesgrube wurde für CHF 900'000 erworben, die abbaubare Gesamtmenge wird auf 300'000 m3 geschätzt. Im ersten Jahr werden 25'000 m3 abgebaut. Wie hoch ist die Abschreibung (CHF)?",erwartet:75000,einheit:"CHF",toleranz:.5,loesung:"900'000 \u00F7 300'000 m3 = CHF 3 pro m3. 3 \u00D7 25'000 m3 = CHF 75'000. Die Substanz nimmt tatsächlich ab, deshalb richtet sich die Abschreibung nach der abgebauten Menge."},{id:"b7-3-C6",typ:"multiplechoice",label:"C6 \u00B7 Art zuordnen",text:"Velowerk schreibt einen Werkstattkompressor nach Betriebsstunden ab. Um welche Abschreibungsart handelt es sich?",antworten:["Zeitproportionale Abschreibung","Substanzwertabschreibung","Leistungsproportionale Abschreibung","Degressive Abschreibung"],korrekt:2,loesung:"Leistungsproportional. Massstab ist die verrichtete Leistung, hier gemessen in Betriebsstunden. Degressiv ist keine eigene Art, sondern eine Methode innerhalb der zeitproportionalen Abschreibung. Substanzwert käme nur infrage, wenn die Substanz selbst abgebaut würde."},{typ:"abschnitt",label:"Teil D \u00B7 Steuers\u00e4tze und weitere Verfahren",farbe:"#A85930",intro:"Velowerk kauft eine Werkzeugmaschine f\u00fcr CHF 100'000. Der steuerliche Normalsatz betr\u00e4gt 45 Prozent vom Buchwert. Zus\u00e4tzlich beurteilst du zwei weitere Verfahren."},{id:"b7-3-D1",typ:"kennzahl",label:"D1 \u00B7 Normalsatz Jahr 1",text:"Wie hoch ist die steuerlich zul\u00e4ssige Abschreibung im Jahr 1 bei degressiver Abschreibung mit 45 Prozent (CHF)?",erwartet:45000,einheit:"CHF",toleranz:.5,loesung:"45 Prozent von 100'000 = CHF 45'000. Der Buchwert sinkt auf CHF 55'000. Die Normals\u00e4tze der Steuer\u00e4mter gelten immer in Prozent des Buchwertes."},{id:"b7-3-D2",typ:"kennzahl",label:"D2 \u00B7 Buchwert nach zwei Jahren degressiv",text:"Wie hoch ist der Buchwert nach zwei Jahren degressiver Abschreibung mit 45 Prozent (CHF)?",erwartet:30250,einheit:"CHF",toleranz:.5,loesung:"Jahr 2: 45 Prozent von 55'000 = CHF 24'750. Buchwert: 55'000 \u2212 24'750 = CHF 30'250."},{id:"b7-3-D3",typ:"kennzahl",label:"D3 \u00B7 Halber Satz bei linearer Abschreibung",text:"Velowerk will stattdessen linear abschreiben. Welcher Satz ist steuerlich zul\u00e4ssig (Prozent)?",erwartet:22.5,einheit:"Prozent",toleranz:.05,loesung:"45 \u00F7 2 = 22.5 Prozent. Die Normals\u00e4tze gelten f\u00fcr die Abschreibung vom Buchwert. Wer vom Anschaffungswert abschreibt, muss sie halbieren (Fussnote 2 des ESTV Merkblatts A 1995)."},{id:"b7-3-D4",typ:"kennzahl",label:"D4 \u00B7 Buchwert nach vier Jahren linear",text:"Wie hoch ist der Buchwert nach vier Jahren linearer Abschreibung mit 22.5 Prozent vom Anschaffungswert (CHF)?",erwartet:10000,einheit:"CHF",toleranz:.5,loesung:"22.5 Prozent von 100'000 = CHF 22'500 pro Jahr. Nach vier Jahren: 100'000 \u2212 4 \u00D7 22'500 = CHF 10'000. Linear ist die Maschine nach rund viereinhalb Jahren abgeschrieben, degressiv erreicht der Buchwert rechnerisch nie null."},{id:"b7-3-D5",typ:"multiplechoice",label:"D5 \u00B7 \u00dcberabschreibung",text:"Velowerk schreibt die Maschine im Jahr 1 mit CHF 60'000 ab, steuerlich zul\u00e4ssig w\u00e4ren CHF 45'000. Was passiert?",antworten:["Nichts, das OR erlaubt es","Die Steuerbeh\u00f6rde rechnet CHF 15'000 auf, es entsteht eine versteuerte stille Reserve","Die ganze Abschreibung wird gestrichen","Der Betrag wird auf das Folgejahr \u00fcbertragen"],korrekt:1,loesung:"Handelsrechtlich ist die h\u00f6here Abschreibung nach dem Vorsichtsprinzip zul\u00e4ssig, steuerlich nicht. Die Behörde rechnet die \u00dcberabschreibung von CHF 15'000 dem steuerbaren Gewinn hinzu. Es entsteht eine versteuerte stille Reserve: In der Bilanz vorhanden, steuerlich aber bereits erfasst."},{id:"b7-3-D6",typ:"kennzahl",label:"D6 \u00B7 Arithmetisch degressiv",text:"Eine Anlage kostet CHF 100'000 und wird \u00fcber 4 Jahre arithmetisch degressiv abgeschrieben. Degressionsbetrag = Anschaffungswert \u00F7 (4+3+2+1). Wie hoch ist die Abschreibung im Jahr 1 (CHF)?",erwartet:40000,einheit:"CHF",toleranz:.5,loesung:"Degressionsbetrag = 100'000 \u00F7 10 = CHF 10'000. Jahr 1 = 4 \u00D7 10'000 = CHF 40'000, danach 30'000, 20'000 und 10'000. Anders als geometrisch degressiv ist die Anlage am Ende vollst\u00e4ndig abgeschrieben."},{id:"b7-3-D7",typ:"multiplechoice",label:"D7 \u00B7 Progressive Abschreibung",text:"Wann ist die progressive Abschreibung sachgerecht?",antworten:["Bei Fahrzeugen, weil sie im ersten Jahr am meisten verlieren","Immer, wenn Steuern gespart werden sollen","Wenn die Nutzung erst \u00fcber die Jahre anl\u00e4uft, etwa bei Kulturen in der Landwirtschaft","Bei Geb\u00e4uden"],korrekt:2,loesung:"Progressiv bedeutet steigende Abschreibungsbetr\u00e4ge, das Gegenteil der degressiven Abschreibung. Sachgerecht nur dort, wo die Anlage erst nach mehreren Jahren ihre volle Nutzung erreicht. Bei Fahrzeugen w\u00e4re degressiv richtig, in der Finanzbuchhaltung ist progressiv praktisch bedeutungslos."}]},b7_aufgabe4={title:"Aufgabe 4: Direkte Abschreibung",subtitle:"Verbuchung direkt auf dem Anlagekonto \u00B7 Velowerk GmbH",tabLabel:"Aufgabe 4",context:"Bei der direkten Methode wird die Abschreibung direkt vom Anlagekonto abgebucht. Das Konto zeigt jederzeit den Buchwert, der ursprüngliche Anschaffungswert ist aber nicht mehr ersichtlich.",theorie:{title:"Theorie: Direkte Abschreibungsmethode",blocks:[{type:"text",text:"Bei der direkten Methode lautet der Buchungssatz: Abschreibungen an Anlagekonto (z.B. Fahrzeuge, Maschinen). Das Anlagekonto wird im Haben direkt reduziert und zeigt danach den Buchwert."},{type:"formel",text:"Buchungssatz direkt: Abschreibungen / Anlagekonto (Fahrzeuge, Maschinen, Mobiliar ...)"},{type:"list",items:["Vorteil: Einfach, das Anlagekonto zeigt direkt den Buchwert.","Nachteil: Anschaffungswert und bisher aufgelaufene Abschreibungen sind aus der Bilanz nicht mehr ersichtlich.","Das Konto Abschreibungen ist ein Aufwandskonto und wird über die Erfolgsrechnung abgeschlossen."]},{type:"beispiel",text:"Velowerk schreibt den Lieferwagen (CHF 48'000) linear mit CHF 8'000 pro Jahr direkt ab: Abschreibungen an Fahrzeuge CHF 8'000. Nach 3 Jahren steht das Konto Fahrzeuge noch auf CHF 24'000."},{type:"merksatz",text:"Direkt heisst: Das Anlagekonto selbst wird reduziert und zeigt den Buchwert. Der Anschaffungswert geht in der Bilanz verloren, er ist nur noch in der Anlagebuchhaltung bzw. im Anlagespiegel dokumentiert. Die einmal gewählte Methode ist stetig anzuwenden (Art. 958c OR)."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Verbuchung direkte Methode",farbe:"#1B6B63",intro:"Lieferwagen Velowerk GmbH: Anschaffungswert CHF 48'000, lineare Abschreibung CHF 8'000 pro Jahr."},{id:"b7-4-A1",label:"A1 \u00B7 Abschreibung Jahr 1 direkt",text:"Verbuche die lineare Abschreibung des Lieferwagens von CHF 8'000 nach der direkten Methode.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["fahrzeuge"],betrag:8e3}]]},{id:"b7-4-A2",typ:"kennzahl",label:"A2 \u00B7 Kontostand nach 3 Jahren",text:"Auf welchem Betrag steht das Konto Fahrzeuge nach 3 Jahren direkter Abschreibung (CHF)?",erwartet:24e3,einheit:"CHF",toleranz:.5,loesung:"48'000 \u2212 3 \u00D7 8'000 = CHF 24'000. Bei der direkten Methode zeigt das Anlagekonto immer den aktuellen Buchwert."},{id:"b7-4-A3",label:"A3 \u00B7 Maschine degressiv direkt",text:"Eine Montagemaschine (Anschaffungswert CHF 60'000) wird degressiv mit 20% vom Buchwert abgeschrieben. Verbuche die Abschreibung im Jahr 1 nach der direkten Methode.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["maschinen"],betrag:12e3}]]},{id:"b7-4-A4",typ:"multiplechoice",label:"A4 \u00B7 Nachteil der direkten Methode",text:"Was ist der wesentliche Nachteil der direkten Abschreibungsmethode?",antworten:["Sie ist komplizierter als die indirekte Methode","Der Anschaffungswert ist aus der Bilanz nicht mehr ersichtlich","Sie ist nach OR verboten","Die Abschreibung wird kein Aufwand"],korrekt:1,loesung:"Weil das Anlagekonto direkt reduziert wird, gehen Anschaffungswert und kumulierte Abschreibungen in der Bilanz verloren. Die indirekte Methode behebt genau diesen Nachteil mit einem separaten Wertberichtigungskonto."}]},b7_aufgabe5={title:"Aufgabe 5: Indirekte Abschreibung",subtitle:"Wertberichtigungskonto \u00B7 Anschaffungswert bleibt sichtbar",tabLabel:"Aufgabe 5",context:"Bei der indirekten Methode bleibt das Anlagekonto zum Anschaffungswert stehen. Die Abschreibungen sammeln sich auf einem separaten Wertberichtigungskonto (WB), einem Minusaktivkonto.",theorie:{title:"Theorie: Indirekte Abschreibungsmethode",blocks:[{type:"text",text:"Bei der indirekten Methode lautet der Buchungssatz: Abschreibungen an WB Anlagekonto (z.B. WB Fahrzeuge, WB Maschinen). Das Anlagekonto bleibt unverändert zum Anschaffungswert stehen, das Wertberichtigungskonto sammelt die kumulierten Abschreibungen."},{type:"formel",text:"Buchwert = Anschaffungswert \u2212 kumulierte Wertberichtigung (WB)"},{type:"list",items:["Das WB-Konto ist ein Minusaktivkonto: Es steht auf der Aktivseite, wirkt aber wertvermindernd.","Vorteil: Anschaffungswert, Alter und bisher aufgelaufene Abschreibungen bleiben transparent.","In der Bilanz wird meist der Nettowert (Buchwert) gezeigt, das WB-Konto liefert die Details für den Anlagespiegel."]},{type:"vergleich",left:{title:"Direkt",text:"Abschreibungen / Fahrzeuge. Anlagekonto zeigt den Buchwert, Anschaffungswert geht verloren."},right:{title:"Indirekt",text:"Abschreibungen / WB Fahrzeuge. Anlagekonto bleibt beim Anschaffungswert, WB-Konto sammelt die kumulierten Abschreibungen."}},{type:"beispiel",text:"Velowerk schreibt den Lieferwagen (CHF 48'000) indirekt ab: Abschreibungen an WB Fahrzeuge CHF 8'000 pro Jahr. Nach 3 Jahren: Konto Fahrzeuge CHF 48'000, WB Fahrzeuge CHF 24'000, Buchwert CHF 24'000."},{type:"subtitle",text:"Welche Methode wählt ein Unternehmen?"},{type:"text",text:"Erfolg, Buchwert, Bilanzsumme und Steuerfolge sind bei beiden Methoden identisch. Der Unterschied liegt allein im Informationsgehalt der Bilanz."},{type:"list",items:["Für direkt spricht: weniger Konten und weniger Aufwand. Sinnvoll bei kleinen Beständen, geringwertigen Anlagen und wenn niemand ausserhalb des Betriebs die Bilanz liest.","Für indirekt spricht: Die Altersstruktur wird lesbar. Maschinen CHF 120'000 minus Wertberichtigung CHF 96'000 zeigt, dass die Anlage zu 80 Prozent abgeschrieben ist und der Ersatz ansteht.","Für indirekt spricht ausserdem: Der Anlagespiegel greift direkt auf die Anschaffungswerte und die kumulierten Abschreibungen zu, und beim Abgang lassen sich beide sauber getrennt ausbuchen.","Stetigkeit: Die einmal gewählte Methode ist über die Jahre beizubehalten (Art. 958c Abs. 1 Ziff. 6 OR). Ein Wechsel ist zulässig, muss aber begründet und im Anhang offengelegt werden, sonst verlieren die Jahresrechnungen ihre Vergleichbarkeit."]},{type:"merksatz",text:"Indirekt heisst: Das Anlagekonto bleibt beim Anschaffungswert, die Wertverminderung sammelt sich im WB-Konto (Minusaktivkonto). Buchwert = Anschaffungswert minus WB. Der Aufwand ist bei beiden Methoden identisch, nur der Informationsgehalt unterscheidet sich. Direkt, wenn die Buchhaltung der Erfolgsermittlung dient. Indirekt, sobald jemand von aussen die Substanz beurteilen soll. Und: einmal gewählt, stetig anwenden."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Verbuchung indirekte Methode",farbe:"#1B6B63",intro:"Lieferwagen Velowerk GmbH: Anschaffungswert CHF 48'000, lineare Abschreibung CHF 8'000 pro Jahr, indirekt verbucht."},{id:"b7-5-A1",label:"A1 \u00B7 Abschreibung Jahr 1 indirekt",text:"Verbuche die lineare Abschreibung des Lieferwagens von CHF 8'000 nach der indirekten Methode.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["wbfahrzeuge"],betrag:8e3}]]},{id:"b7-5-A2",typ:"kennzahl",label:"A2 \u00B7 Buchwert nach 3 Jahren",text:"Wie hoch ist der Buchwert des Lieferwagens nach 3 Jahren indirekter Abschreibung (CHF)?",erwartet:24e3,einheit:"CHF",toleranz:.5,loesung:"Buchwert = 48'000 (Anschaffungswert) \u2212 24'000 (WB nach 3 Jahren) = CHF 24'000."},{id:"b7-5-A3",typ:"kennzahl",label:"A3 \u00B7 Stand des Anlagekontos",text:"Auf welchem Betrag steht das Konto Fahrzeuge selbst nach 3 Jahren indirekter Abschreibung (CHF)?",erwartet:48e3,einheit:"CHF",toleranz:.5,loesung:"Das Anlagekonto bleibt bei der indirekten Methode unverändert auf dem Anschaffungswert von CHF 48'000. Die Wertverminderung steckt vollständig im Konto WB Fahrzeuge (CHF 24'000)."},{id:"b7-5-A4",typ:"multiplechoice",label:"A4 \u00B7 Charakter des WB-Kontos",text:"Welcher Kontenart entspricht das Konto WB Fahrzeuge?",antworten:["Aufwandskonto","Passives Bestandeskonto","Minusaktivkonto (Wertberichtigungskonto)","Ertragskonto"],korrekt:2,loesung:"Das WB-Konto ist ein Minusaktivkonto: Es korrigiert den Wert des zugehörigen Aktivkontos nach unten. Gleiches Prinzip wie das Delkredere (WB Forderungen) aus Block 2."},{typ:"abschnitt",label:"Teil B \u00B7 Vertiefung",farbe:"#1D4ED8"},{id:"b7-5-B1",label:"B1 \u00B7 Maschine degressiv indirekt",text:"Die Montagemaschine (Anschaffungswert CHF 60'000) wird degressiv mit 20% vom Buchwert abgeschrieben. Verbuche die Abschreibung im Jahr 1 nach der indirekten Methode.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["wbmaschinen"],betrag:12e3}]]},{id:"b7-5-B2",typ:"kennzahl",label:"B2 \u00B7 Abschreibung Jahr 2 (degressiv, indirekt)",text:"Wie hoch ist die degressive Abschreibung der Maschine im Jahr 2 (CHF)? Achtung: Basis ist der Buchwert, nicht der Stand des Anlagekontos.",erwartet:96e2,einheit:"CHF",toleranz:.5,loesung:"Buchwert nach Jahr 1: 60'000 \u2212 12'000 = 48'000. Abschreibung Jahr 2: 20% von 48'000 = CHF 9'600. Auch bei der indirekten Methode rechnet die degressive Abschreibung vom Buchwert (Anschaffungswert minus WB), obwohl das Anlagekonto auf 60'000 stehen bleibt."},{id:"b7-5-B3",typ:"multiplechoice",label:"B3 \u00B7 Vorteil der indirekten Methode",text:"Was ist der wesentliche Vorteil der indirekten Abschreibungsmethode?",antworten:["Der Aufwand ist tiefer als bei der direkten Methode","Anschaffungswert und kumulierte Abschreibungen bleiben ersichtlich","Es braucht keine Buchung am Jahresende","Der Buchwert sinkt langsamer"],korrekt:1,loesung:"Anschaffungswert und kumulierte Abschreibungen bleiben transparent, was die Basis für den Anlagespiegel liefert. Der Abschreibungsaufwand und der Buchwert sind bei beiden Methoden identisch."},{id:"b7-5-B4",typ:"multiplechoice",label:"B4 \u00B7 Methodenwechsel",text:"Velowerk hat die Fahrzeuge bisher direkt abgeschrieben und möchte im Jahr 20_3 auf die indirekte Methode wechseln. Was gilt?",antworten:["Ein Wechsel ist verboten","Ein Wechsel ist jederzeit und ohne Begründung möglich","Ein Wechsel ist zulässig, muss aber begründet und im Anhang offengelegt werden","Ein Wechsel ist nur zulässig, wenn er den Gewinn erhöht"],korrekt:2,loesung:"Der Grundsatz der Stetigkeit (Art. 958c Abs. 1 Ziff. 6 OR) verlangt, dass Darstellung und Bewertung über die Zeit gleich bleiben. Ein Wechsel ist nicht verboten, aber er ist begründungs und offenlegungspflichtig, weil die Jahresrechnungen sonst nicht mehr vergleichbar sind."},{id:"b7-5-B5",typ:"multiplechoice",label:"B5 \u00B7 Zwei Betriebe vergleichen",text:"Zwei Betriebe weisen Maschinen mit einem Buchwert von CHF 24'000 aus. Betrieb A schreibt direkt ab, Betrieb B indirekt (Anschaffungswert CHF 120'000, Wertberichtigung CHF 96'000). Was erkennt der Bilanzleser nur bei Betrieb B?",antworten:["Den Abschreibungsaufwand des Jahres","Dass die Anlagen zu 80 Prozent abgeschrieben sind und der Ersatz ansteht","Den Jahresgewinn","Die gewählte Abschreibungsmethode ist am Buchwert erkennbar"],korrekt:1,loesung:"Beide Buchwerte betragen CHF 24'000. Nur bei der indirekten Methode ist erkennbar, ob es sich um fast neue Anlagen oder um weitgehend abgeschriebene Altanlagen handelt. Genau daraus leitet eine Bank den künftigen Investitionsbedarf ab."}]},b7_aufgabe6={title:"Aufgabe 6: Anlagespiegel und Synthese",subtitle:"Anlagespiegel lesen \u00B7 Abschreibungen und stille Reserven",tabLabel:"Aufgabe 6",context:"Der Anlagespiegel zeigt die Entwicklung des Anla
