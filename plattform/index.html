<style>
  .rewe-tutor-widget {
    position: fixed;
    right: 24px;
    bottom: 24px;
    z-index: 50;
    font-family: 'Inter', system-ui, sans-serif;
  }

  .rewe-tutor-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 52px;
    padding: 0 18px 0 14px;
    border: 1px solid rgba(249, 228, 122, 0.65);
    border-radius: 999px;
    background: #1B6B63;
    color: #fff;
    text-decoration: none;
    box-shadow: 0 14px 34px rgba(27, 107, 99, 0.28);

  .rewe-tutor-button:hover {

    box-shadow: 0 16px 38px rgba(27, 107, 99, 0.34);

    border-radius: 999px;

  .rewe-tutor-button-icon svg,

  .rewe-tutor-panel {

    border-radius: 12px;
    background: #fff;

  .rewe-tutor-widget[data-maximized="true"] .rewe-tutor-panel {

    height: auto;
    border-radius: 12px;

  .rewe-tutor-header {

    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 64px;
    padding: 12px 14px 12px 18px;

    color: #fff;

  .rewe-tutor-kicker {

    letter-spacing: 0.08em;

  .rewe-tutor-header h2 {

  .rewe-tutor-actions {

    align-items: center;

    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    flex: 0 0 auto;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    cursor: pointer;
    transition: background-color 0.16s ease;
  }

  .rewe-tutor-newchat:hover,
  .rewe-tutor-maximize:hover,
  .rewe-tutor-close:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  .rewe-tutor-minimize-icon,
  .rewe-tutor-widget[data-maximized="true"] .rewe-tutor-maximize-icon {

  .rewe-tutor-widget[data-maximized="true"] .rewe-tutor-minimize-icon {

  .rewe-tutor-panel iframe {

    .rewe-tutor-panel {
      right: 0;
      left: 0;
      bottom: 66px;
      width: 100%;
      height: min(720px, calc(100vh - 96px));
    }

      inset: 8px;
      right: 8px;
      bottom: 8px;
      width: auto;
      height: auto;
    }
  }

  .platform-meta {
    border-top: 1px solid #e7e5e4;
    background: #fff;
    color: #57534e;

  .platform-meta-inner {
    max-width: 64rem;
    margin: 0 auto;
    padding: 16px 24px;

    flex-wrap: wrap;
    gap: 12px;

  .platform-meta-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
  .platform-meta a { color: #1B6B63; text-decoration: underline; text-underline-offset: 2px; }
  .platform-meta button {
    border: 1px solid #a8a29e;

  .rewe-tutor-notice {

    border-bottom: 1px solid #e7e5e4;

  }
  .rewe-tutor-notice p { margin: 0 0 4px; }
  #rewe-tutor-status:empty { display: none; }
  .rewe-tutor-notice a { color: #1B6B63; font-weight: 700; text-decoration: underline; }
  .sr-only {

  @media (max-width: 640px) {
    .platform-meta-inner { padding: 14px 16px; align-items: flex-start; }
    .rewe-tutor-notice { font-size: 11px; }
  }
</style>
<script>
  (function () {
    var widget = document.querySelector('[data-rewe-tutor]');
    if (!widget) return;

    var toggle = widget.querySelector('.rewe-tutor-button');
    var panel = widget.querySelector('.rewe-tutor-panel');
    var iframe = widget.querySelector('iframe');
    var newChat = widget.querySelector('.rewe-tutor-newchat');
    var maximize = widget.querySelector('.rewe-tutor-maximize');
    var close = widget.querySelector('.rewe-tutor-close');
    var status = widget.querySelector('#rewe-tutor-status');
    var appRoot = document.getElementById('root');

    function setOpen(open) {
      panel.hidden = !open;
      panel.setAttribute('aria-hidden', String(!open));
      widget.dataset.open = String(open);
      toggle.setAttribute('aria-expanded', String(open));
      if (appRoot) appRoot.inert = open;
      if (open) {
        if (navigator.onLine) {
          status.textContent = '';
        } else {
          status.textContent = 'Du bist offline. Die Lernplattform funktioniert weiter; der Tutor benötigt eine Internetverbindung.';
        }
        window.setTimeout(function () { close.focus(); }, 0);
      }
    }

    function setMaximized(maximized) {
      widget.dataset.maximized = String(maximized);
      maximize.setAttribute('aria-pressed', String(maximized));
      maximize.setAttribute('aria-label', maximized ? 'ReWe Tutor verkleinern' : 'ReWe Tutor maximieren');
    }

    toggle.addEventListener('click', function () {
      setOpen(panel.hidden);
    });

    maximize.addEventListener('click', function () {
      setMaximized(widget.dataset.maximized !== 'true');
    });

    newChat.addEventListener('click', function () {
      if (!navigator.onLine) {
        status.textContent = 'Offline kann kein neuer Tutor-Chat gestartet werden.';
        return;
      }
      var baseSrc = iframe.dataset.baseSrc || iframe.src;
      iframe.src = 'about:blank';
      window.setTimeout(function () {
        iframe.src = baseSrc + '?newChat=' + Date.now();
      }, 80);
    });

    close.addEventListener('click', function () {
      setOpen(false);
      setMaximized(false);
      toggle.focus();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !panel.hidden) {
        setOpen(false);
        setMaximized(false);
        toggle.focus();
      }
    });
  })();
</script>

che Erfassung der Gesch\xE4ftsvorf\xE4lle","Belegnachweis f\xFCr die einzelnen Buchungsvorg\xE4nge","Klarheit","Zweckm\xE4ssigkeit mit Blick auf die Art und Gr\xF6sse des Unternehmens","Nachpr\xFCfbarkeit"]},{type:"vergleich",left:{title:"GoB (Art. 957a OR)",text:"Betrifft den Prozess der Buchf\xFChrung: Wie werden Gesch\xE4ftsvorf\xE4lle erfasst, dokumentiert, systematisiert? Voraussetzung f\xFCr ordnungsm\xE4ssige Rechnungslegung."},right:{title:"Grunds\xE4tze der Rechnungslegung (Art. 958c OR)",text:"Betrifft die fertige Darstellung: Wie werden Bilanz und Erfolgsrechnung pr\xE4sentiert? Aufbauend auf den GoB. Siehe Aufgabe 2."}},{type:"beispiel",text:"Ohne Belegnachweis (Grundsatz 2) keine Buchung. Jede Buchung muss durch einen Beleg dokumentiert sein \u2013 von der Lieferantenrechnung bis zur Kassenquittung. Bei einer Steuerpr\xFCfung kontrolliert der Pr\xFCfer als erstes die Belegbarkeit."},{type:"merksatz",text:"Die GoB sind das Fundament. Wer sie verletzt, riskiert Steuerpr\xFCfung, Ermessensveranlagung und im Extremfall strafrechtliche Konsequenzen nach Art. 166 StGB (Unterlassung der Buchf\xFChrung). Sie sind nicht verhandelbar."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Verst\xE4ndnisfragen zu den 5 GoB",farbe:"#1B6B63"},{id:"b1-1-A1",typ:"multiplechoice",label:"A1 \xB7 Bareinnahme ohne Quittung",text:"Ein Mitarbeitender bucht eine Bareinnahme von CHF 450 ohne Quittung. Welcher GoB-Grundsatz wird prim\xE4r verletzt?",antworten:["Klarheit","Belegnachweis","Zweckm\xE4ssigkeit","Nachpr\xFCfbarkeit"],korrekt:1,loesung:"Belegnachweis (Art. 957a Abs. 2 Ziff. 2 OR). Jede Buchung muss durch einen Beleg dokumentiert sein. Eine Bareinnahme ohne Quittung verletzt diesen fundamentalen Grundsatz und kann steuerrechtlich problematisch werden (Verdacht der Schwarzgeldannahme)."},{id:"b1-1-A2",typ:"multiplechoice",label:"A2 \xB7 KMU-Anpassung",text:"Ein KMU mit zwei Mitarbeitenden f\xFChrt keine komplexe Kostenrechnung wie ein Konzern. Ist das zul\xE4ssig?",antworten:["Nein, jedes Unternehmen braucht eine Kostenrechnung","Ja, gem\xE4ss dem Grundsatz der Zweckm\xE4ssigkeit","Nur mit Genehmigung der Steuerverwaltung","Nur, wenn die Revisionsstelle es absegnet"],korrekt:1,loesung:"Ja, gem\xE4ss dem Grundsatz der Zweckm\xE4ssigkeit (Art. 957a Abs. 2 Ziff. 4 OR). Die Buchhaltung muss zur Art und Gr\xF6sse des Unternehmens passen. Ein KMU mit zwei Mitarbeitenden muss nicht dieselbe Komplexit\xE4t haben wie eine Aktiengesellschaft mit 500 Mitarbeitenden."},{id:"b1-1-A3",typ:"multiplechoice",label:"A3 \xB7 Verworfene Buchhaltung",text:"Bei einer Steuerpr\xFCfung kann der Pr\xFCfer die Buchungen nicht nachvollziehen, weil keine systematische Erfassung erfolgte. Welcher Grundsatz fehlt prim\xE4r?",antworten:["Klarheit","Vollst\xE4ndige, wahrheitsgetreue und systematische Erfassung","Belegnachweis","Zweckm\xE4ssigkeit"],korrekt:1,loesung:"Vollst\xE4ndige, wahrheitsgetreue und systematische Erfassung (Art. 957a Abs. 2 Ziff. 1 OR). Ohne systematische Erfassung ist die Buchhaltung nicht nachvollziehbar. Der Pr\xFCfer kann dann eine Ermessensveranlagung vornehmen \u2013 meist zum Nachteil des Unternehmens."},{id:"b1-1-A4",typ:"multiplechoice",label:"A4 \xB7 Kundenkonten einzeln",text:"Ein Treuhandb\xFCro f\xFChrt f\xFCr jeden Kunden ein separates Forderungskonto statt einer Sammelposition. Welcher Grundsatz steht dahinter?",antworten:["Vollst\xE4ndigkeit","Klarheit","Nachpr\xFCfbarkeit","Stetigkeit"],korrekt:1,loesung:"Klarheit (Art. 957a Abs. 2 Ziff. 3 OR). Die Buchhaltung muss so gef\xFChrt sein, dass ein sachkundiger Dritter sich in angemessener Zeit zurechtfindet. Einzelne Kundenkonten erh\xF6hen die Klarheit deutlich \u2013 besonders bei Treuhand- und Anwaltsb\xFCros wichtig."},{typ:"abschnitt",label:"Teil B \xB7 Anwendung und Reflexion",farbe:"#A85930"},{id:"b1-1-B1",typ:"interpretation",label:"B1 \xB7 Konsequenzen einer Verletzung",text:"Was sind die praktischen Konsequenzen, wenn die GoB verletzt werden? Nenne mindestens drei verschiedene Bereiche.",musterloesung:["Steuerrecht: Das Steueramt kann die B\xFCcher verwerfen und eine Ermessensveranlagung vornehmen, meist zum Nachteil des Unternehmens. Zus\xE4tzliche Strafsteuern sind m\xF6glich.","Strafrecht: Bei einem Konkurs k\xF6nnen verletzte GoB strafrechtliche Konsequenzen haben (Art. 166 StGB \u2013 Unterlassung der Buchf\xFChrung).","Revision: Eine ordentliche oder eingeschr\xE4nkte Revision kann nicht ohne Vorbehalt abgegeben werden \u2013 mit Auswirkungen auf Generalversammlung, Banken und Kreditw\xFCrdigkeit.","Beweisf\xFChrung: Bei Streitf\xE4llen mit Kunden, Lieferanten oder Mitarbeitenden fehlt die Grundlage f\xFCr die Beweisf\xFChrung im Gerichtsverfahren.","Reputation und Verkauf: Bei einer Due-Diligence vor Unternehmensverkauf werden GoB-Verletzungen aufgedeckt und mindern den Verkaufspreis."]},{id:"b1-1-B2",typ:"interpretation",label:"B2 \xB7 GoB vs. Grunds\xE4tze der Rechnungslegung",text:"Wo liegt der Unterschied zwischen den GoB (Art. 957a OR) und den Grunds\xE4tzen der Rechnungslegung (Art. 958c OR)? Erkl\xE4re mit eigenen Worten.",musterloesung:["GoB betreffen den Prozess der Buchf\xFChrung: wie Gesch\xE4ftsvorf\xE4lle erfasst, dokumentiert und systematisiert werden.","Grunds\xE4tze der Rechnungslegung betreffen das Resultat: die Bilanz und Erfolgsrechnung am Jahresende.","GoB sind die Voraussetzung, Grunds\xE4tze der Rechnungslegung sind das Ziel.","Beispiel GoB: \xABJede Buchung braucht einen Beleg.\xBB Beispiel Grundsatz Rechnungslegung: \xABDie Darstellung muss klar und vollst\xE4ndig sein.\xBB","Beide Bereiche zusammen bilden das System der ordnungsm\xE4ssigen Buchf\xFChrung und Rechnungslegung nach Schweizer OR. Sie erg\xE4nzen sich, sind aber rechtlich getrennt verankert."]}]},b1_aufgabe2={title:"Aufgabe 2: Grunds\xE4tze der Rechnungslegung",subtitle:"Die 7 Grunds\xE4tze nach Art. 958c OR \xB7 Praxisf\xE4lle und Anwendung",tabLabel:"Aufgabe 2",context:"Die Grunds\xE4tze der Rechnungslegung betreffen die fertige Darstellung in Bilanz und Erfolgsrechnung. Sie bauen auf den GoB (Aufgabe 1) auf.",theorie:{title:"Theorie: Grunds\xE4tze der Rechnungslegung (Art. 958c OR)",blocks:[{type:"text",text:"W\xE4hrend die GoB den Prozess der Buchf\xFChrung regeln (Aufgabe 1), betreffen die Grunds\xE4tze der Rechnungslegung nach Art. 958c OR die fertige Darstellung in Bilanz und Erfolgsrechnung. Sie sorgen daf\xFCr, dass die Adressaten der Jahresrechnung \u2013 Aktion\xE4re, Banken, Steueramt \u2013 ein verl\xE4ssliches Bild bekommen."},{type:"subtitle",text:"Die 7 Grunds\xE4tze nach Art. 958c Abs. 1 OR"},{type:"list",items:["Klarheit und Verst\xE4ndlichkeit","Vollst\xE4ndigkeit","Verl\xE4sslichkeit","Wesentlichkeit","Vorsicht (Vorsichtsprinzip)","Stetigkeit (gleiche Massst\xE4be \xFCber die Zeit)","Verrechnungsverbot / Bruttoprinzip (Aktiven und Passiven, Aufwand und Ertrag d\xFCrfen nicht verrechnet werden)"]},{type:"subtitle",text:"Vorsichtsprinzip als Kernprinzip"},{type:"text",text:"Das Vorsichtsprinzip ist der wichtigste Grundsatz und pr\xE4gt die ganze Schweizer Rechnungslegung. Im Zweifel wird der pessimistischere Wert gew\xE4hlt: Aktiven werden eher tief, Passiven eher hoch bewertet. Das schafft stille Reserven (Aufgabe 5) und sch\xFCtzt vor \xDCberbewertung. Konkretisierungen sind das Imparit\xE4tsprinzip (Aufgabe 3) und das Niederstwertprinzip (Aufgabe 4)."},{type:"vergleich",left:{title:"Stetigkeit",text:"\xDCber die Zeit dieselben Bewertungs- und Darstellungs-Massst\xE4be verwenden. Methodenwechsel sind m\xF6glich, m\xFCssen aber im Anhang offengelegt werden."},right:{title:"Verrechnungsverbot",text:"Bruttoprinzip. Forderungen und Verbindlichkeiten d\xFCrfen nicht gegeneinander aufgerechnet werden. Auch Aufw\xE4nde und Ertr\xE4ge werden brutto ausgewiesen."}},{type:"beispiel",text:"Ein Unternehmen wechselt von der LIFO- zur FIFO-Bewertung. Das ist erlaubt (sachlicher Grund: bessere Marktwert-Ann\xE4herung), muss aber im Anhang erkl\xE4rt werden und auch die Auswirkung auf den Gewinn (Aufdeckung stiller Reserven) ist zu nennen. Verstoss gegen Stetigkeit ohne Begr\xFCndung w\xE4re formell ein Verstoss gegen Art. 958c OR."},{type:"merksatz",text:"Klarheit, Vollst\xE4ndigkeit, Verl\xE4sslichkeit, Wesentlichkeit, Vorsicht, Stetigkeit, Verrechnungsverbot \u2013 sieben Grunds\xE4tze, eine Eselsbr\xFCcke: \xABKVVV-VSV\xBB. Wer alle sieben einh\xE4lt, hat eine ordnungsm\xE4ssige Rechnungslegung."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Zuordnung der Grunds\xE4tze",farbe:"#1B6B63"},{id:"b1-2-A1",typ:"multiplechoice",label:"A1 \xB7 Erl\xF6s und Aufwand getrennt",text:"Ein Unternehmen weist im Gesch\xE4ftsbericht den Bruttoerl\xF6s und die Erl\xF6sminderungen (Rabatte, Skonti) separat aus statt verrechnet. Welcher Grundsatz steht dahinter?",antworten:["Klarheit","Vollst\xE4ndigkeit","Verrechnungsverbot / Bruttoprinzip","Wesentlichkeit"],korrekt:2,loesung:"Verrechnungsverbot / Bruttoprinzip (Art. 958c Abs. 1 Ziff. 7 OR). Aktiven und Passiven sowie Aufwand und Ertrag d\xFCrfen nicht miteinander verrechnet werden. Brutto-Ausweis ist Pflicht \u2013 nur dann sieht ein Leser die wahre Gesch\xE4ftst\xE4tigkeit."},{id:"b1-2-A2",typ:"multiplechoice",label:"A2 \xB7 Pendingforderung tief bewertet",text:"Eine Forderung an einen Kunden in Zahlungsschwierigkeiten wird zu 50% wertberichtigt, obwohl der Ausfall noch nicht sicher ist. Welcher Grundsatz steht dahinter?",antworten:["Stetigkeit","Vorsicht","Wesentlichkeit","Vollst\xE4ndigkeit"],korrekt:1,loesung:"Vorsicht (Art. 958c Abs. 1 Ziff. 5 OR). Aktiven werden im Zweifel tief bewertet. Das Vorsichtsprinzip ist der wichtigste Grundsatz der Schweizer Rechnungslegung und sch\xFCtzt vor \xDCberbewertung und \xFCberoptimistischen Gewinnausweisen."},{id:"b1-2-A3",typ:"multiplechoice",label:"A3 \xB7 Methodenwechsel",text:"Ein Unternehmen wechselt nach 10 Jahren LIFO-Bewertung auf FIFO. Welcher Grundsatz wird tangiert und wie?",antworten:["Stetigkeit \u2013 Wechsel ist verboten","Stetigkeit \u2013 Wechsel ist erlaubt, aber im Anhang zu erkl\xE4ren","Vorsicht \u2013 LIFO ist immer vorsichtiger","Verrechnungsverbot \u2013 keine Verbindung"],korrekt:1,loesung:"Stetigkeit (Art. 958c Abs. 1 Ziff. 6 OR). Methodenwechsel sind grunds\xE4tzlich erlaubt, m\xFCssen aber im Anhang erkl\xE4rt werden \u2013 inklusive Auswirkung auf den Gewinn. Sonst w\xE4re keine Vergleichbarkeit zwischen den Jahren mehr gegeben."},{id:"b1-2-A4",typ:"multiplechoice",label:"A4 \xB7 Kleiner Posten weggelassen",text:"Ein Unternehmen weist eine R\xFCckstellung von CHF 200 in einer Bilanzsumme von CHF 50 Millionen nicht separat aus. Ist das zul\xE4ssig?",antworten:["Nein, alles muss separat ausgewiesen werden","Ja, gem\xE4ss Wesentlichkeitsprinzip","Nur mit Zustimmung der Revisionsstelle","Nur in der Bilanz, nicht in der ER"],korrekt:1,loesung:"Ja, gem\xE4ss Wesentlichkeit (Art. 958c Abs. 1 Ziff. 4 OR). Geringe Betr\xE4ge m\xFCssen nicht separat ausgewiesen werden, wenn sie f\xFCr das Verst\xE4ndnis der Jahresrechnung nicht relevant sind. CHF 200 bei CHF 50 Millionen Bilanzsumme sind klar unwesentlich."},{id:"b1-2-A5",typ:"multiplechoice",label:"A5 \xB7 Verst\xE4ndliche Darstellung",text:"Ein Konzern erkl\xE4rt im Anhang detailliert, wie er Goodwill bewertet. Welcher Grundsatz steht dahinter?",antworten:["Klarheit und Verst\xE4ndlichkeit","Wesentlichkeit","Stetigkeit","Vorsicht"],korrekt:0,loesung:"Klarheit und Verst\xE4ndlichkeit (Art. 958c Abs. 1 Ziff. 1 OR). Komplexe Sachverhalte m\xFCssen so dargestellt werden, dass sie ein sachkundiger Leser nachvollziehen kann. Bewertungsmethoden f\xFCr Goodwill geh\xF6ren in den Anhang erkl\xE4rt."},{typ:"abschnitt",label:"Teil B \xB7 Reflexion zur Anwendung",farbe:"#A85930"},{id:"b1-2-B1",typ:"interpretation",label:"B1 \xB7 Hierarchie der Grunds\xE4tze",text:"Gibt es eine Rangfolge unter den 7 Grunds\xE4tzen? Welcher ist der wichtigste und warum?",musterloesung:["Formal sind alle 7 Grunds\xE4tze gleichrangig. Sie sind im OR auf derselben Ebene genannt.","Praktisch ist das Vorsichtsprinzip der wichtigste und pr\xE4gendste Grundsatz der Schweizer Rechnungslegung.","Es konkretisiert sich in mehreren anderen Bereichen: Imparit\xE4tsprinzip, Niederstwertprinzip, Bildung stiller Reserven.","Das Vorsichtsprinzip sch\xFCtzt vor \xDCberbewertung und \xFCberoptimistischer Gewinnausweisung \u2013 das ist gerade f\xFCr Banken und Gl\xE4ubiger wichtig.","Im Konflikt zwischen Vorsicht und Verl\xE4sslichkeit (echtes Bild) hat in der Schweiz traditionell die Vorsicht Vorrang. Das unterscheidet OR von IFRS, wo Verl\xE4sslichkeit / true and fair view st\xE4rker ist."]},{id:"b1-2-B2",typ:"interpretation",label:"B2 \xB7 OR vs. IFRS",text:"Welche Konsequenz hat es, wenn ein Schweizer Unternehmen freiwillig nach IFRS abschliesst statt nur nach OR? Welche der 7 Grunds\xE4tze werden anders interpretiert?",musterloesung:["IFRS legt mehr Gewicht auf Verl\xE4sslichkeit (true and fair view) als auf Vorsicht. Bilanzpositionen werden eher zum tats\xE4chlichen Wert bewertet.","Stille Reserven sind unter IFRS grunds\xE4tzlich nicht erlaubt \u2013 Aktiven werden nicht systematisch tief bewertet.","LIFO ist unter IFRS verboten (IAS 2), unter OR erlaubt.","Anschaffungskostenprinzip gilt unter IFRS nicht immer \u2013 Neubewertungen sind in vielen Bereichen m\xF6glich.","Konsequenz: Eine IFRS-Bilanz weist meist h\xF6here Verm\xF6genswerte und h\xF6here Gewinne aus als eine OR-Bilanz desselben Unternehmens. Banken und Investoren bekommen ein realistischeres Bild.","Schweizer KMU schliessen meist nur nach OR ab. Kotierte Unternehmen und gr\xF6ssere Konzerne nach Swiss GAAP FER oder IFRS, oft zus\xE4tzlich zum OR-Abschluss."]}]},b1_aufgabe3={title:"Aufgabe 3: Vorsichts- und Imparit\xE4tsprinzip",subtitle:"Konkretisierungen des Vorsichtsprinzips \xB7 Anwendung in der Praxis",tabLabel:"Aufgabe 3",context:"Das Vorsichtsprinzip konkretisiert sich in mehreren Teilprinzipien. Diese Aufgabe vertieft das Imparit\xE4ts- und das Niederstwertprinzip.",theorie:{title:"Theorie: Vorsichts- und Imparit\xE4tsprinzip",blocks:[{type:"text",text:"Das Vorsichtsprinzip ist das pr\xE4gende Prinzip der Schweizer Rechnungslegung. Es besagt: Im Zweifel wird der pessimistischere Wert gew\xE4hlt. Aktiven werden tief, Passiven hoch bewertet. In der Praxis konkretisiert sich das in mehreren Teilprinzipien."},{type:"subtitle",text:"Imparit\xE4tsprinzip"},{type:"text",text:"Das Imparit\xE4tsprinzip ist die wichtigste Konkretisierung des Vorsichtsprinzips. Es sagt: Verluste werden sofort antizipiert (sobald wahrscheinlich), Gewinne erst bei Realisation (also erst, wenn sie sicher verdient sind). Diese Ungleichbehandlung (\xABImparit\xE4t\xBB) sch\xFCtzt vor verfr\xFChter Gewinnausweisung."},{type:"subtitle",text:"Niederstwertprinzip"},{type:"text",text:"F\xFCr Aktiven gilt das Niederstwertprinzip: Beim Abschluss wird der niedrigere von zwei Werten gew\xE4hlt \u2013 Anschaffungs- bzw. Herstellungskosten ODER Markt- bzw. Ver\xE4usserungswert. Damit werden potenzielle Wertverluste sofort erfasst, potenzielle Wertgewinne aber ignoriert (siehe Imparit\xE4t)."},{type:"subtitle",text:"H\xF6chstwertprinzip"},{type:"text",text:"F\xFCr Passiven gilt analog das H\xF6chstwertprinzip: Verbindlichkeiten und R\xFCckstellungen werden zum h\xF6heren der m\xF6glichen Werte bewertet. Damit werden Risiken nicht untersch\xE4tzt."},{type:"vergleich",left:{title:"Verluste (sofort)",text:"Sobald ein Verlust wahrscheinlich ist, wird er erfasst. Beispiel: Eine Forderung an einen Kunden in Zahlungsschwierigkeiten wird wertberichtigt, auch wenn der Ausfall noch nicht sicher ist."},right:{title:"Gewinne (erst bei Realisation)",text:"Auch wenn ein Gewinn fast sicher ist, wird er erst gebucht, wenn er tats\xE4chlich realisiert wurde. Beispiel: Eine Liegenschaft, die im Marktwert gestiegen ist, bleibt zu Anschaffungskosten bilanziert."}},{type:"beispiel",text:"Velowerk hat im Lager 70 Velos zu Anschaffungskosten CHF 510 (Buchwert CHF 35'700). Der Marktpreis dieses Modells ist gefallen auf CHF 480 (Marktwert CHF 33'600). Nach Niederstwertprinzip ist auf den tieferen Wert abzuwerten: Buchung \xABVerlust auf Warenbestand / Warenbestand\xBB CHF 2'100. Wenn der Marktpreis sp\xE4ter wieder steigt auf CHF 530, wird NICHT wieder aufgewertet (Imparit\xE4t: Gewinne erst bei Realisation)."},{type:"merksatz",text:"Vorsicht ist Trumpf in der Schweizer Bilanz. Wer Imparit\xE4t, Niederst- und H\xF6chstwertprinzip verstanden hat, hat den Kern der OR-Bewertung verstanden. Es ist auch der Hauptgrund, warum Schweizer KMU oft erhebliche stille Reserven haben (Aufgabe 5)."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Anwendungsfragen",farbe:"#1B6B63"},{id:"b1-3-A1",typ:"multiplechoice",label:"A1 \xB7 Liegenschaft im Wert gestiegen",text:"Eine Liegenschaft wurde 2010 f\xFCr CHF 800'000 gekauft. Aktueller Marktwert: CHF 1'200'000. Wie wird sie in der Bilanz 2024 bewertet?",antworten:["Zum aktuellen Marktwert CHF 1'200'000","Zu Anschaffungskosten CHF 800'000 (Imparit\xE4t: Gewinne nicht antizipieren)","Zum Durchschnitt CHF 1'000'000","Frei w\xE4hlbar nach Ermessen der Gesch\xE4ftsleitung"],korrekt:1,loesung:"Zu Anschaffungskosten CHF 800'000. Das Imparit\xE4tsprinzip verbietet die Antizipation unrealisierter Gewinne. Solange die Liegenschaft nicht verkauft ist, bleibt sie zu Anschaffungskosten bilanziert. Die stille Reserve von CHF 400'000 wird erst bei Verkauf aufgedeckt."},{id:"b1-3-A2",typ:"multiplechoice",label:"A2 \xB7 Kundenforderung in Gefahr",text:"Ein Kunde hat eine Forderung von CHF 50'000 nicht bezahlt. Konkurs ist nicht er\xF6ffnet, aber Zahlungsschwierigkeiten sind bekannt. Was ist nach Vorsichtsprinzip korrekt?",antworten:["Nichts tun, bis Konkurs offiziell ist","Wertberichtigung bilden (z.B. 50%)","Forderung vollst\xE4ndig abschreiben","Auf Gericht warten"],korrekt:1,loesung:"Wertberichtigung bilden. Das Vorsichtsprinzip und das Imparit\xE4tsprinzip verlangen, dass Verluste sofort antizipiert werden, sobald sie wahrscheinlich sind. Eine Wertberichtigung von z.B. 50% ist eine pragmatische Antizipation des erwarteten Verlustes."},{id:"b1-3-A3",typ:"multiplechoice",label:"A3 \xB7 Warenbestand gefallen",text:"Modeware im Wert von CHF 100'000 (Anschaffung) ist saisonal abgewertet auf CHF 70'000 Marktwert. Wie ist zu bewerten?",antworten:["CHF 100'000 (Anschaffungskosten gelten)","CHF 70'000 (Niederstwertprinzip)","CHF 85'000 (Durchschnitt)","Wahlrecht des Buchhalters"],korrekt:1,loesung:"CHF 70'000 nach Niederstwertprinzip. Der niedrigere von Anschaffungs- und Marktwert ist zwingend zu w\xE4hlen. Buchung: Verlust auf Warenbestand / Warenbestand CHF 30'000."},{id:"b1-3-A4",typ:"multiplechoice",label:"A4 \xB7 R\xFCckstellung f\xFCr Prozess",text:"Gegen das Unternehmen l\xE4uft ein Gerichtsverfahren mit m\xF6glichem Schaden CHF 200'000 bis CHF 500'000 (alle Werte gleich wahrscheinlich). Welche R\xFCckstellung ist nach Vorsichtsprinzip korrekt?",antworten:["CHF 200'000 (Minimum)","CHF 350'000 (Mittelwert)","CHF 500'000 (H\xF6chstwertprinzip)","Keine R\xFCckstellung, bis Urteil"],korrekt:2,loesung:"CHF 500'000. F\xFCr Passiven gilt das H\xF6chstwertprinzip \u2013 im Zweifel der h\xF6here Wert. Das sch\xFCtzt vor Untersch\xE4tzung des Risikos. Wenn das Urteil sp\xE4ter g\xFCnstiger ausf\xE4llt, wird die R\xFCckstellung gewinnerh\xF6hend aufgel\xF6st."},{typ:"abschnitt",label:"Teil B \xB7 Reflexion",farbe:"#A85930"},{id:"b1-3-B1",typ:"interpretation",label:"B1 \xB7 Wirtschaftliche Folgen",text:"Welche wirtschaftlichen Folgen hat das Vorsichtsprinzip f\xFCr ein Unternehmen? Nenne Vor- und Nachteile.",musterloesung:["Vorteil \u2013 Krisenresistenz: Stille Reserven bieten einen Puffer in schlechten Jahren. Sie k\xF6nnen aufgel\xF6st werden, um Verluste zu gl\xE4tten.","Vorteil \u2013 Steuerlast: Tieferer ausgewiesener Gewinn = tiefere Steuern in starken Jahren. Steuerstundungseffekt.","Vorteil \u2013 Glaubw\xFCrdigkeit bei Banken: Konservative Bilanzen wirken solide, was Kreditkonditionen verbessern kann.","Nachteil \u2013 Verzerrtes Bild: Investoren und Aktion\xE4re sehen nicht die wahre Verm\xF6genslage. Das kann zu Fehlentscheidungen bei Verkauf, Erbgang oder Beteiligungen f\xFChren.","Nachteil \u2013 Internationale Vergleichbarkeit: Bei Vergleichen mit IFRS-Unternehmen oder ausl\xE4ndischen Konkurrenten wirkt das Schweizer Unternehmen kleiner und schw\xE4cher, als es ist.","Nachteil \u2013 Verkaufswert: Wer das Unternehmen verkaufen will, muss die stillen Reserven sichtbar machen \u2013 das kann komplex und langwierig sein."]}]},b1_aufgabe4={title:"Aufgabe 4: Bewertungsmassst\xE4be",subtitle:"Anschaffungs- und Herstellungskosten, Marktwert, Niederstwertprinzip",tabLabel:"Aufgabe 4",context:"Bei der erstmaligen Erfassung gelten Anschaffungs- oder Herstellungskosten als Obergrenze (Art. 960a OR). Bei der Folgebewertung das Niederstwertprinzip.",theorie:{title:"Theorie: Bewertungsmassst\xE4be nach OR",blocks:[{type:"text",text:"Die Bewertung von Aktiven folgt klaren Regeln. Art. 960a OR sagt: Bei der erstmaligen Erfassung sind Aktiven h\xF6chstens zu den Anschaffungs- oder Herstellungskosten zu bewerten. Bei der Folgebewertung gilt das Niederstwertprinzip \u2013 der niedrigere von Anschaffungs- und Marktwert."},{type:"subtitle",text:"Anschaffungskosten"},{type:"text",text:"Anschaffungskosten umfassen alle Aufwendungen, die n\xF6tig sind, um einen Verm\xF6genswert in den betriebsbereiten Zustand zu bringen. Dazu geh\xF6ren: Kaufpreis, Transport, Montage, Installation, Bezugsspesen. Skonti und Rabatte werden abgezogen. MWST nur bei nicht-vorsteuerabzugsberechtigten Unternehmen einbezogen."},{type:"subtitle",text:"Herstellungskosten"},{type:"text",text:"Bei selbst hergestellten Verm\xF6genswerten (z.B. Maschinen, Bauten, Software) sind Herstellungskosten massgebend. Sie umfassen: Materialkosten, direkte Lohnkosten, anteilige Gemeinkosten der Fertigung. Vertriebs- und Verwaltungsgemeinkosten d\xFCrfen NICHT aktiviert werden."},{type:"formel",text:"Anschaffungskosten = Kaufpreis \u2013 Rabatte \u2013 Skonti + Transport + Montage + Installation + Bezugsspesen"},{type:"subtitle",text:"Niederstwertprinzip (Folgebewertung)"},{type:"text",text:"Beim Jahresabschluss wird bei Aktiven der niedrigere von zwei Werten gew\xE4hlt: Anschaffungs-/Herstellungskosten ODER Markt-/Ver\xE4usserungswert. Damit werden potenzielle Wertverluste sofort erfasst (siehe Aufgabe 3 Imparit\xE4tsprinzip)."},{type:"vergleich",left:{title:"Anschaffung von Dritten",text:"Anschaffungskosten = Kaufpreis netto + Nebenkosten (Transport, Montage). Geld floss extern aus dem Unternehmen."},right:{title:"Selbst hergestellt",text:"Herstellungskosten = Material + direkte L\xF6hne + anteilige Fertigungs-Gemeinkosten. Kein Geldabfluss, aber Wertsch\xF6pfung im Unternehmen."}},{type:"beispiel",text:"Velowerk kauft eine Velo-Aufbau-Maschine f\xFCr CHF 50'000 brutto. Skonto 3% (CHF 1'500) bei Zahlung innert 10 Tagen. Transport CHF 800, Montage CHF 1'200, Schulung Mitarbeitende CHF 500. Anschaffungskosten: 50'000 - 1'500 + 800 + 1'200 + 500 = CHF 51'000. Schulungskosten sind aktivierbar, wenn sie f\xFCr die Inbetriebnahme n\xF6tig sind."},{type:"merksatz",text:"Anschaffungs- und Herstellungskosten sind die Obergrenze der Bewertung (Art. 960a OR). Sie k\xF6nnen nicht \xFCberschritten werden \u2013 ausser durch echte Neubewertung nach Aufwertungsm\xF6glichkeit (sehr selten in der Schweizer Praxis). Bei der Folgebewertung greift das Niederstwertprinzip nach unten."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Berechnung Anschaffungskosten",farbe:"#1B6B63"},{id:"b1-4-A1",typ:"kennzahl",label:"A1 \xB7 Maschine Anschaffungskosten",text:"Maschine: Kaufpreis CHF 80'000, Skonto 2% gew\xE4hrt, Transport CHF 1'500, Montage CHF 2'000, Schulung CHF 800. Berechne die Anschaffungskosten (CHF).",erwartet:82700,einheit:"CHF",toleranz:5,loesung:"80'000 \u2013 2% (= 1'600) + 1'500 + 2'000 + 800 = 80'000 \u2013 1'600 + 4'300 = CHF 82'700. Alle Kosten zur Erreichung der Betriebsbereitschaft inkl. Schulung sind aktivierbar."},{id:"b1-4-A2",typ:"kennzahl",label:"A2 \xB7 Liegenschaft Anschaffungskosten",text:"Liegenschaft: Kaufpreis CHF 1'200'000, Notariatskosten CHF 18'000, Hand\xE4nderungssteuer CHF 36'000, Umbau vor Bezug CHF 80'000, laufende Reparaturen 1. Jahr CHF 5'000. Berechne die Anschaffungskosten (CHF).",erwartet:1334e3,einheit:"CHF",toleranz:100,loesung:"1'200'000 + 18'000 + 36'000 + 80'000 = CHF 1'334'000. Notariat, Hand\xE4nderungssteuer und Umbau vor Bezug sind aktivierbar. Laufende Reparaturen (CHF 5'000) sind Erhaltungsaufwand, also direkt in den Aufwand zu buchen."},{id:"b1-4-A3",typ:"kennzahl",label:"A3 \xB7 Niederstwertprinzip Anwendung",text:"Warenbestand Buchwert (Anschaffungskosten): CHF 120'000. Aktueller Marktwert: CHF 95'000. Welcher Wert wird bilanziert (CHF)?",erwartet:95e3,einheit:"CHF",toleranz:0,loesung:"CHF 95'000. Nach Niederstwertprinzip ist der niedrigere von Buch- und Marktwert massgebend. Buchung: Verlust auf Warenbestand / Warenbestand CHF 25'000."},{id:"b1-4-A4",typ:"kennzahl",label:"A4 \xB7 Wertsteigerung sp\xE4ter",text:"Im Folgejahr steigt der Marktwert der Ware aus A3 wieder auf CHF 110'000. Auf welchen Wert wird bilanziert (CHF)?",erwartet:11e4,einheit:"CHF",toleranz:0,loesung:"CHF 110'000. Wertaufholung ist erlaubt bis maximal zu den urspr\xFCnglichen Anschaffungskosten (CHF 120'000). Die Aufholung erfolgt aber nur bis zum aktuellen Marktwert (CHF 110'000), nicht dar\xFCber. Buchung: Warenbestand / Wertaufholung CHF 15'000."},{typ:"abschnitt",label:"Teil B \xB7 Konzeptuelles Verst\xE4ndnis",farbe:"#A85930"},{id:"b1-4-B1",typ:"multiplechoice",label:"B1 \xB7 Welche Kosten aktivierbar?",text:"Bei welcher der folgenden Kosten gilt der Aktivierungsgrundsatz NICHT?",antworten:["Transport einer neuen Maschine zum Betrieb","Schulung der Mitarbeitenden zur Bedienung der neuen Maschine","Laufende Wartung der Maschine im Betrieb","Montage und Installation einer neuen Maschine"],korrekt:2,loesung:"Laufende Wartung der Maschine im Betrieb. Diese f\xE4llt nach Inbetriebnahme an und ist Erhaltungsaufwand \u2013 direkt als Aufwand in der ER zu erfassen. Die anderen Kosten geh\xF6ren zur Erreichung der Betriebsbereitschaft und sind damit aktivierbar."},{id:"b1-4-B2",typ:"multiplechoice",label:"B2 \xB7 Selbst hergestellt",text:"Welche Kosten d\xFCrfen bei der Aktivierung selbst hergestellter Verm\xF6genswerte NICHT einbezogen werden?",antworten:["Materialkosten","Direkte Lohnkosten der Fertigung","Anteilige Fertigungs-Gemeinkosten","Vertriebs- und Verwaltungsgemeinkosten"],korrekt:3,loesung:"Vertriebs- und Verwaltungsgemeinkosten d\xFCrfen NICHT aktiviert werden. Sie sind dem Gesch\xE4ftsbetrieb zuzurechnen, nicht der Herstellung. Material, direkte L\xF6hne und anteilige Fertigungs-Gemeinkosten sind aber Teil der Herstellungskosten."},{id:"b1-4-B3",typ:"interpretation",label:"B3 \xB7 Wertaufholung",text:"Wann ist eine Wertaufholung erlaubt und bis zu welcher Grenze? Erkl\xE4re mit eigenen Worten.",musterloesung:["Wertaufholung ist erlaubt, wenn der Grund f\xFCr die fr\xFChere Abwertung (nach Niederstwertprinzip) entfallen ist.","Beispiel: Ein Warenbestand wurde saisonal abgewertet, der Markt erholt sich aber wieder.","Die Wertaufholung darf NICHT \xFCber die urspr\xFCnglichen Anschaffungs- oder Herstellungskosten hinausgehen (Art. 960a OR).","Damit wird verhindert, dass durch Hin- und Her-Bewertungen stille Reserven verschoben oder Gewinne k\xFCnstlich generiert werden.","Konsequenz: Anschaffungskosten bleiben die absolute Obergrenze der Bewertung \u2013 auch nach Auf- und Abwertungen.","Buchung Wertaufholung: Aktivkonto / Wertaufholungsertrag (oder Reduktion des Abschreibungs-Aufwands)."]}]},b1_aufgabe5={title:"Aufgabe 5: Stille Reserven",subtitle:"Bildung, Aufl\xF6sung und buchhalterische Behandlung",tabLabel:"Aufgabe 5",context:"Stille Reserven entstehen, wenn Aktiven unter dem tats\xE4chlichen Wert oder Passiven \xFCber dem tats\xE4chlichen Wert bilanziert werden. Sie sind ein zentrales Merkmal der OR-Rechnungslegung.",theorie:{title:"Theorie: Stille Reserven",blocks:[{type:"text",text:"Stille Reserven sind eines der zentralsten Merkmale der Schweizer OR-Rechnungslegung. Sie entstehen, wenn Aktiven UNTER ihrem tats\xE4chlichen Wert (Unterbewertung) oder Passiven \xDCBER ihrem tats\xE4chlichen Wert (\xDCberbewertung) bilanziert werden. In der Bilanz sind sie unsichtbar \u2013 daher der Name \xABstill\xBB."},{type:"subtitle",text:"Zwei Arten von stillen Reserven"},{type:"list",items:["Zwangsreserven: Sie entstehen automatisch aus den Höchstbewertungsvorschriften des OR. Steigt der Marktwert über den Anschaffungswert, darf nicht aufgewertet werden (siehe Liegenschaft in Aufgabe 3). Die Geschäftsleitung hat keinen Ermessensspielraum.","Willkürreserven: Sie bildet die Geschäftsleitung absichtlich, um das Jahresergebnis zu beeinflussen. Typisch sind zu hohe Rückstellungen und Wertberichtigungen, höhere Abschreibungen als wirtschaftlich nötig oder eine zu tiefe Bewertung des Warenvorrats."]},{type:"text",text:"Innerhalb der Willkürreserven verläuft die entscheidende Grenze im Steuerrecht. Bewegt sich die Bewertung im geschäftsmässig begründeten Rahmen, wird sie anerkannt. Was darüber hinausgeht, rechnet die Steuerbehörde auf. Handelsrechtlich sind beide Arten zulässig."},{type:"subtitle",text:"Bildung und Aufl\xF6sung"},{type:"text",text:"Bildung: Erh\xF6hung der Wertberichtigung, schnellere Abschreibung, tiefere Bewertung. Buchung typischerweise \xFCber einen Aufwand. Beispiel: Wertberichtigung erh\xF6hen \u2192 Aufwand erh\xF6ht sich, Reingewinn sinkt, stille Reserve wird gebildet. Aufl\xF6sung: Reduktion der Wertberichtigung, Bewertung erh\xF6hen. Erfolg: Ertrag erh\xF6ht sich, Reingewinn steigt. Beispiel: Verkauf einer Liegenschaft, die unter Buchwert bilanziert war."},{type:"vergleich",left:{title:"Bildung (in starken Jahren)",text:"Aufwand erh\xF6hen \u2192 Gewinn senken \u2192 stille Reserve aufbauen. Wird in guten Jahren bewusst gemacht, um Puffer f\xFCr schlechte Jahre zu schaffen."},right:{title:"Aufl\xF6sung (in schwachen Jahren)",text:"Bewertung erh\xF6hen \u2192 Ertrag steigt \u2192 Reingewinn steigt \u2192 stille Reserve abgebaut. Gl\xE4ttet das ausgewiesene Ergebnis \xFCber die Jahre."}},{type:"subtitle",text:"Beispiel: Velowerk Lagerbewertung"},{type:"beispiel",text:"Velowerk hat 70 City Cruiser im Lager. Nach FIFO Wert CHF 35'700, nach LIFO Wert CHF 31'500. Wenn Velowerk LIFO w\xE4hlt (OR erlaubt das), entsteht eine stille Reserve von CHF 4'200. Diese Reserve ist in der Bilanz unsichtbar, k\xF6nnte aber bei Methodenwechsel (FIFO) aufgedeckt werden \u2013 mit entsprechender Gewinnerh\xF6hung im Wechseljahr."},{type:"merksatz",text:"Stille Reserven sind nach OR grunds\xE4tzlich zul\xE4ssig (Art. 960a Abs. 4 OR) und Teil des Vorsichtsprinzips. Unter Swiss GAAP FER und IFRS sind sie deutlich eingeschr\xE4nkt oder verboten. Bei einem Verkauf oder Erbgang werden sie typischerweise aufgedeckt \u2013 und dann steuerwirksam."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Berechnung von stillen Reserven",farbe:"#1B6B63"},{id:"b1-5-A1",typ:"kennzahl",label:"A1 \xB7 Stille Reserve im Lager",text:"Warenbestand zu Anschaffungskosten (FIFO): CHF 50'000. Buchwert nach LIFO-Methode: CHF 38'000. Wie hoch ist die stille Reserve (CHF)?",erwartet:12e3,einheit:"CHF",toleranz:0,loesung:"Stille Reserve = tats\xE4chlicher Wert \u2013 Buchwert = 50'000 \u2013 38'000 = CHF 12'000. Diese Reserve ist in der Bilanz unsichtbar."},{id:"b1-5-A2",typ:"kennzahl",label:"A2 \xB7 Stille Reserve in Liegenschaft",text:"Liegenschaft Buchwert CHF 800'000 (Anschaffung 2010), Marktwert per heute CHF 1'400'000. Wie hoch ist die stille Reserve (CHF)?",erwartet:6e5,einheit:"CHF",toleranz:0,loesung:"Stille Reserve = Marktwert \u2013 Buchwert = 1'400'000 \u2013 800'000 = CHF 600'000. Diese Zwangsreserve entsteht durch das Anschaffungskostenprinzip \u2013 die Liegenschaft kann nicht \xFCber Anschaffungskosten bewertet werden. Erst beim Verkauf wird die Reserve aufgedeckt."},{id:"b1-5-A3",typ:"kennzahl",label:"A3 \xB7 Willk\xFCrreserve in der Wertberichtigung",text:"Forderungsbestand CHF 200'000. Wertberichtigung gebildet: CHF 30'000 (15%). Effektiv erwarteter Ausfall: CHF 8'000. Wie hoch ist die stille Reserve (CHF)?",erwartet:22e3,einheit:"CHF",toleranz:0,loesung:"Stille Reserve = \xFCberh\xF6hte WB \u2013 effektiv n\xF6tig = 30'000 \u2013 8'000 = CHF 22'000. Die WB ist zu hoch angesetzt \u2013 im Resultat eine \xDCberbewertung der WB (Minderaktiv-Konto), was zu einer Unterbewertung der Netto-Forderungen f\xFChrt. Es handelt sich um eine Willk\xFCrreserve, weil die Bewertung \xFCber das gesch\xE4ftsm\xE4ssig Begr\xFCndete hinausgeht."},{typ:"abschnitt",label:"Teil B \xB7 Buchung der Aufl\xF6sung",farbe:"#15803D",intro:"Aufl\xF6sung stille Reserven: Wertberichtigung wird reduziert, ein Ertrag entsteht. Wir reduzieren WB Forderungen von CHF 30'000 auf CHF 8'000 (Aufl\xF6sung CHF 22'000)."},{id:"b1-5-B1",label:"B1 \xB7 Aufl\xF6sung WB Forderungen",text:"Die WB Forderungen wird von CHF 30'000 auf CHF 8'000 reduziert. Die Aufl\xF6sung von CHF 22'000 wird erfolgswirksam gebucht.",loesungen:[[{sollKeys:["wbforderungen"],habenKeys:["verlusteausforderungen"],betrag:22e3}]]},{typ:"abschnitt",label:"Teil C \xB7 Reflexion",farbe:"#A85930"},{id:"b1-5-C1",typ:"multiplechoice",label:"C1 \xB7 OR vs. Swiss GAAP FER",text:"Welche Aussage zu stillen Reserven nach Swiss GAAP FER trifft zu?",antworten:["Sie sind erlaubt wie nach OR","Sie sind grunds\xE4tzlich nicht erlaubt","Sie sind erlaubt, m\xFCssen aber offengelegt werden","Sie sind nur in der Erfolgsrechnung erlaubt"],korrekt:1,loesung:"Sie sind grunds\xE4tzlich nicht erlaubt. Swiss GAAP FER folgt dem true-and-fair-view-Prinzip wie IFRS. Bilanzpositionen m\xFCssen zu ihrem tats\xE4chlichen Wert bilanziert werden \u2013 keine systematische Unterbewertung von Aktiven. Stille Reserven sind ein OR-spezifisches Ph\xE4nomen."},{id:"b1-5-C2",typ:"interpretation",label:"C2 \xB7 Strategischer Einsatz",text:"Wann macht es f\xFCr ein Unternehmen Sinn, stille Reserven aufzul\xF6sen? Nenne drei m\xF6gliche Anl\xE4sse.",musterloesung:["Ergebnisgl\xE4ttung in einem schwachen Jahr: Wenn das operative Resultat tief ist, kann eine Aufl\xF6sung stiller Reserven das ausgewiesene Resultat verbessern. Vorteil: stabile Dividende, beruhigt Aktion\xE4re und Banken.","Kapitalbedarf f\xFCr Investitionen: Wer eine Kreditaufnahme plant, profitiert von einer optisch st\xE4rkeren Bilanz. Aufl\xF6sung stiller Reserven erh\xF6ht das ausgewiesene Eigenkapital.","Vor Unternehmensverkauf: K\xE4ufer wollen den \xABechten\xBB Wert sehen. Die Aufl\xF6sung stiller Reserven (oder zumindest deren Offenlegung) ist Teil der Due-Diligence.","Erbgang oder Generationenwechsel: Wenn das Unternehmen vererbt wird, m\xFCssen stille Reserven f\xFCr die Erbteilung transparent gemacht werden.","Methodenwechsel auf Swiss GAAP FER oder IFRS: Beim Wechsel zu strengeren Standards m\xFCssen stille Reserven aufgel\xF6st und versteuert werden.","Achtung: Aufl\xF6sung ist immer steuerwirksam (h\xF6herer Reingewinn = h\xF6here Steuern). Das ist die Kehrseite des Steuerstundungseffekts der Bildung."]}]},b2_aufgabe1={title:"Aufgabe 1: Endg\xFCltige und mutmassliche Verluste",subtitle:"Kundenverkehr \xFCber zwei Jahre, Zahlungen \xFCber Bank",tabLabel:"Aufgabe 1",theorie:{title:"Theorie: Endg\xFCltige und mutmassliche Forderungsverluste",blocks:[{type:"text",text:"Forderungen aus Lieferungen und Leistungen entstehen, wenn Kunden auf Rechnung kaufen. In der Praxis zahlt jedoch nicht jeder Kunde seine Rechnung. Buchhalterisch wird unterschieden zwischen Verlusten, die bereits sicher entstanden sind (endg\xFCltig), und Verlusten, die erwartet werden (mutmasslich). Das Vorsichtsprinzip nach Art. 958c OR verlangt, beide korrekt zu erfassen."},{type:"subtitle",text:"Endg\xFCltige Verluste"},{type:"text",text:"Ein endg\xFCltiger Verlust liegt vor, wenn der Forderungsausfall sicher feststeht: der Schuldner ist in Konkurs, ein Verlustschein wurde ausgestellt oder die Forderung ist anderweitig definitiv verloren. Die Forderung wird direkt aus den B\xFCchern entfernt (Direktabschreibung)."},{type:"subtitle",text:"Mutmassliche Verluste"},{type:"text",text:"Bei mutmasslichen Verlusten besteht die Vermutung, dass ein Teil der Forderungen ausfallen wird, ohne dass der konkrete Ausfall schon eingetreten ist. Aufgrund des Vorsichtsprinzips m\xFCssen diese Risiken ber\xFCcksichtigt werden. Die Verlustreserve wird auf einem Minderaktiv-Konto erfasst (Wertberichtigung Forderungen oder Delkredere) \u2013 das ist eine indirekte Wertberichtigung."},{type:"vergleich",left:{title:"Endg\xFCltiger Verlust",text:"Forderung ist definitiv ausgefallen. Direktabschreibung \xFCber Aufwand. Buchung: Verlust aus Forderungen / Forderungen L+L."},right:{title:"Mutmasslicher Verlust",text:"Ausfall noch nicht sicher, aber wahrscheinlich. Indirekte Wertberichtigung. Buchung: Verlust aus Forderungen / Wertberichtigung Forderungen."}},{type:"beispiel",text:"Ein Kunde mit Forderung CHF 60 meldet Konkurs an: endg\xFCltiger Verlust \u2192 Verlust aus Forderungen / Forderungen 60. Beim Abschluss wird zus\xE4tzlich pauschal 5% des Restbestands wertberichtigt: Verlust aus Forderungen / Wertberichtigung Forderungen. Die alte Wertberichtigung wird auf den neuen Sollwert angepasst (Aufl\xF6sung oder Erh\xF6hung)."},{type:"merksatz",text:"Endg\xFCltige Verluste reduzieren die Forderungen direkt (Forderungen / weg). Mutmassliche Verluste werden indirekt \xFCber ein Wertberichtigungs-Konto erfasst, damit die Bruttoforderungen in der Bilanz ersichtlich bleiben. Beide belasten den Periodenerfolg \xFCber das Konto \xABVerlust aus Forderungen\xBB."}]},faelle:[{id:"b2-1-j1-1",label:"Jahr 1 \xB7 Er\xF6ffnung",text:"Er\xF6ffnungsbestand: Forderungen L+L 120 / WB Forderungen L+L 12. (Reine Er\xF6ffnung, keine Buchung notwendig.)",keineEingabe:!0,loesung:"Er\xF6ffnungsbuchungen werden aus der Er\xF6ffnungsbilanz \xFCbernommen. Keine eigene Buchung im laufenden Gesch\xE4ft."},{id:"b2-1-j1-2",label:"Jahr 1 \xB7 Fall 2",text:"Kundenrechnungen CHF 1'250",loesungen:[[{sollKeys:["forderungen"],habenKeys:["betriebsertrag"],betrag:1250}]]},{id:"b2-1-j1-3",label:"Jahr 1 \xB7 Fall 3",text:"Kundenzahlungen CHF 1'180 auf die Bank",loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:1180}]]},{id:"b2-1-j1-4",label:"Jahr 1 \xB7 Fall 4",text:"Kunde Meier ist in Konkurs geraten, endg\xFCltiger Verlust CHF 60",loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:60}]]},{id:"b2-1-j1-5",label:"Jahr 1 \xB7 Abschluss",text:"Abschluss: Neue WB = 5% von CHF 130 (kaufm. gerundet) = CHF 7. Bestehende WB CHF 12 \u2192 Aufl\xF6sung CHF 5.",loesungen:[[{sollKeys:["wbforderungen"],habenKeys:["verlusteausforderungen"],betrag:5}]]},{id:"b2-1-j2-2",label:"Jahr 2 \xB7 Fall 2",text:"Kundenrechnungen CHF 1'480",loesungen:[[{sollKeys:["forderungen"],habenKeys:["betriebsertrag"],betrag:1480}]]},{id:"b2-1-j2-3",label:"Jahr 2 \xB7 Fall 3",text:"Kundenzahlungen CHF 1'430 auf die Bank",loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:1430}]]},{id:"b2-1-j2-4",label:"Jahr 2 \xB7 Fall 4",text:"Kunde Breitenmoser: Rechnung CHF 28, Nachlass CHF 8 gew\xE4hrt, Rest CHF 20 auf Bank \xFCberwiesen. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["verlusteausforderungen","erloesminderungen"],habenKeys:["forderungen"],betrag:8},{sollKeys:["bank"],habenKeys:["forderungen"],betrag:20}]]},{id:"b2-1-j2-5",label:"Jahr 2 \xB7 Abschluss",text:"Abschluss: Neue WB = 5% von CHF 152 (kaufm. gerundet) = CHF 8. Bestehende WB CHF 7 \u2192 Erh\xF6hung CHF 1.",loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["wbforderungen"],betrag:1}]]}],kontenLoesung:{konten:[{name:"Forderungen L+L",jahr1:{soll:[["Er\xF6ffnung",120],["Betriebsertrag",1250]],haben:[["Bank",1180],["Verluste aus Ford.",60],["Saldo (Vortrag)",130]]},jahr2:{soll:[["Er\xF6ffnung",130],["Betriebsertrag",1480]],haben:[["Bank",1430],["Verluste aus Ford.",8],["Bank",20],["Saldo (Vortrag)",152]]}},{name:"WB Forderungen L+L",jahr1:{soll:[["Verluste aus Ford. (Aufl\xF6sung)",5],["Saldo",7]],haben:[["Er\xF6ffnung",12]]},jahr2:{soll:[["Saldo",8]],haben:[["Er\xF6ffnung",7],["Verluste aus Ford. (Erh\xF6hung)",1]]}},{name:"Verluste aus Forderungen",jahr1:{soll:[["Forderungen L+L (Konkurs Meier)",60]],haben:[["WB Forderungen (Aufl\xF6sung)",5],["Erfolgsrechnung",55]]},jahr2:{soll:[["Forderungen L+L (Nachlass)",8],["WB Forderungen (Erh\xF6hung)",1]],haben:[["Erfolgsrechnung",9]]}}]}},b2_aufgabe2={title:"Aufgabe 2: Typische Buchungen zu Kundenguthaben",subtitle:"10 Standard-Gesch\xE4ftsf\xE4lle",tabLabel:"Aufgabe 2",theorie:{title:"Theorie: Standard-Buchungen rund um Kundenguthaben",blocks:[{type:"text",text:"Im t\xE4glichen Gesch\xE4ft fallen rund um die Forderungen aus L+L immer wieder \xE4hnliche Buchungen an: Rechnungen stellen, Zahlungen empfangen, Verluste abschreiben, Rabatte gew\xE4hren und Wertberichtigungen anpassen. Wer diese F\xE4lle automatisch beherrscht, hat den Kern der Debitorenbuchhaltung verstanden."},{type:"subtitle",text:"Verkauf auf Rechnung"},{type:"text",text:"Kernbuchung: Forderungen L+L / Betriebsertrag (bzw. Warenertrag oder Dienstleistungsertrag). Die Forderung entsteht in dem Moment, in dem die Rechnung gestellt wird, nicht erst bei Zahlungseingang."},{type:"subtitle",text:"Zahlungseingang"},{type:"text",text:"Bank (oder Kasse) / Forderungen L+L. Die Forderung wird ausgebucht, das Bankguthaben erh\xF6ht sich. Bei Teilzahlungen bleibt der Restbetrag als Forderung offen."},{type:"subtitle",text:"Abschreibung von Forderungen"},{type:"text",text:"Wenn ein Kunde nicht zahlt (Konkurs, Nachlassvertrag, Verlustschein), wird die Forderung direkt abgeschrieben: Verlust aus Forderungen / Forderungen L+L. Bei einer Konkursdividende (Teilzahlung aus der Konkursmasse) wird zuerst der erhaltene Anteil \xFCber Bank verbucht und der Rest abgeschrieben."},{type:"subtitle",text:"Rabatte und Erl\xF6sminderungen"},{type:"text",text:"Wird einem Kunden nach Rechnungsstellung ein Rabatt gew\xE4hrt, entsteht eine Erl\xF6sminderung. Buchung: Erl\xF6sminderungen (oder direkt Betriebsertrag) / Forderungen L+L. Die Forderung sinkt, der Ertrag wird reduziert."},{type:"vergleich",left:{title:"Betreibungskosten",text:"Wenn wir f\xFCr eine Betreibung einen Kostenvorschuss leisten, dieser ist dem Kunden zu belasten: Forderungen L+L / Bank. Die Forderung gegen\xFCber dem Kunden erh\xF6ht sich."},right:{title:"Wertberichtigung anpassen",text:"Beim Abschluss wird die Wertberichtigung neu gesch\xE4tzt. Erh\xF6hung: Verlust aus Forderungen / WB. Aufl\xF6sung: WB / Verlust aus Forderungen."}},{type:"beispiel",text:"Konkurs mit 30% Konkursdividende auf Forderung CHF 1'500: Erhalt: Bank / Forderungen 450. Abschreibung Rest: Verlust aus Forderungen / Forderungen 1'050. Total: 1'500 ausgebucht."},{type:"merksatz",text:"Verluste aus Forderungen sind ein Sammelkonto auf der Aufwandseite. Es nimmt alle direkten Abschreibungen und Anpassungen der Wertberichtigung auf. Unerwartete Zahlungen aus abgeschriebenen Forderungen werden hier gegengebucht oder als a.o. Ertrag erfasst."}]},faelle:[{id:"b2-2-1",label:"Fall 1",text:"Wir stellen Kunden Rechnungen im Betrag von CHF 1'680.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["betriebsertrag"],betrag:1680}]]},{id:"b2-2-2",label:"Fall 2",text:"Konkursverfahren abgeschlossen, Forderung CHF 850 wird abgeschrieben.",loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:850}]]},{id:"b2-2-3",label:"Fall 3",text:"Betreibung gegen Kunden, Kostenvorschuss CHF 50 \xFCber Bank bezahlt und dem Kunden belastet.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["bank"],betrag:50}]]},{id:"b2-2-4",label:"Fall 4",text:"Kunden zahlen Rechnung von CHF 750 auf die Bank.",loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:750}]]},{id:"b2-2-5",label:"Fall 5",text:"Nachlassvertrag mit Kunden: CHF 60 werden abgeschrieben.",loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:60}]]},{id:"b2-2-6",label:"Fall 6",text:"Unerwartete Zahlung CHF 95 auf Bank von einem im Vorjahr abgeschriebenen Kunden.",loesungen:[[{sollKeys:["bank"],habenKeys:["verlusteausforderungen","aoertrag"],betrag:95}]]},{id:"b2-2-7",label:"Fall 7",text:"Kunde Konkurs, Forderung CHF 1'500, Konkursdividende 30% auf Bank, Rest abschreiben. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:450},{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:1050}]]},{id:"b2-2-8",label:"Fall 8",text:"Rabatt von CHF 80 an Kunden gutschreiben.",loesungen:[[{sollKeys:["erloesminderungen","betriebsertrag"],habenKeys:["forderungen"],betrag:80}]]},{id:"b2-2-9",label:"Fall 9",text:"Betreibungsamt \xFCberweist CHF 120, Rest CHF 150 wird abgeschrieben. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:120},{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:150}]]},{id:"b2-2-10",label:"Fall 10",text:"WB Forderungen L+L aktuell CHF 300, neu gesch\xE4tzt CHF 260 (Aufl\xF6sung CHF 40).",loesungen:[[{sollKeys:["wbforderungen"],habenKeys:["verlusteausforderungen"],betrag:40}]]}]},b2_aufgabe3={title:"Aufgabe 3: Gesch\xE4ftsf\xE4lle zu Forderungen und Verbindlichkeiten",subtitle:"12 F\xE4lle plus Abschluss",tabLabel:"Aufgabe 3",theorie:{title:"Theorie: Verlustf\xE4lle und ihre buchhalterische Behandlung",blocks:[{type:"text",text:"Wenn ein Kunde nicht oder nur teilweise zahlt, gibt es in der Praxis verschiedene Verlustsituationen. Sie unterscheiden sich in der H\xF6he des Ausfalls und im rechtlichen Verfahren. Buchhalterisch wird aber meist nach dem gleichen Muster verbucht: erhaltener Teil \xFCber Bank/Kasse, Rest als Verlust."},{type:"subtitle",text:"Konkurs und Konkursdividende"},{type:"text",text:"Bei einem Konkurs wird ein Teil der Forderungen aus der Konkursmasse befriedigt (die Konkursdividende, z.B. 14% oder 30%). Der Rest geht verloren. Buchhalterisch sind das immer zwei Buchungen: Bank/Forderungen f\xFCr den Erhalt und Verlust aus Forderungen/Forderungen f\xFCr den Rest."},{type:"subtitle",text:"Nachlassvertrag"},{type:"text",text:"Beim Nachlassvertrag verzichtet der Gl\xE4ubiger freiwillig auf einen Teil der Forderung, damit der Schuldner saniert werden kann. Der Verzicht wird als Verlust gebucht: Verlust aus Forderungen / Forderungen L+L."},{type:"subtitle",text:"Verlustschein und sp\xE4tere Zahlungen"},{type:"text",text:"Ein Verlustschein wird ausgestellt, wenn ein Schuldner nichts mehr hat. Die Forderung wird abgeschrieben. Wenn der Schuldner Jahre sp\xE4ter doch noch zahlt, ist das ein a.o. Ertrag oder Reduktion der Verluste aus Forderungen \u2013 kein normaler Forderungseingang mehr, weil die Forderung bereits ausgebucht war."},{type:"vergleich",left:{title:"Verlust im laufenden Jahr",text:"Direkt zum Zeitpunkt des Schadens. Buchung: Verlust aus Forderungen / Forderungen. Der Aufwand belastet das laufende Gesch\xE4ftsjahr."},right:{title:"Eingang abgeschriebener Forderung",text:"In sp\xE4teren Jahren. Buchung: Bank / a.o. Ertrag (oder Bank / Verlust aus Forderungen). Korrigiert den Aufwand fr\xFCherer Jahre oder ist ausserordentlicher Ertrag."}},{type:"beispiel",text:"Forderung CHF 2'000, Konkursdividende 14% = CHF 280. Buchung 1: PostFinance / Forderungen 280. Buchung 2: Verlust aus Forderungen / Forderungen 1'720. Damit ist die Forderung vollst\xE4ndig ausgebucht und der Verlust periodengerecht erfasst."},{type:"subtitle",text:"Betreibungskosten"},{type:"text",text:"Kosten f\xFCr eine Betreibung sind zun\xE4chst Forderungen gegen\xFCber dem Schuldner (er muss sie tragen, falls er kann). Wir leisten den Kostenvorschuss und belasten ihn dem Kunden: Forderungen / Bank."},{type:"merksatz",text:"Bei allen Verlustf\xE4llen gilt: der erhaltene Teil l\xE4uft \xFCber Bank/Kasse/PostFinance gegen Forderungen, der ausgefallene Teil \xFCber \xABVerlust aus Forderungen\xBB gegen Forderungen. Sp\xE4tere Zahlungen auf bereits abgeschriebene Forderungen sind a.o. Ertrag oder Reduktion des Verlust-Kontos."}]},faelle:[{id:"b2-3-1",label:"Fall 1",text:"Konkursdividende 14% = CHF 280 auf PostFinance (Gesamtforderung CHF 2'000, Rest CHF 1'720 verloren). (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["postfinance"],habenKeys:["forderungen"],betrag:280},{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:1720}]]},{id:"b2-3-2",label:"Fall 2",text:"Verlustschein aus M\xE4rz, im November CHF 120 bar erhalten.",loesungen:[[{sollKeys:["kasse"],habenKeys:["verlusteausforderungen"],betrag:120}]]},{id:"b2-3-3",label:"Fall 3",text:"Nachlassvertrag: 70% Schuldennachlass auf CHF 5'900 = CHF 4'130 Verlust, Rest gestundet.",loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:4130}]]},{id:"b2-3-4",label:"Fall 4",text:"Vor 4 Jahren erfolglos betriebener Schuldner \xFCberweist CHF 250 auf Bank.",loesungen:[[{sollKeys:["bank"],habenKeys:["aoertrag","verlusteausforderungen"],betrag:250}]]},{id:"b2-3-5",label:"Fall 5",text:"Schuldner bringt CHF 300 bar, Restschuld CHF 410 wird erlassen. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["kasse"],habenKeys:["forderungen"],betrag:300},{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:410}]]},{id:"b2-3-6",label:"Fall 6",text:"Konkurs CHF 2'500, Dividende 30% auf PostFinance, Rest Verlustausweis. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["postfinance"],habenKeys:["forderungen"],betrag:750},{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:1750}]]},{id:"b2-3-7",label:"Fall 7",text:"Privater Nachlassvertrag: 40% von CHF 9'600 = CHF 3'840 Verlust.",loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:3840}]]},{id:"b2-3-8",label:"Fall 8",text:"Vor 4 Jahren in Konkurs geratener Kunde \xFCberweist CHF 800 auf Bank.",loesungen:[[{sollKeys:["bank"],habenKeys:["aoertrag","verlusteausforderungen"],betrag:800}]]},{id:"b2-3-9",label:"Fall 9",text:"Konkurs CHF 4'000, Dividende 8% auf PostFinance, Rest definitiv verloren. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["postfinance"],habenKeys:["forderungen"],betrag:320},{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:3680}]]},{id:"b2-3-10",label:"Fall 10",text:"Betreibungsspesen CHF 85 durch Bank bezahlt und dem Kunden belastet.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["bank"],betrag:85}]]},{id:"b2-3-11",label:"Fall 11",text:"Rechnung CHF 5'000 (Waren) unter Abzug von 2% Skonto durch Bank bezahlt. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:4900},{sollKeys:["verbindlichkeiten"],habenKeys:["skontoertrag","warenaufwand"],betrag:100}]]},{id:"b2-3-12",label:"Fall 12",text:"Gesch\xE4ftsinhaber \xFCberweist CHF 12'500 aus privaten Mitteln auf Gesch\xE4ftskonto.",loesungen:[[{sollKeys:["bank"],habenKeys:["privat"],betrag:12500}]]},{id:"b2-3-13",label:"Abschluss",text:"Konto \xABVerluste aus Forderungen L+L\xBB per 31.12. abschliessen. Der Saldo wird gegen die Erfolgsrechnung gebucht.",freitext:!0,loesung:"Erfolgsrechnung / Verluste aus Forderungen L+L (Saldo). Der Saldobetrag ergibt sich aus der Summe aller Buchungen auf dem Verlustkonto."}]},b2_aufgabe4={title:"Aufgabe 4: Anzahlungen an Lieferanten (K\xE4ufersicht)",subtitle:"Gallo Maschinenfabrik AG kauft, Kaufpreis CHF 900'000",tabLabel:"Aufgabe 4",context:"Wir sind die Gallo Maschinenfabrik AG und kaufen vier Maschinen. 1/3 Anzahlung bei Bestellung, 1/3 bei Lieferung (15.08.), Rest 2 Monate nach Lieferung. Alle Zahlungen \xFCber Bank. Geleistete Anzahlungen werden auf einem Aktivkonto (\xABAnzahlungen an Lieferanten\xBB) gebucht.",theorie:{title:"Theorie: Anzahlungen an Lieferanten \u2013 K\xE4ufersicht",blocks:[{type:"text",text:"Bei gr\xF6sseren Auftr\xE4gen verlangen Lieferanten oft eine Anzahlung, bevor sie die Ware oder Leistung erbringen. Aus Sicht des K\xE4ufers ist diese Vorauszahlung wirtschaftlich keine Endzahlung, sondern eine Forderung gegen\xFCber dem Lieferanten: wir haben bezahlt, aber noch nichts erhalten."},{type:"subtitle",text:"Konto \xABAnzahlungen an Lieferanten\xBB"},{type:"text",text:"Dies ist ein Aktivkonto mit Forderungs-Charakter. Es zeigt: \xABWir haben bereits Geld geleistet, aber noch nichts erhalten.\xBB Bei der sp\xE4teren Lieferung wird das Konto aufgel\xF6st und mit der finalen Rechnung verrechnet."},{type:"subtitle",text:"Buchungslogik in den Phasen"},{type:"list",items:["Anzahlung leisten: Anzahlungen an Lieferanten / Bank","Schlusslieferung erhalten: Anlagen oder Warenaufwand / Verbindlichkeiten L+L (voller Betrag)","Verrechnung der Anzahlung: Verbindlichkeiten L+L / Anzahlungen an Lieferanten","Restzahlung: Verbindlichkeiten L+L / Bank"]},{type:"beispiel",text:"Gallo kauft eine Maschine f\xFCr CHF 900'000. Bei Bestellung 1/3 Anzahlung: Anzahlungen an Lieferanten / Bank 300'000. Bei Lieferung: Mobile Sachanlagen / Verbindlichkeiten L+L 900'000. Verrechnung: Verbindlichkeiten / Anzahlungen 300'000. 2 weitere Drittel werden sp\xE4ter bezahlt: Verbindlichkeiten / Bank."},{type:"vergleich",left:{title:"Anzahlung wirtschaftlich",text:"Vor-Vorauszahlung an den Lieferanten. Wir haben bereits Liquidit\xE4t gegeben, ohne dass der Vertrag erf\xFCllt wurde."},right:{title:"Anzahlung bilanziell",text:"Aktivkonto im Umlaufverm\xF6gen. Erst bei finaler Lieferung wird die Position aufgel\xF6st und in den Verm\xF6genswert (Anlagen, Warenbestand) umgewandelt."}},{type:"merksatz",text:"Aus K\xE4ufersicht ist die Anzahlung ein Aktivkonto, weil sie eine Forderung gegen\xFCber dem Lieferanten darstellt: \xABwir haben bereits bezahlt, aber noch nicht erhalten\xBB. Das Konto wird bei der finalen Verrechnung gegen die Verbindlichkeiten aufgel\xF6st."}]},faelle:[{id:"b2-4-1",label:"Fall 1 \xB7 Bestellung",text:"Lieferant sendet Rechnung \xFCber Anzahlung CHF 300'000, wir bezahlen sofort. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["anzahlungenlieferanten"],habenKeys:["verbindlichkeiten"],betrag:3e5},{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:3e5}]]},{id:"b2-4-2",label:"Fall 2 \xB7 Lieferung 15.08.",text:"Lieferung der Maschinen. Restrechnung \xFCber CHF 600'000 erhalten, zweites Drittel CHF 300'000 bezahlt. (3 Buchungen)",anzahlBuchungen:3,loesungen:[[{sollKeys:["maschinen"],habenKeys:["verbindlichkeiten"],betrag:9e5},{sollKeys:["verbindlichkeiten"],habenKeys:["anzahlungenlieferanten"],betrag:3e5},{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:3e5}]]},{id:"b2-4-3",label:"Fall 3 \xB7 Restzahlung",text:"Restzahlung CHF 300'000 zwei Monate nach Lieferung.",loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:3e5}]]}]},b2_aufgabe5={title:"Aufgabe 5: Anzahlungen von Kunden (Verk\xE4ufersicht)",subtitle:"Maschinenbau Gerber AG verkauft an M\xFCller Handwerk AG, Verkaufspreis CHF 900'000",tabLabel:"Aufgabe 5",context:"Wir sind die Maschinenbau Gerber AG und verkaufen vier Spezialmaschinen an die M\xFCller Handwerk AG. Spiegelbild zu Aufgabe 4 aus Verk\xE4ufersicht. Erhaltene Anzahlungen werden auf einem Passivkonto (\xABAnzahlungen Kunden\xBB) gebucht und bei Lieferung als Betriebsertrag realisiert. Zahlungs- und Lieferbedingungen: 1/3 Anzahlung bei Auftragserteilung, 1/3 bei Lieferung (15.08.), Rest 2 Monate nach Lieferung. Alle Zahlungen \xFCber Bank.",theorie:{title:"Theorie: Anzahlungen von Kunden \u2013 Verk\xE4ufersicht",blocks:[{type:"text",text:"Aus Verk\xE4ufersicht ist eine empfangene Anzahlung das Spiegelbild zu Aufgabe 4. Der Kunde zahlt im Voraus, wir haben die Leistung aber noch nicht erbracht. Buchhalterisch entsteht eine Verpflichtung gegen\xFCber dem Kunden \u2013 ein Passivkonto."},{type:"subtitle",text:"Konto \xABAnzahlungen von Kunden\xBB"},{type:"text",text:"Dies ist ein Passivkonto mit Verbindlichkeits-Charakter. Es zeigt: \xABWir haben Geld erhalten, aber noch nichts geliefert.\xBB Wirtschaftlich besteht eine Lieferpflicht gegen\xFCber dem Kunden. Bei der Schlusslieferung wird die Anzahlung als Betriebsertrag realisiert."},{type:"subtitle",text:"Buchungslogik in den Phasen"},{type:"list",items:["Anzahlung erhalten: Bank / Anzahlungen von Kunden","Schlusslieferung: Forderungen L+L / Betriebsertrag (f\xFCr den noch ausstehenden Teil)","Realisierung der Anzahlung: Anzahlungen von Kunden / Betriebsertrag","Resterhalt: Bank / Forderungen L+L"]},{type:"vergleich",left:{title:"K\xE4ufer (Aufgabe 4)",text:"Anzahlungen an Lieferanten = Aktivkonto. Wir haben bezahlt, aber noch nichts erhalten. Buchung am Anfang: Anzahlungen / Bank."},right:{title:"Verk\xE4ufer (Aufgabe 5)",text:"Anzahlungen von Kunden = Passivkonto. Wir haben Geld erhalten, aber noch nicht geleistet. Buchung am Anfang: Bank / Anzahlungen."}},{type:"beispiel",text:"Gerber verkauft eine Maschine f\xFCr CHF 900'000. Kunde zahlt 1/3 an: Bank / Anzahlungen von Kunden 300'000. Bei Lieferung Rechnung 600'000: Forderungen / Betriebsertrag 600'000. Realisierung Anzahlung: Anzahlungen von Kunden / Betriebsertrag 300'000. Restzahlung bei F\xE4lligkeit: Bank / Forderungen 300'000."},{type:"merksatz",text:"Anzahlungen sind aus Sicht beider Parteien gespiegelt: beim K\xE4ufer ein Aktivkonto (Forderung), beim Verk\xE4ufer ein Passivkonto (Verpflichtung). Die Anzahlung wird erst zum Ertrag, wenn die Leistung tats\xE4chlich erbracht ist \u2013 sonst l\xE4ge eine Umsatzbuchung ohne Lieferung vor, was buchhalterisch falsch w\xE4re."}]},faelle:[{id:"b2-5-1",label:"Fall 1 \xB7 Auftragserteilung",text:"Wir stellen dem Kunden die Rechnung \xFCber die vereinbarte Anzahlung (1/3 = CHF 300'000). Der Kunde \xFCberweist den Betrag umgehend auf unser Bankkonto. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["forderungen"],habenKeys:["anzahlungenkunden"],betrag:3e5},{sollKeys:["bank"],habenKeys:["forderungen"],betrag:3e5}]]},{id:"b2-5-2",label:"Fall 2 \xB7 Lieferung 15.08.",text:"Mit der Lieferung stellen wir dem Kunden die Restrechnung \xFCber CHF 600'000. Die Anzahlung von CHF 300'000 wird als Betriebsertrag realisiert. Der Kunde bezahlt das zweite Drittel von CHF 300'000. (3 Buchungen)",anzahlBuchungen:3,loesungen:[[{sollKeys:["forderungen"],habenKeys:["betriebsertrag"],betrag:6e5},{sollKeys:["anzahlungenkunden"],habenKeys:["betriebsertrag"],betrag:3e5},{sollKeys:["bank"],habenKeys:["forderungen"],betrag:3e5}]]},{id:"b2-5-3",label:"Fall 3 \xB7 Restzahlung",text:"Den Restbetrag von CHF 300'000 erhalten wir zwei Monate nach Lieferung auf unser Bankkonto.",loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:3e5}]]}],vergleich:{title:"Direktvergleich K\xE4ufer vs. Verk\xE4ufer",subtitle:"Aufgabe 4 (Gallo, K\xE4ufer) vs. Aufgabe 5 (Gerber, Verk\xE4ufer)",cols:["Aspekt","K\xE4ufer (Aufgabe 4)","Verk\xE4ufer (Aufgabe 5)"],rows:[["Konto","Anzahlungen an Lieferanten","Anzahlungen Kunden"],["Kontoart","Aktivkonto (geleistete Anz.)","Passivkonto (erhaltene Anz.)"],["Bilanzseite","Umlaufverm\xF6gen","kurzfristiges Fremdkapital"],["Bei Anzahlung","Anz. Lieferanten / Bank","Bank / Anz. Kunden"],["Bei Lieferung","Umbuchung in Maschinen","Realisierung als Betriebsertrag"],["Erfolgswirkung","keine (Aktivierung)","+900'000 bei Lieferung"],["Cashflow","\u2212900'000 (3 Tranchen)","+900'000 (3 Tranchen)"]]}},b2_aufgabe6={title:"Aufgabe 6: Kunden- und Lieferantenanalyse",subtitle:"Velowerk GmbH Luzern \xB7 Kennzahlen, Altersstruktur, Massnahmen (Lernziel 1.4.2-K4)",tabLabel:"Aufgabe 6",context:"Die Velowerk GmbH Luzern schliesst das Gesch\xE4ftsjahr per 31.12. ab. Die Gesch\xE4ftsleitung m\xF6chte die Qualit\xE4t des Debitorenbestands analysieren und geeignete Massnahmen zur Reduktion der Forderungsverluste ableiten.",theorie:{title:"Theorie: Analyse von Kunden- und Lieferantenpositionen",blocks:[{type:"text",text:"Forderungen und Verbindlichkeiten sind nicht nur buchhalterische Positionen, sondern auch wichtige Kennzahlen f\xFCr das Working Capital Management. Wie schnell zahlen unsere Kunden? Wie schnell zahlen wir unsere Lieferanten? Wo gibt es Klumpenrisiken? Diese Analyse ist Kerngesch\xE4ft jedes Treuh\xE4nders und CFOs."},{type:"subtitle",text:"Debitorenfrist (Days Sales Outstanding, DSO)"},{type:"text",text:"Sie misst, wie viele Tage Kunden im Durchschnitt brauchen, um zu zahlen. Eine hohe Debitorenfrist bedeutet viel gebundenes Kapital und tiefen Cashflow. Branchen\xFCblich sind 30 bis 60 Tage."},{type:"formel",text:"Debitorenfrist = (Forderungen \xD7 360) \xF7 Umsatz"},{type:"subtitle",text:"Kreditorenfrist (Days Payable Outstanding, DPO)"},{type:"text",text:"Sie misst, wie viele Tage wir uns selbst Zeit nehmen, Lieferanten zu bezahlen. Eine hohe Kreditorenfrist bedeutet g\xFCnstigen Lieferantenkredit, kann aber die Gesch\xE4ftsbeziehung belasten."},{type:"formel",text:"Kreditorenfrist = (Verbindlichkeiten \xD7 360) \xF7 Wareneinkauf"},{type:"subtitle",text:"Altersstruktur der Forderungen"},{type:"text",text:"Die Altersstruktur zeigt, wie alt die offenen Forderungen sind. \xDCblich sind Buckets: nicht f\xE4llig, 1-30 Tage \xFCberf\xE4llig, 31-60 Tage, 61-90 Tage, \xFCber 90 Tage. Je \xE4lter eine Forderung, desto h\xF6her das Ausfallrisiko."},{type:"vergleich",left:{title:"Cash Conversion Cycle (positiv)",text:"Wenn Lager- + Debitorenfrist \u2013 Kreditorenfrist > 0, finanzieren wir das operative Gesch\xE4ft selbst. Hohe Liquidit\xE4tsanforderungen."},right:{title:"Cash Conversion Cycle (negativ)",text:"Wenn die Differenz negativ ist, finanzieren uns die Lieferanten. Tiefe Liquidit\xE4tsanforderungen, ideal f\xFCr Wachstum."}},{type:"subtitle",text:"Massnahmen zur Reduktion der Debitorenfrist"},{type:"list",items:["Klare Zahlungsbedingungen auf jeder Rechnung (z.B. 30 Tage netto)","Skonto-Anreize f\xFCr Schnellzahler (2% bei Zahlung innert 10 Tagen)","Mahnwesen systematisch und konsequent (1., 2., 3. Mahnung mit klaren Fristen)","Vorauszahlung oder Anzahlung bei Erstkunden und grossen Auftr\xE4gen","Bonit\xE4tspr\xFCfung bei Neukunden (Auskunftei wie CRIF, Bisnode)","Wertberichtigung gem\xE4ss Erfahrungswerten und Vorsichtsprinzip"]},{type:"beispiel",text:"Velowerk hat CHF 250'000 Forderungen bei CHF 1'500'000 Umsatz: Debitorenfrist = (250'000 \xD7 360) \xF7 1'500'000 = 60 Tage. Sehr lang f\xFCr Velohandel \u2013 Mahnwesen verst\xE4rken, Skontoanreize pr\xFCfen, \xE4ltere Forderungen einzeln bewerten."},{type:"merksatz",text:"Working Capital Management ist Cashflow-Management. Jeder Tag Debitorenfrist weniger bedeutet schneller verf\xFCgbares Geld. Jeder Tag Kreditorenfrist mehr ist g\xFCnstiger Lieferantenkredit \u2013 solange die Gesch\xE4ftsbeziehung nicht leidet. Die Analyse von Altersstruktur und Konzentrationsrisiken zeigt, wo die n\xE4chste Forderung ausfallen k\xF6nnte."}]},sachverhalt:{kennzahlen:{cols:["Position","Vorjahr (CHF)","Aktuelles Jahr (CHF)"],rows:[["Nettoerl\xF6s aus Warenverkauf","2'400'000","2'640'000"],["Warenaufwand","1'560'000","1'800'000"],["Forderungen L+L per 31.12.","320'000","440'000"],["Verbindlichkeiten L+L per 31.12.","195'000","225'000"],["Forderungsverluste (endg\xFCltig)","18'000","34'000"],["Wertberichtigung Ford. L+L per 31.12.","16'000","22'000"]]},altersstruktur:{title:"Altersstruktur der Forderungen per 31.12. (aktuelles Jahr)",cols:["F\xE4lligkeitsklasse","Betrag (CHF)","Anteil","WB-Satz"],rows:[["nicht f\xE4llig","264'000","60 %","1 %"],["1-30 Tage \xFCberf\xE4llig","88'000","20 %","3 %"],["31-60 Tage \xFCberf\xE4llig","44'000","10 %","8 %"],["61-90 Tage \xFCberf\xE4llig","26'400","6 %","20 %"],["\xFCber 90 Tage \xFCberf\xE4llig","17'600","4 %","40 %"],["Total","440'000","100 %",""]]}},faelle:[{id:"b2-6-A0",typ:"abschnitt",label:"Teil A \xB7 Kennzahlen berechnen"},{id:"6-A1a",typ:"kennzahl",label:"A1 \xB7 Debitorenfrist Vorjahr",text:"Berechnen Sie die Debitorenfrist im Vorjahr. Formel: Forderungen L+L \xD7 365 / Nettoerl\xF6s. Auf ganze Tage runden.",erwartet:49,einheit:"Tage",toleranz:1,loesung:"320'000 \xD7 365 / 2'400'000 = 116'800'000 / 2'400'000 = 48.67 Tage \u2192 gerundet 49 Tage"},{id:"6-A1b",typ:"kennzahl",label:"A1 \xB7 Debitorenfrist aktuelles Jahr",text:"Debitorenfrist im aktuellen Jahr.",erwartet:61,einheit:"Tage",toleranz:1,loesung:"440'000 \xD7 365 / 2'640'000 = 160'600'000 / 2'640'000 = 60.83 Tage \u2192 gerundet 61 Tage"},{id:"6-A2a",typ:"kennzahl",label:"A2 \xB7 Kreditorenfrist Vorjahr",text:"Berechnen Sie die Kreditorenfrist im Vorjahr. Formel: Verbindlichkeiten L+L \xD7 365 / Warenaufwand. Auf ganze Tage runden.",erwartet:46,einheit:"Tage",toleranz:1,loesung:"195'000 \xD7 365 / 1'560'000 = 45.62 Tage \u2192 gerundet 46 Tage"},{id:"6-A2b",typ:"kennzahl",label:"A2 \xB7 Kreditorenfrist aktuelles Jahr",text:"Kreditorenfrist im aktuellen Jahr.",erwartet:46,einheit:"Tage",toleranz:1,loesung:"225'000 \xD7 365 / 1'800'000 = 45.63 Tage \u2192 gerundet 46 Tage"},{id:"6-A3a",typ:"kennzahl",label:"A3 \xB7 Forderungsverlustquote Vorjahr",text:"Berechnen Sie die Forderungsverlustquote im Vorjahr (in %). Formel: Forderungsverluste / Nettoerl\xF6s \xD7 100.",erwartet:.75,einheit:"%",toleranz:.05,loesung:"18'000 / 2'400'000 = 0.0075 = 0.75 %"},{id:"6-A3b",typ:"kennzahl",label:"A3 \xB7 Forderungsverlustquote aktuelles Jahr",text:"Forderungsverlustquote im aktuellen Jahr (in %).",erwartet:1.29,einheit:"%",toleranz:.05,loesung:"34'000 / 2'640'000 = 0.01288 = 1.29 %"},{id:"b2-6-A4",typ:"interpretation",label:"A \xB7 Interpretation der Kennzahlen",text:"Interpretieren Sie die Ver\xE4nderung der Kennzahlen. Was sind die wichtigsten Beobachtungen?",musterloesung:["Die Debitorenfrist hat sich um 12 Tage verschlechtert (49 \u2192 61 Tage). Kunden zahlen erkennbar langsamer.","Die Liquidit\xE4tsl\xFCcke (Vorfinanzierungsbedarf) betr\xE4gt aktuell 61 minus 46 = 15 Tage. Velowerk muss diese L\xFCcke selbst \xFCberbr\xFCcken (z.B. \xFCber Kontokorrent).","Die Forderungsverlustquote hat sich nahezu verdoppelt (0.75 % \u2192 1.29 %). Das deutet auf eine Verschlechterung der Kundenqualit\xE4t oder M\xE4ngel im Inkasso hin.","Akuter Handlungsbedarf: Bonit\xE4tspr\xFCfung versch\xE4rfen, Mahnwesen systematisieren, Kreditlimiten \xFCberpr\xFCfen."]},{id:"b2-6-B0",typ:"abschnitt",label:"Teil B \xB7 Altersstruktur analysieren"},{id:"b2-6-B1",typ:"wbtabelle",label:"B1 \xB7 Differenzierte Wertberichtigung",text:"Berechnen Sie die WB pro F\xE4lligkeitsklasse (Betrag \xD7 Satz) und das Total.",zeilen:[{klasse:"nicht f\xE4llig",betrag:264e3,satz:1,erwartet:2640},{klasse:"1-30 Tage \xFCberf\xE4llig",betrag:88e3,satz:3,erwartet:2640},{klasse:"31-60 Tage \xFCberf\xE4llig",betrag:44e3,satz:8,erwartet:3520},{klasse:"61-90 Tage \xFCberf\xE4llig",betrag:26400,satz:20,erwartet:5280},{klasse:"\xFCber 90 Tage \xFCberf\xE4llig",betrag:17600,satz:40,erwartet:7040}],erwartetTotal:21120},{id:"b2-6-B2",typ:"interpretation",label:"B2 \xB7 Vergleich mit pauschaler WB",text:"Vergleichen Sie das Ergebnis mit der aktuellen pauschalen WB von CHF 22'000. Ist die aktuelle WB angemessen, zu hoch oder zu tief?",musterloesung:["Pauschale WB: CHF 22'000","Differenzierte WB: CHF 21'120","Differenz: CHF 880 \u2192 die aktuelle pauschale WB ist um CHF 880 zu hoch (versteckte stille Reserve).","Eine differenzierte WB nach Altersstruktur ist gem\xE4ss Vorsichtsprinzip (Art. 960a OR) und Swiss GAAP FER pr\xE4ziser, da sie das tats\xE4chliche Ausfallrisiko besser abbildet."]},{id:"b2-6-B3",typ:"buchung",label:"B3 \xB7 Buchung der Anpassung",text:"Buchen Sie die Anpassung der WB (Aufl\xF6sung um CHF 880).",anzahlBuchungen:1,loesungen:[[{sollKeys:["wbforderungen"],habenKeys:["verlusteausforderungen"],betrag:880}]]},{id:"b2-6-C0",typ:"abschnitt",label:"Teil C \xB7 Verbesserungsmassnahmen ableiten"},{id:"b2-6-C1",typ:"interpretation",label:"C1 \xB7 Massnahmen zur Verk\xFCrzung der Debitorenfrist",text:"Nennen Sie drei konkrete Massnahmen, um die Debitorenfrist zu verk\xFCrzen.",musterloesung:["Skonto-Anreize: 2 % bei Zahlung innert 10 Tagen (lockt zu Fr\xFChzahlung).","K\xFCrzere Zahlungsfristen vereinbaren (z.B. 20 statt 30 Tage Netto).","Konsequentes Mahnwesen mit fixen Mahnstufen (1. Mahnung nach 7 Tagen, 2. nach 14, 3. nach 21).","Rechnungsstellung sofort bei Lieferung statt monatliche Sammelrechnung.","Lastschriftverfahren (Direct Debit) f\xFCr Stammkunden anbieten."]},{id:"b2-6-C2",typ:"interpretation",label:"C2 \xB7 Massnahmen zur Pr\xE4vention von Forderungsverlusten",text:"Nennen Sie zwei Massnahmen zur Pr\xE4vention von Forderungsverlusten.",musterloesung:["Bonit\xE4tspr\xFCfung vor jedem gr\xF6sseren Auftrag (Creditreform, Bisnode).","Kreditlimiten pro Kunde definieren und im ERP \xFCberwachen.","Anzahlungen bei Neukunden oder grossen Auftr\xE4gen verlangen.","Kreditversicherung f\xFCr Forderungen \xFCber bestimmten Betrag abschliessen."]},{id:"b2-6-C3",typ:"interpretation",label:"C3 \xB7 Stellungnahme zu 2 % Skonto",text:"Die Gesch\xE4ftsleitung \xFCberlegt, ob sie allen Kunden 2 % Skonto bei Zahlung innert 10 Tagen anbieten soll. Welche Vor- und Nachteile hat diese Massnahme? Lohnt sich das aus Sicht der Velowerk GmbH?",musterloesung:["Vorteile: Liquidit\xE4tsgewinn (schnellere Zahlungseing\xE4nge), Reduktion Forderungsverluste, Marketingeffekt (Kundenbindung), Reduktion Mahnaufwand.","Nachteile: Direkte Ertragsminderung (2 % von 2'640'000 = CHF 52'800 weniger Ertrag), hoher impliziter Zinssatz (~36 % p.a.), Mitnahmeeffekt bei p\xFCnktlich zahlenden Kunden, l\xF6st strukturelle Probleme nicht.","Empfehlung f\xFCr Velowerk: Skonto-Satz auf 1 % reduzieren, nur f\xFCr definierte Kundensegmente (z.B. Neukunden oder s\xE4umige Zahler), zwingend mit Bonit\xE4tspr\xFCfung und Mahnwesen kombinieren, Wirkung nach 6 Monaten messen.","Fazit: Skonto ist Teil der L\xF6sung, aber kein Allheilmittel. Strukturelle Massnahmen (Bonit\xE4tspr\xFCfung, Limiten, Mahnwesen) wirken nachhaltiger."]}]},b3_aufgabe1={title:"Aufgabe 1: Methode ohne und mit laufender Inventur",subtitle:"Buchungen im Vergleich \xB7 Velowerk GmbH",tabLabel:"Aufgabe 1",context:"Identischer Sachverhalt f\xFCr beide Methoden. Bei der Methode ohne Inventur werden Bewegungen direkt auf Erfolgskonten gebucht; bei der Methode mit Inventur wird der Bestand laufend aktualisiert.",theorie:{title:"Theorie: Zwei Methoden der Warenkontenf\xFChrung",blocks:[{type:"text",text:"Beim Warenhandel m\xFCssen Wareneink\xE4ufe und Verk\xE4ufe verbucht werden. Es gibt zwei grunds\xE4tzliche Methoden, wie das Konto Warenbestand gef\xFChrt wird. Beide Methoden f\xFChren am Jahresende zum gleichen Bruttogewinn und gleichen Endbestand. Sie unterscheiden sich aber im Buchungsweg und in der laufenden Aktualit\xE4t."},{type:"subtitle",text:"Methode ohne laufende Inventur"},{type:"text",text:"W\xE4hrend des Jahres werden alle Wareneink\xE4ufe direkt als Warenaufwand und alle Verk\xE4ufe direkt als Warenertrag verbucht. Das Konto Warenbestand bleibt unver\xE4ndert. Erst beim Jahresabschluss wird der tats\xE4chliche Endbestand durch eine Inventur ermittelt und das Bestandskonto entsprechend angepasst."},{type:"vergleich",left:{title:"Vorteile",text:"Einfach in der Anwendung. Geeignet f\xFCr KMU mit manueller Buchhaltung. Wenige Buchungen w\xE4hrend des Jahres."},right:{title:"Nachteile",text:"Lagerwert ist w\xE4hrend des Jahres nicht aktuell. Bestandskorrektur am Jahresende zwingend n\xF6tig."}},{type:"subtitle",text:"Methode mit laufender Inventur"},{type:"text",text:"Bei dieser Methode wird das Bestandskonto bei jeder Bewegung aktualisiert. Wareneink\xE4ufe gehen direkt auf das Bestandskonto. Bei jedem Verkauf werden zwei Buchungen erstellt: der Erl\xF6s zum Verkaufspreis und der Einstand (Warenaufwand) zum Einkaufspreis. Beim Jahresabschluss ist keine Bestandskorrektur mehr n\xF6tig."},{type:"vergleich",left:{title:"Vorteile",text:"Bestandskonto jederzeit aktuell. Direkter \xDCberblick \xFCber die Marge pro Verkauf. Standard in modernen ERP-Systemen."},right:{title:"Nachteile",text:"Mehr Buchungen w\xE4hrend des Jahres. Einstandswert muss bei jedem Verkauf bekannt sein."}},{type:"beispiel",text:"Velowerk verkauft ein Velo f\xFCr CHF 800, das im Einkauf CHF 500 gekostet hat. Bei der Methode ohne Inventur wird nur der Erl\xF6s von 800 gebucht. Bei der Methode mit Inventur werden zwei Buchungen erstellt: 800 als Erl\xF6s und 500 als Einstand (Bestandsabbuchung)."},{type:"subtitle",text:"Welche Methode wo? Branchen\xFCblicher Einsatz"},{type:"text",text:"Die Wahl der Methode h\xE4ngt stark von Branche, Betriebsgr\xF6sse und vorhandener Informatik ab. Faustregel: Je gr\xF6sser das Unternehmen und je komplexer die Bestandsstruktur, desto eher die Methode mit laufender Inventur."},{type:"list",items:["Handelsbetrieb: KMU mit manueller Buchhaltung oder einfacher Kasse (Quartierladen, kleine Boutique) f\xFChren meist OHNE laufende Inventur. Grosse Detailh\xE4ndler mit Scanner-Kassen und Warenwirtschaftssystem (Migros, Coop, Apotheken-Ketten) nutzen die Methode MIT laufender Inventur \u2013 sie ist f\xFCr Sortimentssteuerung, Lagerumschlag und Margenkontrolle unverzichtbar.","Dienstleistungsbetrieb: Selten relevant, da kaum Warenbestand vorhanden ist. Wo doch (Coiffeursalon mit Pflegeprodukten, Tierarztpraxis mit Medikamenten, Restaurant mit Getr\xE4nken), wird meist OHNE laufende Inventur gearbeitet. Schwerpunkt sind hier nicht fakturierte Dienstleistungen (siehe Aufgabe 4), nicht der Warenbestand.","Produktionsbetrieb: Fast immer MIT laufender Inventur. Grund: Rohstoffe, Halbfabrikate und Fertigfabrikate m\xFCssen sauber abgegrenzt werden (siehe Aufgabe 5). Die Kostentr\xE4gerrechnung verlangt pr\xE4zise Bestandsverfolgung und ERP-Systeme wie SAP setzen die permanente Inventur voraus."]},{type:"vergleich",left:{title:"Faustregel",text:"Handel klein und Dienstleistung \u2192 meist ohne laufende Inventur. Geringer technischer Aufwand, ausreichend f\xFCr Erfolgsermittlung."},right:{title:"Faustregel",text:"Handel gross und Produktion \u2192 fast immer mit laufender Inventur. Notwendig f\xFCr Sortimentssteuerung, Margenkontrolle und Kostentr\xE4gerrechnung."}},{type:"merksatz",text:"Beide Meth
