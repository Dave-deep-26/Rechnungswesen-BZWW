gevermögens: Anschaffungswerte, Zugänge, Abgänge, kumulierte Wertberichtigungen und Buchwerte. Zum Abschluss verknüpfst du Abschreibungen mit dem Thema stille Reserven.",theorie:{title:"Theorie: Anlagespiegel",blocks:[{type:"text",text:"Der Anlagespiegel dokumentiert pro Anlagekategorie die Entwicklung während des Jahres. Er gliedert sich in zwei Ebenen: die Anschaffungswerte (Anfangsbestand + Zugänge \u2212 Abgänge = Endbestand) und die kumulierten Wertberichtigungen (Anfangsbestand + Abschreibungen des Jahres \u2212 WB der Abgänge = Endbestand)."},{type:"formel",text:"Buchwert Ende = Anschaffungswert Ende \u2212 kumulierte Wertberichtigung Ende"},{type:"list",items:["Zugänge: Käufe von Anlagen zum Anschaffungswert.","Abgänge: Verkäufe oder Ausmusterungen; sowohl der Anschaffungswert als auch die zugehörige WB werden ausgebucht.","Abschreibungen des Jahres: erhöhen die kumulierte WB.","Der Anlagespiegel setzt die indirekte Logik voraus: Er trennt Anschaffungswerte und Wertberichtigungen."]},{type:"subtitle",text:"Abschreibungen und stille Reserven"},{type:"text",text:"Wird mehr abgeschrieben, als der effektiven Wertverminderung entspricht, liegt der Buchwert unter dem effektiven Wert. Die Differenz ist eine stille Reserve. Sie entsteht bewusst (Willkür) oder durch pauschale Steuersätze und löst sich spätestens beim Verkauf der Anlage wieder auf."},{type:"merksatz",text:"Der Anlagespiegel macht transparent, was die Bilanz verdichtet: Anschaffungswerte, Investitionen, Abgänge und kumulierte Abschreibungen pro Kategorie. Buchwert = Anschaffungswert minus kumulierte WB."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Anlagespiegel Velowerk GmbH (Maschinen)",farbe:"#1B6B63",intro:"Anschaffungswerte: Anfangsbestand CHF 200'000, Zugänge CHF 40'000, Abgänge CHF 20'000. Kumulierte WB: Anfangsbestand CHF 80'000, Abschreibungen des Jahres CHF 24'000, WB der Abgänge CHF 15'000."},{id:"b7-6-A1",typ:"kennzahl",label:"A1 \u00B7 Anschaffungswert Ende",text:"Wie hoch ist der Anschaffungswert der Maschinen am Jahresende (CHF)?",erwartet:22e4,einheit:"CHF",toleranz:.5,loesung:"200'000 + 40'000 (Zugänge) \u2212 20'000 (Abgänge) = CHF 220'000."},{id:"b7-6-A2",typ:"kennzahl",label:"A2 \u00B7 Kumulierte WB Ende",text:"Wie hoch ist die kumulierte Wertberichtigung am Jahresende (CHF)?",erwartet:89e3,einheit:"CHF",toleranz:.5,loesung:"80'000 + 24'000 (Abschreibungen des Jahres) \u2212 15'000 (WB der Abgänge) = CHF 89'000. Beim Abgang einer Anlage wird auch ihre aufgelaufene WB ausgebucht."},{id:"b7-6-A3",typ:"kennzahl",label:"A3 \u00B7 Buchwert Ende",text:"Wie hoch ist der Buchwert der Maschinen am Jahresende (CHF)?",erwartet:131e3,einheit:"CHF",toleranz:.5,loesung:"220'000 (Anschaffungswert Ende) \u2212 89'000 (kumulierte WB Ende) = CHF 131'000."},{typ:"abschnitt",label:"Teil B \u00B7 Stille Reserven und Synthese",farbe:"#1D4ED8"},{id:"b7-6-B1",typ:"multiplechoice",label:"B1 \u00B7 Überhöhte Abschreibung",text:"Velowerk schreibt eine Maschine schneller ab, als sie effektiv an Wert verliert. Was entsteht?",antworten:["Ein ausserordentlicher Ertrag","Eine stille Reserve, weil der Buchwert unter dem effektiven Wert liegt","Eine offene Reserve im Eigenkapital","Eine Rückstellung"],korrekt:1,loesung:"Der Buchwert liegt unter dem effektiven Wert: Die Differenz ist eine stille Reserve. Sie senkt im Bildungsjahr den Gewinn und löst sich spätestens beim Verkauf (Buchgewinn) wieder auf."},{id:"b7-6-B2",typ:"kennzahl",label:"B2 \u00B7 Höhe der stillen Reserve",text:"Der effektive Wert der Maschinen beträgt CHF 150'000, der Buchwert gemäss Anlagespiegel CHF 131'000. Wie hoch sind die stillen Reserven auf den Maschinen (CHF)?",erwartet:19e3,einheit:"CHF",toleranz:.5,loesung:"150'000 \u2212 131'000 = CHF 19'000. Stille Reserven auf Aktiven = effektiver Wert minus Buchwert."},{id:"b7-6-B3",typ:"interpretation",label:"B3 \u00B7 Synthese: Nutzen des Anlagespiegels",text:"Erkläre, welche Informationen der Anlagespiegel liefert und warum diese für die Beurteilung eines Unternehmens wertvoll sind. Nenne mindestens drei Punkte.",musterloesung:["Investitionstätigkeit: Die Zugänge zeigen, ob das Unternehmen in seine Anlagen investiert oder von der Substanz lebt.","Alter der Anlagen: Ein hoher Anteil kumulierter WB am Anschaffungswert deutet auf alte, bald zu ersetzende Anlagen hin (Investitionsstau).","Abschreibungspolitik: Der Vergleich von Abschreibungen und Anlagenbestand macht sichtbar, ob vorsichtig (Bildung stiller Reserven) oder knapp abgeschrieben wird.","Abgänge: Verkäufe und Ausmusterungen werden transparent, inklusive der zugehörigen Wertberichtigungen.","Grundlage für Planung: Ersatzinvestitionen und künftiger Finanzbedarf lassen sich aus dem Spiegel ableiten."]}]},b8_aufgabe1={title:"Aufgabe 1: Gliederung der Erfolgsrechnung",subtitle:"Mehrstufiger Erfolgsausweis nach OR \u00B7 Bruttogewinn, Betriebsgewinn, Nebenerfolg",tabLabel:"Aufgabe 1",context:"Das OR verlangt eine Mindestgliederung der Erfolgsrechnung. Der mehrstufige Erfolgsausweis zeigt, auf welcher Stufe der Erfolg entsteht: im Kerngeschäft, im betrieblichen Nebenerfolg oder im neutralen Bereich.",theorie:{title:"Theorie: Strukturierung der Erfolgsrechnung",blocks:[{type:"text",text:"Die Erfolgsrechnung kann einstufig (alle Erträge minus alle Aufwände) oder mehrstufig gegliedert werden. Der mehrstufige Erfolgsausweis bildet Zwischenergebnisse und zeigt, woher der Erfolg stammt. Das OR (Art. 959b) schreibt eine Mindestgliederung vor, entweder als Produktionserfolgsrechnung oder als Absatzerfolgsrechnung."},{type:"subtitle",text:"Die wichtigsten Stufen im Handelsbetrieb"},{type:"list",items:["Bruttogewinn = Warenertrag \u2212 Warenaufwand. Er zeigt die Handelsmarge.","Betriebsgewinn = Bruttogewinn \u2212 übrige Betriebsaufwände (Personal, Raum, Abschreibungen usw.). Er zeigt den Erfolg des Kerngeschäfts.","Betrieblicher Nebenerfolg: Erfolg aus Nebentätigkeiten mit Bezug zum Betrieb, z.B. Vermietung eines Teils der Betriebsliegenschaft.","Neutraler Erfolg: betriebsfremd (z.B. Wertschriften ohne Betriebsbezug), ausserordentlich oder periodenfremd.","Jahresgewinn: Ergebnis nach allen Stufen inkl. Finanzerfolg und Steuern."]},{type:"subtitle",text:"Erfolgsrechnung im Produktionsbetrieb"},{type:"text",text:"Produktionsbetriebe weisen statt des Warenaufwands den Materialaufwand aus und korrigieren die Leistung um Bestandesänderungen an unfertigen und fertigen Erzeugnissen: Nur was produziert wurde, gehört zur Periodenleistung, unabhängig davon, ob es schon verkauft ist."},{type:"beispiel",text:"Velowerk GmbH: Warenertrag CHF 900'000, Warenaufwand CHF 540'000, Bruttogewinn CHF 360'000. Nach Abzug von Personalaufwand CHF 180'000, übrigem Betriebsaufwand CHF 60'000 und Abschreibungen CHF 30'000 bleibt ein Betriebsgewinn von CHF 90'000."},{type:"merksatz",text:"Mehrstufig heisst: Zwischenergebnisse zeigen die Erfolgsquellen. Bruttogewinn misst die Handelsmarge, Betriebsgewinn das Kerngeschäft. Nebenerfolg und neutraler Erfolg werden separat ausgewiesen, damit das Betriebsergebnis unverzerrt bleibt."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Stufen und Begriffe",farbe:"#1B6B63"},{id:"b8-1-A1",typ:"multiplechoice",label:"A1 \u00B7 Bruttogewinn",text:"Wie wird der Bruttogewinn im Handelsbetrieb berechnet?",antworten:["Warenertrag \u2212 Warenaufwand","Warenertrag \u2212 alle Aufwände","Jahresgewinn + Steuern","Warenertrag \u2212 Personalaufwand"],korrekt:0,loesung:"Bruttogewinn = Warenertrag \u2212 Warenaufwand. Er zeigt die Handelsmarge, bevor die übrigen Betriebsaufwände abgezogen werden."},{id:"b8-1-A2",typ:"kennzahl",label:"A2 \u00B7 Bruttogewinn Velowerk",text:"Warenertrag CHF 900'000, Warenaufwand CHF 540'000. Wie hoch ist der Bruttogewinn (CHF)?",erwartet:36e4,einheit:"CHF",toleranz:.5,loesung:"900'000 \u2212 540'000 = CHF 360'000. Das entspricht einer Bruttogewinnmarge von 40% des Warenertrags."},{id:"b8-1-A3",typ:"multiplechoice",label:"A3 \u00B7 Betrieblicher Nebenerfolg",text:"Welcher Sachverhalt gehört bei der Velowerk GmbH zum betrieblichen Nebenerfolg?",antworten:["Verkauf von E-Bikes","Mietertrag aus einer vermieteten Etage der Betriebsliegenschaft","Gewinn aus spekulativen Wertschriften ohne Betriebsbezug","Bruttogewinn aus dem Warenhandel"],korrekt:1,loesung:"Die Vermietung eines Teils der Betriebsliegenschaft ist eine Nebentätigkeit mit Betriebsbezug: betrieblicher Nebenerfolg. Der E-Bike-Verkauf ist Kerngeschäft, spekulative Wertschriften ohne Betriebsbezug sind betriebsfremd (neutraler Erfolg)."},{id:"b8-1-A4",typ:"multiplechoice",label:"A4 \u00B7 Neutraler Erfolg",text:"Welche drei Kategorien bilden zusammen den neutralen Erfolg?",antworten:["Bruttogewinn, Betriebsgewinn, Jahresgewinn","Betriebsfremder, ausserordentlicher und periodenfremder Erfolg","Warenertrag, Warenaufwand, Personalaufwand","Zinsertrag, Zinsaufwand, Steuern"],korrekt:1,loesung:"Neutral ist alles ohne Bezug zur ordentlichen Betriebstätigkeit der Periode: betriebsfremder Erfolg (z.B. Wertschriften ohne Betriebsbezug), ausserordentlicher Erfolg (einmalig, unvorhersehbar) und periodenfremder Erfolg (gehört wirtschaftlich in eine andere Periode)."},{typ:"abschnitt",label:"Teil B \u00B7 Anwendung",farbe:"#1D4ED8"},{id:"b8-1-B1",typ:"kennzahl",label:"B1 \u00B7 Betriebsgewinn Velowerk",text:"Bruttogewinn CHF 360'000, Personalaufwand CHF 180'000, übriger Betriebsaufwand CHF 60'000, Abschreibungen CHF 30'000. Wie hoch ist der Betriebsgewinn (CHF)?",erwartet:9e4,einheit:"CHF",toleranz:.5,loesung:"360'000 \u2212 180'000 \u2212 60'000 \u2212 30'000 = CHF 90'000. Der Betriebsgewinn zeigt den Erfolg des eigentlichen Kerngeschäfts."},{id:"b8-1-B2",typ:"multiplechoice",label:"B2 \u00B7 Nutzen der Mehrstufigkeit",text:"Warum ist der mehrstufige Erfolgsausweis aussagekräftiger als der einstufige?",antworten:["Er ergibt einen höheren Jahresgewinn","Er zeigt, auf welcher Stufe und aus welcher Quelle der Erfolg entsteht","Er ist einfacher zu erstellen","Er vermeidet Steuern"],korrekt:1,loesung:"Der Jahresgewinn ist bei beiden Varianten identisch. Der mehrstufige Ausweis zeigt aber die Erfolgsquellen: Ein tiefer Betriebsgewinn, der durch neutralen Erfolg kaschiert wird, ist ein Warnsignal, das der einstufige Ausweis verstecken würde."},{id:"b8-1-B3",typ:"multiplechoice",label:"B3 \u00B7 Produktionsbetrieb",text:"Was unterscheidet die Erfolgsrechnung eines Produktionsbetriebs von der eines Handelsbetriebs?",antworten:["Sie enthält keinen Personalaufwand","Sie weist Materialaufwand und Bestandesänderungen an unfertigen und fertigen Erzeugnissen aus","Sie kennt keinen Bruttogewinn","Sie wird nicht nach OR gegliedert"],korrekt:1,loesung:"Der Produktionsbetrieb weist Materialaufwand statt Warenaufwand aus und korrigiert die Leistung um Bestandesänderungen an Halb- und Fertigfabrikaten: Zur Periodenleistung zählt die Produktion, nicht nur der Verkauf."}]},b8_aufgabe2={title:"Aufgabe 2: EBITDA, EBIT und EBT",subtitle:"Zwischenergebnisse berechnen und interpretieren \u00B7 Velowerk GmbH",tabLabel:"Aufgabe 2",context:"EBITDA, EBIT und EBT sind international gebräuchliche Zwischenergebnisse der Erfolgsrechnung. Sie blenden gezielt Abschreibungen, Finanzierung und Steuern aus und machen Unternehmen vergleichbar.",theorie:{title:"Theorie: EBITDA, EBIT, EBT",blocks:[{type:"text",text:"Die drei Kennzahlen bauen aufeinander auf und unterscheiden sich darin, welche Positionen noch nicht abgezogen sind. Earnings before ... heisst: Gewinn vor den genannten Positionen."},{type:"list",items:["EBITDA: Earnings before Interest, Taxes, Depreciation and Amortisation. Gewinn vor Zinsen, Steuern und Abschreibungen. Nähert sich der operativen Geldflusskraft an.","EBIT: Earnings before Interest and Taxes. Gewinn vor Zinsen und Steuern, aber nach Abschreibungen. Entspricht weitgehend dem Betriebsgewinn.","EBT: Earnings before Taxes. Gewinn vor Steuern, aber nach Zinsen und Abschreibungen."]},{type:"formel",text:"EBITDA \u2212 Abschreibungen = EBIT \u00B7 EBIT \u2212 Zinsaufwand (+ Zinsertrag) = EBT \u00B7 EBT \u2212 Steuern = Jahresgewinn"},{type:"text",text:"Warum ausblenden? Abschreibungen hängen von der Abschreibungspolitik ab, Zinsen von der Finanzierung, Steuern vom Standort. EBITDA und EBIT machen die operative Leistung über Unternehmen und Länder hinweg vergleichbar."},{type:"beispiel",text:"Velowerk GmbH: Warenertrag CHF 1'200'000, Warenaufwand CHF 600'000, Personalaufwand CHF 300'000, übriger Betriebsaufwand CHF 120'000, Abschreibungen CHF 60'000, Zinsaufwand CHF 20'000, Steuern CHF 20'000. EBITDA = 180'000, EBIT = 120'000, EBT = 100'000, Jahresgewinn = 80'000."},{type:"merksatz",text:"Von oben nach unten: EBITDA (vor Abschreibungen, Zinsen, Steuern), EBIT (nach Abschreibungen), EBT (nach Zinsen), Jahresgewinn (nach Steuern). Je weiter oben, desto besser vergleichbar, aber desto weiter weg vom effektiven Ergebnis."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Berechnung Velowerk GmbH",farbe:"#1B6B63",intro:"Warenertrag CHF 1'200'000, Warenaufwand CHF 600'000, Personalaufwand CHF 300'000, übriger Betriebsaufwand CHF 120'000, Abschreibungen CHF 60'000, Zinsaufwand CHF 20'000, Steuern CHF 20'000."},{id:"b8-2-A1",typ:"kennzahl",label:"A1 \u00B7 EBITDA",text:"Wie hoch ist das EBITDA der Velowerk GmbH (CHF)?",erwartet:18e4,einheit:"CHF",toleranz:.5,loesung:"1'200'000 \u2212 600'000 \u2212 300'000 \u2212 120'000 = CHF 180'000. Abschreibungen, Zinsen und Steuern sind noch nicht abgezogen."},{id:"b8-2-A2",typ:"kennzahl",label:"A2 \u00B7 EBIT",text:"Wie hoch ist das EBIT (CHF)?",erwartet:12e4,einheit:"CHF",toleranz:.5,loesung:"EBITDA 180'000 \u2212 Abschreibungen 60'000 = CHF 120'000. Das EBIT entspricht weitgehend dem Betriebsgewinn."},{id:"b8-2-A3",typ:"kennzahl",label:"A3 \u00B7 EBT",text:"Wie hoch ist das EBT (CHF)?",erwartet:1e5,einheit:"CHF",toleranz:.5,loesung:"EBIT 120'000 \u2212 Zinsaufwand 20'000 = CHF 100'000. Nach Abzug der Steuern von 20'000 verbleibt der Jahresgewinn von CHF 80'000."},{id:"b8-2-A4",typ:"multiplechoice",label:"A4 \u00B7 Was blendet das EBIT aus?",text:"Welche Positionen sind im EBIT noch nicht abgezogen?",antworten:["Abschreibungen und Personalaufwand","Zinsen und Steuern","Warenaufwand und Abschreibungen","Nur die Steuern"],korrekt:1,loesung:"EBIT = Earnings before Interest and Taxes: Zinsen und Steuern fehlen noch. Abschreibungen sind im EBIT bereits abgezogen, das unterscheidet es vom EBITDA."},{typ:"abschnitt",label:"Teil B \u00B7 Interpretation",farbe:"#1D4ED8"},{id:"b8-2-B1",typ:"kennzahl",label:"B1 \u00B7 EBITDA-Marge",text:"Wie hoch ist die EBITDA-Marge in Prozent des Warenertrags (EBITDA CHF 180'000, Warenertrag CHF 1'200'000)?",erwartet:15,einheit:"%",toleranz:.1,loesung:"180'000 \u00F7 1'200'000 \u00D7 100 = 15%. Die EBITDA-Marge zeigt, wie viel vom Umsatz als operatives Ergebnis vor Abschreibungen, Zinsen und Steuern übrig bleibt."},{id:"b8-2-B2",typ:"multiplechoice",label:"B2 \u00B7 Warum EBITDA für Vergleiche?",text:"Warum eignet sich das EBITDA besonders für den Vergleich verschiedener Unternehmen?",antworten:["Weil es immer höher ist als der Jahresgewinn","Weil es Effekte aus Abschreibungspolitik, Finanzierung und Steuerstandort ausblendet","Weil es die Liquidität exakt misst","Weil es gesetzlich vorgeschrieben ist"],korrekt:1,loesung:"Abschreibungen hängen von der gewählten Politik ab (inkl. stiller Reserven), Zinsen von der Finanzierungsstruktur, Steuern vom Standort. Das EBITDA neutralisiert diese Unterschiede und macht die operative Leistung vergleichbar."}]},b8_aufgabe3={title:"Aufgabe 3: Bewertungsvorschriften",subtitle:"Erst- und Folgebewertung \u00B7 Niederstwert-, Realisations- und Imparitätsprinzip",tabLabel:"Aufgabe 3",context:"Das OR regelt, mit welchem Wert Aktiven in die Bilanz eingehen und wie sie später bewertet werden. Die Prinzipien folgen der Vorsicht: Verluste früh, Gewinne erst bei Realisation.",theorie:{title:"Theorie: Bewertungsvorschriften nach OR",blocks:[{type:"subtitle",text:"Erst- und Folgebewertung"},{type:"text",text:"Bei der Ersterfassung werden Aktiven höchstens zu Anschaffungs- oder Herstellkosten bewertet. In der Folgebewertung dürfen sie höchstens zu diesem Wert abzüglich notwendiger Abschreibungen und Wertberichtigungen bilanziert werden. Aufwertungen über die Anschaffungskosten sind grundsätzlich nicht zulässig."},{type:"subtitle",text:"Die drei Vorsichtsprinzipien der Bewertung"},{type:"list",items:["Niederstwertprinzip: Vorräte werden zum tieferen Wert von Anschaffungskosten und Marktwert (Nettoveräusserungswert) bilanziert.","Realisationsprinzip: Gewinne werden erst ausgewiesen, wenn sie durch einen Verkauf realisiert sind. Blosse Wertsteigerungen sind kein Ertrag.","Imparitätsprinzip: Ungleiche Behandlung. Drohende, noch nicht realisierte Verluste müssen erfasst werden, unrealisierte Gewinne nicht."]},{type:"subtitle",text:"Ausnahme: Aktiven mit beobachtbaren Marktpreisen"},{type:"text",text:"Aktiven mit Börsenkurs oder anderem beobachtbarem Marktpreis in einem aktiven Markt (z.B. kotierte Wertschriften) dürfen zum Kurswert am Bilanzstichtag bewertet werden, auch über den Anschaffungskosten. Zum Ausgleich der Kursschwankungen darf eine Schwankungsreserve gebildet werden."},{type:"beispiel",text:"Velowerk hat E-Bike-Komponenten für CHF 45'000 eingekauft. Wegen eines Modellwechsels beträgt der Marktwert am Bilanzstichtag noch CHF 39'000. Niederstwertprinzip: Bilanzierung zu CHF 39'000, die Differenz von CHF 6'000 belastet als Wertkorrektur den Erfolg."},{type:"merksatz",text:"Erstbewertung höchstens zu Anschaffungs- oder Herstellkosten, Folgebewertung höchstens zu diesem Wert minus Abschreibungen. Vorräte zum Niederstwert. Gewinne erst bei Realisation, drohende Verluste sofort (Imparität). Ausnahme: beobachtbare Marktpreise dürfen zum Kurswert bilanziert werden."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Prinzipien anwenden",farbe:"#1B6B63"},{id:"b8-3-A1",typ:"multiplechoice",label:"A1 \u00B7 Niederstwertprinzip",text:"Vorräte wurden für CHF 100 pro Stück eingekauft, der Marktwert beträgt am Bilanzstichtag CHF 80. Zu welchem Wert werden sie bilanziert?",antworten:["CHF 100 (Anschaffungskosten)","CHF 90 (Mittelwert)","CHF 80 (tieferer Marktwert)","Frei wählbar zwischen 80 und 100"],korrekt:2,loesung:"Niederstwertprinzip: Es gilt der tiefere der beiden Werte, hier der Marktwert von CHF 80. Der Wertverlust wird sofort erfolgswirksam erfasst."},{id:"b8-3-A2",typ:"kennzahl",label:"A2 \u00B7 Bewertung Vorräte Velowerk",text:"Komponentenlager: Anschaffungskosten CHF 45'000, Marktwert am Bilanzstichtag CHF 39'000. Zu welchem Wert wird das Lager bilanziert (CHF)?",erwartet:39e3,einheit:"CHF",toleranz:.5,loesung:"Zum tieferen Marktwert von CHF 39'000 (Niederstwertprinzip). Die Wertkorrektur von CHF 6'000 belastet den Erfolg der laufenden Periode."},{id:"b8-3-A3",typ:"multiplechoice",label:"A3 \u00B7 Realisationsprinzip",text:"Der Marktwert eines Lagerbestands steigt über die Anschaffungskosten. Darf Velowerk den Gewinn bereits ausweisen?",antworten:["Ja, sofort in voller Höhe","Ja, zur Hälfte","Nein, Gewinne werden erst bei Realisation (Verkauf) ausgewiesen","Nur mit Bewilligung der Revisionsstelle"],korrekt:2,loesung:"Realisationsprinzip: Gewinne entstehen buchhalterisch erst durch den Verkauf. Die blosse Wertsteigerung des Lagers bleibt unberücksichtigt, der Bestand bleibt höchstens zu Anschaffungskosten bilanziert."},{id:"b8-3-A4",typ:"multiplechoice",label:"A4 \u00B7 Imparitätsprinzip",text:"Was besagt das Imparitätsprinzip?",antworten:["Gewinne und Verluste werden gleich behandelt","Drohende, unrealisierte Verluste müssen erfasst werden, unrealisierte Gewinne nicht","Verluste dürfen erst bei Realisation gebucht werden","Alle Bewertungen erfolgen zum Marktwert"],korrekt:1,loesung:"Imparität heisst Ungleichheit: Drohende Verluste werden sofort erfasst (Vorsicht), unrealisierte Gewinne erst bei Realisation. Zusammen mit dem Realisationsprinzip bildet dies den Kern der vorsichtigen Bewertung."},{id:"b8-3-A5",typ:"multiplechoice",label:"A5 \u00B7 Beobachtbare Marktpreise",text:"Velowerk hält kotierte Aktien (Anschaffungskosten CHF 50'000, Börsenkurs am Bilanzstichtag CHF 58'000). Welche Aussage ist korrekt?",antworten:["Bewertung zwingend zu CHF 50'000","Bewertung zum Kurswert CHF 58'000 ist zulässig, eine Schwankungsreserve darf gebildet werden","Bewertung zu CHF 58'000 ist verboten","Aktien dürfen nicht bilanziert werden"],korrekt:1,loesung:"Aktiven mit beobachtbaren Marktpreisen in einem aktiven Markt dürfen zum Kurswert bewertet werden, auch über den Anschaffungskosten. Zum Ausgleich künftiger Kursschwankungen darf eine Schwankungsreserve gebildet werden."},{typ:"abschnitt",label:"Teil B \u00B7 Vertiefung",farbe:"#1D4ED8"},{id:"b8-3-B1",typ:"interpretation",label:"B1 \u00B7 Erst- und Folgebewertung erklären",text:"Erkläre am Beispiel einer Maschine den Unterschied zwischen Erst- und Folgebewertung nach OR.",musterloesung:["Erstbewertung: Beim Kauf wird die Maschine höchstens zu ihren Anschaffungskosten bilanziert (Kaufpreis plus direkt zurechenbare Kosten wie Transport und Installation).","Folgebewertung: An den folgenden Bilanzstichtagen darf sie höchstens zu den Anschaffungskosten abzüglich der notwendigen Abschreibungen bewertet werden.","Eine Aufwertung über die Anschaffungskosten ist nicht zulässig, selbst wenn der Marktwert gestiegen ist (Realisationsprinzip).","Sinkt der Nutzwert ausserplanmässig (z.B. Beschädigung, technische Überholung), ist zusätzlich ausserplanmässig abzuschreiben (Imparitäts- und Vorsichtsprinzip).","Tiefere Bewertungen zu Vorsichtszwecken sind zulässig und führen zu stillen Reserven."]}]},b8_aufgabe4={title:"Aufgabe 4: Stille Reserven bilden und auflösen",subtitle:"Zwangs- und Willkürreserven \u00B7 Verbuchung bei Velowerk",tabLabel:"Aufgabe 4",context:"Stille Reserven entstehen, wenn Aktiven unter- oder Verpflichtungen überbewertet werden. Hier berechnest und verbuchst du ihre Bildung und Auflösung und unterscheidest Zwangs- von Willkürreserven.",theorie:{title:"Theorie: Stille Reserven",blocks:[{type:"text",text:"Stille Reserven sind der Unterschied zwischen dem effektiven Wert und dem tieferen Buchwert eines Aktivums (oder dem höheren Buchwert einer Verpflichtung). Sie sind in der Bilanz nicht sichtbar, daher still. Das OR lässt ihre Bildung zu Vorsichtszwecken ausdrücklich zu."},{type:"subtitle",text:"Wie stille Reserven entstehen"},{type:"list",items:["Überhöhte Abschreibungen: Der Buchwert der Anlage sinkt schneller als ihr effektiver Wert.","Unterbewertung der Vorräte: z.B. pauschale Wertabschläge auf dem Warenbestand (Warendrittel).","Überhöhte Rückstellungen: mehr zurückgestellt als betriebswirtschaftlich nötig.","Zwangsreserven: entstehen durch die Bewertungsvorschriften selbst, z.B. wenn der Marktwert über die Anschaffungskosten steigt, aber nicht aufgewertet werden darf.","Willkürreserven: werden bewusst durch Unterbewertung gebildet (Ermessensspielraum der Unternehmensleitung)."]},{type:"subtitle",text:"Erfolgswirkung"},{type:"formel",text:"Bildung stiller Reserven senkt den ausgewiesenen Gewinn \u00B7 Auflösung erhöht den ausgewiesenen Gewinn"},{type:"text",text:"Steuerlich werden stille Reserven bei der Bildung nur anerkannt, soweit sie geschäftsmässig begründet sind (z.B. Warendrittel, pauschale Delkrederesätze, Steuerabschreibungssätze). Bei der Auflösung werden sie als Gewinn steuerbar."},{type:"beispiel",text:"Velowerk schreibt Maschinen um CHF 25'000 ab, obwohl nur CHF 10'000 nötig wären: stille Reserve CHF 15'000. Zusätzlich wird der Warenbestand um CHF 20'000 unter den effektiven Wert gesetzt: weitere stille Reserve CHF 20'000. Total gebildete stille Reserven: CHF 35'000."},{type:"merksatz",text:"Stille Reserven = effektiver Wert minus Buchwert. Bildung senkt den ausgewiesenen Gewinn, Auflösung erhöht ihn. Zwangsreserven erzwingt das Gesetz, Willkürreserven wählt die Unternehmensleitung bewusst."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Bildung stiller Reserven (Velowerk, Jahr 20_1)",farbe:"#1B6B63",intro:"Betriebswirtschaftlich nötige Abschreibung auf Maschinen: CHF 10'000. Velowerk bucht indirekt CHF 25'000. Zusätzlich wird der Warenbestand von effektiv CHF 120'000 auf CHF 100'000 hinuntergebucht."},{id:"b8-4-A1",label:"A1 \u00B7 Überhöhte Abschreibung verbuchen",text:"Verbuche die gesamte Abschreibung auf den Maschinen von CHF 25'000 nach der indirekten Methode.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["wbmaschinen"],betrag:25e3}]]},{id:"b8-4-A2",typ:"kennzahl",label:"A2 \u00B7 Stille Reserve aus der Abschreibung",text:"Wie hoch ist die dabei gebildete stille Reserve (CHF)?",erwartet:15e3,einheit:"CHF",toleranz:.5,loesung:"Gebucht 25'000 \u2212 nötig 10'000 = CHF 15'000 stille Reserve. Der Buchwert liegt um diesen Betrag unter dem effektiven Wert."},{id:"b8-4-A3",label:"A3 \u00B7 Unterbewertung Warenbestand",text:"Verbuche die Herabsetzung des Warenbestands um CHF 20'000 (von 120'000 auf 100'000).",anzahlBuchungen:1,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["warenbestand"],betrag:2e4}]]},{id:"b8-4-A4",typ:"kennzahl",label:"A4 \u00B7 Total gebildete stille Reserven",text:"Wie hoch sind die in 20_1 total gebildeten stillen Reserven (CHF)?",erwartet:35e3,einheit:"CHF",toleranz:.5,loesung:"15'000 (Maschinen) + 20'000 (Warenbestand) = CHF 35'000. Der ausgewiesene Gewinn 20_1 ist um diesen Betrag tiefer als der effektive Gewinn."},{typ:"abschnitt",label:"Teil B \u00B7 Auflösung und Begriffe",farbe:"#1D4ED8"},{id:"b8-4-B1",label:"B1 \u00B7 Auflösung im Folgejahr",text:"In 20_2 wird der Warenbestand wieder auf seinen effektiven Wert von CHF 120'000 hinaufgebucht. Verbuche die Auflösung der stillen Reserve von CHF 20'000.",anzahlBuchungen:1,loesungen:[[{sollKeys:["warenbestand"],habenKeys:["warenaufwand"],betrag:2e4}]]},{id:"b8-4-B2",typ:"multiplechoice",label:"B2 \u00B7 Wirkung der Auflösung",text:"Wie wirkt sich die Auflösung stiller Reserven auf den ausgewiesenen Gewinn aus?",antworten:["Er sinkt","Er steigt","Keine Wirkung","Er wird halbiert"],korrekt:1,loesung:"Die Auflösung erhöht den ausgewiesenen Gewinn: Der zuvor versteckte Wert wird sichtbar. In der Praxis werden so schlechte Jahre optisch geglättet, und die aufgelösten Reserven werden steuerbar."},{id:"b8-4-B3",typ:"multiplechoice",label:"B3 \u00B7 Zwangs- vs. Willkürreserven",text:"Der Börsenkurs einer Beteiligung liegt über den Anschaffungskosten, eine Aufwertung wird nicht vorgenommen. Velowerk schreibt zudem ihre Fahrzeuge bewusst doppelt so schnell ab wie nötig. Wie sind die beiden stillen Reserven zu klassifizieren?",antworten:["Beides Willkürreserven","Beides Zwangsreserven","Beteiligung: Zwangsreserve \u00B7 Fahrzeuge: Willkürreserve","Beteiligung: Willkürreserve \u00B7 Fahrzeuge: Zwangsreserve"],korrekt:2,loesung:"Die Reserve auf der Beteiligung entsteht durch die Bewertungsobergrenze (Anschaffungskostenprinzip): Zwangsreserve. Die bewusst überhöhte Abschreibung ist eine Ermessensentscheidung: Willkürreserve."}]},b8_aufgabe5={title:"Aufgabe 5: Interne und externe Bilanz und Erfolgsrechnung",subtitle:"Vom externen zum internen Abschluss \u00B7 Überleitung mit stillen Reserven",tabLabel:"Aufgabe 5",context:"Die externe Jahresrechnung enthält stille Reserven und zeigt ein vorsichtiges Bild. Die interne Rechnung korrigiert diese und zeigt die effektiven Werte als Führungsgrundlage. Hier rechnest du zwischen beiden Welten um.",theorie:{title:"Theorie: Externe und interne Jahresrechnung",blocks:[{type:"vergleich",left:{title:"Externe Bilanz / Erfolgsrechnung",text:"Nach OR erstellt, enthält stille Reserven. Adressaten: Aktionäre, Gläubiger, Steuerbehörden, Öffentlichkeit. Zeigt ein vorsichtiges, tendenziell zu tiefes Bild von Vermögen und Erfolg."},right:{title:"Interne Bilanz / Erfolgsrechnung",text:"Zu effektiven Werten, stille Reserven sind eliminiert. Adressaten: Geschäftsleitung und Verwaltungsrat. Führungsinstrument für Entscheidungen, Kalkulation und Erfolgsbeurteilung."}},{type:"subtitle",text:"Überleitung vom externen zum internen Erfolg"},{type:"formel",text:"Interner Erfolg = externer Erfolg + Bildung stiller Reserven \u2212 Auflösung stiller Reserven"},{type:"text",text:"Logik: Die Bildung stiller Reserven hat den externen Erfolg gedrückt, also wird sie für die interne Sicht wieder dazugezählt. Die Auflösung hat ihn aufgebläht, also wird sie abgezogen. Analog gilt für die Bilanz: internes Eigenkapital = externes Eigenkapital + Bestand stiller Reserven."},{type:"subtitle",text:"Steuerrechtliche Aspekte"},{type:"text",text:"Die Steuerbehörden akzeptieren stille Reserven nur, soweit sie geschäftsmässig begründet sind (z.B. Warendrittel, pauschale Abschreibungssätze). Bei der Auflösung unterliegen stille Reserven der Gewinnsteuer, sie sind also aufgeschobene, nicht ersparte Steuern."},{type:"beispiel",text:"Externer Gewinn 20_1: CHF 80'000. In 20_1 wurden stille Reserven von CHF 35'000 gebildet und keine aufgelöst. Interner Gewinn = 80'000 + 35'000 = CHF 115'000."},{type:"merksatz",text:"Extern = vorsichtiges Bild mit stillen Reserven für Aussenstehende. Intern = effektive Werte für die Führung. Interner Erfolg = externer Erfolg + Bildung \u2212 Auflösung stiller Reserven."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Überleitung Velowerk GmbH",farbe:"#1B6B63"},{id:"b8-5-A1",typ:"kennzahl",label:"A1 \u00B7 Interner Gewinn 20_1",text:"Externer Gewinn CHF 80'000, in 20_1 gebildete stille Reserven CHF 35'000, keine Auflösungen. Wie hoch ist der interne Gewinn (CHF)?",erwartet:115e3,einheit:"CHF",toleranz:.5,loesung:"80'000 + 35'000 = CHF 115'000. Die Bildung hat den externen Gewinn gedrückt und wird intern wieder hinzugerechnet."},{id:"b8-5-A2",typ:"kennzahl",label:"A2 \u00B7 Internes Eigenkapital",text:"Externes Eigenkapital CHF 400'000, Bestand stiller Reserven CHF 90'000. Wie hoch ist das interne (effektive) Eigenkapital (CHF)?",erwartet:49e4,einheit:"CHF",toleranz:.5,loesung:"400'000 + 90'000 = CHF 490'000. Der Bestand aller stillen Reserven ist verstecktes Eigenkapital."},{id:"b8-5-A3",typ:"kennzahl",label:"A3 \u00B7 Interner Gewinn 20_2",text:"Externer Gewinn 20_2: CHF 95'000. Aufgelöste stille Reserven CHF 20'000, neu gebildete CHF 5'000. Wie hoch ist der interne Gewinn 20_2 (CHF)?",erwartet:8e4,einheit:"CHF",toleranz:.5,loesung:"95'000 + 5'000 (Bildung) \u2212 20'000 (Auflösung) = CHF 80'000. Extern sieht 20_2 besser aus als es effektiv war, weil die Auflösung den Gewinn aufgebläht hat."},{id:"b8-5-A4",typ:"multiplechoice",label:"A4 \u00B7 Adressaten der internen Rechnung",text:"Wer arbeitet typischerweise mit der internen Bilanz und Erfolgsrechnung?",antworten:["Die Öffentlichkeit und die Medien","Geschäftsleitung und Verwaltungsrat","Nur die Steuerverwaltung","Die Kundschaft"],korrekt:1,loesung:"Die interne Rechnung mit effektiven Werten ist ein Führungsinstrument für Geschäftsleitung und Verwaltungsrat. Aussenstehende erhalten die externe Rechnung nach OR."},{typ:"abschnitt",label:"Teil B \u00B7 Beurteilung",farbe:"#1D4ED8"},{id:"b8-5-B1",typ:"interpretation",label:"B1 \u00B7 Chancen und Gefahren stiller Reserven",text:"Beurteile stille Reserven aus Sicht des Unternehmens und aus Sicht der Aussenstehenden: Nenne je mindestens zwei Chancen und zwei Gefahren.",musterloesung:["Chance Unternehmen: Ergebnisglättung. Gute Jahre werden gedämpft, schlechte durch Auflösung gestützt, was Vertrauen und Stabilität signalisiert.","Chance Unternehmen: Substanzstärkung und Sicherheitspolster. Verstecktes Eigenkapital erhöht die Krisenfestigkeit, Steuern werden aufgeschoben.","Gefahr Aussenstehende: Verlust an Aussagekraft. Aktionäre und Gläubiger sehen ein zu vorsichtiges Bild und können die effektive Lage schwer beurteilen.","Gefahr Aussenstehende: Verschleierte Verschlechterung. Wer schlechte Jahre still stützt, kann eine negative Entwicklung lange verbergen.","Gefahr Unternehmen: Fehlsteuerung. Wenn die Führung selbst mit den externen Zahlen arbeitet, kalkuliert sie mit falschen Werten. Genau deshalb braucht es die interne Rechnung."]}]},b8_aufgabe6={title:"Aufgabe 6: Reservenspiegel und Synthese",subtitle:"Bestand und Veränderung stiller Reserven \u00B7 Abschlussaufgabe Block 8",tabLabel:"Aufgabe 6",context:"Der Reservenspiegel führt Buch über die stillen Reserven: Anfangsbestand, Bildung, Auflösung und Endbestand pro Position. Er ist die Grundlage für die Überleitung zum internen Abschluss.",theorie:{title:"Theorie: Reservenspiegel",blocks:[{type:"text",text:"Der Reservenspiegel ist eine interne Tabelle, die für jede Bilanzposition den Bestand und die Veränderung der stillen Reserven zeigt: Anfangsbestand + Bildung \u2212 Auflösung = Endbestand. Er wird nicht publiziert, sondern dient der Geschäftsleitung und der Erstellung der internen Jahresrechnung."},{type:"formel",text:"Endbestand stille Reserven = Anfangsbestand + Bildung \u2212 Auflösung"},{type:"list",items:["Pro Position geführt: z.B. Warenbestand, Maschinen, Rückstellungen.","Die Summe der Endbestände ergibt das gesamte versteckte Eigenkapital.","Die Nettoveränderung (Bildung minus Auflösung) ist die Korrekturgrösse für die Überleitung vom externen zum internen Erfolg."]},{type:"beispiel",text:"Warenbestand: Anfang 20'000, Bildung 10'000, Auflösung 0, Ende 30'000. Maschinen: Anfang 40'000, Bildung 0, Auflösung 10'000, Ende 30'000. Rückstellungen: Anfang 10'000, Bildung 5'000, Auflösung 0, Ende 15'000. Total Ende: 75'000. Nettoveränderung: +5'000."},{type:"merksatz",text:"Der Reservenspiegel macht die stillen Reserven intern transparent: pro Position Anfangsbestand + Bildung \u2212 Auflösung = Endbestand. Die Nettoveränderung verbindet externen und internen Erfolg."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Reservenspiegel Velowerk GmbH 20_2",farbe:"#1B6B63",intro:"Warenbestand: Anfang CHF 20'000, Bildung CHF 10'000, Auflösung CHF 0. Maschinen: Anfang CHF 40'000, Bildung CHF 0, Auflösung CHF 10'000. Rückstellungen: Anfang CHF 10'000, Bildung CHF 5'000, Auflösung CHF 0. Externer Gewinn 20_2: CHF 100'000."},{id:"b8-6-A1",typ:"kennzahl",label:"A1 \u00B7 Endbestand Warenbestand",text:"Wie hoch ist der Endbestand der stillen Reserven auf dem Warenbestand (CHF)?",erwartet:3e4,einheit:"CHF",toleranz:.5,loesung:"20'000 + 10'000 \u2212 0 = CHF 30'000."},{id:"b8-6-A2",typ:"kennzahl",label:"A2 \u00B7 Total Endbestand",text:"Wie hoch ist der gesamte Endbestand der stillen Reserven über alle drei Positionen (CHF)?",erwartet:75e3,einheit:"CHF",toleranz:.5,loesung:"Warenbestand 30'000 + Maschinen (40'000 \u2212 10'000 = 30'000) + Rückstellungen (10'000 + 5'000 = 15'000) = CHF 75'000."},{id:"b8-6-A3",typ:"kennzahl",label:"A3 \u00B7 Nettoveränderung",text:"Wie gross ist die Nettoveränderung der stillen Reserven in 20_2 (Bildung minus Auflösung, CHF)?",erwartet:5e3,einheit:"CHF",toleranz:.5,loesung:"Bildung total 15'000 (10'000 Warenbestand + 5'000 Rückstellungen) \u2212 Auflösung 10'000 (Maschinen) = +CHF 5'000. Der Bestand stiller Reserven ist netto gewachsen."},{id:"b8-6-A4",typ:"kennzahl",label:"A4 \u00B7 Interner Gewinn 20_2",text:"Wie hoch ist der interne Gewinn 20_2 bei einem externen Gewinn von CHF 100'000 (CHF)?",erwartet:105e3,einheit:"CHF",toleranz:.5,loesung:"100'000 + 15'000 (Bildung) \u2212 10'000 (Auflösung) = CHF 105'000. Die Nettobildung von 5'000 hat den externen Gewinn um diesen Betrag gedrückt."},{typ:"abschnitt",label:"Teil B \u00B7 Synthese",farbe:"#1D4ED8"},{id:"b8-6-B1",typ:"multiplechoice",label:"B1 \u00B7 Zweck des Reservenspiegels",text:"Welchen Zweck erfüllt der Reservenspiegel?",antworten:["Er wird im Geschäftsbericht publiziert","Er dokumentiert intern Bestand und Veränderung der stillen Reserven als Basis für den internen Abschluss","Er ersetzt die Erfolgsrechnung","Er dient der MWST-Abrechnung"],korrekt:1,loesung:"Der Reservenspiegel ist ein internes Instrument: Er hält pro Position Anfangsbestand, Bildung, Auflösung und Endbestand der stillen Reserven fest und liefert die Korrekturgrössen für die interne Bilanz und Erfolgsrechnung. Publiziert wird er nicht."},{id:"b8-6-B2",typ:"interpretation",label:"B2 \u00B7 Synthese: Vorsicht und Aussagekraft",text:"Verbinde die Themen dieses Blocks: Erkläre, wie Vorsichtsprinzip, Bewertungsvorschriften und stille Reserven zusammenhängen und was das für die Aussagekraft der externen Jahresrechnung bedeutet.",musterloesung:["Das Vorsichtsprinzip prägt die OR-Bewertung: höchstens Anschaffungskosten, Niederstwertprinzip bei Vorräten, Gewinne erst bei Realisation, drohende Verluste sofort (Imparität).","Diese Regeln erzeugen systematisch Zwangsreserven (z.B. Marktwert über Anschaffungskosten) und erlauben zusätzlich Willkürreserven (überhöhte Abschreibungen, Unterbewertung Vorräte, überhöhte Rückstellungen).","Folge: Die externe Jahresrechnung zeigt Vermögen und Erfolg tendenziell zu tief. Sie ist verlässlich vorsichtig, aber nicht effektiv wahr.","Für die Führung braucht es deshalb die interne Rechnung zu effektiven Werten, gestützt auf den Reservenspiegel, und für Vergleiche Kennzahlen wie EBITDA und EBIT, welche die Abschreibungspolitik neutralisieren.","Wer eine externe Jahresrechnung liest, muss stille Reserven mitdenken: Ein stabiler ausgewiesener Gewinn kann geglättet sein, die effektive Entwicklung dahinter kann deutlich volatiler verlaufen."]}]},b8_aufgabe7={"title": "Aufgabe 7: Der Geschäftsbericht nach OR", "subtitle": "Anhang, erweiterter Anhang, Geldflussrechnung und Lagebericht · Offenlegung nach OR 958 ff.", "tabLabel": "Aufgabe 7", "context": "Der Abschluss endet nicht mit der Schlussbilanz. Er endet mit einem Dokument, das nach aussen geht. Wer wie viel publizieren muss, hängt nicht von der Rechtsform ab, sondern von der Grösse und damit von der Revisionspflicht.", "theorie": {"title": "Theorie: Aufbau und Umfang des Geschäftsberichts", "blocks": [{"type": "text", "text": "Der Geschäftsbericht ist der Oberbegriff (OR 958 Abs. 2). Er enthält immer die Jahresrechnung, bestehend aus Bilanz (OR 959a), Erfolgsrechnung (OR 959b) und Anhang (OR 959c). Wer zur ordentlichen Revision verpflichtet ist, liefert nach OR 961 drei weitere Teile: den erweiterten Anhang (OR 961a), die Geldflussrechnung (OR 961b) und den Lagebericht (OR 961c)."}, {"type": "list", "items": ["Grössenkriterien für die ordentliche Revision nach OR 727: Bilanzsumme CHF 20 Mio, Umsatzerlös CHF 40 Mio, 250 Vollzeitstellen im Jahresdurchschnitt.", "Zwei der drei Kriterien müssen in zwei aufeinanderfolgenden Geschäftsjahren überschritten sein.", "Ebenfalls ordentlich revidiert werden Publikumsgesellschaften und konzernrechnungspflichtige Gesellschaften.", "Einzelunternehmen und Personengesellschaften dürfen nach OR 959c Abs. 3 ganz auf den Anhang verzichten, sofern sie nicht den Vorschriften für grössere Unternehmen unterstehen."]}, {"type": "text", "text": "Der Anhang ergänzt und erläutert die Zahlen. Er nennt die angewandten Bewertungsgrundsätze, schlüsselt einzelne Positionen auf und enthält die Pflichtangaben juristischer Personen: Firma, Rechtsform, Sitz, Anzahl Vollzeitstellen, Beteiligungen, eigene Anteile, Restschuld aus Leasing und Abzahlungsgeschäften, Verbindlichkeiten gegenüber Vorsorgeeinrichtungen, Sicherheiten für Dritte, verpfändete Aktiven, Eventualverbindlichkeiten und wesentliche Ereignisse nach dem Bilanzstichtag."}, {"type": "beispiel", "text": "Direkte Verbindung zu den stillen Reserven: Nach OR 959c Abs. 1 Ziff. 3 muss die Nettoauflösung stiller Reserven im Anhang offengelegt werden, wenn das Ergebnis dadurch wesentlich günstiger dargestellt wird. Die Bildung dagegen bleibt unsichtbar. Genau deshalb sind stille Reserven ein Instrument der Gewinnglättung."}, {"type": "text", "text": "Der erweiterte Anhang ist kein zweites Dokument. Er besteht aus zwei zusätzlichen Angaben im gleichen Anhang: der Fristigkeit der langfristigen verzinslichen Verbindlichkeiten und dem Honorar der Revisionsstelle, getrennt nach Revisionsdienstleistungen und übrigen Dienstleistungen (OR 961a)."}, {"type": "text", "text": "Die Geldflussrechnung zeigt, woher das Geld kam und wohin es floss. Bezugsgrösse ist der Fonds flüssige Mittel. Gegliedert wird in Geldfluss aus Betriebstätigkeit, aus Investitionstätigkeit und aus Finanzierungstätigkeit. Die Summe der drei Bereiche entspricht exakt der Veränderung der flüssigen Mittel gemäss Bilanz. Der operative Geldfluss wird direkt (Einzahlungen minus Auszahlungen) oder indirekt (aus dem Jahresgewinn) ermittelt. In der Praxis dominiert die indirekte Methode."}, {"type": "formel", "text": "Jahresgewinn + Aufwand ohne Geldabfluss − Ertrag ohne Geldzufluss ± Veränderung Nettoumlaufvermögen = Geldfluss aus Betriebstätigkeit"}, {"type": "text", "text": "Der Lagebericht ist der einzige Teil ohne Zahlenwerk. Er stellt Geschäftsverlauf und wirtschaftliche Lage unter Aspekten dar, welche die Jahresrechnung nicht abbildet: Anzahl Vollzeitstellen im Jahresdurchschnitt, Durchführung einer Risikobeurteilung, Bestellungs- und Auftragslage, Forschung und Entwicklung, aussergewöhnliche Ereignisse und Zukunftsaussichten (OR 961c). Er darf der Jahresrechnung nicht widersprechen. Nach OR 961d entfallen alle drei Zusatzteile, wenn eine Konzernrechnung nach einem anerkannten Standard erstellt wird oder das Unternehmen in eine solche einbezogen ist."}, {"type": "merksatz", "text": "Der Anhang erklärt die Vergangenheit in Zahlen, der Lagebericht ordnet sie in Worte ein und blickt nach vorne, die Geldflussrechnung zeigt, ob dem ausgewiesenen Gewinn auch Geld entspricht."}]}, "faelle": [{"typ": "abschnitt", "label": "Teil A · Umfang und Pflichten", "farbe": "#1B6B63", "intro": "Sie prüfen für verschiedene Unternehmen, welche Bestandteile der Geschäftsbericht enthalten muss."}, {"id": "b8-7-A1", "typ": "multiplechoice", "label": "A1 · Bestandteile der Jahresrechnung", "text": "Woraus besteht die Jahresrechnung nach OR immer, unabhängig von der Grösse des Unternehmens?", "antworten": ["Bilanz und Erfolgsrechnung", "Bilanz, Erfolgsrechnung und Geldflussrechnung", "Bilanz, Erfolgsrechnung und Anhang", "Bilanz, Erfolgsrechnung, Anhang und Lagebericht"], "korrekt": 2, "loesung": "Die Jahresrechnung umfasst Bilanz (OR 959a), Erfolgsrechnung (OR 959b) und Anhang (OR 959c). Geldflussrechnung und Lagebericht kommen erst bei ordentlicher Revision dazu (OR 961)."}, {"id": "b8-7-A2", "typ": "multiplechoice", "label": "A2 · Grössenkriterien anwenden", "text": "Die Velowerk GmbH weist in zwei aufeinanderfolgenden Geschäftsjahren eine Bilanzsumme von CHF 22 Mio, einen Umsatzerlös von CHF 31 Mio und 140 Vollzeitstellen aus. Ist sie zur ordentlichen Revision verpflichtet?", "antworten": ["Nein, nur ein Kriterium ist überschritten, es braucht deren zwei", "Ja, die Bilanzsumme allein genügt", "Ja, weil sie eine GmbH ist", "Nein, GmbH unterliegen nie der ordentlichen Revision"], "korrekt": 0, "loesung": "Überschritten ist nur die Bilanzsumme (22 > 20 Mio). Umsatz (31 < 40 Mio) und Vollzeitstellen (140 < 250) liegen darunter. OR 727 verlangt zwei der drei Kriterien in zwei aufeinanderfolgenden Geschäftsjahren. Die Rechtsform spielt dabei keine Rolle."}, {"id": "b8-7-A3", "typ": "multiplechoice", "label": "A3 · Erweiterter Anhang", "text": "Was verlangt der erweiterte Anhang nach OR 961a zusätzlich zum ordentlichen Anhang?", "antworten": ["Eine vollständige Segmentberichterstattung", "Einen Reservenspiegel mit allen stillen Reserven", "Eine Aufstellung sämtlicher Löhne der Geschäftsleitung", "Fristigkeit der langfristigen verzinslichen Verbindlichkeiten und Honorar der Revisionsstelle"], "korrekt": 3, "loesung": "Genau zwei Zusatzangaben, im gleichen Anhang: die Fristigkeit der langfristigen verzinslichen Verbindlichkeiten und das Honorar der Revisionsstelle, getrennt nach Revisionsdienstleistungen und übrigen Dienstleistungen. Der Begriff «erweitert» verspricht mehr, als er hält. Ein Reservenspiegel ist gesetzlich nirgends verlangt."}, {"id": "b8-7-A4", "typ": "multiplechoice", "label": "A4 · Offenlegung stiller Reserven", "text": "Wo und in welchem Fall müssen stille Reserven offengelegt werden?", "antworten": ["Im Anhang, wenn die Nettoauflösung das Ergebnis wesentlich günstiger darstellt", "In der Bilanz, sobald sie gebildet werden", "Im Lagebericht, jährlich und vollständig", "Gar nie, stille Reserven bleiben immer geheim"], "korrekt": 0, "loesung": "OR 959c Abs. 1 Ziff. 3: offenzulegen ist der Betrag der aufgelösten stillen Reserven, soweit er die neu gebildeten übersteigt und das Ergebnis dadurch wesentlich günstiger dargestellt wird. Die Bildung bleibt unsichtbar. Die Asymmetrie ist gewollt und schützt die Gläubiger."}, {"id": "b8-7-A5", "typ": "multiplechoice", "label": "A5 · Geldflussrechnung bei einer KMU", "text": "Eine KMU ohne ordentliche Revision erstellt freiwillig eine Geldflussrechnung für ihre Bank. Wie ist das zu beurteilen?", "antworten": ["Unzulässig, nur revisionspflichtige Gesellschaften dürfen eine erstellen", "Zulässig und in der Praxis üblich, die Pflicht nach OR 961b entfällt lediglich", "Zulässig, aber nur mit Zustimmung der Steuerbehörde", "Unzulässig, weil dadurch stille Reserven aufgedeckt würden"], "korrekt": 1, "loesung": "OR 961b begründet eine Pflicht, kein Verbot. Banken verlangen die Geldflussrechnung im Kreditgespräch regelmässig, weil der Geldfluss aus Betriebstätigkeit weit weniger bewertungsabhängig ist als der ausgewiesene Gewinn."}, {"typ": "abschnitt", "label": "Teil B · Geldflussrechnung Velowerk GmbH 20_1", "farbe": "#A85930", "intro": "Jahresgewinn CHF 80'000. Abschreibungen CHF 60'000. Zunahme Rückstellungen CHF 15'000. Zunahme Forderungen LL CHF 25'000. Zunahme Verbindlichkeiten LL CHF 10'000. Im Jahr 20_1 wurde eine Montagemaschine für CHF 80'000 bar bezahlt, ein Altfahrzeug für CHF 15'000 verkauft. An die Gesellschafter wurde eine Dividende von CHF 30'000 ausbezahlt, ein Bankdarlehen von CHF 20'000 amortisiert."}, {"id": "b8-7-B1", "typ": "kennzahl", "label": "B1 · Geldfluss aus Betriebstätigkeit", "text": "Wie hoch ist der Geldfluss aus Betriebstätigkeit nach der indirekten Methode (CHF)?", "erwartet": 140000, "einheit": "CHF", "toleranz": 0.5, "loesung": "80'000 + 60'000 (Abschreibungen) + 15'000 (Zunahme Rückstellungen) − 25'000 (Zunahme Forderungen LL) + 10'000 (Zunahme Verbindlichkeiten LL) = CHF 140'000. Abschreibungen werden addiert, weil sie Aufwand ohne Geldabfluss sind, nicht weil sie Geld bringen."}, {"id": "b8-7-B2", "typ": "kennzahl", "label": "B2 · Geldfluss aus Investitionstätigkeit", "text": "Wie hoch ist der Geldfluss aus Investitionstätigkeit (Nettoabfluss als positive Zahl in CHF)?", "erwartet": 65000, "einheit": "CHF", "toleranz": 0.5, "loesung": "Auszahlung Maschine 80'000 minus Einzahlung Fahrzeugverkauf 15'000 = Nettoabfluss CHF 65'000."}, {"id": "b8-7-B3", "typ": "kennzahl", "label": "B3 · Geldfluss aus Finanzierungstätigkeit", "text": "Wie hoch ist der Geldfluss aus Finanzierungstätigkeit (Nettoabfluss als positive Zahl in CHF)?", "erwartet": 50000, "einheit": "CHF", "toleranz": 0.5, "loesung": "Dividende 30'000 plus Darlehensamortisation 20'000 = Nettoabfluss CHF 50'000. Beides sind Zahlungen an die Kapitalgeber, Eigen- wie Fremdkapital."}, {"id": "b8-7-B4", "typ": "kennzahl", "label": "B4 · Veränderung der flüssigen Mittel", "text": "Um wie viel haben sich die flüssigen Mittel im Geschäftsjahr 20_1 verändert (Zunahme als positive Zahl in CHF)?", "erwartet": 25000, "einheit": "CHF", "toleranz": 0.5, "loesung": "140'000 − 65'000 − 50'000 = +CHF 25'000. Diese Zahl muss exakt der Differenz der Bilanzposition flüssige Mittel zwischen 1.1. und 31.12. entsprechen. Das ist die Kontrollrechnung der Geldflussrechnung."}, {"typ": "abschnitt", "label": "Teil C · Beurteilung und Transfer", "farbe": "#BE185D"}, {"id": "b8-7-C1", "typ": "interpretation", "label": "C1 · Anhang, erweiterter Anhang und Lagebericht abgrenzen", "text": "Ein Studienkollege behauptet, der erweiterte Anhang und der Lagebericht seien im Grunde dasselbe, einfach für grössere Firmen. Nehmen Sie Stellung und grenzen Sie die drei Dokumente sauber ab.", "musterloesung": ["Der Anhang (OR 959c) ist Teil der Jahresrechnung und für alle juristischen Personen Pflicht. Er nennt Bewertungsgrundsätze, schlüsselt Positionen auf und enthält die gesetzlichen Pflichtangaben, darunter die Nettoauflösung stiller Reserven.", "Der erweiterte Anhang (OR 961a) ist kein eigenes Dokument, sondern derselbe Anhang mit genau zwei Zusatzangaben: Fristigkeit der langfristigen verzinslichen Verbindlichkeiten und Honorar der Revisionsstelle.", "Der Lagebericht (OR 961c) ist ein eigenständiges Dokument ohne Zahlenwerk. Er beschreibt Geschäftsverlauf, Vollzeitstellen, Risikobeurteilung, Auftragslage, Forschung und Entwicklung sowie Zukunftsaussichten.", "Die Aussage ist also falsch: Der erweiterte Anhang ist eine Ergänzung innerhalb der Jahresrechnung, der Lagebericht steht daneben und ist qualitativ, nicht quantitativ.", "Gemeinsam ist beiden nur der Auslöser: die Pflicht zur ordentlichen Revision nach OR 727, nicht die Rechtsform."]}, {"id": "b8-7-C2", "typ": "interpretation", "label": "C2 · Gewinn gegen Geldfluss", "text": "Die Velowerk GmbH weist einen Jahresgewinn von CHF 80'000 aus, der Geldfluss aus Betriebstätigkeit beträgt CHF 140'000. Erklären Sie die Differenz und beurteilen Sie, welche Grösse für eine Bank aussagekräftiger ist.", "musterloesung": ["Die Differenz von CHF 60'000 entsteht durch Positionen, die den Gewinn belasten oder entlasten, ohne dass Geld fliesst: Abschreibungen von 60'000 und die Zunahme der Rückstellungen von 15'000 sind Aufwand ohne Geldabfluss.", "Gegenläufig wirkt das Nettoumlaufvermögen: Die Zunahme der Forderungen LL von 25'000 bindet Geld, die Zunahme der Verbindlichkeiten LL von 10'000 setzt Geld frei.", "Der Gewinn hängt von Bewertungsentscheiden ab, also von Abschreibungssätzen, Delkredere und Rückstellungshöhe. Genau dort entstehen stille Reserven. Der Geldfluss aus Betriebstätigkeit lässt sich damit kaum steuern.", "Für die Bank ist deshalb der operative Geldfluss die härtere Grösse: Zins und Amortisation werden aus Geld bezahlt, nicht aus einem Buchgewinn.", "Umgekehrt gilt die Warnung: Ein positiver Geldfluss allein genügt nicht. Wird er nur durch den Abbau von Lagern und das Strecken von Lieferantenzahlungen erzeugt, ist er nicht nachhaltig."]}, {"id": "b8-7-C3", "typ": "interpretation", "label": "C3 · Was die externe Rechnung nicht zeigt", "text": "Eine Bank erhält von einer KMU nur Bilanz, Erfolgsrechnung und Anhang. Welche Informationslücken bleiben und wie kann die Bank sie schliessen?", "musterloesung": ["Es fehlt die Geldflussrechnung: Ob der ausgewiesene Gewinn auch zu Geld geworden ist, bleibt offen. Die Bank muss den operativen Geldfluss selbst indirekt aus zwei Bilanzen und der Erfolgsrechnung rekonstruieren.", "Es fehlt der Lagebericht: Auftragslage, Abhängigkeit von einzelnen Kunden, Risikobeurteilung und Zukunftsaussichten sind nicht dokumentiert. Diese Informationen holt die Bank im Kreditgespräch.", "Stille Reserven bleiben grösstenteils verborgen. Nur die Nettoauflösung erscheint im Anhang, und auch das nur bei wesentlicher Ergebnisverbesserung. Die Bank verlangt deshalb oft eine interne Jahresrechnung oder einen Reservenspiegel.", "Praktische Konsequenz: Die externe Jahresrechnung nach OR ist vorsichtig, aber nicht vollständig aussagekräftig. Wer Kredit gibt, arbeitet mit Zusatzinformationen, die das Gesetz nicht verlangt.", "Für die Unternehmung heisst das umgekehrt: Wer freiwillig Geldflussrechnung und interne Zahlen liefert, verbessert seine Verhandlungsposition und in der Regel die Kreditkonditionen."]}]},b8_aufgabe8={"title": "Aufgabe 8: Finanzerfolg und die Stufenbegriffe", "subtitle": "Was zwischen EBIT und EBT liegt · Kontenrahmen KMU gegen Kennzahlenleiter", "tabLabel": "Aufgabe 8", "context": "Zwischen EBIT und EBT liegt genau eine Grösse: der Finanzerfolg. Er entscheidet darüber, ob zwei Unternehmen mit gleicher Betriebsleistung dasselbe Ergebnis ausweisen. Und er ist die Stelle, an der am häufigsten falsch gebucht wird, weil vieles nach Zins aussieht, was keiner ist.", "theorie": {"title": "Theorie: Der Finanzerfolg und die Stufen der Erfolgsrechnung", "blocks": [{"type": "text", "text": "Der EBIT ist das Ergebnis vor Zinsen und Steuern, der EBT das Ergebnis vor Steuern. Dazwischen liegt der Finanzerfolg, also Finanzaufwand minus Finanzertrag. Im Kontenrahmen KMU sind das die Konten 6900 Finanzaufwand und 6950 Finanzertrag."}, {"type": "list", "items": ["Zum Finanzaufwand gehören: Hypothekarzinsen, Darlehenszinsen, Zinsen auf dem Kontokorrentkredit, Zinsen auf Gesellschafterdarlehen und Obligationenanleihen.", "Ebenfalls Finanzaufwand: zinsähnliche Bankkosten wie Kreditkommissionen, Diskontspesen, Konto- und Depotgebühren.", "Ebenfalls Finanzaufwand: der Zinsanteil aus Finanzierungsleasing sowie selbst geschuldete Verzugszinsen.", "Zum Finanzertrag gehören: Zinsen auf Bankguthaben, Zinsen auf gewährten Darlehen, Zinserträge aus Obligationen, erhaltene Verzugszinsen."]}, {"type": "beispiel", "text": "Vier Positionen sehen nach Zins aus, gehören aber nicht in den Finanzerfolg. Skonto beim Einkauf mindert den Warenaufwand, Skonto beim Verkauf den Warenertrag. Kursdifferenzen aus Warengeschäften laufen nach der einfachen Methode über Warenaufwand oder Warenertrag. Verrechnete Mahnspesen und Betreibungskosten sind übriger Betriebsertrag. Der Beteiligungsertrag ist im Kontenrahmen KMU kein Finanzertrag, sondern Erfolg aus Beteiligungen im Bereich 7000."}, {"type": "merksatz", "text": "Skonto ist wirtschaftlich ein Zins, buchhalterisch aber nicht. Wer Skonto in den Finanzerfolg bucht, verschiebt die Bruttogewinnmarge und verfälscht damit die wichtigste Steuergrösse der Erfolgsrechnung."}, {"type": "text", "text": "Der Finanzerfolg ist der Grund, weshalb die Analyse zwei Kennzahlen braucht. Die Gesamtkapitalrendite rechnet mit einer Grösse vor Zinsen, also mit dem EBIT, weil sie messen will, was das eingesetzte Kapital erwirtschaftet, unabhängig davon, wer es zur Verfügung gestellt hat. Die Eigenkapitalrendite rechnet mit dem Gewinn nach Zinsen. Die Differenz zwischen beiden ist der Leverage Effekt."}, {"type": "text", "text": "Achtung bei den Begriffen: Der Kontenrahmen KMU kennt drei Stufen. Die erste ist der Bruttogewinn, die zweite endet beim Betriebserfolg, die dritte beim Unternehmenserfolg. EBITDA und EBIT sind dabei keine eigenen Stufen, sondern Zwischengrössen innerhalb der zweiten Stufe. Der Betriebserfolg des Kontenrahmens ist bereits nach Zinsen gerechnet und entspricht damit dem EBT, nicht dem EBIT."}, {"type": "formel", "text": "Bruttogewinn − übrige operative Aufwände = EBITDA − Abschreibungen = EBIT − Finanzerfolg = EBT (Betriebserfolg) − direkte Steuern = Jahresgewinn (Unternehmenserfolg)"}, {"type": "merksatz", "text": "Betriebserfolg klingt nach EBIT, liegt aber nach den Zinsen. Wer für die Gesamtkapitalrendite den Betriebserfolg des Kontenrahmens einsetzt, rechnet die Zinsen doppelt heraus."}]}, "faelle": [{"typ": "abschnitt", "label": "Teil A · Gehört es in den Finanzerfolg?", "farbe": "#1B6B63", "intro": "Sie ordnen einzelne Geschäftsfälle der richtigen Position der Erfolgsrechnung zu."}, {"id": "b8-8-A1", "typ": "multiplechoice", "label": "A1 · Hypothekarzins", "text": "Die Velowerk GmbH bezahlt den Hypothekarzins für die Werkstattliegenschaft. Wo wird der Aufwand erfasst?", "antworten": ["Im Immobilienaufwand, weil er die Liegenschaft betrifft", "Im Finanzaufwand, weil es eine Vergütung für Fremdkapital ist", "Im übrigen Betriebsaufwand", "Als Minderung des Warenertrags"], "korrekt": 1, "loesung": "Jede Vergütung für überlassenes Fremdkapital ist Finanzaufwand, unabhängig davon, wofür das Kapital verwendet wurde. Der Immobilienaufwand nimmt nur den Betriebsaufwand der Liegenschaft auf, etwa Unterhalt und Nebenkosten."}, {"id": "b8-8-A2", "typ": "multiplechoice", "label": "A2 · Skonto beim Einkauf", "text": "Velowerk zahlt eine Lieferantenrechnung innert zehn Tagen und zieht 2 Prozent Skonto ab. Wie wird der Skonto erfasst?", "antworten": ["Als Finanzertrag, weil er wirtschaftlich einem Zins entspricht", "Als übriger Betriebsertrag", "Als Minderung des Warenaufwands", "Als Minderung des Warenertrags"], "korrekt": 2, "loesung": "Skonto beim Einkauf mindert den Einstandspreis der Ware und damit den Warenaufwand. Wirtschaftlich ist er zwar ein Zins, buchhalterisch aber eine Preiskorrektur. Wer ihn in den Finanzerfolg bucht, verändert die Bruttogewinnmarge."}, {"id": "b8-8-A3", "typ": "multiplechoice", "label": "A3 · Kursdifferenz aus einem Wareneinkauf", "text": "Beim Bezahlen einer Lieferantenrechnung in Euro entsteht nach der einfachen Methode eine Kursdifferenz. Wo wird sie erfasst?", "antworten": ["Im Warenaufwand, zusammen mit der ursprünglichen Buchung", "Im Finanzaufwand oder Finanzertrag", "Im übrigen Betriebsaufwand", "Direkt im Eigenkapital"], "korrekt": 0, "loesung": "Nach der einfachen Methode fliessen Kursdifferenzen aus Warengeschäften in dasselbe Konto wie der Grundvorgang, also in den Warenaufwand oder den Warenertrag. Nur die Vierspaltenmethode führt eigene Kurskonten im Finanzergebnis."}, {"id": "b8-8-A4", "typ": "multiplechoice", "label": "A4 · Zins auf dem Bankguthaben", "text": "Die Bank schreibt Velowerk einen Zins auf dem Guthaben gut. Wo wird er erfasst?", "antworten": ["Als Minderung des Finanzaufwands", "Als übriger Betriebsertrag", "Als Beteiligungsertrag", "Als Finanzertrag"], "korrekt": 3, "loesung": "Zinsen auf Guthaben sind Finanzertrag. In der Erfolgsrechnung wird der Finanzerfolg als Saldo aus Finanzaufwand und Finanzertrag ausgewiesen, die Konten selbst werden aber getrennt geführt."}, {"id": "b8-8-A5", "typ": "multiplechoice", "label": "A5 · Beteiligungsertrag", "text": "Velowerk erhält eine Dividende aus einer Beteiligung an einer Zulieferfirma. Wo gehört sie im Kontenrahmen KMU hin?", "antworten": ["In den Erfolg aus Beteiligungen, nicht in den Finanzerfolg", "In den Finanzertrag", "In den übrigen Betriebsertrag", "In den Warenertrag"], "korrekt": 0, "loesung": "Der Kontenrahmen KMU führt den Beteiligungsertrag in einem eigenen Bereich, getrennt vom Finanzerfolg. Er ist betriebsfremder Erfolg, weil er nicht aus der eigenen Leistungserstellung stammt."}, {"id": "b8-8-A6", "typ": "multiplechoice", "label": "A6 · Leasingrate", "text": "Velowerk zahlt eine Leasingrate für eine bilanzierte Montageanlage. Wie wird die Rate behandelt?", "antworten": ["Vollständig als Finanzaufwand", "Vollständig als übriger Betriebsaufwand", "Zinsanteil als Finanzaufwand, Amortisationsanteil als Tilgung der Verbindlichkeit", "Vollständig als Abschreibung"], "korrekt": 2, "loesung": "Beim Finanzierungsleasing ist nur der Zinsanteil Aufwand. Der Amortisationsanteil tilgt die Leasingverbindlichkeit und ist erfolgsneutral. Die Nutzung des Objekts wird separat über die Abschreibung erfasst."}, {"typ": "abschnitt", "label": "Teil B · Von EBITDA zum Jahresgewinn", "farbe": "#A85930", "intro": "Velowerk GmbH 20_1: Nettoerlös CHF 1'200'000, Bruttogewinn CHF 600'000, EBITDA CHF 180'000, Abschreibungen CHF 60'000, Zinsaufwand CHF 22'000, Zinsertrag CHF 2'000, direkte Steuern CHF 20'000."}, {"id": "b8-8-B1", "typ": "kennzahl", "label": "B1 · EBIT", "text": "Wie hoch ist der EBIT (CHF)?", "erwartet": 120000, "einheit": "CHF", "toleranz": 0.5, "loesung": "EBITDA 180'000 minus Abschreibungen 60'000 = CHF 120'000. Der EBIT liegt vor Zinsen und Steuern."}, {"id": "b8-8-B2", "typ": "kennzahl", "label": "B2 · Finanzerfolg", "text": "Wie hoch ist der Finanzerfolg als Nettoaufwand (positive Zahl in CHF)?", "erwartet": 20000, "einheit": "CHF", "toleranz": 0.5, "loesung": "Finanzaufwand 22'000 minus Finanzertrag 2'000 = Nettoaufwand CHF 20'000. Ausgewiesen wird der Saldo, geführt werden zwei getrennte Konten."}, {"id": "b8-8-B3", "typ": "kennzahl", "label": "B3 · EBT", "text": "Wie hoch ist der EBT (CHF)?", "erwartet": 100000, "einheit": "CHF", "toleranz": 0.5, "loesung": "EBIT 120'000 minus Finanzerfolg 20'000 = CHF 100'000. Diese Stufe heisst im Kontenrahmen KMU Betriebserfolg und ist die Basis der Steuerberechnung."}, {"id": "b8-8-B4", "typ": "kennzahl", "label": "B4 · Jahresgewinn", "text": "Wie hoch ist der Jahresgewinn (CHF)?", "erwartet": 80000, "einheit": "CHF", "toleranz": 0.5, "loesung": "EBT 100'000 minus direkte Steuern 20'000 = CHF 80'000. Diese Stufe heisst im Kontenrahmen KMU Unternehmenserfolg."}, {"id": "b8-8-B5", "typ": "kennzahl", "label": "B5 · EBIT-Marge", "text": "Wie hoch ist die EBIT-Marge in Prozent, auf eine Kommastelle gerundet?", "erwartet": 10, "einheit": "%", "toleranz": 0.15, "loesung": "120'000 geteilt durch 1'200'000 mal 100 = 10.0 Prozent. Die EBIT-Marge misst die operative Ertragskraft unabhängig von Finanzierung und Steuern."}, {"typ": "abschnitt", "label": "Teil C · Begriffe sauber trennen", "farbe": "#BE185D"}, {"id": "b8-8-C1", "typ": "interpretation", "label": "C1 · Warum die Analyse den EBIT braucht", "text": "Zwei Velobetriebe haben identischen Umsatz, identische Kosten und identische Abschreibungen. Der eine ist schuldenfrei, der andere zu 70 Prozent fremdfinanziert. Erklären Sie, welche Stufen sich unterscheiden und welche Kennzahl deshalb welche Grösse verwendet.", "musterloesung": ["Bruttogewinn, EBITDA und EBIT sind bei beiden Betrieben identisch, weil bis zu dieser Stufe keine Finanzierungskosten enthalten sind.", "Ab dem EBT gehen die beiden auseinander: Der fremdfinanzierte Betrieb trägt Zinsaufwand und weist deshalb ein tieferes Ergebnis vor Steuern und einen tieferen Jahresgewinn aus.", "Die Gesamtkapitalrendite misst, was das eingesetzte Kapital erwirtschaftet, unabhängig von seiner Herkunft. Sie rechnet deshalb mit einer Grösse vor Zinsen, also mit dem EBIT beziehungsweise mit Gewinn plus Fremdkapitalzins.", "Die Eigenkapitalrendite misst die Sicht der Eigentümer und rechnet mit dem Gewinn nach Zinsen.", "Die Differenz zwischen beiden Renditen ist der Leverage Effekt: Solange die Gesamtkapitalrendite über dem Fremdkapitalzinssatz liegt, hebt Fremdkapital die Eigenkapitalrendite."]}, {"id": "b8-8-C2", "typ": "interpretation", "label": "C2 · Betriebserfolg ist nicht EBIT", "text": "Eine Mitstudierende setzt für die Gesamtkapitalrendite den Betriebserfolg aus dem Kontenrahmen KMU ein. Nehmen Sie Stellung und erklären Sie den Unterschied der beiden Begriffssysteme.", "musterloesung": ["Der Kontenrahmen KMU kennt drei Stufen: Bruttogewinn, Betriebserfolg und Unternehmenserfolg. EBITDA und EBIT sind dort keine eigenen Stufen, sondern Zwischengrössen innerhalb der zweiten Stufe.", "Der Betriebserfolg ist bereits nach Abzug der Zinsen gerechnet. Er entspricht damit dem EBT, nicht dem EBIT, obwohl der Name das nahelegt.", "Wird der Betriebserfolg in die Gesamtkapitalrendite eingesetzt, sind die Zinsen doppelt berücksichtigt: einmal abgezogen im Betriebserfolg und einmal wieder addiert durch die Formel Gewinn plus Fremdkapitalzins.", "Richtig ist entweder der EBIT direkt oder der Jahresgewinn zuzüglich Fremdkapitalzins. Beide Wege führen zum selben Wert.", "Konsequenz für die Prüfung: Immer prüfen, ob eine genannte Grösse vor oder nach Zinsen liegt. Der Name allein genügt nicht."]}]},pt_aufgabe1={title:"Aufgabe 1: Gemischte Buchungssätze",subtitle:"24 Fälle aus allen acht Blöcken · ohne Themenangabe",tabLabel:"Gemischt buchen",context:"In der Prüfung steht nicht, um welches Thema es geht. Genau das trainierst du hier: Zuerst den Sachverhalt erkennen, dann buchen. Die Fälle sind bewusst gemischt und folgen keiner Blockreihenfolge.",theorie:{title:"So gehst du bei jedem Fall vor",blocks:[{type:"list",items:["Was ist passiert? Geldfluss, Leistung, Wertveränderung oder Abschlussbuchung?","Welche zwei Konten sind betroffen? Bestand oder Erfolg?","Wer wird belastet (Soll), wer entlastet (Haben)?","Steht der Betrag brutto oder netto da? Bei MWST immer trennen."]},{type:"merksatz",text:"Die häufigsten Prüfungsfehler sind keine Rechenfehler, sondern Erkennungsfehler: Abgrenzung statt Rückstellung, Aufwand statt Anzahlung, brutto statt netto."}]},faelle:[{typ:"abschnitt",label:"Teil A · Fälle 1 bis 12",farbe:"#1B6B63",intro:"Velowerk GmbH, Luzern. Geschäftsjahr 20_1. MWST-Normalsatz 8.1 Prozent, effektive Abrechnungsmethode."},{id:"pt-1-A1",label:"A1",text:"Wareneinkauf brutto CHF 5'405 (inkl. 8.1% MWST) auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:5000},{sollKeys:["vorsteuer"],habenKeys:["verbindlichkeiten"],betrag:405}]]},{id:"pt-1-A2",label:"A2",text:"Ein Kunde bezahlt eine offene Rechnung von CHF 8'640 per Bank.",anzahlBuchungen:1,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:8640}]]},{id:"pt-1-A3",label:"A3",text:"Eine Forderung von CHF 1'200 ist definitiv uneinbringlich und wird ausgebucht.",anzahlBuchungen:1,loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["forderungen"],betrag:1200}]]},{id:"pt-1-A4",label:"A4",text:"Lohnzahlung: Bruttolohn CHF 6'500, Arbeitnehmerabzüge CHF 780 an die Sozialversicherungen, Rest per Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:780},{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:5720}]]},{id:"pt-1-A5",label:"A5",text:"Rechnung eines italienischen Lieferanten über EUR 4'000, Tageskurs 0.95. Buchung der Rechnung.",anzahlBuchungen:1,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:3800}]]},{id:"pt-1-A6",label:"A6",text:"Zahlung der Rechnung aus A5 zum Kurs 0.97, Belastung Bank CHF 3'880. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:3800},{sollKeys:["kursverlust"],habenKeys:["bank"],betrag:80}]]},{id:"pt-1-A7",label:"A7",text:"Am 1.10.20_1 wurde die Betriebsversicherung für zwölf Monate bezahlt: CHF 3'600. Abschlussbuchung per 31.12.20_1.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischeaktiven"],habenKeys:["versicherungsaufwand"],betrag:2700}]]},{id:"pt-1-A8",label:"A8",text:"Die Stromrechnung für Dezember 20_1 über CHF 3'200 trifft erst im Januar 20_2 ein. Abschlussbuchung per 31.12.20_
