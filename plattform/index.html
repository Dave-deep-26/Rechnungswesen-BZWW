oden ergeben am Ende denselben Bruttogewinn und denselben Endbestand. Der Unterschied liegt im Buchungsweg und in der Aktualit\xE4t des Bestandskontos."}]},sachverhalt:{title:"Sachverhalt: Velowerk GmbH \xB7 Gesch\xE4ftsjahr",intro:"Velowerk handelt mit Velos. Alle Bewegungen \xFCber die Bank, Eink\xE4ufe und Verk\xE4ufe jeweils auf Rechnung.",tabelle:{cols:["Position","Betrag (CHF)"],rows:[["Er\xF6ffnungsbestand 1.1.","80'000"],["Wareneink\xE4ufe im Jahr (auf Rechnung)","120'000"],["Warenverk\xE4ufe im Jahr (auf Rechnung)","200'000"],["Endbestand laut Inventur 31.12.","70'000"],["Bestandsver\xE4nderung","\u221210'000 (Abnahme)"]]}},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Methode ohne laufende Inventur",farbe:"#1D4ED8",intro:"Wareneink\xE4ufe gehen direkt auf den Aufwand, Verk\xE4ufe direkt auf den Ertrag. Das Bestandskonto wird erst beim Abschluss korrigiert."},{id:"b3-1-A1",label:"A1 \xB7 Wareneinkauf im Jahr",text:"Wir kaufen w\xE4hrend des Jahres Waren auf Rechnung im Wert von CHF 120'000.",loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:12e4}]]},{id:"b3-1-A2",label:"A2 \xB7 Warenverkauf im Jahr",text:"Wir verkaufen Waren auf Rechnung f\xFCr CHF 200'000.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag"],betrag:2e5}]]},{id:"b3-1-A3",label:"A3 \xB7 Abschluss \xB7 Bestandsanpassung",text:"Per 31.12.: Anfangsbestand CHF 80'000, Endbestand laut Inventur CHF 70'000. Bestandsabnahme um CHF 10'000 verbuchen.",loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["warenbestand"],betrag:1e4}]]},{id:"b3-1-A4",label:"A4 \xB7 Personalaufwand",text:"Personalaufwand im Jahr CHF 30'000 (per Bank bezahlt).",loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:3e4}]]},{id:"b3-1-A5",label:"A5 \xB7 Raumaufwand",text:"Mietzins f\xFCr Verkaufslokal im Jahr CHF 12'000 (per Bank bezahlt).",loesungen:[[{sollKeys:["raumaufwand"],habenKeys:["bank"],betrag:12e3}]]},{typ:"abschnitt",label:"Teil B \xB7 Methode mit laufender Inventur",farbe:"#15803D",intro:"Identischer Sachverhalt wie Teil A (Anfangsbestand 80'000, Eink\xE4ufe 120'000, Verk\xE4ufe 200'000, Endbestand 70'000) \u2013 nur die Buchungsweise \xE4ndert sich. Eink\xE4ufe gehen direkt auf das Bestandskonto, bei jedem Verkauf wird der Einstand sofort abgebucht. Bevor wir die Buchungen machen, m\xFCssen wir wissen, wie viel Ware insgesamt zum Einstandspreis verkauft wurde."},{id:"b3-1-B1",typ:"kennzahl",label:"B1 \xB7 Berechnung Einstand der verkauften Ware",text:"Berechne aus dem Sachverhalt den Gesamtwert der im Jahr verkauften Ware zu Einstandspreisen. Formel: Anfangsbestand + Eink\xE4ufe \u2212 Endbestand. Werte: Anfangsbestand 80'000, Eink\xE4ufe 120'000, Endbestand 70'000.",erwartet:13e4,einheit:"CHF",toleranz:0,loesung:"Einstand = 80'000 + 120'000 \u2212 70'000 = CHF 130'000. Logik: Was am Anfang im Lager war (80'000) plus alles was eingekauft wurde (120'000) ergibt das verf\xFCgbare Warenvolumen (200'000). Davon sind am Ende noch 70'000 da, also sind 130'000 rausgegangen zum Einstandswert. Probe \xFCber den Bruttogewinn: Verkaufserl\xF6s 200'000 \u2212 Einstand 130'000 = Bruttogewinn 70'000."},{id:"b3-1-B2",label:"B2 \xB7 Wareneinkauf im Jahr",text:"Wir kaufen w\xE4hrend des Jahres Waren auf Rechnung im Wert von CHF 120'000 (gleicher Wert wie A1, aber jetzt direkt auf das Bestandskonto).",loesungen:[[{sollKeys:["warenbestand"],habenKeys:["verbindlichkeiten"],betrag:12e4}]]},{id:"b3-1-B3",label:"B3 \xB7 Warenverkauf \xB7 Erl\xF6s",text:"Wir verkaufen Waren auf Rechnung f\xFCr CHF 200'000 (gleicher Wert wie A2). Buchung des Erl\xF6ses zum Verkaufspreis.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag"],betrag:2e5}]]},{id:"b3-1-B4",label:"B4 \xB7 Warenverkauf \xB7 Einstand",text:"Gleichzeitig zur Erl\xF6sbuchung in B3: Einstand der verkauften Ware abbuchen. Den Einstandswert hast du in B1 berechnet (CHF 130'000).",loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["warenbestand"],betrag:13e4}]]},{id:"b3-1-B5",label:"B5 \xB7 Personalaufwand",text:"Personalaufwand im Jahr CHF 30'000 (per Bank bezahlt).",loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:3e4}]]},{id:"b3-1-B6",label:"B6 \xB7 Raumaufwand",text:"Mietzins f\xFCr Verkaufslokal im Jahr CHF 12'000 (per Bank bezahlt).",loesungen:[[{sollKeys:["raumaufwand"],habenKeys:["bank"],betrag:12e3}]]},{id:"b3-1-B7",label:"B7 \xB7 Abschluss",text:"Welche Buchung ist beim Jahresabschluss bez\xFCglich Warenbestand n\xF6tig?",keineEingabe:!0,loesung:"Keine Buchung n\xF6tig. Das Bestandskonto ist durch die laufenden Buchungen automatisch auf dem korrekten Endbestand: 80'000 (Anfang) + 120'000 (Einkauf) \u2212 130'000 (Verkaufs-Einstand) = CHF 70'000. Genau das verspricht die laufende Inventur: jederzeit aktueller Bestand ohne Abschlussbuchung. Personalaufwand und Raumaufwand sind bereits laufend verbucht, also auch dort nichts zu tun."}],vergleich:{title:"Direktvergleich beider Methoden",subtitle:"Identischer Sachverhalt, identisches Resultat",cols:["Position","Ohne laufende Inventur","Mit laufender Inventur"],rows:[["Buchungen w\xE4hrend des Jahres","2 (Einkauf, Verkauf)","3 (Einkauf, Erl\xF6s, Einstand)"],["Buchungen am Abschluss","1 (Bestandskorrektur)","0 (keine n\xF6tig)"],["Aktualit\xE4t Bestandskonto","nur am Jahresende korrekt","jederzeit aktuell"],["Warenaufwand total","120'000 + 10'000 = 130'000","130'000 (sofort gebucht)"],["Bruttogewinn (200'000 minus 130'000)","70'000","70'000"],["Endbestand 31.12.","70'000","70'000"],["Praxis","KMU, manuelle Buchhaltung","ERP-Systeme, Grossunternehmen"]],merksatz:"Beide Methoden ergeben das gleiche Resultat. Die Methode ohne Inventur ist einfacher in der Anwendung, daf\xFCr ist der Bestand w\xE4hrend des Jahres nicht aktuell. Die Methode mit Inventur ist aufw\xE4ndiger, daf\xFCr ist der Bestand jederzeit korrekt \u2013 Standard in modernen ERP-Systemen."}},b3_aufgabe2={title:"Aufgabe 2: Vorratbewertung nach LIFO und Durchschnitt",subtitle:"Velowerk City Cruiser \xB7 Endbestand bewerten",tabLabel:"Aufgabe 2",context:"Drei Einkaufstranchen zu unterschiedlichen Preisen, 230 St\xFCck verkauft, 70 im Lager. Die zwei Verfahren ergeben verschiedene Werte.",theorie:{title:"Theorie: Vorratbewertung \u2013 FIFO, LIFO und Durchschnitt",blocks:[{type:"text",text:"Wenn ein Unternehmen w\xE4hrend des Jahres Ware zu unterschiedlichen Preisen einkauft, stellt sich am Jahresende die Frage: Mit welchem Preis bewerten wir den Endbestand? Da die Ware physisch identisch ist (z.B. 70 Velos vom selben Modell), kann man die einzelnen St\xFCcke meist nicht mehr einer Einkaufstranche zuordnen. Darum braucht es eine Bewertungsmethode als Annahme \xFCber den Materialfluss."},{type:"subtitle",text:"FIFO \u2013 First In, First Out"},{type:"text",text:"Die zuerst gekauften St\xFCcke werden zuerst verkauft. Im Lager bleiben die j\xFCngsten Best\xE4nde zu den aktuellsten Preisen. Diese Methode entspricht dem tats\xE4chlichen Materialfluss und ist bei verderblichen G\xFCtern (Lebensmittel, Medikamente) zwingend."},{type:"subtitle",text:"LIFO \u2013 Last In, First Out"},{type:"text",text:"Die zuletzt gekauften St\xFCcke werden zuerst verkauft. Im Lager bleiben die \xE4ltesten Best\xE4nde zu den \xE4ltesten Preisen. Diese Methode wird vor allem in L\xE4ndern mit hoher Inflation angewendet, weil sie den Aufwand und damit die Steuerlast senkt."},{type:"subtitle",text:"Gewichteter Durchschnittspreis"},{type:"text",text:"Alle Eink\xE4ufe werden zu einem Mischpreis gemittelt. Endbestand und Warenaufwand werden mit demselben Durchschnittspreis bewertet. Dieser Mittelweg zwischen FIFO und LIFO ist in der Schweizer Praxis am h\xE4ufigsten anzutreffen."},{type:"formel",text:"Mischpreis = Total Wert \xF7 Total St\xFCck     |     Endbestand-Wert = St\xFCckzahl \xD7 Mischpreis"},{type:"vergleich",left:{title:"Bei steigenden Preisen",text:"FIFO: h\xF6herer Lagerwert, h\xF6herer Gewinn, h\xF6here Steuern. LIFO: tieferer Lagerwert, tieferer Gewinn, tiefere Steuern. Durchschnitt liegt dazwischen."},right:{title:"Bei fallenden Preisen",text:"FIFO: tieferer Lagerwert, tieferer Gewinn. LIFO: h\xF6herer Lagerwert, h\xF6herer Gewinn. Der Effekt kehrt sich um."}},{type:"beispiel",text:"Velowerk kauft im Januar 80 Velos zu CHF 450, im April 120 zu CHF 480, im September 100 zu CHF 510. Verkauft werden 230 St\xFCck, im Lager bleiben 70. Je nach Methode liegt der Lagerwert zwischen CHF 31'500 (LIFO) und CHF 35'700 (FIFO) \u2013 eine Differenz von 4'200 CHF, die als stille Reserve interpretiert werden kann."},{type:"merksatz",text:"OR erlaubt alle drei Verfahren. IFRS (IAS 2) verbietet LIFO seit 2005. Swiss GAAP FER sieht LIFO als verp\xF6nt. In der Schweizer KMU-Praxis dominieren heute FIFO und Durchschnitt."}]},sachverhalt:{title:"Sachverhalt: Velowerk GmbH \xB7 Modell City Cruiser",intro:"Velowerk bewertet zum Jahresende den Lagerbestand des Modells City Cruiser. Im Laufe des Jahres wurden drei Tranchen zu unterschiedlichen Einkaufspreisen beschafft. Insgesamt wurden 230 St\xFCck verkauft.",tabelle:{cols:["Datum","Vorgang","St\xFCck","St\xFCckpreis (CHF)","Wert (CHF)"],rows:[["01.01.","Anfangsbestand","80","450.00","36'000"],["15.04.","Zukauf 1","120","480.00","57'600"],["10.09.","Zukauf 2","100","510.00","51'000"],["Total verf\xFCgbar","","300","\u2014","144'600"],["","Verkauf im Jahr","230","\u2014",""],["31.12.","Endbestand","70","?","?"]]}},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Vorbereitung",farbe:"#1B6B63"},{id:"b3-2-A1",typ:"kennzahl",label:"A1 \xB7 Total verf\xFCgbare St\xFCckzahl",text:"Wie viele St\xFCck City Cruiser sind insgesamt verf\xFCgbar?",erwartet:300,einheit:"St\xFCck",toleranz:0,loesung:"Anfangsbestand 80 + Zukauf 1 (120) + Zukauf 2 (100) = 300 St\xFCck"},{id:"b3-2-A2",typ:"kennzahl",label:"A2 \xB7 Total verf\xFCgbarer Wert",text:"Welcher Gesamteinkaufswert (CHF) steht zur Verf\xFCgung?",erwartet:144600,einheit:"CHF",toleranz:0,loesung:"36'000 + 57'600 + 51'000 = 144'600 CHF"},{id:"b3-2-A3",typ:"kennzahl",label:"A3 \xB7 Endbestand Menge",text:"Wie viele St\xFCck sind per 31.12. noch im Lager?",erwartet:70,einheit:"St\xFCck",toleranz:0,loesung:"300 verf\xFCgbar minus 230 verkauft = 70 St\xFCck"},{typ:"abschnitt",label:"Teil B \xB7 Bewertung nach FIFO",farbe:"#15803D",intro:"FIFO unterstellt, dass die zuerst gekauften St\xFCcke zuerst verkauft werden. Im Lager bleiben die j\xFCngsten Best\xE4nde zu den aktuellsten Preisen."},{id:"b3-2-B1",typ:"kennzahl",label:"B1 \xB7 FIFO-St\xFCckpreis f\xFCr Endbestand",text:"Mit welchem St\xFCckpreis (CHF) bewertet FIFO die 70 St\xFCck Endbestand?",erwartet:510,einheit:"CHF/St\xFCck",toleranz:0,loesung:"Bei FIFO bleiben die j\xFCngsten St\xFCcke im Lager, also der letzte Zukauf vom 10.09. zu CHF 510 pro St\xFCck."},{id:"b3-2-B2",typ:"kennzahl",label:"B2 \xB7 FIFO-Endbestand Wert",text:"Wie hoch ist der Lagerwert (CHF) per 31.12. nach FIFO?",erwartet:35700,einheit:"CHF",toleranz:0,loesung:"70 St\xFCck \xD7 CHF 510 = CHF 35'700"},{id:"b3-2-B3",typ:"kennzahl",label:"B3 \xB7 FIFO-Warenaufwand",text:"Wie hoch ist der Warenaufwand (CHF) im laufenden Jahr nach FIFO?",erwartet:108900,einheit:"CHF",toleranz:0,loesung:"Total verf\xFCgbar 144'600 minus Endbestand 35'700 = Warenaufwand 108'900 CHF. Buchhalterischer \xDCbertrag: Bei Methode mit laufender Inventur wird der Einstand laufend w\xE4hrend des Jahres bei jedem Verkauf abgebucht (vgl. Aufgabe 1, Teil B). Bei Methode ohne laufende Inventur erfolgt die Anpassung am Jahresabschluss als Bestandsdifferenz."},{typ:"abschnitt",label:"Teil C \xB7 Bewertung nach LIFO",farbe:"#1D4ED8",intro:"LIFO unterstellt, dass die zuletzt gekauften St\xFCcke zuerst verkauft werden. Im Lager bleiben die \xE4ltesten Best\xE4nde."},{id:"b3-2-C1",typ:"kennzahl",label:"C1 \xB7 LIFO-St\xFCckpreis f\xFCr Endbestand",text:"Mit welchem St\xFCckpreis (CHF) bewertet LIFO die 70 St\xFCck Endbestand?",erwartet:450,einheit:"CHF/St\xFCck",toleranz:0,loesung:"Bei LIFO bleiben die \xE4ltesten St\xFCcke im Lager, also der Anfangsbestand zu CHF 450 pro St\xFCck."},{id:"b3-2-C2",typ:"kennzahl",label:"C2 \xB7 LIFO-Endbestand Wert",text:"Wie hoch ist der Lagerwert (CHF) per 31.12. nach LIFO?",erwartet:31500,einheit:"CHF",toleranz:0,loesung:"70 St\xFCck \xD7 CHF 450 = CHF 31'500"},{id:"b3-2-C3",typ:"kennzahl",label:"C3 \xB7 LIFO-Warenaufwand",text:"Wie hoch ist der Warenaufwand (CHF) im laufenden Jahr nach LIFO?",erwartet:113100,einheit:"CHF",toleranz:0,loesung:"Total verf\xFCgbar 144'600 minus Endbestand 31'500 = Warenaufwand 113'100 CHF. Buchhalterischer \xDCbertrag: Bei Methode mit laufender Inventur wird der Einstand laufend w\xE4hrend des Jahres bei jedem Verkauf abgebucht (vgl. Aufgabe 1, Teil B). Bei Methode ohne laufende Inventur erfolgt die Anpassung am Jahresabschluss als Bestandsdifferenz."},{typ:"abschnitt",label:"Teil D \xB7 Bewertung nach Durchschnitt",farbe:"#0F766E",intro:"Die Durchschnittsmethode mittelt alle Eink\xE4ufe zu einem Mischpreis. Endbestand und Warenaufwand werden mit demselben Durchschnittspreis bewertet."},{id:"b3-2-D1",typ:"kennzahl",label:"D1 \xB7 Mischpreis (gewichteter Durchschnitt)",text:"Wie hoch ist der Mischpreis (CHF) pro St\xFCck, also der gewichtete Durchschnitt aller Eink\xE4ufe?",erwartet:482,einheit:"CHF/St\xFCck",toleranz:.5,loesung:"Mischpreis = Total Wert 144'600 \xF7 Total St\xFCck 300 = CHF 482.00 pro St\xFCck. \xABGewichtet\xBB heisst: jeder Einkaufspreis z\xE4hlt entsprechend seiner St\xFCckzahl. Tranche 2 mit 120 St\xFCck hat mehr Gewicht im Durchschnitt als der Anfangsbestand mit 80 St\xFCck."},{id:"b3-2-D2",typ:"kennzahl",label:"D2 \xB7 Durchschnitts-Endbestand Wert",text:"Wie hoch ist der Lagerwert (CHF) per 31.12. nach Durchschnitt?",erwartet:33740,einheit:"CHF",toleranz:5,loesung:"70 St\xFCck \xD7 CHF 482 = CHF 33'740"},{id:"b3-2-D3",typ:"kennzahl",label:"D3 \xB7 Durchschnitts-Warenaufwand",text:"Wie hoch ist der Warenaufwand (CHF) im laufenden Jahr nach Durchschnitt?",erwartet:110860,einheit:"CHF",toleranz:5,loesung:"Total verf\xFCgbar 144'600 minus Endbestand 33'740 = Warenaufwand 110'860 CHF. Buchhalterischer \xDCbertrag: Bei Methode mit laufender Inventur wird der Einstand laufend w\xE4hrend des Jahres bei jedem Verkauf abgebucht (vgl. Aufgabe 1, Teil B). Bei Methode ohne laufende Inventur erfolgt die Anpassung am Jahresabschluss als Bestandsdifferenz."},{typ:"abschnitt",label:"Teil E \xB7 Vergleich und Reflexion",farbe:"#A85930"},{id:"b3-2-E1",typ:"kennzahl",label:"E1 \xB7 Differenz FIFO vs. LIFO",text:"Um wie viel CHF ist der Endbestand bei FIFO h\xF6her als bei LIFO?",erwartet:4200,einheit:"CHF",toleranz:5,loesung:"FIFO 35'700 minus LIFO 31'500 = 4'200 CHF h\xF6her bei FIFO. Das ist die maximale stille Reserve, die durch die Methodenwahl entsteht."},{id:"b3-2-E2",typ:"interpretation",label:"E2 \xB7 Auswirkung auf Bilanz und Erfolgsrechnung",text:"Was bedeuten die Differenzen zwischen den drei Verfahren f\xFCr die Bilanz und die Erfolgsrechnung von Velowerk?",musterloesung:["FIFO produziert den h\xF6chsten Endbestand (35'700) und damit den tiefsten Warenaufwand (108'900) und h\xF6chsten Gewinn.","LIFO produziert den tiefsten Endbestand (31'500) und damit den h\xF6chsten Warenaufwand (113'100) und tiefsten Gewinn.","Durchschnitt liegt dazwischen (Endbestand 33'740, Warenaufwand 110'860).","Stille Reserven: Wer LIFO statt FIFO w\xE4hlt, h\xE4lt 4'200 CHF stille Reserve im Lager.","Steuerwirkung: LIFO senkt kurzfristig die Steuern, weil der Gewinn tiefer ausgewiesen wird (Steuerstundungseffekt)."]},{id:"b3-2-E3",typ:"interpretation",label:"E3 \xB7 OR vs. IFRS",text:"Welche Methoden erlaubt das OR? Welche IFRS? Welche Methode w\xFCrde Velowerk w\xE4hlen, wenn das Unternehmen kotiert w\xE4re?",musterloesung:["OR: Erlaubt FIFO, LIFO und Durchschnitt. Stille Reserven sind grunds\xE4tzlich zul\xE4ssig (Vorsichtsprinzip nach Art. 960a OR).","IFRS (IAS 2): LIFO ist seit 2005 verboten. Erlaubt sind nur FIFO und Durchschnitt. Begr\xFCndung: LIFO verzerrt bei steigenden Preisen das wahre Bild des Verm\xF6gens.","Konsequenz f\xFCr ein kotiertes Velowerk: M\xFCsste IFRS anwenden und auf FIFO oder Durchschnitt wechseln. Wechsel von LIFO zu FIFO w\xFCrde stille Reserven aufdecken und den Eigenkapitalwert erh\xF6hen.","Praktisch: Auch unter OR wenden viele Schweizer KMU heute FIFO oder Durchschnitt an, weil sie einfach zu rechnen und international anschlussf\xE4hig sind."]}],vergleich:{title:"Direktvergleich FIFO, LIFO und Durchschnitt",subtitle:"So unterschiedlich bewertet derselbe physische Lagerbestand",cols:["Position","FIFO","LIFO","Durchschnitt"],rows:[["St\xFCckpreis Endbestand","CHF 510","CHF 450","CHF 482"],["Endbestand Wert (Bilanz)","CHF 35'700","CHF 31'500","CHF 33'740"],["Warenaufwand (ER)","CHF 108'900","CHF 113'100","CHF 110'860"],["Gewinneffekt (relativ zu Durchschnitt)","+1'960","\u22122'240","0 (Basis)"],["Stille Reserve im Lager","0 (Basis)","CHF 4'200","CHF 1'960"]],merksatz:"Bei steigenden Einkaufspreisen produziert FIFO den h\xF6chsten Lagerwert und h\xF6chsten Gewinn, LIFO den tiefsten. Durchschnitt liegt dazwischen. Wer LIFO w\xE4hlt, schafft die gr\xF6sste stille Reserve \u2013 aber IFRS verbietet das seit 2005."}},b3_aufgabe3={title:"Aufgabe 3: Vier Verfahren der Lagerbewertung",subtitle:"FIFO, LIFO, Durchschnitt und Verrechnungspreise",tabLabel:"Aufgabe 3",context:"F\xFCnf Multiple-Choice-Fragen zu den Eigenschaften der vier Bewertungsverfahren plus eine Reflexion. Die \xDCbersichtstabelle steht am Ende als Selbstkontrolle bereit.",theorie:{title:"Theorie: Vier Verfahren der Lagerbewertung im \xDCberblick",blocks:[{type:"text",text:"Neben FIFO, LIFO und Durchschnitt gibt es in der Praxis ein viertes Verfahren: die Verrechnungspreise (auch Standardkosten genannt). W\xE4hrend die ersten drei Verfahren mit Ist-Preisen arbeiten, verwenden Verrechnungspreise feste Kalkulationspreise. Hier ein kompakter \xDCberblick aller vier Methoden, ihrer Anwendung und Beurteilung."},{type:"subtitle",text:"FIFO (First In, First Out)"},{type:"list",items:["Anwendung: Jeder Einkauf wird chronologisch nach Datum festgehalten","Bewertung: \xC4lteste Artikel werden zuerst ausgebucht","Beurteilung: Entspricht dem tats\xE4chlichen Materialfluss; bei verderblichen G\xFCtern zwingend"]},{type:"subtitle",text:"LIFO (Last In, First Out)"},{type:"list",items:["Anwendung: Wie FIFO chronologische Erfassung, aber umgekehrte Auslagerung","Bewertung: Zuletzt eingelagerte Artikel werden zuerst ausgeliefert","Beurteilung: Heute weniger \xFCblich, in Swiss GAAP FER verp\xF6nt; Anwendung vor allem in Hochinflations-L\xE4ndern"]},{type:"subtitle",text:"Gewichteter Durchschnittspreis"},{type:"list",items:["Anwendung: Bei jedem Einkauf wird ein neuer Durchschnittswert errechnet","Bewertung: Lagerbez\xFCge erfolgen zum laufenden Durchschnittspreis","Beurteilung: In der Schweizer Praxis am h\xE4ufigsten; geringe Anforderungen an ERP-Systeme"]},{type:"subtitle",text:"Verrechnungspreise (Standardkosten)"},{type:"list",items:["Anwendung: F\xFCr jeden Artikel ist ein fester Verrechnungspreis hinterlegt (meist j\xE4hrlich)","Bewertung: Ein- und Auslagerungen zum Standardpreis; Differenzen separat ausgewiesen","Beurteilung: Vorteilhaft f\xFCr Kostenrechnung und Kalkulation; bei stark schwankenden Marktpreisen ungeeignet"]},{type:"vergleich",left:{title:"Inventurmethode",text:"Frage: Wie f\xFChre ich das Lager? Antwort: ohne laufende Inventur oder mit laufender Inventur. Bestimmt den Buchungsweg."},right:{title:"Bewertungsmethode",text:"Frage: Wie bewerte ich die Ware? Antwort: FIFO, LIFO, Durchschnitt oder Verrechnungspreise. Bestimmt den Wert pro St\xFCck."}},{type:"merksatz",text:"Inventur- und Bewertungsmethode sind zwei unabh\xE4ngige Entscheidungen. In der Praxis kombinieren KMU meistens \xABmit laufender Inventur + FIFO\xBB oder \xABmit laufender Inventur + Durchschnitt\xBB."}]},faelle:[{id:"b3-3-C1",typ:"multiplechoice",label:"C1 \xB7 Tats\xE4chlicher Materialfluss",text:"Welches Verfahren entspricht dem tats\xE4chlichen Materialfluss und wird bei verderblichen G\xFCtern zwingend angewendet?",antworten:["FIFO (First In, First Out)","LIFO (Last In, First Out)","Gewichteter Durchschnittspreis","Verrechnungspreise (Standardkosten)"],korrekt:0,loesung:"FIFO. Die zuerst eingetroffenen Artikel werden zuerst verbraucht. Bei Lebensmitteln, Medikamenten und anderen verderblichen G\xFCtern ist FIFO zwingend, weil Ware sonst verf\xE4llt."},{id:"b3-3-C2",typ:"multiplechoice",label:"C2 \xB7 Berechnung Mischpreis",text:"Bei welchem Verfahren werden bei jedem Einkauf die vorhandenen Best\xE4nde und der neue Einkauf addiert, um einen neuen Wert zu ermitteln?",antworten:["FIFO","LIFO","Gewichteter Durchschnittspreis","Verrechnungspreise"],korrekt:2,loesung:"Gewichteter Durchschnittspreis. Bei jedem Zugang wird ein neuer Durchschnitt berechnet. In der Schweizer Praxis am h\xE4ufigsten, weil ERP-Systeme das ohne Aufwand k\xF6nnen."},{id:"b3-3-C3",typ:"multiplechoice",label:"C3 \xB7 Inflation und Preisweitergabe",text:"Welches Verfahren wird vor allem in L\xE4ndern mit hoher Inflationsrate angewendet, weil Preissteigerungen so weitergegeben werden k\xF6nnen?",antworten:["FIFO","LIFO","Durchschnitt","Verrechnungspreise"],korrekt:1,loesung:"LIFO. Bei steigenden Preisen wird die zuletzt (teuerste) eingekaufte Ware zuerst verbraucht, was den Aufwand erh\xF6ht und den Gewinn senkt. In Hochinflations-L\xE4ndern hilft das, die Steuerlast zu dr\xFCcken."},{id:"b3-3-C4",typ:"multiplechoice",label:"C4 \xB7 Swiss GAAP FER",text:"Welches Verfahren ist heute weniger \xFCblich und in Swiss GAAP FER sowie IFRS verp\xF6nt oder verboten?",antworten:["FIFO","LIFO","Durchschnitt","Verrechnungspreise"],korrekt:1,loesung:"LIFO. Swiss GAAP FER und IFRS (IAS 2) lehnen LIFO ab, weil es bei steigenden Preisen den Vorratsbestand zu tief ausweist und das wahre Verm\xF6gensbild verzerrt. OR erlaubt LIFO formal noch, in der Praxis kaum mehr im Einsatz."},{id:"b3-3-C5",typ:"multiplechoice",label:"C5 \xB7 Konstante Preise",text:"Welches Verfahren bietet Vorteile f\xFCr Betriebsabrechnung und Kalkulation durch konstante Preise, ist aber bei grossen Preisschwankungen weniger geeignet?",antworten:["FIFO","LIFO","Durchschnitt","Verrechnungspreise (Standardkosten)"],korrekt:3,loesung:"Verrechnungspreise (Standardkosten). F\xFCr jeden Artikel wird ein fester Preis hinterlegt, meist j\xE4hrlich. Vorteil: stabile Grundlage f\xFCr Kalkulation. Nachteil: bei stark schwankenden Marktpreisen entstehen grosse Preisdifferenzen, die separat ausgewiesen werden m\xFCssen."},{id:"b3-3-C6",typ:"multiplechoice",label:"C6 \xB7 Inventur vs. Bewertung",text:"Welche Aussage zum Verh\xE4ltnis von Inventurmethode und Bewertungsmethode trifft zu?",antworten:["Die Inventurmethode bestimmt die Bewertung","Beide sind unabh\xE4ngig kombinierbar","FIFO funktioniert nur ohne laufende Inventur","Mit laufender Inventur ist nur Durchschnitt m\xF6glich"],korrekt:1,loesung:"Beide sind unabh\xE4ngig kombinierbar. Die Inventurmethode beantwortet die Frage \xABWie f\xFChre ich das Lager?\xBB (ohne oder mit laufender Inventur), die Bewertungsmethode beantwortet \xABWie bewerte ich die Ware?\xBB (FIFO/LIFO/Durchschnitt/Verrechnungspreise). In der Praxis ist die Kombination \xABMit laufender Inventur + FIFO\xBB am h\xE4ufigsten, aber technisch funktioniert jede Kombination."},{id:"b3-3-C7",typ:"interpretation",label:"C7 \xB7 Empfehlung f\xFCr Velowerk",text:"Welches Verfahren w\xFCrden Sie Velowerk empfehlen und warum? Ber\xFCcksichtigen Sie Eigenschaften der Ware (Velos, Modetrends, Komponenten), Praxistauglichkeit und Norm-Konformit\xE4t.",musterloesung:["Empfehlung: Gewichteter Durchschnittspreis oder FIFO. Beide sind nach OR, Swiss GAAP FER und IFRS zul\xE4ssig.","Argument FIFO: Velos sind nicht verderblich, aber Modetrends (Farben, Designs) und technische Komponenten altern. FIFO sichert, dass alte Modelle zuerst verkauft werden.","Argument Durchschnitt: Einfach in der Anwendung, jeder ERP-Standard kann es. Reduziert Aufwand und ist praktisch fehlerfrei.","Gegen LIFO: Verp\xF6nt unter Swiss GAAP FER, kaum noch im Einsatz. Verzerrt das Verm\xF6gensbild bei steigenden Preisen.","Gegen Verrechnungspreise: Erfordert ein ERP-System mit Standardkostenrechnung. F\xFCr ein KMU wie Velowerk \xFCbertrieben."]}],verfahrensTabelle:{title:"\xDCbersicht: Vier Verfahren der Lagerbewertung",subtitle:"Anwendung, Bewertung und Beurteilung im Direktvergleich",cols:["Verfahren","Anwendung","Bewertung Lagerbez\xFCge","Beurteilung"],rows:[{verfahren:"FIFO",verfahrenSub:"First In, First Out",farbe:"blue",anwendung:"Jeder Einkauf wird chronologisch nach Datum festgehalten.",bewertung:"Lagerbez\xFCge erfolgen in der Reihenfolge des Einkaufs. Zuerst eingelagerte Artikel werden zuerst ausgebucht.",beurteilung:"Entspricht dem tats\xE4chlichen Materialfluss. Bei verderblichen G\xFCtern zwingend."},{verfahren:"LIFO",verfahrenSub:"Last In, First Out",farbe:"rose",anwendung:"Jeder Einkauf wird chronologisch festgehalten.",bewertung:"Lagerbez\xFCge erfolgen in umgekehrter Reihenfolge. Zuletzt eingelagerte Artikel werden zuerst ausgeliefert.",beurteilung:"Heute weniger \xFCblich, in Swiss GAAP FER verp\xF6nt. Anwendung in L\xE4ndern mit hoher Inflation."},{verfahren:"Gewichteter Durchschnitt",verfahrenSub:"Mischpreis nach jedem Zugang",farbe:"green",anwendung:"Bei jedem Einkauf werden Bestand und Einkauf addiert. Daraus wird ein neuer Durchschnittswert ermittelt.",bewertung:"Lagerbez\xFCge erfolgen zum aktuellen Durchschnittspreis, der laufend errechnet wird.",beurteilung:"H\xE4ufig anzutreffen. Stellt an ERP-Systeme wenig Anforderungen."},{verfahren:"Verrechnungspreise",verfahrenSub:"Standardkosten",farbe:"amber",anwendung:"F\xFCr jeden Artikel ist ein Verrechnungspreis hinterlegt. Ein- und Auslagerungen erfolgen zu diesem Preis. Preisdifferenzen werden separat ausgewiesen.",bewertung:"Lagerbez\xFCge erfolgen immer zum hinterlegten Verrechnungspreis (in der Regel j\xE4hrlich festgelegt).",beurteilung:"Vorteilhaft f\xFCr Betriebsabrechnung und Kalkulation durch konstante Preise. Bei grossen Preisschwankungen ungeeignet."}]}},b3_aufgabe4={title:"Aufgabe 4: Konten im Dienstleistungsunternehmen",subtitle:"Steiner & Partner Rechtsanw\xE4lte AG \xB7 Buchungen und Konzept",tabLabel:"Aufgabe 4",context:"Dienstleistungsbetriebe haben kein Lager und keine physischen Produkte. Hauptkonten sind Dienstleistungsertrag, Personalaufwand (dominant) und Raumaufwand.",theorie:{title:"Theorie: Buchhaltung im Dienstleistungsunternehmen",blocks:[{type:"text",text:"Dienstleistungsunternehmen verkaufen keine physische Ware, sondern Leistungen. Sie machen in der Schweiz rund 75 bis 83 Prozent aller Unternehmen aus. Dazu geh\xF6ren Banken, Treuh\xE4nder, Anw\xE4lte, Berater, IT-Firmen, Coiffeure, \xC4rzte und viele mehr. Buchhalterisch unterscheiden sie sich grundlegend von Handelsbetrieben."},{type:"subtitle",text:"Hauptkonten"},{type:"list",items:["Ertrag: Dienstleistungsertrag (auch Honorarertrag oder Beratungsertrag)","Aufwand dominant: Personalaufwand (Mitarbeitende sind das Produktionsmittel)","Weitere Aufw\xE4nde: Raumaufwand, Verwaltung, Marketing, Abschreibungen","Aktiva: Bank, Forderungen L+L, eventuell NFDL","Passiva: Verbindlichkeiten L+L"]},{type:"subtitle",text:"Was es NICHT gibt"},{type:"list",items:["Kein Warenbestand (keine physische Ware)","Kein Warenaufwand, kein Warenertrag","Keine Lagerbewertung (FIFO, LIFO, Durchschnitt entf\xE4llt)","Keine Inventur im klassischen Sinne"]},{type:"subtitle",text:"Nicht fakturierte Dienstleistungen (NFDL)"},{type:"text",text:"Das wichtigste Spezialkonto im Dienstleistungsbetrieb. Wenn am Jahresende Leistungen erbracht, aber noch nicht in Rechnung gestellt wurden, m\xFCssen sie aktiviert werden \u2013 analog zum Warenbestand bei Handelsbetrieben. Das Gegenkonto heisst \xABBestands\xE4nderung NFDL\xBB und wird als Ertrag verbucht."},{type:"beispiel",text:"Ein Finanzplaner leistet im Dezember 5 Stunden Beratung \xE0 CHF 250, die Rechnung folgt erst im Januar. Per 31.12. wird der Wert von CHF 1'250 aktiviert: \xABNicht fakturierte Dienstleistungen / Bestands\xE4nderung NFDL 1'250\xBB. Bei der Fakturierung im Januar wird die NFDL-Position wieder aufgel\xF6st, und der Erl\xF6s l\xE4uft regul\xE4r \xFCber das Konto Dienstleistungsertrag."},{type:"vergleich",left:{title:"NFDL",text:"Bereits erbrachte, noch nicht verrechnete Leistung. Operative Wertsch\xF6pfung hat stattgefunden, Rechnung folgt. Erh\xF6ht den Periodenertrag."},right:{title:"Transitorische Aktive",text:"Klassische zeitliche Abgrenzung. Vorgang ist abgeschlossen (z.B. vorausbezahlte Versicherung), nur der Zeitpunkt wird korrigiert. Erfolgsneutral."}},{type:"merksatz",text:"NFDL und Warenbestand folgen demselben Prinzip: bereits geschaffene Werte werden in der Bilanz sichtbar gemacht. Im Handel ist es das physische Lager, im Dienstleistungsbetrieb das geistige Lager an offenen Leistungen."}]},sachverhalt:{title:"Sachverhalt: Steiner & Partner Rechtsanw\xE4lte AG",intro:"Die Anwaltskanzlei in Z\xFCrich besch\xE4ftigt 12 Mitarbeitende und erbringt Rechtsberatung f\xFCr Unternehmen und Privatpersonen. Es gibt kein Lager und keine physischen Produkte. Der gr\xF6sste Aufwandsblock ist Personal.",tabelle:{cols:["Konto-Typ","Typische Konten"],rows:[["Aktiv","Bank, Forderungen L+L"],["Passiv","Verbindlichkeiten L+L"],["Ertrag","Dienstleistungsertrag (Honorare)"],["Aufwand","Personalaufwand (dominant), Raumaufwand"]]}},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Typische Buchungen",farbe:"#15803D"},{id:"b3-4-A1",label:"A1 \xB7 Honorarrechnung an Klienten",text:"Wir stellen einem Klienten eine Honorarrechnung \xFCber CHF 15'000 (auf Rechnung).",loesungen:[[{sollKeys:["forderungen"],habenKeys:["dienstleistungsertrag"],betrag:15e3}]]},{id:"b3-4-A2",label:"A2 \xB7 Lohnzahlung Mitarbeitende",text:"Wir bezahlen die Monatsl\xF6hne der Mitarbeitenden \xFCber CHF 45'000 via Bank.",loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:45e3}]]},{id:"b3-4-A3",label:"A3 \xB7 Mietzahlung B\xFCro",text:"Wir bezahlen die B\xFCromiete CHF 5'000 via Bank.",loesungen:[[{sollKeys:["raumaufwand"],habenKeys:["bank"],betrag:5e3}]]},{typ:"abschnitt",label:"Teil B \xB7 Nicht fakturierte Dienstleistungen (NFDL)",farbe:"#0F766E",intro:"NFDL sind bereits erbrachte, aber noch nicht verrechnete Leistungen. Sie werden am Jahresende aktiviert (analog zum Warenbestand bei Handelsbetrieben). Bei der sp\xE4teren Fakturierung wird die Position wieder aufgel\xF6st."},{id:"b3-4-B1",label:"B1 \xB7 Aktivierung NFDL am Jahresende",text:"Per 31.12. sind 5 Stunden Beratung \xE0 CHF 250 geleistet, aber noch nicht in Rechnung gestellt (Wert: CHF 1'250). Die offene Leistung wird aktiviert.",loesungen:[[{sollKeys:["nfdl"],habenKeys:["bestandsaenderung_nfdl"],betrag:1250}]]},{id:"b3-4-B2",label:"B2 \xB7 Fakturierung im Folgejahr",text:"Im neuen Jahr wird die Beratung dem Klienten in Rechnung gestellt (CHF 1'250). Erl\xF6sbuchung.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["dienstleistungsertrag"],betrag:1250}]]},{id:"b3-4-B3",label:"B3 \xB7 Aufl\xF6sung NFDL",text:"Gleichzeitig zur Fakturierung wird die NFDL-Position aufgel\xF6st, weil die Leistung jetzt verrechnet ist.",loesungen:[[{sollKeys:["bestandsaenderung_nfdl"],habenKeys:["nfdl"],betrag:1250}]]},{id:"b3-4-B4",typ:"interpretation",label:"B4 \xB7 NFDL vs. Transitorische Aktive",text:"Wodurch unterscheiden sich Nicht fakturierte Dienstleistungen (NFDL) von transitorischen Aktiven? Beide sind Aktivkonten, die am Jahresende gebildet werden \u2013 aber sie haben unterschiedliche Anl\xE4sse.",musterloesung:["Transitorische Aktive: Klassische zeitliche Abgrenzung. Es geht um den Zeitpunkt der Erfassung (z.B. vorausbezahlte Versicherung, Marchzins). Der Vorgang ist abgeschlossen, nur der Zeitpunkt wird korrigiert.","NFDL: Operative Wertsch\xF6pfung. Es geht um eine bereits produzierte, aber noch nicht verrechnete Leistung (Work in Progress). Die Wertsch\xF6pfung hat stattgefunden, die Rechnung folgt.","Buchungstechnisch \xE4hnlich: beide werden am Jahresende aktiviert und im Folgejahr aufgel\xF6st.","Konzeptionell verschieden: Transitorische Aktive sind erfolgsneutral (Periodenverschiebung), NFDL erh\xF6hen den Periodenertrag (Bestands\xE4nderung als Ertragskonto).","Praxis: Treuh\xE4nder, Anw\xE4lte und Berater f\xFChren NFDL als Standard. \xDCbliche Abk\xFCrzungen sind NFDL oder Nicht fakt. DL."]},{typ:"abschnitt",label:"Teil C \xB7 Konzeptuelles Verst\xE4ndnis",farbe:"#A85930"},{id:"b3-4-C1",typ:"multiplechoice",label:"C1 \xB7 Welches Konto fehlt?",text:"Welches der folgenden Konten findet sich typischerweise NICHT in einem Dienstleistungsunternehmen?",antworten:["Warenbestand","Personalaufwand","Dienstleistungsertrag","Raumaufwand"],korrekt:0,loesung:"Warenbestand. Dienstleistungsbetriebe verkaufen keine physische Ware, sondern Leistungen. Daher gibt es kein Warenlager und auch kein Konto Warenbestand. Stattdessen dominiert der Personalaufwand und es gibt das Spezialkonto NFDL."},{id:"b3-4-C2",typ:"multiplechoice",label:"C2 \xB7 Dominanter Aufwand",text:"Welcher Aufwand dominiert in einem typischen Dienstleistungsunternehmen?",antworten:["Materialaufwand","Personalaufwand","Warenaufwand","Abschreibungen"],korrekt:1,loesung:"Personalaufwand. In Dienstleistungsbetrieben wie Anwaltskanzleien, Beratungen oder IT-Dienstleistern sind die Mitarbeitenden das Hauptproduktionsmittel. Der Personalaufwand macht oft 60 bis 80 Prozent des Gesamtaufwands aus."},{id:"b3-4-C3",typ:"interpretation",label:"C3 \xB7 Vergleich mit Handelsbetrieb",text:"Was sind die wichtigsten buchhalterischen Besonderheiten eines Dienstleistungsbetriebes im Vergleich zu einem Handelsbetrieb?",musterloesung:["Kein Warenlager: Es gibt keine physischen Produkte zu lagern und somit kein Konto Warenbestand und kein Konto Warenaufwand.","Hauptertrag heisst Dienstleistungsertrag (statt Warenertrag), je nach Branche auch Honorarertrag oder Beratungsertrag.","Personalaufwand dominiert die Erfolgsrechnung (Mitarbeitende sind das Produktionsmittel), w\xE4hrend im Handel der Warenaufwand der gr\xF6sste Block ist.","Keine Lagerbewertungs-Frage: Die ganze Diskussion um FIFO, LIFO und Durchschnitt entf\xE4llt, weil es keine Vorr\xE4te gibt.","Stattdessen NFDL: Bereits erbrachte, noch nicht verrechnete Leistungen werden am Jahresende aktiviert (Pendant zum Warenbestand).","Bilanz: Das Umlaufverm\xF6gen besteht haupts\xE4chlich aus Bank, Forderungen und NFDL, kaum aus Vorr\xE4ten."]}]},b3_aufgabe5={title:"Aufgabe 5: Konten im Produktionsunternehmen",subtitle:"Maschinenbau M\xFCller AG \xB7 Drei Lagerstufen und Aktivierung",tabLabel:"Aufgabe 5",context:"Produktionsbetriebe f\xFChren drei Lagerstufen: Rohstoffe, Halbfabrikate und Fertigfabrikate. Eigenleistungen werden aktiviert (im Bestandskonto erfasst statt direkt als Aufwand).",theorie:{title:"Theorie: Buchhaltung im Produktionsunternehmen",blocks:[{type:"text",text:"Produktionsbetriebe stellen aus Rohstoffen Fertigprodukte her. Dazu geh\xF6ren Maschinenbau, Lebensmittelindustrie, Pharma, M\xF6belhersteller und viele andere. Buchhalterisch sind sie komplexer als Handelsbetriebe, weil der Wertfluss durch mehrere Stufen geht \u2013 jede mit einem eigenen Bestandskonto."},{type:"subtitle",text:"Drei Lagerstufen"},{type:"list",items:["Rohstoffe (Lagerstufe 1): eingekaufte Materialien wie Stahl, Schrauben, Elektronik","Halbfabrikate (Lagerstufe 2): in Produktion befindliche oder teilfertige Produkte","Fertigfabrikate (Lagerstufe 3): verkaufsbereite, fertige Produkte"]},{type:"subtitle",text:"Hauptkonten"},{type:"list",items:["Aktiva: Rohstoffe, Halbfabrikate, Fertigfabrikate, Forderungen L+L, Bank","Ertrag: Produktionsertrag (auch Fabrikationsertrag genannt)","Aufwand: Materialaufwand (Rohstoffverbrauch), Personalaufwand (Produktionsl\xF6hne), Abschreibungen auf Maschinen"]},{type:"subtitle",text:"Wertfluss durch die Produktion"},{type:"text",text:"Material wird gekauft (geht auf Rohstoffe), in die Produktion eingebracht (wird zu Halbfabrikat) und nach Fertigstellung als Fertigfabrikat aktiviert. Erst beim Verkauf wird der Wert als Aufwand realisiert. Dieser mehrstufige Prozess macht die Bewertung von Halbfabrikaten besonders anspruchsvoll, weil sie Material- und Lohnanteile enthalten."},{type:"beispiel",text:"Maschinenbau M\xFCller AG kauft Stahl f\xFCr CHF 50'000 (Rohstoffe / Verbindlichkeiten). Daraus produziert sie eine Maschine, die nach Fertigstellung als Fertigfabrikat ins Lager geht (Fertigfabrikate / Halbfabrikate CHF 30'000). Beim Verkauf wird der Erl\xF6s gebucht (Forderungen / Produktionsertrag CHF 80'000)."},{type:"subtitle",text:"Aktivierung von Eigenleistungen"},{type:"text",text:"Eine Besonderheit von Produktionsbetrieben: Lohnaufwand f\xFCr Produktionsmitarbeitende und Materialverbrauch werden anteilig in die Bestandskonten umgebucht, statt direkt als Aufwand erfasst. Diese Werte erscheinen erst beim Verkauf in der Erfolgsrechnung. Das nennt man Aktivierung von Eigenleistungen."},{type:"merksatz",text:"Im Handelsbetrieb gibt es ein Lager (Warenbestand), im Produktionsbetrieb drei (Rohstoffe, Halbfabrikate, Fertigfabrikate). Diese Mehrstufigkeit bildet den Produktionsprozess buchhalterisch ab und erlaubt eine differenzierte Bewertung der Werte in jeder Verarbeitungsstufe."}]},sachverhalt:{title:"Sachverhalt: Maschinenbau M\xFCller AG",intro:"Die Maschinenbau-AG in Winterthur produziert Spezialmaschinen f\xFCr die Lebensmittelindustrie und besch\xE4ftigt 35 Mitarbeitende. Drei Lagerstufen werden gef\xFChrt. Materialaufwand und Personalaufwand sind die Hauptaufwandsbl\xF6cke.",tabelle:{cols:["Lagerstufe / Konto","Inhalt"],rows:[["Rohstoffe (Lagerstufe 1)","Eingekaufte Materialien wie Stahl, Schrauben, Elektronik"],["Halbfabrikate (Lagerstufe 2)","In Produktion befindliche oder teilfertige Maschinen"],["Fertigfabrikate (Lagerstufe 3)","Verkaufsbereite Maschinen"],["Hauptaufwand","Materialaufwand, Personalaufwand"],["Hauptertrag","Produktionsertrag"]]}},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Typische Buchungen",farbe:"#7E22CE"},{id:"b3-5-A1",label:"A1 \xB7 Rohstoffeinkauf",text:"Wir kaufen Stahl und Komponenten als Rohstoffe f\xFCr CHF 50'000 auf Rechnung.",loesungen:[[{sollKeys:["rohstoffe"],habenKeys:["verbindlichkeiten"],betrag:5e4}]]},{id:"b3-5-A2",label:"A2 \xB7 Aktivierung Fertigfabrikat",text:"Eine Maschine wird fertiggestellt und vom Halbfabrikat-Lager ins Fertigfabrikat-Lager umgebucht. Wert: CHF 30'000.",loesungen:[[{sollKeys:["fertigfabrikate"],habenKeys:["halbfabrikate"],betrag:3e4}]]},{id:"b3-5-A3",label:"A3 \xB7 Verkauf Fertigprodukt",text:"Wir verkaufen eine fertige Maschine f\xFCr CHF 80'000 auf Rechnung an einen Kunden.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["produktionsertrag","warenertrag"],betrag:8e4}]]},{typ:"abschnitt",label:"Teil B \xB7 Konzeptuelles Verst\xE4ndnis",farbe:"#0F766E"},{id:"b3-5-B1",typ:"multiplechoice",label:"B1 \xB7 Lagerstufen",text:"Wie viele Lagerstufen f\xFChrt ein typischer Produktionsbetrieb?",antworten:["1 Lagerstufe (nur Fertigprodukte)","2 Lagerstufen (Rohstoffe und Fertigprodukte)","3 Lagerstufen (Rohstoffe, Halbfabrikate, Fertigfabrikate)","4 Lagerstufen"],korrekt:2,loesung:"Drei Lagerstufen: Rohstoffe (Eingangslager), Halbfabrikate (Produktion) und Fertigfabrikate (Ausgangslager). Diese Differenzierung erlaubt es, den Wertfluss durch die Produktion abzubilden."},{id:"b3-5-B2",typ:"multiplechoice",label:"B2 \xB7 Konto im Produktionsbetrieb",text:"Welches Konto findet sich im Produktionsbetrieb, aber NICHT im Handelsbetrieb?",antworten:["Forderungen L+L","Verbindlichkeiten L+L","Halbfabrikate","Bank"],korrekt:2,loesung:"Halbfabrikate. W\xE4hrend Handelsbetriebe nur fertige Ware kaufen und weiterverkaufen, durchl\xE4uft die Ware in einem Produktionsbetrieb mehrere Stufen. Halbfabrikate (teilfertige Produkte) sind das Bindeglied zwischen Rohstoffen und Fertigfabrikaten und gibt es nur in Produktionsbetrieben."},{id:"b3-5-B3",typ:"interpretation",label:"B3 \xB7 Vergleich mit Handelsbetrieb",text:"Wodurch unterscheidet sich die Kontenf\xFChrung eines Produktionsbetriebes von einem Handelsbetrieb? Welche zus\xE4tzlichen Konten gibt es und warum?",musterloesung:["Drei Lagerstufen statt einer: Rohstoffe, Halbfabrikate, Fertigfabrikate. Das bildet den Produktionsprozess von der Materialbeschaffung bis zum verkaufsbereiten Produkt ab.","Eigenleistungen werden aktiviert: Lohn- und Materialaufwand werden anteilig in die Bestandskonten umgebucht (Halbfabrikate / Personalaufwand). Diese Werte erscheinen in der Bilanz, nicht als Aufwand in der Erfolgsrechnung.","Materialaufwand statt Warenaufwand: Material wird verbraucht, nicht weiterverkauft. Daher anderer Begriff.","Produktionsertrag (oder Fabrikationsertrag) statt Warenertrag: zeigt, dass die Wertsch\xF6pfung im Unternehmen selbst stattfindet.","Komplexere Bewertung: Halbfabrikate m\xFCssen mit Material- und Lohnanteil bewertet werden, was eine ausgebaute Kostenrechnung voraussetzt."]}]},b3_aufgabe6={title:"Aufgabe 6: Drei Velowerke \xB7 Praxis-Synthese",subtitle:"Branchenvergleich anhand identischer Gesch\xE4ftsvorf\xE4lle (Q2)",tabLabel:"Aufgabe 6",context:"Synthese-Aufgabe zu Block 3: Velowerk in drei Branchen-Varianten mit identischen Basiszahlen f\xFCr Q2. Du buchst f\xFCr alle drei Branchen die wichtigsten Gesch\xE4ftsvorf\xE4lle und berechnest den EBIT. Am Ende vergleichst du die Resultate.",theorie:{title:"Theorie: Was diese Aufgabe verbindet",blocks:[{type:"text",text:"Diese Aufgabe vereint die Themen von Block 3: Methode mit laufender Inventur, branchenspezifische Konten (Warenhandel, Dienstleistung, Produktion) und periodengerechte Erfassung von Ertr\xE4gen (NFDL, Halbfabrikate). Sie ist gleichzeitig die Vorbereitung auf Block 9 (mehrstufige Erfolgsrechnung)."},{type:"subtitle",text:"Gleicher Sachverhalt, drei Sichten"},{type:"text",text:"Velowerk hat im Q2 folgende Basiszahlen: Lager-Anfangsbestand 25'000, Einkauf 40'000, Umsatz 80'000, Endbestand 22'000, Personalaufwand 18'000. Diese Zahlen sind f\xFCr alle drei Branchen identisch. Was sich unterscheidet, ist die branchenspezifische Zusatzinformation und die verwendeten Konten."},{type:"vergleich",left:{title:"Berechnung Materialverbrauch",text:"Anfangsbestand 25'000 + Einkauf 40'000 \u2212 Endbestand 22'000 = Verbrauch 43'000 CHF. Dieser Betrag wird je nach Branche unterschiedlich benannt (Warenaufwand, Materialaufwand)."},right:{title:"EBIT-Berechnung",text:"EBIT = Ertr\xE4ge total \u2212 Material/Warenaufwand \u2212 Personalaufwand \u2212 weitere Aufw\xE4nde. Der branchen-spezifische Zusatz (NFDL, Halbfabrikate, Mietzins) verschiebt den EBIT deutlich."}},{type:"merksatz",text:"Bei identischer Gesch\xE4ftst\xE4tigkeit sieht der EBIT je nach Branche sehr unterschiedlich aus. Das ist kein Zufall: die Buchhaltungsregeln pro Branche machen die Wirtschaftslage unterschiedlich sichtbar."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Velowerk Handel",farbe:"#B91C1C",intro:"Velowerk Handel verkauft fertige Velos. Zus\xE4tzliche Information: Mietzins Verkaufslokal CHF 10'000 (per Bank bezahlt). Methode mit laufender Inventur."},{id:"b3-6-A1",label:"A1 \xB7 Wareneinkauf",text:"Wareneinkauf im Q2 auf Rechnung CHF 40'000.",loesungen:[[{sollKeys:["warenbestand"],habenKeys:["verbindlichkeiten"],betrag:4e4}]]},{id:"b3-6-A2",label:"A2 \xB7 Warenverkauf \xB7 Erl\xF6s",text:"Warenverkauf im Q2 auf Rechnung CHF 80'000.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag"],betrag:8e4}]]},{id:"b3-6-A3",label:"A3 \xB7 Wareneinstand",text:"Einstand der verkauften Ware (berechne: 25'000 + 40'000 \u2212 22'000).",loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["warenbestand"],betrag:43e3}]]},{id:"b3-6-A4",label:"A4 \xB7 Personalaufwand",text:"Personalaufwand CHF 18'000 (per Bank).",loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:18e3}]]},{id:"b3-6-A5",label:"A5 \xB7 Mietzins Verkaufslokal",text:"Mietzins f\xFCr Verkaufslokal CHF 10'000 (per Bank).",loesungen:[[{sollKeys:["raumaufwand"],habenKeys:["bank"],betrag:1e4}]]},{id:"b3-6-A6",typ:"kennzahl",label:"A6 \xB7 EBIT Handel berechnen",text:"Wie hoch ist der EBIT von Velowerk Handel im Q2 (CHF)? Formel: Warenertrag \u2212 Warenaufwand \u2212 Personalaufwand \u2212 Raumaufwand.",erwartet:9e3,einheit:"CHF",toleranz:0,loesung:"EBIT Handel = 80'000 \u2212 43'000 \u2212 18'000 \u2212 10'000 = 9'000 CHF. Der Mietzins dr\xFCckt den EBIT deutlich, weil bei reinem Handel die Marge zwischen Einkauf und Verkauf die einzige Wertsch\xF6pfungsquelle ist."},{typ:"abschnitt",label:"Teil B \xB7 Velowerk Werkstatt (Dienstleistung)",farbe:"#1D4ED8",intro:"Velowerk Werkstatt repariert Velos. Zus\xE4tzliche Information: Per 30.6. sind CHF 12'000 Reparaturen begonnen, aber noch nicht fakturiert (NFDL). Methode mit laufender Inventur."},{id:"b3-6-B1",label:"B1 \xB7 Materialeinkauf",text:"Materialeinkauf (Ersatzteile) im Q2 auf Rechnung CHF 40'000.",loesungen:[[{sollKeys:["warenbestand"],habenKeys:["verbindlichkeiten"],betrag:4e4}]]},{id:"b3-6-B2",label:"B2 \xB7 Dienstleistungsertrag",text:"Fakturierte Reparaturen im Q2 auf Rechnung CHF 80'000.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["dienstleistungsertrag"],betrag:8e4}]]},{id:"b3-6-B3",label:"B3 \xB7 Materialverbrauch",text:"Materialverbrauch in den Reparaturen (berechne: 25'000 + 40'000 \u2212 22'000).",loesungen:[[{sollKeys:["warenaufwand","materialaufwand"],habenKeys:["warenbestand"],betrag:43e3}]]},{id:"b3-6-B4",label:"B4 \xB7 Personalaufwand",text:"Personalaufwand (Mechaniker-L\xF6hne) CHF 18'000 (per Bank).",loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:18e3}]]},{id:"b3-6-B5",label:"B5 \xB7 NFDL erfassen",text:"Erfassung der nicht fakturierten Dienstleistungen per 30.6.: CHF 12'000.",loesungen:[[{sollKeys:["nfdl"],habenKeys:["bestandsaenderung_nfdl"],betrag:12e3}]]},{id:"b3-6-B6",typ:"kennzahl",label:"B6 \xB7 EBIT Werkstatt berechnen",text:"Wie hoch ist der EBIT von Velowerk Werkstatt im Q2 (CHF)? Formel: (Dienstleistungsertrag + Bestands\xE4nderung NFDL) \u2212 Materialaufwand \u2212 Personalaufwand.",erwartet:31e3,einheit:"CHF",toleranz:0,loesung:"EBIT Werkstatt = (80'000 + 12'000) \u2212 43'000 \u2212 18'000 = 31'000 CHF. Die NFDL erh\xF6hen den ausgewiesenen Ertrag um 12'000, weil die Leistung bereits erbracht aber noch nicht fakturiert ist (periodengerechte Abgrenzung)."},{typ:"abschnitt",label:"Teil C \xB7 Velowerk Produktion",farbe:"#15803D",intro:"Velowerk Produktion stellt Velos selbst her. Zus\xE4tzliche Information: Per 30.6. sind im Werk noch Velos in der Fertigung (Halbfabrikate) im Wert von CHF 7'000. Methode mit laufender Inventur."},{id:"b3-6-C1",label:"C1 \xB7 Rohstoffeinkauf",text:"Rohstoffeinkauf im Q2 auf Rechnung CHF 40'000.",loesungen:[[{sollKeys:["rohstoffe","warenbestand"],habenKeys:["verbindlichkeiten"],betrag:4e4}]]},{id:"b3-6-C2",label:"C2 \xB7 Verkauf fertige Velos",text:"Verkauf fertiger Velos im Q2 auf Rechnung CHF 80'000.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag","produktionsertrag"],betrag:8e4}]]},{id:"b3-6-C3",label:"C3 \xB7 Rohstoffverbrauch",text:"Rohstoffverbrauch in der Produktion (berechne: 25'000 + 40'000 \u2212 22'000).",loesungen:[[{sollKeys:["materialaufwand","warenaufwand"],habenKeys:["rohstoffe","warenbestand"],betrag:43e3}]]},{id:"b3-6-C4",label:"C4 \xB7 Personalaufwand",text:"Personalaufwand (Produktionsmitarbeiter) CHF 18'000 (per Bank).",loesungen:[[{sollKeys:["personalaufwand"],habenKeys:["bank"],betrag:18e3}]]},{id:"b3-6-C5",label:"C5 \xB7 Halbfabrikate erfassen",text:"Erfassung der Halbfabrikate per 30.6.: Bestandszunahme CHF 7'000.",loesungen:[[{sollKeys:["halbfabrikate"],habenKeys:["bestandsaenderung_halbfabrikate"],betrag:7e3}]]},{id:"b3-6-C6",typ:"kennzahl",label:"C6 \xB7 EBIT Produktion berechnen",text:"Wie hoch ist der EBIT von Velowerk Produktion im Q2 (CHF)? Formel: (Produktverkauf + Bestands\xE4nderung Halbfabrikate) \u2212 Materialaufwand \u2212 Personalaufwand.",erwartet:26e3,einheit:"CHF",toleranz:0,loesung:"EBIT Produktion = (80'000 + 7'000) \u2212 43'000 \u2212 18'000 = 26'000 CHF. Die Bestandszunahme Halbfabrikate erh\xF6ht den Ertrag um 7'000, weil die Wertsch\xF6pfung im Unternehmen entstanden ist (Material und L\xF6hne wurden in Halbfertigprodukte umgewandelt)."},{typ:"abschnitt",label:"Teil D \xB7 Synthese und Reflexion",farbe:"#A85930"},{id:"b3-6-D1",typ:"interpretation",label:"D1 \xB7 Branchen-Synthese",text:"Du hast jetzt drei verschiedene EBITs berechnet: Handel 9'000, Werkstatt 31'000, Produktion 26'000. Erkl\xE4re in eigenen Worten: Warum unterscheiden sich die EBITs so stark, obwohl die Basiszahlen identisch sind? Was bedeutet das f\xFCr den Praxis-Treuh\xE4nder?",musterloesung:["Identische Basiszahlen: Anfangsbestand 25, Einkauf 40, Umsatz 80, Endbestand 22, Personal 18. Der Materialverbrauch ist \xFCberall 43.","Beim Handel kommt der Mietzins von 10 hinzu (Raumaufwand). EBIT = 80 \u2212 43 \u2212 18 \u2212 10 = 9.","Bei der Werkstatt kommen die nicht fakturierten Dienstleistungen von 12 als zus\xE4tzlicher Ertrag dazu (NFDL). EBIT = 92 \u2212 61 = 31.","Bei der Produktion kommt die Bestandszunahme Halbfabrikate von 7 als zus\xE4tzlicher Ertrag dazu. EBIT = 87 \u2212 61 = 26.","Bedeutung: Bei identischer wirtschaftlicher Leistung sieht der EBIT je nach Branche v\xF6llig anders aus. Die Buchhaltung \xABmisst\xBB die Wirtschaftslage unterschiedlich, das ist nicht falsch sondern Spiegelbild der Branche.","Praxis-Folgen: Ein Treuh\xE4nder muss die Branche kennen, um die Bilanz und ER richtig zu lesen. Bei Vergleich zwischen Unternehmen verschiedener Branchen sind absolute EBITs wenig aussagekr\xE4ftig, sinnvoller sind branchenrelative Kennzahlen wie EBIT-Marge, Materialintensit\xE4t, Personalintensit\xE4t."]},{id:"b3-6-D2",typ:"multiplechoice",label:"D2 \xB7 Branchen-Erkennung",text:"Eine Bilanz zeigt die Positionen \xABRohstoffe\xBB, \xABHalbfabrikate\xBB und \xABFertigfabrikate\xBB. Um welche Branche handelt es sich am wahrscheinlichsten?",antworten:["Handel","Dienstleistung","Produktion","Bank"],korrekt:2,loesung:"Produktion. Die drei Wertsch\xF6pfungsstufen Rohstoffe, Halbfabrikate und Fertigfabrikate sind das eindeutige Erkennungsmerkmal eines Produktionsbetriebs. Im Handel g\xE4be es nur Warenbestand (fertige Produkte), in der Dienstleistung Materialbestand und ggf. NFDL."},{id:"b3-6-D3",typ:"multiplechoice",label:"D3 \xB7 Konto-Zuordnung",text:"Auf welchem Konto buchen wir eine erbrachte Reparaturarbeit, die noch nicht fakturiert ist?",antworten:["Forderungen L+L (Aktivseite) und Dienstleistungsertrag (Erfolgsrechnung)","Nicht fakturierte Dienstleistungen (Aktivseite) und Bestands\xE4nderung NFDL (Erfolgsrechnung)","Halbfabrikate (Aktivseite) und Bestands\xE4nderung Halbfabrikate (Erfolgsrechnung)","Erst dann buchen, wenn die Rechnung gestellt ist"],korrekt:1,loesung:"Nicht fakturierte Dienstleistungen (Aktivseite) und Bestands\xE4nderung NFDL (Erfolgsrechnung). Die Forderung entsteht erst mit Rechnungsstellung. Bis dahin wird der Wert der erbrachten Leistung \xFCber das NFDL-Konto erfasst (periodengerechte Abgrenzung)."}]},b4_aufgabe1={title:"Aufgabe 1: MWST-Grundlagen",subtitle:"Steuers\xE4tze, Steuerpflicht, Abrechnungsmethoden",tabLabel:"Aufgabe 1",context:"Die Mehrwertsteuer ist eine indirekte Verbrauchssteuer auf Bundesebene. Sie wird vom Unternehmen erhoben, aber vom Endkonsumenten getragen. Geregelt im Mehrwertsteuergesetz (MWSTG), Verwaltung durch die Eidgen\xF6ssische Steuerverwaltung (ESTV).",theorie:{title:"Theorie: MWST-Grundlagen",blocks:[{type:"text",text:"Die Mehrwertsteuer ist eine indirekte Steuer auf den Endkonsum. Unternehmen sind nur \xABSteuerinkasso-Stellen\xBB f\xFCr den Bund: sie kassieren MWST beim Verkauf (Umsatzsteuer) und zahlen MWST beim Einkauf (Vorsteuer). Die Differenz fliesst an die Eidgen\xF6ssische Steuerverwaltung (ESTV). F\xFCr das Unternehmen ist die MWST kein Aufwand und kein Ertrag, sondern ein durchlaufender Posten."},{type:"subtitle",text:"Aktuelle Steuers\xE4tze (seit 1.1.2024)"},{type:"list",items:["Normalsatz 8.1%: gilt f\xFCr die meisten Lieferungen und Dienstleistungen (Velo, Auto, Kleidung, Beratung, Reparatur)","Reduzierter Satz 2.6%: gilt f\xFCr G\xFCter des t\xE4glichen Bedarfs (Lebensmittel, Medikamente, B\xFCcher, Zeitungen, Wasser)","Sondersatz 3.8%: gilt nur f\xFCr Beherbergungsleistungen (Hotel\xFCbernachtungen)"]},{type:"subtitle",text:"Steuerpflicht"},{type:"text",text:"Steuerpflichtig wird ein Unternehmen, wenn der weltweite Umsatz pro Jahr CHF 100'000 erreicht (Sportvereine und gemeinn\xFCtzige Institutionen: CHF 250'000). Unter dieser Grenze ist die Anmeldung freiwillig (kann sich lohnen, wenn viel Vorsteuer anf\xE4llt). Anmeldung erfolgt online bei der ESTV."},{type:"subtitle",text:"Zwei Abrechnungsmethoden"},{type:"vergleich",left:{title:"Effektive Methode",text:"Standardmethode. Vorsteuer und Umsatzsteuer werden detailliert verbucht und je quartalsweise an die ESTV abgerechnet. Hoher administrativer Aufwand, aber pr\xE4zise und f\xFCr alle Unternehmen m\xF6glich."},right:{title:"Saldosteuermethode",text:"Vereinfacht. Statt Vorsteuer und Umsatzsteuer separat: ein branchen-spezifischer Saldosteuersatz auf den Bruttoumsatz. Voraussetzung: Umsatz unter CHF 5.024 Mio. und Steuerschuld unter CHF 108'000. Halbj\xE4hrliche Abrechnung. Wechsel zur\xFCck nach 3 Jahren."}},{type:"beispiel",text:"Velowerk verkauft ein Velo f\xFCr brutto CHF 1'080 (inkl. 8.1% MWST). Netto sind das CHF 999.07 (Ertrag) und CHF 80.93 MWST (Schuld an ESTV). Bei der Saldosteuermethode mit z.B. 2.1% (Velohandel) w\xFCrde nur 2.1% von brutto CHF 1'080 = CHF 22.68 an die ESTV abgeliefert \u2013 deutlich weniger administrativer Aufwand."},{type:"merksatz",text:"MWST ist f\xFCr das Unternehmen ein durchlaufender Posten: kassiert beim Verkauf (Schuld an ESTV), bezahlt beim Einkauf (Forderung an ESTV), Saldo wird quartalsweise (oder halbj\xE4hrlich) abgerechnet. Nur der Endkonsument tr\xE4gt die Steuer."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Verst\xE4ndnisfragen zu MWST-Grundlagen",farbe:"#1B6B63"},{id:"b4-1-A1",typ:"multiplechoice",label:"A1 \xB7 Welcher Steuersatz?",text:"Velowerk verkauft ein neues E-Bike. Welcher MWST-Satz gilt?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:0,loesung:"Normalsatz 8.1%. Velos und E-Bikes sind keine G\xFCter des t\xE4glichen Bedarfs und keine Beherbergungsleistungen \u2013 damit gilt der Normalsatz. Lebensmittel (2.6%) und Hotels (3.8%) sind die einzigen Ausnahmen vom Normalsatz."},{id:"b4-1-A2",typ:"multiplechoice",label:"A2 \xB7 Welcher Steuersatz?",text:"Ein Restaurant verkauft ein Take-away-Sandwich. Welcher MWST-Satz?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:1,loesung:"Reduzierter Satz 2.6%. Lebensmittel zum Mitnehmen gelten als G\xFCter des t\xE4glichen Bedarfs. Achtung: Wenn das gleiche Sandwich im Restaurant konsumiert wird (Konsumation vor Ort), gilt der Normalsatz 8.1% \u2013 das ist eine klassische Stolperfalle in der Gastronomie."},{id:"b4-1-A3",typ:"multiplechoice",label:"A3 \xB7 Welcher Steuersatz?",text:"Ein Hotel verkauft eine \xDCbernachtung f\xFCr CHF 200. Welcher MWST-Satz?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:2,loesung:"Sondersatz 3.8%. Beherbergungsleistungen haben einen eigenen, reduzierten Satz \u2013 das soll den Schweizer Tourismus gegen\xFCber dem Ausland wettbewerbsf\xE4hig halten. Fr\xFChst\xFCck ist meist eingerechnet (ebenfalls 3.8%), Restaurantleistungen ausserhalb des Pakets aber zum Normalsatz."},{id:"b4-1-A4",typ:"multiplechoice",label:"A4 \xB7 Steuerpflicht-Grenze",text:"Ab welchem Jahresumsatz wird ein Unternehmen in der Schweiz MWST-pflichtig (allgemein)?",antworten:["CHF 50'000","CHF 100'000","CHF 250'000","CHF 500'000"],korrekt:1,loesung:"CHF 100'000 Jahresumsatz. F\xFCr Sportvereine und gemeinn\xFCtzige Institutionen liegt die Grenze bei CHF 250'000. Unter der Grenze ist die Anmeldung freiwillig \u2013 kann sich aber lohnen, wenn viel Vorsteuer anf\xE4llt (z.B. bei Investitionen oder Gesch\xE4ft mit MWST-pflichtigen B2B-Kunden)."},{id:"b4-1-A5",typ:"multiplechoice",label:"A5 \xB7 Welche Methode wann?",text:"Welches Kriterium f\xFChrt KMU oft zur Saldosteuermethode?",antworten:["Mehr Vorsteuer als Umsatzsteuer","Weniger administrativer Aufwand","Pflicht bei Umsatz \xFCber CHF 5 Mio.","H\xF6here Steuerschuld"],korrekt:1,loesung:"Weniger administrativer Aufwand. Die Saldosteuermethode spart Buchhaltungsarbeit (keine Vorsteuer separat zu erfassen) und reduziert die Abrechnungsfrequenz (halbj\xE4hrlich statt quartalsweise). Sie ist allerdings nur f\xFCr KMU unter CHF 5.024 Mio. Umsatz zul\xE4ssig."},{typ:"abschnitt",label:"Teil B \xB7 Reflexion",farbe:"#A85930"},{id:"b4-1-B1",typ:"interpretation",label:"B1 \xB7 Warum drei S\xE4tze?",text:"Warum gibt es in der Schweiz drei verschiedene MWST-S\xE4tze und nicht nur einen? Erkl\xE4re die politische und wirtschaftliche Logik.",musterloesung:["Sozialpolitik: Der reduzierte Satz 2.6% auf Lebensmittel und Medikamente entlastet einkommensschwache Haushalte. Indirekte Steuern sind regressiv \u2013 wer weniger verdient, gibt einen h\xF6heren Anteil des Einkommens f\xFCr Konsum aus.","Bildung und Information: B\xFCcher, Zeitungen und Zeitschriften haben den reduzierten Satz, um Bildung zu f\xF6rdern.","Tourismus-F\xF6rderung: Der Sondersatz 3.8% f\xFCr Beherbergungsleistungen sch\xFCtzt den Schweizer Tourismus gegen\xFCber dem Ausland \u2013 Hotels in Italien, \xD6sterreich oder Frankreich profitieren von tieferen S\xE4tzen, die Schweiz musste reagieren.","Wirtschaftliche Wirkung: Die Differenzierung macht das System komplexer, aber sozialer und wettbewerbsf\xE4higer. Andere L\xE4nder (D\xE4nemark, Singapur) haben nur einen Satz \u2013 einfacher, aber weniger sozial gerecht.","Politische Kompromissl\xF6sung: Die drei S\xE4tze sind das Resultat jahrzehntelanger Verhandlungen zwischen verschiedenen Interessengruppen. Eine Vereinfachung w\xE4re theoretisch m\xF6glich, politisch aber kaum durchsetzbar."]},{id:"b4-1-B2",typ:"interpretation",label:"B2 \xB7 Vorteil freiwillige Anmeldung",text:"Ein KMU hat CHF 60'000 Umsatz pro Jahr (unter der Pflichtgrenze). Wann kann eine freiwillige Anmeldung trotzdem Sinn machen?",musterloesung:["Hohe Investitionen geplant: Wer eine Maschine f\xFCr CHF 100'000 brutto kauft, hat CHF 8'100 Vorsteuer \u2013 ohne Anmeldung ist dieses Geld definitiv weg.","B2B-Gesch\xE4ft: Unternehmenskunden ziehen ihre Vorsteuer ab und st\xF6ren sich nicht an MWST auf Rechnungen. Ohne Anmeldung wirkt man als Gesch\xE4ftspartner kleiner und unprofessioneller.","Wachstum erwartet: Wer 80'000 Umsatz hat und auf 150'000 w\xE4chst, wird sowieso pflichtig. Fr\xFChe Anmeldung vermeidet sp\xE4teren Aufwand.","Vorsteuerintensive Branche: Bei Bauunternehmen, Handwerk oder Handel mit viel Wareneinkauf summiert sich die Vorsteuer schnell.","Achtung Gegenargument: B2C-Gesch\xE4ft mit Privatpersonen leidet unter freiwilliger Anmeldung \u2013 die Kunden zahlen 8.1% mehr und der Wettbewerb mit nicht-MWST-pflichtigen Konkurrenten wird schwieriger.","Anmeldung bindet f\xFCr mindestens 1 Jahr (in der Praxis oft l\xE4nger). Entscheidung also nicht leichtfertig treffen."]},{typ:"abschnitt",label:"Teil C · Zusatzübungen Steuersätze",farbe:"#0F766E"},{id:"b4-1-Z1",typ:"multiplechoice",label:"Z1 · Bücher und Zeitungen",text:"Eine Buchhandlung verkauft ein Sachbuch. Welcher MWST-Satz gilt?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:1,loesung:"Reduzierter Satz 2.6%. Bücher, Zeitungen und Zeitschriften haben den reduzierten Satz, um Bildung und Information zu fördern."},{id:"b4-1-Z2",typ:"multiplechoice",label:"Z2 · Medikamente",text:"Eine Apotheke verkauft ein rezeptpflichtiges Medikament. Welcher Satz?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:1,loesung:"Reduzierter Satz 2.6%. Medikamente gehören zu den Gütern des täglichen Bedarfs und unterliegen dem reduzierten Satz."},{id:"b4-1-Z3",typ:"multiplechoice",label:"Z3 · Coiffeur",text:"Ein Coiffeursalon stellt einen Haarschnitt in Rechnung. Welcher Satz?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:0,loesung:"Normalsatz 8.1%. Coiffeurleistungen sind normale Dienstleistungen, keine Güter des täglichen Bedarfs und keine Beherbergung."},{id:"b4-1-Z4",typ:"multiplechoice",label:"Z4 · Restaurant vor Ort",text:"Ein Gast konsumiert ein Sandwich im Restaurant (Konsumation vor Ort). Welcher Satz?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:0,loesung:"Normalsatz 8.1%. Bei Konsumation vor Ort gilt der Normalsatz. Nur das gleiche Sandwich als Take-away wäre mit 2.6% besteuert. Klassische Gastro-Stolperfalle."},{id:"b4-1-Z5",typ:"multiplechoice",label:"Z5 · Mineralwasser im Laden",text:"Ein Detailhändler verkauft eine Flasche Mineralwasser zum Mitnehmen. Welcher Satz?",antworten:["Normalsatz 8.1%","Reduzierter Satz 2.6%","Sondersatz 3.8%","Steuerbefreit"],korrekt:1,loesung:"Reduzierter Satz 2.6%. Abgepacktes Wasser und Getränke ohne Alkohol gelten als Lebensmittel und damit als Gut des täglichen Bedarfs."},{id:"b4-1-Z6",typ:"multiplechoice",label:"Z6 · Steuerpflicht Sportverein",text:"Ab welchem Jahresumsatz wird ein gemeinnütziger Sportverein MWST-pflichtig?",antworten:["CHF 100'000","CHF 150'000","CHF 250'000","CHF 500'000"],korrekt:2,loesung:"CHF 250'000. Für Sportvereine und gemeinnützige Institutionen liegt die Grenze höher als die allgemeinen CHF 100'000."}]},b4_aufgabe2={title:"Aufgabe 2: Vorsteuer beim Einkauf",subtitle:"Buchungen mit Vorsteuer-Konto \xB7 Berechnung Brutto/Netto",tabLabel:"Aufgabe 2",context:"Beim Einkauf bezahlt das Unternehmen MWST an den Lieferanten. Diese Vorsteuer ist eine Forderung an die ESTV und wird auf einem Aktivkonto erfasst.",theorie:{title:"Theorie: Vorsteuer beim Einkauf",blocks:[{type:"text",text:"Beim Einkauf bezahlt das Unternehmen MWST an den Lieferanten. Diese Steuer kann es aber von seiner Umsatzsteuer abziehen \u2013 sie ist also wirtschaftlich kein Aufwand, sondern eine Forderung an die ESTV. Buchhalterisch wird sie auf einem Aktivkonto \xABVorsteuer\xBB erfasst."},{type:"subtitle",text:"Buchungssystematik"},{type:"text",text:"Beim Einkauf wird der Bruttobetrag auf die Verbindlichkeiten gebucht (das ist, was wir dem Lieferanten schulden). Der Aufwand wird netto erfasst (ohne MWST). Die MWST wird auf das Konto \xABVorsteuer\xBB gebucht."},{type:"formel",text:"Aufwand (netto) + Vorsteuer = Verbindlichkeiten L+L (brutto)"},{type:"subtitle",text:"Brutto/Netto-Umrechnung"},{type:"text",text:"Brutto = Netto \xD7 (1 + Satz). Netto = Brutto \xF7 (1 + Satz). Beim Normalsatz 8.1%: Brutto = Netto \xD7 1.081. Netto = Brutto \xF7 1.081."},{type:"vergleich",left:{title:"Ware oder Investition",text:"Vorsteuer kann immer abgezogen werden, wenn der Einkauf f\xFCr die steuerpflichtige Gesch\xE4ftst\xE4tigkeit verwendet wird. Buchung: Warenaufwand oder Anlagen + Vorsteuer / Verbindlichkeiten."},right:{title:"Privatnutzung",text:"Wenn ein Einkauf privat genutzt wird (z.B. Gesch\xE4ftswagen privat), darf die Vorsteuer nicht abgezogen werden. Korrektur durch Privatanteil (Aufgabe 5)."}},{type:"beispiel",text:"Velowerk kauft Velos brutto CHF 10'810 (inkl. 8.1% MWST). Aufteilung: Netto-Aufwand CHF 10'000, Vorsteuer CHF 810. Buchung: Warenaufwand 10'000 + Vorsteuer 810 / Verbindlichkeiten L+L 10'810."},{type:"merksatz",text:"Vorsteuer ist ein Aktivkonto. Wir haben Geld an den Lieferanten gezahlt, das wir uns von der ESTV zur\xFCckholen. Die Buchung ist immer: Aufwand netto + Vorsteuer = Verbindlichkeit brutto. Wer das Gleichgewicht verletzt, hat sich verbucht."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Berechnung Brutto/Netto",farbe:"#1B6B63"},{id:"b4-2-A1",typ:"kennzahl",label:"A1 \xB7 Netto aus Brutto (Normalsatz)",text:"Brutto-Rechnung CHF 1'620 inkl. 8.1% MWST. Wie hoch ist der Netto-Betrag (CHF, auf 2 Dezimalstellen)?",erwartet:1498.61,einheit:"CHF",toleranz:.5,loesung:"Netto = 1'620 \xF7 1.081 = CHF 1'498.61. Die MWST betr\xE4gt 1'620 \u2013 1'498.61 = CHF 121.39."},{id:"b4-2-A2",typ:"kennzahl",label:"A2 \xB7 Brutto aus Netto (Normalsatz)",text:"Netto-Rechnung CHF 5'000 zzgl. 8.1% MWST. Wie hoch ist der Brutto-Betrag (CHF)?",erwartet:5405,einheit:"CHF",toleranz:.5,loesung:"Brutto = 5'000 \xD7 1.081 = CHF 5'405. Die MWST betr\xE4gt CHF 405."},{id:"b4-2-A3",typ:"kennzahl",label:"A3 \xB7 Netto aus Brutto (Reduzierter Satz)",text:"Lebensmittel-Einkauf brutto CHF 1'026 inkl. 2.6% MWST. Wie hoch ist der Netto-Betrag (CHF)?",erwartet:1e3,einheit:"CHF",toleranz:.5,loesung:"Netto = 1'026 \xF7 1.026 = CHF 1'000. Die MWST betr\xE4gt CHF 26."},{typ:"abschnitt",label:"Teil B \xB7 Buchungen Vorsteuer",farbe:"#1D4ED8",intro:"Bei jedem Einkauf wird der Bruttobetrag auf die Verbindlichkeiten gebucht, der Aufwand netto und die MWST auf \xABVorsteuer\xBB (Aktivkonto)."},{id:"b4-2-B1",label:"B1 \xB7 Wareneinkauf 8.1%",text:"Wareneinkauf brutto CHF 10'810 (inkl. 8.1% MWST). Auf Rechnung. (2 Buchungen, gleicher Beleg)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:1e4},{sollKeys:["vorsteuer"],habenKeys:["verbindlichkeiten"],betrag:810}]]},{id:"b4-2-B2",label:"B2 \xB7 Maschinenkauf 8.1%",text:"Velowerk kauft eine Aufbau-Maschine brutto CHF 54'050 (inkl. 8.1% MWST). Sofortzahlung \xFCber Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["maschinen"],habenKeys:["bank"],betrag:5e4},{sollKeys:["vorsteuer"],habenKeys:["bank"],betrag:4050}]]},{id:"b4-2-B3",label:"B3 \xB7 Beratungsleistung 8.1%",text:"Treuhandb\xFCro stellt Rechnung \xFCber brutto CHF 2'702.50 (inkl. 8.1% MWST). Auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["beratungsaufwand"],habenKeys:["verbindlichkeiten"],betrag:2500},{sollKeys:["vorsteuer"],habenKeys:["verbindlichkeiten"],betrag:202.5}]]},{id:"b4-2-B4",label:"B4 \xB7 Lebensmittel 2.6%",text:"Kantinen-Einkauf brutto CHF 1'539 (inkl. 2.6% MWST). Barzahlung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["kasse"],betrag:1500},{sollKeys:["vorsteuer"],habenKeys:["kasse"],betrag:39}]]},{typ:"abschnitt",label:"Teil C · Zusatzübungen",farbe:"#0F766E",intro:"Gemischte Wiederholung: erst rechnen, dann buchen. Gleiche Logik wie Teil A und B."},{id:"b4-2-Z1",typ:"kennzahl",label:"Z1 · Netto aus Brutto",text:"Einkauf brutto CHF 3'243 inkl. 8.1% MWST. Netto-Betrag (CHF)?",erwartet:3000,einheit:"CHF",toleranz:.5,loesung:"Netto = 3'243 ÷ 1.081 = CHF 3'000.00. Vorsteuer = CHF 243.00."},{id:"b4-2-Z2",typ:"kennzahl",label:"Z2 · Brutto aus Netto",text:"Einkauf netto CHF 4'000 zzgl. 8.1% MWST. Brutto-Betrag (CHF)?",erwartet:4324,einheit:"CHF",toleranz:.5,loesung:"Brutto = 4'000 × 1.081 = CHF 4'324.00. Vorsteuer = CHF 324.00."},{id:"b4-2-Z3",typ:"kennzahl",label:"Z3 · Vorsteuer aus Brutto",text:"Einkauf brutto CHF 6'486 inkl. 8.1% MWST. Wie hoch ist die Vorsteuer (CHF)?",erwartet:486,einheit:"CHF",toleranz:.5,loesung:"Netto = 6'486 ÷ 1.081 = 6'000. Vorsteuer = 6'486 − 6'000 = CHF 486.00."},{id:"b4-2-Z4",label:"Z4 · Wareneinkauf 8.1%",text:"Wareneinkauf brutto CHF 8'648 (inkl. 8.1% MWST) auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:8000},{sollKeys:["vorsteuer"],habenKeys:["verbindlichkeiten"],betrag:648}]]},{id:"b4-2-Z5",label:"Z5 · Lieferwagen 8.1%",text:"Velowerk kauft einen Lieferwagen brutto CHF 27'025 (inkl. 8.1% MWST), Zahlung über Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["maschinen"],habenKeys:["bank"],betrag:25000},{sollKeys:["vorsteuer"],habenKeys:["bank"],betrag:2025}]]},{id:"b4-2-Z6",label:"Z6 · Büromiete 8.1%",text:"Büromiete brutto CHF 5'405 (inkl. 8.1% MWST), Zahlung über Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["raumaufwand"],habenKeys:["bank"],betrag:5000},{sollKeys:["vorsteuer"],habenKeys:["bank"],betrag:405}]]}]},b4_aufgabe3={title:"Aufgabe 3: Umsatzsteuer beim Verkauf",subtitle:"Buchungen mit MWST-Schuld \xB7 Erl\xF6sminderungen",tabLabel:"Aufgabe 3",context:"Beim Verkauf erhebt das Unternehmen MWST vom Kunden. Diese Umsatzsteuer ist eine Schuld gegen\xFCber der ESTV und wird auf einem Passivkonto erfasst.",theorie:{title:"Theorie: Umsatzsteuer beim Verkauf",blocks:[{type:"text",text:"Beim Verkauf erhebt das Unternehmen MWST vom Kunden \u2013 diese \xABUmsatzsteuer\xBB schuldet es der ESTV. Auf der Rechnung steht der Bruttobetrag (was der Kunde zahlt). Buchhalterisch wird der Ertrag netto erfasst und die MWST auf das Konto \xABUmsatzsteuer\xBB (Passivkonto) gebucht."},{type:"subtitle",text:"Buchungssystematik"},{type:"text",text:"Beim Verkauf wird der Bruttobetrag auf die Forderungen gebucht. Der Ertrag wird netto erfasst (ohne MWST). Die MWST landet als Verbindlichkeit gegen\xFCber der ESTV auf dem Konto \xABUmsatzsteuer\xBB oder \xABMWST-Schuld\xBB."},{type:"formel",text:"Forderungen L+L (brutto) = Ertrag (netto) + Umsatzsteuer"},{type:"subtitle",text:"Erl\xF6sminderungen mit MWST"},{type:"text",text:"Rabatte, Skonti und R\xFCcksendungen reduzieren den Verkaufserl\xF6s. Wichtig: die MWST wird PROPORTIONAL mit reduziert. Bei einem Skonto von 2% auf eine Rechnung mit MWST wird auch die Umsatzsteuer um 2% korrigiert. Das ist logisch: wir schulden der ESTV nur die tats\xE4chlich kassierte MWST."},{type:"vergleich",left:{title:"Skonto-Gew\xE4hrung",text:"Verk\xE4ufer reduziert den Erl\xF6s. Buchung: Erl\xF6sminderung (netto) + Umsatzsteuer-Korrektur / Forderungen (brutto). Die Forderung sinkt um den Skonto-Betrag inkl. MWST."},right:{title:"R\xFCcksendung",text:"Kunde sendet Ware zur\xFCck. Spiegelbild zum Verkauf: Umsatzsteuer wird storniert. Buchung: Erl\xF6sminderung + Umsatzsteuer / Forderungen L+L."}},{type:"beispiel",text:"Velowerk verkauft Velos brutto CHF 21'620 (inkl. 8.1% MWST). Aufteilung: Netto-Ertrag CHF 20'000, Umsatzsteuer CHF 1'620. Buchung: Forderungen L+L 21'620 / Warenertrag 20'000 + Umsatzsteuer 1'620. Bei 2% Skonto-Gew\xE4hrung: Reduktion brutto 432.40, davon Netto 400 und MWST 32.40 zur\xFCck."},{type:"merksatz",text:"Umsatzsteuer ist ein Passivkonto. Wir haben Geld vom Kunden kassiert, das wir der ESTV schulden. Die Buchung ist immer: Forderung brutto = Ertrag netto + Umsatzsteuer. Bei Erl\xF6sminderungen wird die Umsatzsteuer proportional korrigiert."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Berechnung Brutto/Netto Verkauf",farbe:"#1B6B63"},{id:"b4-3-A1",typ:"kennzahl",label:"A1 \xB7 Netto-Erl\xF6s aus Brutto",text:"Verkaufsrechnung brutto CHF 4'324 (inkl. 8.1% MWST). Wie hoch ist der Netto-Erl\xF6s (CHF)?",erwartet:4e3,einheit:"CHF",toleranz:.5,loesung:"Netto = 4'324 \xF7 1.081 = CHF 4'000. Umsatzsteuer = CHF 324."},{id:"b4-3-A2",typ:"kennzahl",label:"A2 \xB7 MWST aus Brutto",text:"Verkaufsrechnung brutto CHF 8'108 (inkl. 8.1% MWST). Wie hoch ist die Umsatzsteuer (CHF)?",erwartet:608,einheit:"CHF",toleranz:.5,loesung:"Netto = 8'108 \xF7 1.081 = 7'500. Umsatzsteuer = 8'108 \u2013 7'500 = CHF 608."},{typ:"abschnitt",label:"Teil B \xB7 Buchungen Verkauf",farbe:"#1D4ED8",intro:"Beim Verkauf entsteht eine Schuld an die ESTV in der H\xF6he der Umsatzsteuer (Passivkonto \xABUmsatzsteuer\xBB bzw. \xABMWST-Schuld\xBB)."},{id:"b4-3-B1",label:"B1 \xB7 Warenverkauf 8.1%",text:"Warenverkauf brutto CHF 21'620 (inkl. 8.1% MWST). Auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag"],betrag:2e4},{sollKeys:["forderungen"],habenKeys:["mwstpflicht"],betrag:1620}]]},{id:"b4-3-B2",label:"B2 \xB7 Dienstleistung 8.1%",text:"Beratungsleistung f\xFCr Kunde brutto CHF 5'405 (inkl. 8.1% MWST). Sofortzahlung Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["warenertrag"],betrag:5e3},{sollKeys:["bank"],habenKeys:["mwstpflicht"],betrag:405}]]},{id:"b4-3-B3",label:"B3 \xB7 Skonto bei Verkauf",text:"Aus dem Gesch\xE4ftsfall B1 (Forderung 21'620): Kunde nutzt 2% Skonto bei Zahlung. Buche den Skonto-Anteil inkl. MWST-Korrektur. (3 Buchungen: Zahlung Bank, Skonto Netto, MWST-Korrektur)",anzahlBuchungen:3,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:21187.6},{sollKeys:["erloesminderungen"],habenKeys:["forderungen"],betrag:400},{sollKeys:["mwstpflicht"],habenKeys:["forderungen"],betrag:32.4}]]},{id:"b4-3-B4",label:"B4 \xB7 R\xFCcksendung mit MWST",text:"Kunde sendet Ware aus B1 zur\xFCck, Brutto-Wert CHF 1'081 (inkl. 8.1% MWST). Forderung reduziert sich entsprechend. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["erloesminderungen"],habenKeys:["forderungen"],betrag:1e3},{sollKeys:["mwstpflicht"],habenKeys:["forderungen"],betrag:81}]]},{typ:"abschnitt",label:"Teil C \xB7 Reflexion",farbe:"#A85930"},{id:"b4-3-C1",typ:"interpretation",label:"C1 \xB7 Warum MWST-Korrektur bei Skonto?",text:"Warum wird bei einem Skonto auch die Umsatzsteuer korrigiert? Welche Logik steckt dahinter?",musterloesung:["Prinzip der Steuerwahrheit: Wir schulden der ESTV nur die MWST, die wir tats\xE4chlich kassiert haben. Wenn der Kunde dank Skonto weniger zahlt, kassieren wir auch weniger MWST.","Konkretes Beispiel: Rechnung brutto 21'620 (netto 20'000 + MWST 1'620). Bei 2% Skonto zahlt der Kunde 21'187.60. Davon sind 19'600 netto und 1'587.60 MWST. Wir m\xFCssen 32.40 MWST \xABzur\xFCckgeben\xBB (Korrektur).","W\xE4re die MWST nicht korrigiert, w\xFCrden wir 1'620 MWST abliefern, obwohl wir nur 1'587.60 kassiert haben. Das w\xE4ren 32.40 Verlust f\xFCr uns.","Dasselbe gilt f\xFCr Rabatte nachtr\xE4glich, R\xFCcksendungen und Forderungsverluste \u2013 immer wird auch die MWST proportional korrigiert.","Forderungsverlust ist ein Spezialfall: Bei einem definitiv abgeschriebenen Kunden k\xF6nnen wir auch die MWST aus dem Verlust zur\xFCckfordern \u2013 Buchung \xFCber Konto \xABUmsatzsteuer\xBB oder direkt in der MWST-Abrechnung als negative Position."]},{typ:"abschnitt",label:"Teil D · Zusatzübungen",farbe:"#0F766E",intro:"Weitere Verkaufsfälle inklusive Skonto und Rücksendung mit MWST-Korrektur."},{id:"b4-3-Z1",typ:"kennzahl",label:"Z1 · Netto-Erlös aus Brutto",text:"Verkaufsrechnung brutto CHF 6'486 (inkl. 8.1% MWST). Netto-Erlös (CHF)?",erwartet:6000,einheit:"CHF",toleranz:.5,loesung:"Netto = 6'486 ÷ 1.081 = CHF 6'000.00. Umsatzsteuer = CHF 486.00."},{id:"b4-3-Z2",typ:"kennzahl",label:"Z2 · Umsatzsteuer aus Brutto",text:"Verkaufsrechnung brutto CHF 10'810 (inkl. 8.1% MWST). Umsatzsteuer (CHF)?",erwartet:810,einheit:"CHF",toleranz:.5,loesung:"Netto = 10'810 ÷ 1.081 = 10'000. Umsatzsteuer = CHF 810.00."},{id:"b4-3-Z3",label:"Z3 · Warenverkauf 8.1%",text:"Warenverkauf brutto CHF 16'215 (inkl. 8.1% MWST) auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag","betriebsertrag"],betrag:15000},{sollKeys:["forderungen"],habenKeys:["mwstpflicht"],betrag:1215}]]},{id:"b4-3-Z4",label:"Z4 · Dienstleistung 8.1%",text:"Beratungsleistung brutto CHF 5'405 (inkl. 8.1% MWST), Zahlung über Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["dienstleistungsertrag"],betrag:5000},{sollKeys:["bank"],habenKeys:["mwstpflicht"],betrag:405}]]},{id:"b4-3-Z5",label:"Z5 · Skonto bei Verkauf",text:"Aus Z3 (Forderung CHF 16'215): Kunde nutzt 2% Skonto bei Zahlung. Buche Zahlung, Skonto netto und MWST-Korrektur. (3 Buchungen)",anzahlBuchungen:3,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:15890.7},{sollKeys:["erloesminderungen"],habenKeys:["forderungen"],betrag:300},{sollKeys:["mwstpflicht"],habenKeys:["forderungen"],betrag:24.3}]]},{id:"b4-3-Z6",label:"Z6 · Rücksendung mit MWST",text:"Kunde sendet Ware aus Z3 zurück, Brutto-Wert CHF 2'162 (inkl. 8.1% MWST). (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["erloesminderungen"],habenKeys:["forderungen"],betrag:2000},{sollKeys:["mwstpflicht"],habenKeys:["forderungen"],betrag:162}]]}]},b4_aufgabe4={title:"Aufgabe 4: MWST-Abrechnung mit ESTV",subtitle:"Saldo berechnen \xB7 Zahllast buchen \xB7 Methodenvergleich",tabLabel:"Aufgabe 4",context:"Quartalsweise (effektive Methode) oder halbj\xE4hrlich (Saldosteuermethode) wird der Saldo zwischen Umsatzsteuer und Vorsteuer berechnet und an die ESTV abgerechnet.",theorie:{title:"Theorie: MWST-Abrechnung mit der ESTV",blocks:[{type:"text",text:"Die MWST-Abrechnung ist der periodische \xABAusgleich\xBB zwischen Umsatzsteuer (Schuld) und Vorsteuer (Guthaben). Die Differenz wird der ESTV \xFCberwiesen oder von ihr zur\xFCckerstattet."},{type:"subtitle",text:"Effektive Methode \u2013 Berechnung der Zahllast"},{type:"formel",text:"Zahllast = Umsatzsteuer (Saldo Konto Umsatzsteuer) \u2013 Vorsteuer (Saldo Konto Vorsteuer)"},{type:"text",text:"Positiver Saldo = wir schulden der ESTV. Negativer Saldo = die ESTV schuldet uns (R\xFCckzahlung). Die Abrechnung erfolgt quartalsweise (Q1, Q2, Q3, Q4) und ist bis sp\xE4testens 60 Tage nach Quartalsende einzureichen."},{type:"subtitle",text:"Buchung der Abrechnung"},{type:"list",items:["Aufl\xF6sung der beiden Konten: Umsatzsteuer / Vorsteuer (f\xFCr den kleineren der beiden Betr\xE4ge)","Zahllast bleibt als Saldo auf dem Umsatzsteuer-Konto: Umsatzsteuer / Bank","Oder bei Vorsteuer-\xDCberhang: Bank / Vorsteuer"]},{type:"subtitle",text:"Saldosteuermethode"},{type:"text",text:"Bei der Saldosteuermethode entf\xE4llt das Verbuchen der Vorsteuer. Stattdessen wird ein branchen-spezifischer Saldosteuersatz auf den Bruttoumsatz angewendet (z.B. 2.1% f\xFCr Velohandel, 0.6% f\xFCr Treuhand). Das ist administrativ einfacher, kann aber je nach Vorsteuer-Volumen g\xFCnstiger oder teurer sein als die effektive Methode."},{type:"vergleich",left:{title:"Effektive Methode",text:"Vorteil: Genau, alle Vorsteuern k\xF6nnen abgezogen werden. Nachteil: Aufwand. Geeignet f\xFCr vorsteuerintensive Unternehmen (Handel, Bau, Produktion). Quartalsweise Abrechnung."},right:{title:"Saldosteuermethode",text:"Vorteil: Einfach, halbj\xE4hrliche Abrechnung, weniger Aufwand. Nachteil: Vorsteuer aus Investitionen kann nicht abgezogen werden \u2013 ung\xFCnstig bei hohen Investitionen. Voraussetzung: Umsatz unter CHF 5.024 Mio."}},{type:"beispiel",text:"Velowerk im Q1: Umsatzsteuer CHF 30'000, Vorsteuer CHF 18'000. Zahllast = 30'000 \u2013 18'000 = CHF 12'000 an die ESTV. Buchung: Umsatzsteuer 30'000 / Vorsteuer 18'000 + Bank 12'000. Bei Saldosteuermethode 2.1% auf Brutto-Umsatz CHF 400'000 = CHF 8'400 an ESTV \u2013 weniger administrativer Aufwand, aber wenn viel investiert wurde, eventuell teurer."},{type:"merksatz",text:"Quartalsweise Abrechnung bei effektiver Methode, halbj\xE4hrlich bei Saldosteuermethode. Die Wahl der Methode bindet f\xFCr mindestens ein Jahr (Saldosteuermethode 3 Jahre). Entscheidung also strategisch fundieren \u2013 ein Steuerberater oder Treuh\xE4nder ist hier oft gut investiertes Geld."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Berechnung Zahllast",farbe:"#1B6B63"},{id:"b4-4-A1",typ:"kennzahl",label:"A1 \xB7 Zahllast Q1",text:"Quartal 1: Umsatzsteuer-Saldo CHF 28'500, Vorsteuer-Saldo CHF 16'200. Wie hoch ist die Zahllast an die ESTV (CHF)?",erwartet:12300,einheit:"CHF",toleranz:0,loesung:"Zahllast = Umsatzsteuer \u2013 Vorsteuer = 28'500 \u2013 16'200 = CHF 12'300. Das ist der Betrag, den Velowerk innert 60 Tagen an die ESTV \xFCberweisen muss."},{id:"b4-4-A2",typ:"kennzahl",label:"A2 \xB7 Vorsteuer-\xDCberhang",text:"Quartal 2 (mit grosser Investition): Umsatzsteuer-Saldo CHF 25'000, Vorsteuer-Saldo CHF 38'500. Wie hoch ist das Guthaben bei der ESTV (CHF, als positive Zahl)?",erwartet:13500,einheit:"CHF",toleranz:0,loesung:"Vorsteuer-\xDCberhang = Vorsteuer \u2013 Umsatzsteuer = 38'500 \u2013 25'000 = CHF 13'500. Die ESTV erstattet diesen Betrag zur\xFCck \u2013 meist innert 30\u201360 Tagen nach Einreichung der Abrechnung."},{id:"b4-4-A3",typ:"kennzahl",label:"A3 \xB7 Saldosteuer-Berechnung",text:"Velowerk w\xE4hlt Saldosteuermethode mit Saldosteuersat
