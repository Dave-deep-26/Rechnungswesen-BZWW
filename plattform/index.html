z 2.1%. Brutto-Umsatz im Halbjahr: CHF 480'000. Wie hoch ist die MWST-Schuld (CHF)?",erwartet:10080,einheit:"CHF",toleranz:.5,loesung:"MWST-Schuld = 480'000 \xD7 2.1% = CHF 10'080. Bei effektiver Methode w\xE4re das je nach Vorsteuer-Volumen mehr oder weniger \u2013 darum ist die Methodenwahl strategisch."},{typ:"abschnitt",label:"Teil B \xB7 Buchung der Abrechnung",farbe:"#1D4ED8",intro:"Am Quartalsende werden Umsatzsteuer und Vorsteuer ausgeglichen, der Saldo an die ESTV \xFCberwiesen oder zur\xFCckerhalten."},{id:"b4-4-B1",label:"B1 \xB7 Verrechnung der Konten",text:"Q1-Abschluss: Umsatzsteuer-Saldo 28'500, Vorsteuer-Saldo 16'200. Buche die Verrechnung der beiden Konten (kleinerer Betrag wird saldiert).",loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["vorsteuer"],betrag:16200}]]},{id:"b4-4-B2",label:"B2 \xB7 Zahlung an ESTV",text:"Restbetrag auf dem Umsatzsteuer-Konto (CHF 12'300) wird an die ESTV \xFCberwiesen.",loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["bank"],betrag:12300}]]},{id:"b4-4-B3",label:"B3 \xB7 R\xFCckerstattung von ESTV",text:"Q2: Vorsteuer-\xDCberhang CHF 13'500. Die ESTV \xFCberweist diesen Betrag zur\xFCck auf das Bankkonto.",loesungen:[[{sollKeys:["bank"],habenKeys:["vorsteuer"],betrag:13500}]]},{typ:"abschnitt",label:"Teil C \xB7 Methodenwahl",farbe:"#A85930"},{id:"b4-4-C1",typ:"interpretation",label:"C1 \xB7 Wann effektive Methode?",text:"F\xFCr welche Unternehmen lohnt sich die effektive Methode (statt Saldosteuermethode)? Nenne mindestens drei Kriterien.",musterloesung:["Vorsteuerintensive Unternehmen: Handel, Bau, Produktion \u2013 wer viel einkauft, hat viel Vorsteuer zum Abziehen. Die Saldosteuermethode w\xFCrde diese Vorsteuer \xABverschenken\xBB.","Geplante Grossinvestitionen: Wer eine Maschine oder eine Liegenschaft kauft, hat einmalig sehr hohe Vorsteuer. Mit der effektiven Methode kann diese vollst\xE4ndig zur\xFCckgeholt werden \u2013 mit der Saldosteuermethode nur teilweise.","Hoher Umsatz: \xDCber CHF 5.024 Mio. ist die Saldosteuermethode sowieso nicht zul\xE4ssig.","Saisonalit\xE4t: Wer in einem Quartal viel Umsatz und im anderen viel Investitionen hat, profitiert von der quartalsweisen Detailabrechnung.","Mit professionellem Treuh\xE4nder: Wenn die Buchhaltung sowieso digital und automatisiert gef\xFChrt wird, ist der zus\xE4tzliche Aufwand f\xFCr die effektive Methode marginal.","Gegenteilig: Klein-Dienstleister (Coiffeur, Berater, Coach) mit wenig Wareneinkauf und gleichm\xE4ssigem Umsatz \u2013 f\xFCr diese ist die Saldosteuermethode meist g\xFCnstiger und einfacher."]},{typ:"abschnitt",label:"Teil D · Zusatzübungen",farbe:"#0F766E",intro:"Weitere Abrechnungsfälle: Zahllast, Vorsteuerüberhang und Saldosteuermethode."},{id:"b4-4-Z1",typ:"kennzahl",label:"Z1 · Zahllast",text:"Quartal: Umsatzsteuer-Saldo CHF 35'000, Vorsteuer-Saldo CHF 21'000. Zahllast an die ESTV (CHF)?",erwartet:14000,einheit:"CHF",toleranz:0,loesung:"Zahllast = 35'000 − 21'000 = CHF 14'000."},{id:"b4-4-Z2",typ:"kennzahl",label:"Z2 · Vorsteuerüberhang",text:"Quartal mit Grossinvestition: Umsatzsteuer CHF 18'000, Vorsteuer CHF 24'500. Guthaben bei der ESTV (CHF, positiv)?",erwartet:6500,einheit:"CHF",toleranz:0,loesung:"Vorsteuerüberhang = 24'500 − 18'000 = CHF 6'500. Die ESTV erstattet diesen Betrag zurück."},{id:"b4-4-Z3",typ:"kennzahl",label:"Z3 · Saldosteuer",text:"Saldosteuersatz 2.1%, Brutto-Umsatz im Halbjahr CHF 600'000. MWST-Schuld (CHF)?",erwartet:12600,einheit:"CHF",toleranz:.5,loesung:"MWST-Schuld = 600'000 × 2.1% = CHF 12'600."},{id:"b4-4-Z4",label:"Z4 · Verrechnung",text:"Q-Abschluss: Umsatzsteuer-Saldo 35'000, Vorsteuer-Saldo 21'000. Buche die Verrechnung (kleinerer Betrag 21'000).",loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["vorsteuer"],betrag:21000}]]},{id:"b4-4-Z5",label:"Z5 · Zahlung an ESTV",text:"Restbetrag auf dem Umsatzsteuer-Konto (CHF 14'000) wird an die ESTV überwiesen.",loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["bank"],betrag:14000}]]},{id:"b4-4-Z6",label:"Z6 · Rückerstattung",text:"Vorsteuerüberhang CHF 6'500 wird von der ESTV auf das Bankkonto zurückerstattet.",loesungen:[[{sollKeys:["bank"],habenKeys:["vorsteuer"],betrag:6500}]]}]},b4_aufgabe5={title:"Aufgabe 5: Sonderf\xE4lle und Strategie",subtitle:"Privatanteil, Bezugssteuer, strategische Methodenwahl",tabLabel:"Aufgabe 5",context:"MWST hat einige Sonderf\xE4lle, die in der Praxis h\xE4ufig vorkommen. Diese Aufgabe vertieft die wichtigsten und schliesst mit strategischen Reflexionen.",theorie:{title:"Theorie: MWST-Sonderf\xE4lle",blocks:[{type:"text",text:"Drei Sonderf\xE4lle sind in der Praxis besonders relevant: der Privatanteil bei gemischter Nutzung, die Bezugssteuer bei Auslandseink\xE4ufen und die strategische Wahl der Abrechnungsmethode. Wer diese drei Themen beherrscht, ist im MWST-Alltag gut aufgestellt."},{type:"subtitle",text:"Privatanteil"},{type:"text",text:"Wenn ein Gesch\xE4ftswagen, ein Mobiltelefon oder eine Wohnung gemischt genutzt wird (gesch\xE4ftlich und privat), darf die Vorsteuer nur anteilig abgezogen werden. Der Privatanteil wird pauschal angesetzt (z.B. 9.6% pro Jahr beim Gesch\xE4ftswagen) und als Ertrag verbucht \u2013 die darauf entfallende MWST geht an die ESTV."},{type:"subtitle",text:"Bezugssteuer (Reverse Charge)"},{type:"text",text:"Wenn Dienstleistungen aus dem Ausland bezogen werden (z.B. Software-Lizenz aus den USA, Beratung aus Deutschland), muss das Schweizer Unternehmen selbst die MWST berechnen und abliefern \u2013 das nennt sich Bezugssteuer. Gleichzeitig kann die Vorsteuer abgezogen werden, wenn die Leistung steuerpflichtig genutzt wird. Buchhalterisch oft Nullspiel, aber meldepflichtig."},{type:"subtitle",text:"Pauschalsteuersatz-Methode"},{type:"text",text:"\xC4hnlich der Saldosteuermethode, aber f\xFCr gemeinn\xFCtzige Vereine, soziale Institutionen und Sportvereine. Die Pauschalsteuers\xE4tze sind tiefer als die Saldosteuers\xE4tze und sollen den administrativen Aufwand f\xFCr NPOs minimieren."},{type:"vergleich",left:{title:"Effektive Methode",text:"Standard. Detailliert. Quartalsweise. Beste Vorsteuer-Ausnutzung. Geeignet f\xFCr vorsteuerintensive KMU und alle grossen Unternehmen."},right:{title:"Saldosteuermethode + Pauschalsteuersatz",text:"Vereinfacht. Halbj\xE4hrlich. Reduzierter administrativer Aufwand. Geeignet f\xFCr kleine Dienstleister, NPOs, Coiffeursalons. Aber: Vorsteuer aus Investitionen geht verloren."}},{type:"merksatz",text:"Die MWST ist im Schweizer Recht hochgradig komplex und \xE4ndert sich regelm\xE4ssig (S\xE4tze, Schwellenwerte, Sonderregeln). Wer im Unternehmen mit der MWST zu tun hat, sollte sich j\xE4hrlich auf den neuesten Stand bringen \u2013 die ESTV publiziert detaillierte Branchenmerkbl\xE4tter, die als Praxis-Bibel gelten."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Verst\xE4ndnis Sonderf\xE4lle",farbe:"#1B6B63"},{id:"b4-5-A1",typ:"multiplechoice",label:"A1 \xB7 Privatanteil",text:"Was ist der Privatanteil bei einem Gesch\xE4ftswagen?",antworten:["Eine Steuer, die der Mitarbeitende zahlt","Eine pauschale Ertragsbuchung f\xFCr die private Nutzung des Gesch\xE4ftsfahrzeugs","Ein Abzug von der Vorsteuer","Eine Abschreibung"],korrekt:1,loesung:"Eine pauschale Ertragsbuchung. Wenn ein Gesch\xE4ftswagen gemischt genutzt wird (gesch\xE4ftlich + privat), wird der Privatanteil als Ertrag verbucht (typisch 9.6% des Kaufpreises pro Jahr). Die darauf entfallende MWST geht an die ESTV. So wird verhindert, dass private Nutzung steuerlich beg\xFCnstigt wird."},{id:"b4-5-A2",typ:"multiplechoice",label:"A2 \xB7 Bezugssteuer",text:"Wann f\xE4llt Bezugssteuer an?",antworten:["Beim Kauf von Waren aus dem Ausland","Beim Bezug von Dienstleistungen aus dem Ausland","Bei Privatentnahmen","Beim Verkauf an Privatkunden"],korrekt:1,loesung:"Beim Bezug von Dienstleistungen aus dem Ausland. Wenn ein Schweizer Unternehmen z.B. eine Software-Lizenz aus den USA oder Beratung aus Deutschland bezieht, muss es selbst die MWST berechnen und an die ESTV abliefern (Reverse Charge). Bei Waren aus dem Ausland f\xE4llt dagegen Einfuhr-MWST am Zoll an."},{id:"b4-5-A3",typ:"multiplechoice",label:"A3 \xB7 Saldosteuermethode-Voraussetzung",text:"Welche Voraussetzung muss f\xFCr die Saldosteuermethode erf\xFCllt sein?",antworten:["Umsatz unter CHF 100'000","Umsatz unter CHF 5.024 Mio. und Steuerschuld unter CHF 108'000","Nur f\xFCr Dienstleistungsbetriebe","Nur f\xFCr Vereine"],korrekt:1,loesung:"Umsatz unter CHF 5.024 Mio. und Steuerschuld unter CHF 108'000. \xDCber diesen Grenzen ist die effektive Methode zwingend. Die Limiten werden periodisch angepasst \u2013 aktuelle Werte immer auf estv.admin.ch pr\xFCfen."},{id:"b4-5-A4",typ:"multiplechoice",label:"A4 \xB7 Methodenwechsel",text:"Wie lange ist man an die Wahl der Saldosteuermethode gebunden?",antworten:["1 Jahr","3 Jahre","5 Jahre","Beliebig wechselbar"],korrekt:1,loesung:"3 Jahre. Die Saldosteuermethode bindet f\xFCr mindestens drei Steuerperioden. Die effektive Methode bindet nur ein Jahr. Wer wechseln will, muss aktiv die ESTV informieren \u2013 der Wechsel ist nicht automatisch."},{typ:"abschnitt",label:"Teil B \xB7 Strategische Reflexion",farbe:"#A85930"},{id:"b4-5-B1",typ:"interpretation",label:"B1 \xB7 Methodenwahl f\xFCr ein Restaurant",text:"Du ber\xE4tst ein Restaurant mit CHF 800'000 Jahresumsatz. Welche Abrechnungsmethode empfiehlst du? Begr\xFCnde.",musterloesung:["Voraussetzung Saldosteuermethode erf\xFCllt (Umsatz unter CHF 5.024 Mio.).","Restaurants haben typischerweise relativ wenig Vorsteuer im Verh\xE4ltnis zum Umsatz (haupts\xE4chlich Lebensmittel mit 2.6%, plus Strom, Miete, Reinigung).","Saldosteuersatz f\xFCr Gastronomie liegt bei ca. 5.1% (variiert je nach exakter Branche).","Empfehlung: Saldosteuermethode pr\xFCfen. Vorteile: halbj\xE4hrliche Abrechnung statt quartalsweise, weniger Buchhaltungsaufwand, bei Restaurants oft g\xFCnstiger als effektive Methode.","Aber Vorsicht: Bei geplanten Grossinvestitionen (Umbau, neue K\xFCche) zuerst zur effektiven Methode wechseln, Vorsteuer holen, dann zur\xFCck auf Saldosteuer.","Praxistipp: Probeberechnung machen. Vergangenes Jahr nach beiden Methoden durchrechnen lassen (z.B. durch Treuh\xE4nder), dann entscheiden. Differenz ist oft mehrere tausend Franken pro Jahr.","Strategischer Tipp: Die Methodenwahl ist auch eine Frage der Buchhaltungs-Software und des Treuh\xE4nder-Tarifs. Wer eine moderne Buchhaltung mit automatisierter Vorsteuer-Erfassung hat, kann die effektive Methode fast \xABumsonst\xBB fahren."]},{id:"b4-5-B2",typ:"interpretation",label:"B2 \xB7 MWST als Wachstumsfalle",text:"Ein Kleinstunternehmer mit CHF 90'000 Umsatz \xFCberlegt, ob er auf CHF 110'000 wachsen soll. Warum kann das Wachstum \xABteuer\xBB werden?",musterloesung:["Mit dem Erreichen der Umsatzgrenze von CHF 100'000 wird das Unternehmen MWST-pflichtig. Auf einmal m\xFCssen 8.1% MWST auf Rechnungen ausgewiesen werden \u2013 ohne dass automatisch der Verkaufspreis steigt.","Wenn die Kunden Privatpersonen sind (B2C), bedeutet das: Entweder 8.1% Margenverlust (weil der Preis nicht erh\xF6ht werden kann) oder Wettbewerbsnachteil (h\xF6herer Preis).","Im B2B-Gesch\xE4ft kein Problem: Gesch\xE4ftskunden ziehen die MWST als Vorsteuer ab.","Administrativer Aufwand: MWST-Anmeldung, quartalsweise (oder halbj\xE4hrliche) Abrechnung, Buchhaltung anpassen. Zeit und Geld.","Steuerberater oft n\xF6tig: Kosten ca. CHF 2'000\u20135'000 pro Jahr zus\xE4tzlich.","Strategie 1: Bewusst unter CHF 100'000 bleiben (Wachstum drosseln) \u2013 \xABkreative Buchhaltung\xBB, aber legitim.","Strategie 2: Direkt deutlich \xFCber die Grenze wachsen (CHF 150'000+), damit die Effizienzgewinne den Aufwand mehr als kompensieren.","Strategie 3: Vorsteuer-Optimierung \u2013 wer wachsen will, sollte Investitionen (Maschinen, Software, Werkzeuge) ins erste MWST-Jahr legen, um die Vorsteuer mitzunehmen.","Lektion: MWST-Pflicht ist keine Strafe, aber sie erfordert strategische Planung. Wachstum von 90'000 auf 110'000 ist die teuerste Wachstumsstufe \u2013 dar\xFCber lohnt es sich wieder."]},{typ:"abschnitt",label:"Teil C · Zusatzübungen Sonderfälle",farbe:"#0F766E"},{id:"b4-5-Z1",typ:"multiplechoice",label:"Z1 · Privatanteil buchen",text:"Wie wird der Privatanteil für die private Nutzung eines Geschäftswagens grundsätzlich verbucht?",antworten:["Als Aufwand","Als Ertrag","Als Abschreibung","Als Vorsteuer"],korrekt:1,loesung:"Als Ertrag. Der Privatanteil ist eine pauschale Ertragsbuchung. Die darauf entfallende MWST geht an die ESTV, damit private Nutzung nicht steuerlich begünstigt wird."},{id:"b4-5-Z2",typ:"multiplechoice",label:"Z2 · Software aus dem Ausland",text:"Ein Schweizer Unternehmen bezieht eine Software-Lizenz aus den USA. Was fällt an?",antworten:["Einfuhr-MWST am Zoll","Bezugssteuer (Reverse Charge)","Keine MWST","Nur Vorsteuer"],korrekt:1,loesung:"Bezugssteuer (Reverse Charge). Bei Dienstleistungen aus dem Ausland berechnet das Schweizer Unternehmen die MWST selbst und liefert sie ab. Gleichzeitig ist der Vorsteuerabzug möglich, wenn die Leistung steuerpflichtig genutzt wird."},{id:"b4-5-Z3",typ:"multiplechoice",label:"Z3 · Ware aus dem Ausland",text:"Ein Unternehmen importiert physische Ware aus Deutschland. Was fällt an?",antworten:["Bezugssteuer","Einfuhr-MWST am Zoll","Keine MWST","Sondersatz 3.8%"],korrekt:1,loesung:"Einfuhr-MWST am Zoll. Bei physischen Waren wird die MWST bei der Einfuhr erhoben (nicht Bezugssteuer, das gilt nur für Dienstleistungen). Die Einfuhr-MWST ist als Vorsteuer abziehbar."},{id:"b4-5-Z4",typ:"multiplechoice",label:"Z4 · Bindung Saldosteuermethode",text:"Wie lange ist man an die Wahl der Saldosteuermethode mindestens gebunden?",antworten:["1 Jahr","2 Jahre","3 Jahre","5 Jahre"],korrekt:2,loesung:"3 Jahre. Die Saldosteuermethode bindet für mindestens drei Steuerperioden, die effektive Methode nur ein Jahr."},{id:"b4-5-Z5",typ:"multiplechoice",label:"Z5 · Frequenz effektive Methode",text:"In welchem Rhythmus rechnet ein Unternehmen mit der effektiven Methode mit der ESTV ab?",antworten:["Monatlich","Quartalsweise","Halbjährlich","Jährlich"],korrekt:1,loesung:"Quartalsweise. Die effektive Methode wird je Quartal abgerechnet, die Saldosteuermethode nur halbjährlich."}]},b4_aufgabe6={title:"Aufgabe 6: Synthese \xB7 Wertsch\xF6pfungskette und Sonderf\xE4lle",subtitle:"Allphasensteuer, Steuerbefreiungen, Entgelt-Methoden und Rechnungsanforderungen",tabLabel:"Aufgabe 6",context:"Synthese-Aufgabe zu Block 4: Du verstehst die MWST als Allphasensteuer mit Berechnungen, unterscheidest echte und unechte Steuerbefreiung, kennst den Unterschied zwischen vereinbartem und vereinnahmtem Entgelt und kennst die formalen Rechnungsanforderungen.",theorie:{title:"Theorie: Vier Teil-Bereiche im \xDCberblick",blocks:[{type:"text",text:"Diese Aufgabe greift die vier Themen auf, die in den vorherigen Aufgaben nur am Rande vorkamen: Wertsch\xF6pfungskette als didaktische Logik, Steuerbefreiungen mit ihren Vorsteuer-Konsequenzen, Entgelt-Methoden mit Periodenwirkung und die formalen Anforderungen an MWST-konforme Rechnungen."},{type:"subtitle",text:"Was du in dieser Aufgabe \xFCbst"},{type:"vergleich",left:{title:"Teil A: Wertsch\xF6pfungskette",text:"Du berechnest die MWST-Schuld jeder Stufe und siehst, warum die Summe genau der MWST auf den Endverbraucherpreis entspricht."},right:{title:"Teil B: Steuerbefreiungen",text:"Du ordnest Beispiele der echten oder unechten Steuerbefreiung zu und verstehst die Vorsteuer-Konsequenzen."}},{type:"vergleich",left:{title:"Teil C: Entgelt-Methoden",text:"Du entscheidest pro Beispiel, in welche Abrechnungsperiode der Umsatz f\xE4llt \u2014 je nach Sollversteuerung oder Istversteuerung."},right:{title:"Teil D: Rechnungsanforderungen",text:"Du erkennst, welche Pflichtangaben auf einer Rechnung fehlen und beurteilst, ob der Vorsteuerabzug akzeptiert wird."}},{type:"merksatz",text:"Wer Block 4 wirklich beherrscht, beantwortet diese vier Bereiche fehlerfrei. Das ist das Niveau f\xFCr die Diplompr\xFCfung und die Treuhand-Praxis."}]},faelle:[{typ:"abschnitt",label:"Teil A \xB7 Wertsch\xF6pfungskette",farbe:"#7E22CE",intro:"Ein Brot durchl\xE4uft drei Stufen: Bauer \u2192 M\xFCller \u2192 B\xE4cker \u2192 Konsument. Auf jeder Stufe wird Normalsatz 8.1% MWST aufgeschlagen. Wir verfolgen den MWST-Fluss."},{id:"b4-6-A1",typ:"kennzahl",label:"A1 \xB7 MWST-Schuld Bauer",text:"Bauer verkauft Korn an M\xFCller f\xFCr netto CHF 100. Wie viel MWST schuldet er der ESTV (CHF, 2 Dezimalstellen)? Hinweis: Bauer hat keine Vorsteuer (eigener Anbau).",erwartet:8.1,einheit:"CHF",toleranz:.01,loesung:"MWST = 100 \xD7 8.1% = 8.10 CHF. Da der Bauer keine Vorsteuer hat, geht der volle Betrag an die ESTV."},{id:"b4-6-A2",typ:"kennzahl",label:"A2 \xB7 MWST-Schuld M\xFCller",text:"M\xFCller verkauft Mehl an B\xE4cker f\xFCr netto CHF 200. Er hat aber selbst 8.10 CHF Vorsteuer bezahlt (an den Bauer). Wie viel schuldet er netto der ESTV?",erwartet:8.1,einheit:"CHF",toleranz:.01,loesung:"M\xFCller: Ausgangs-MWST = 200 \xD7 8.1% = 16.20 CHF. Minus Vorsteuer 8.10 CHF = Nettoschuld an ESTV 8.10 CHF. M\xFCller zahlt nur die MWST auf den eigenen Mehrwert (100 CHF Mehrwert \xD7 8.1% = 8.10)."},{id:"b4-6-A3",typ:"kennzahl",label:"A3 \xB7 MWST-Schuld B\xE4cker",text:"B\xE4cker verkauft das Brot an den Konsumenten f\xFCr netto CHF 350. Vorsteuer war CHF 16.20. Wie viel schuldet er netto der ESTV?",erwartet:12.15,einheit:"CHF",toleranz:.01,loesung:"B\xE4cker: Ausgangs-MWST = 350 \xD7 8.1% = 28.35 CHF. Minus Vorsteuer 16.20 CHF = Nettoschuld 12.15 CHF. Sein Mehrwert war 150 CHF (350 \u2212 200) \xD7 8.1% = 12.15 CHF."},{id:"b4-6-A4",typ:"kennzahl",label:"A4 \xB7 Total MWST aller drei Stufen",text:"Was bezahlt die ESTV insgesamt aus dieser Wertsch\xF6pfungskette? Addiere die drei Betr\xE4ge.",erwartet:28.35,einheit:"CHF",toleranz:.01,loesung:"Total = 8.10 + 8.10 + 12.15 = 28.35 CHF. Das ist genau die MWST von 8.1% auf den Endverbraucher-Preis von 350 CHF. Trotz drei Stufen wird die MWST nur einmal effektiv erhoben \u2014 auf den finalen Mehrwert."},{id:"b4-6-A5",typ:"multiplechoice",label:"A5 \xB7 Warum heisst es \xABMehrwertsteuer\xBB?",text:"Was ist der zentrale Aspekt, der den Namen \xABMehrwertsteuer\xBB erkl\xE4rt?",antworten:["Weil sie auf alle Waren erhoben wird","Weil jeder Unternehmer nur auf seinen eigenen Mehrwert MWST bezahlt","Weil sie auf mehrere Stufen aufgeteilt wird","Weil sie h\xF6her ist als andere Steuern"],korrekt:1,loesung:"Jeder Unternehmer zahlt nur auf seinen eigenen Mehrwert. Das ist das Kernprinzip: Bauer +100, M\xFCller +100, B\xE4cker +150 = 350 Endmehrwert. Jeder zahlt 8.1% auf seinen Mehrwertanteil. Die Allphasensteuer wird durch den Vorsteuerabzug zu einer reinen Mehrwertsteuer."},{typ:"abschnitt",label:"Teil B \xB7 Steuerbefreiungen",farbe:"#15803D",intro:"Du arbeitest in der Treuhand und musst beurteilen, ob die Ums\xE4tze deiner Kunden echt oder unecht steuerbefreit sind. Die Unterscheidung ist entscheidend, weil sie den Vorsteuerabzug beeinflusst."},{id:"b4-6-B1",typ:"multiplechoice",label:"B1 \xB7 Exportgesch\xE4ft Maschinenbauer",text:"Ein Maschinenbauer aus der Schweiz exportiert seine Anlagen nach Deutschland. Welche Steuerbefreiung greift?",antworten:["Echte Steuerbefreiung (Vorsteuerabzug m\xF6glich)","Unechte Steuerbefreiung (kein Vorsteuerabzug)","Keine Befreiung, Normalsatz","Reduzierter Steuersatz"],korrekt:0,loesung:"Echte Steuerbefreiung gem\xE4ss Art. 23 MWSTG. Exporte sind in der Schweiz steuerfrei, der Maschinenbauer kann aber die Vorsteuer auf seinen Eink\xE4ufen voll zur\xFCckfordern. Das ist Exportf\xF6rderung \u2014 schweizerische Produkte werden im Ausland nicht doppelt belastet."},{id:"b4-6-B2",typ:"multiplechoice",label:"B2 \xB7 Arztpraxis",text:"Eine Allgemeinpraxis behandelt Patienten und schreibt Rechnungen ohne MWST. Welche Steuerbefreiung?",antworten:["Echte Steuerbefreiung","Unechte Steuerbefreiung (von der Steuer ausgenommen)","Verminderte Steuerbefreiung","Saldosteuersatz"],korrekt:1,loesung:"Unechte Steuerbefreiung gem\xE4ss Art. 21 MWSTG. Gesundheitsleistungen sind von der MWST ausgenommen. Aber: die Arztpraxis kann auch keinen Vorsteuerabzug machen. Die MWST auf Ger\xE4te-Eink\xE4ufen, Medikamente etc. bleibt ein versteckter Kostenfaktor."},{id:"b4-6-B3",typ:"multiplechoice",label:"B3 \xB7 Sprachschule",text:"Eine Sprachschule bietet Deutschkurse f\xFCr Migranten an. Was gilt f\xFCr die MWST?",antworten:["Echt befreit, Vorsteuerabzug m\xF6glich","Unecht befreit, kein Vorsteuerabzug","Normalsatz 8.1%","Reduzierter Satz 2.6%"],korrekt:1,loesung:"Unecht befreit. Bildungsleistungen sind gem\xE4ss Art. 21 MWSTG von der Steuer ausgenommen. Die Sprachschule darf keine MWST auf ihre Kurse aufschlagen, kann aber auch keine Vorsteuer geltend machen (Miete, Lehrmittel, Strom)."},{id:"b4-6-B4",typ:"interpretation",label:"B4 \xB7 Strategischer Vergleich",text:"Warum ist die unechte Steuerbefreiung wirtschaftlich ung\xFCnstiger als die echte Steuerbefreiung? Erkl\xE4re das in eigenen Worten anhand eines Beispiels.",musterloesung:["Bei echter Steuerbefreiung (Export) bleibt der Vorsteuerabzug erhalten. Das Unternehmen kann die bezahlte MWST auf Eink\xE4ufen vom Fiskus zur\xFCckfordern. Resultat: das Produkt verl\xE4sst die Schweiz steuerfrei und ist im Ausland wettbewerbsf\xE4hig.","Bei unechter Steuerbefreiung (z.B. Arzt) entf\xE4llt der Vorsteuerabzug. Die auf Eink\xE4ufen bezahlte MWST (Ger\xE4te, Material) bleibt ein Aufwand, der nicht zur\xFCckerstattet wird.","Beispiel Arzt: Kauft Untersuchungsliege f\xFCr CHF 5'000 + 405 MWST. Die 405 CHF werden NICHT zur\xFCckerstattet \u2014 sie sind echte Kosten. Beim Maschinenbauer f\xFCr Export werden die 405 CHF MWST hingegen r\xFCckerstattet.","Praxis-Folge: Branchen mit unechter Befreiung (Gesundheit, Bildung, Banken, Versicherungen) haben h\xF6here effektive Kosten als ihre Konkurrenz im steuerpflichtigen Bereich. Das ist ein versteckter Wettbewerbsnachteil."]},{typ:"abschnitt",label:"Teil C \xB7 Vereinbartes vs. vereinnahmtes Entgelt",farbe:"#1D4ED8",intro:"Du musst pro Gesch\xE4ftsfall entscheiden, in welche MWST-Periode der Umsatz geh\xF6rt. Das h\xE4ngt davon ab, ob das Unternehmen nach \xABvereinbartem Entgelt\xBB (Sollversteuerung) oder \xABvereinnahmtem Entgelt\xBB (Istversteuerung) abrechnet."},{id:"b4-6-C1",typ:"multiplechoice",label:"C1 \xB7 Vereinbartes Entgelt (Sollversteuerung)",text:"Velowerk rechnet nach VEREINBARTEM Entgelt ab. Velos werden am 25.3. fakturiert (Q1), der Kunde zahlt am 15.4. (Q2). In welche Periode geh\xF6rt der Umsatz?",antworten:["Q1 (Quartal der Rechnungsstellung)","Q2 (Quartal der Zahlung)","Aufteilung 50/50","Wahlrecht f\xFCr das Unternehmen"],korrekt:0,loesung:"Q1. Bei der Sollversteuerung (vereinbartes Entgelt) gilt der Zeitpunkt der Rechnungsstellung \u2014 unabh\xE4ngig vom Zahlungseingang. Der Umsatz und die MWST geh\xF6ren ins erste Quartal."},{id:"b4-6-C2",typ:"multiplechoice",label:"C2 \xB7 Vereinnahmtes Entgelt (Istversteuerung)",text:"Gleicher Sachverhalt: Rechnung 25.3., Zahlungseingang 15.4. ABER Velowerk rechnet nach VEREINNAHMTEM Entgelt (Istversteuerung). In welche Periode geh\xF6rt der Umsatz?",antworten:["Q1","Q2 (Quartal des Zahlungseingangs)","Q3 (sicherheitshalber sp\xE4ter)","Beliebig w\xE4hlbar"],korrekt:1,loesung:"Q2. Bei der Istversteuerung gilt der Zeitpunkt der Zahlung. Das ist liquidit\xE4tsschonend f\xFCr KMU mit langen Zahlungsfristen: die MWST muss erst abgef\xFChrt werden, wenn das Geld tats\xE4chlich da ist."},{id:"b4-6-C3",typ:"interpretation",label:"C3 \xB7 Welche Methode f\xFCr welche Branche?",text:"Du ber\xE4tst zwei KMU: eine kleine Treuhand-Firma (lange Zahlungsfristen, 60\u201390 Tage) und einen Detailhandel (sofortige Barzahlung). Welche Methode (vereinbart oder vereinnahmt) empfiehlst du jeweils und warum?",musterloesung:["Treuhand-Firma: Vereinnahmtes Entgelt (Istversteuerung). Bei langen Zahlungsfristen m\xFCsste sie sonst MWST abf\xFChren, bevor das Geld eingeht. Das belastet die Liquidit\xE4t.","Detailhandel: Vereinbartes Entgelt reicht v\xF6llig, weil Rechnungsstellung und Zahlung praktisch zusammenfallen. Der Unterschied w\xE4re marginal.","Praxis-Tipp: Wer Istversteuerung will, muss sie bei der ESTV BEANTRAGEN. Die Sollversteuerung ist die Standard-Variante.","Strategischer Aspekt: Bei wachsendem Gesch\xE4ft mit hohem Forderungsbestand spart Istversteuerung viel Liquidit\xE4t, weil die MWST-Vorfinanzierung wegf\xE4llt."]},{typ:"abschnitt",label:"Teil D \xB7 Formale Rechnungsanforderungen",farbe:"#D97706",intro:"Damit der Vorsteuerabzug von der ESTV akzeptiert wird, muss eine Rechnung gem\xE4ss Art. 26 MWSTG bestimmte Pflichtangaben enthalten. Du pr\xFCfst Rechnungen auf Vollst\xE4ndigkeit."},{id:"b4-6-D1",typ:"multiplechoice",label:"D1 \xB7 Pflichtangaben \u2014 was MUSS drauf?",text:"Welche der folgenden Angaben sind NICHT zwingend auf einer MWST-konformen Rechnung \xFCber CHF 5'000 erforderlich?",antworten:["MWST-Nummer (UID) des Leistungserbringers","Name und Ort des Leistungsempf\xE4ngers","Bankverbindung des Leistungserbringers","Datum oder Zeitraum der Leistung"],korrekt:2,loesung:"Bankverbindung ist NICHT erforderlich (sie ist nur praktisch f\xFCr die Zahlung). Zwingend sind: Name und Ort beider Parteien, MWST-Nummer Leistungserbringer, Datum, Art und Umfang der Leistung, Entgelt netto, Steuersatz und MWST-Betrag."},{id:"b4-6-D2",typ:"multiplechoice",label:"D2 \xB7 Kleinbetragsrechnung",text:"Eine Rechnung \xFCber CHF 350 f\xFCr B\xFCrobedarf tr\xE4gt keinen Namen des Empf\xE4ngers. Was gilt?",antworten:["Vorsteuerabzug wird verweigert","Kleinbetragsrechnungen bis CHF 400 d\xFCrfen Name und Adresse des Empf\xE4ngers weglassen","Vorsteuerabzug nur zu 50%","Rechnung muss neu ausgestellt werden"],korrekt:1,loesung:"Kleinbetragsrechnungen bis CHF 400 (inkl. MWST) d\xFCrfen Punkte 3 (Name Leistungsempf\xE4nger) und 4 (Datum/Zeitraum der Leistung) weglassen. Die anderen Pflichtangaben m\xFCssen aber vollst\xE4ndig sein. Vorsteuerabzug ist trotzdem m\xF6glich."},{id:"b4-6-D3",typ:"interpretation",label:"D3 \xB7 Rechnungs-Check in der Praxis",text:"Eine Rechnung von einem Lieferanten erreicht dich. Sie enth\xE4lt: Lieferantenname, Datum, Position \xABBeratungsleistung\xBB mit Betrag CHF 8'100 inkl. 8.1% MWST. Es fehlen: MWST-Nummer des Lieferanten und der Hinweis auf den Steuersatz. Akzeptierst du den Vorsteuerabzug? Begr\xFCnde.",musterloesung:["Vorsteuerabzug verweigern oder Rechnung zur Korrektur zur\xFCckschicken.","Die MWST-Nummer (UID mit Zusatz \xABMWST\xBB) ist eine zwingende Pflichtangabe gem\xE4ss Art. 26 MWSTG. Ohne sie kann die ESTV den Vorsteuerabzug bei einer Revision r\xFCckwirkend streichen.","Auch der Hinweis auf den Steuersatz ist Pflicht (bei gemischten Rechnungen sogar pro Position).","Praxis-Vorgehen: Lieferant kontaktieren, korrekte Rechnung anfordern, dann erst buchen und Vorsteuer geltend machen. Niemals \xAB\xFCber das fehlende Detail hinweg schauen\xBB \u2014 das ist ein klassischer Revisionsfehler.","Strategischer Tipp: Etabliere im eigenen Unternehmen einen Eingangsrechnungs-Check als Standardprozess. Das vermeidet R\xFCckforderungen und Strafzinsen."]},{typ:"abschnitt",label:"Teil E · Zusatzübungen",farbe:"#0F766E",intro:"Kurze Wiederholung zur Wertschöpfungskette und zu den Steuerbefreiungen."},{id:"b4-6-Z1",typ:"kennzahl",label:"Z1 · Netto-Schuld einer Stufe",text:"Ein Grosshändler kauft Ware für netto CHF 500 ein und verkauft sie für netto CHF 700 weiter (alles 8.1%). Wie hoch ist seine Netto-Schuld an die ESTV (CHF, 2 Dezimalstellen)?",erwartet:16.2,einheit:"CHF",toleranz:.01,loesung:"Ausgangs-MWST = 700 × 8.1% = 56.70. Vorsteuer = 500 × 8.1% = 40.50. Netto-Schuld = 56.70 − 40.50 = CHF 16.20 (8.1% auf den Mehrwert von 200)."},{id:"b4-6-Z2",typ:"kennzahl",label:"Z2 · MWST auf Endpreis",text:"Der Endkonsument zahlt für die Ware aus Z1 netto CHF 700 plus MWST. Wie viel MWST steckt total im Endpreis (CHF)?",erwartet:56.7,einheit:"CHF",toleranz:.01,loesung:"MWST total = 700 × 8.1% = CHF 56.70. Genau dieser Betrag wird über alle Stufen verteilt an die ESTV abgeliefert."},{id:"b4-6-Z3",typ:"multiplechoice",label:"Z3 · Export richtig einordnen",text:"Ein Schweizer Hersteller exportiert Ware nach Frankreich. Wie ist dieser Umsatz einzuordnen?",antworten:["Echte Steuerbefreiung (Vorsteuerabzug möglich)","Unechte Steuerbefreiung (kein Vorsteuerabzug)","Normalsatz 8.1%","Sondersatz 3.8%"],korrekt:0,loesung:"Echte Steuerbefreiung nach Art. 23 MWSTG. Exporte sind steuerfrei, der Vorsteuerabzug bleibt aber erhalten. Das verhindert eine Doppelbelastung im Ausland."}]},b4_aufgabe7={title:"Aufgabe 7: Repetition · Rechnen mit der MWST",subtitle:"Brutto, Netto und MWST-Betrag über alle drei Sätze · Drill",tabLabel:"Repetition Rechnen",context:"Reine Rechen-Repetition. Trainiere die Umrechnung Brutto/Netto und das Isolieren des MWST-Betrags, bis es sitzt. Normalsatz 8.1%, reduzierter Satz 2.6%, Sondersatz 3.8%.",theorie:{title:"Kurz-Repetition: Die drei Rechnungen",blocks:[{type:"formel",text:"Netto = Brutto ÷ (1 + Satz)   |   Brutto = Netto × (1 + Satz)   |   MWST = Brutto − Netto"},{type:"list",items:["Normalsatz 8.1%: Faktor 1.081","Reduzierter Satz 2.6%: Faktor 1.026","Sondersatz 3.8%: Faktor 1.038"]},{type:"merksatz",text:"Aus Brutto wird Netto durch Teilen, aus Netto wird Brutto durch Mal-Nehmen. Der MWST-Betrag ist immer die Differenz der beiden."}]},faelle:[{typ:"abschnitt",label:"Teil A · Netto aus Brutto (8.1%)",farbe:"#1B6B63"},{id:"b4-7-A1",typ:"kennzahl",label:"A1 · Netto aus Brutto",text:"Brutto CHF 1'081 inkl. 8.1% MWST. Netto-Betrag (CHF)?",erwartet:1000,einheit:"CHF",toleranz:.5,loesung:"Netto = 1'081 ÷ 1.081 = CHF 1'000.00. MWST = CHF 81.00."},{id:"b4-7-A2",typ:"kennzahl",label:"A2 · Netto aus Brutto",text:"Brutto CHF 5'405 inkl. 8.1% MWST. Netto-Betrag (CHF)?",erwartet:5000,einheit:"CHF",toleranz:.5,loesung:"Netto = 5'405 ÷ 1.081 = CHF 5'000.00. MWST = CHF 405.00."},{id:"b4-7-A3",typ:"kennzahl",label:"A3 · Netto aus Brutto",text:"Brutto CHF 2'162 inkl. 8.1% MWST. Netto-Betrag (CHF)?",erwartet:2000,einheit:"CHF",toleranz:.5,loesung:"Netto = 2'162 ÷ 1.081 = CHF 2'000.00. MWST = CHF 162.00."},{id:"b4-7-A4",typ:"kennzahl",label:"A4 · Netto aus Brutto",text:"Brutto CHF 3'243 inkl. 8.1% MWST. Netto-Betrag (CHF)?",erwartet:3000,einheit:"CHF",toleranz:.5,loesung:"Netto = 3'243 ÷ 1.081 = CHF 3'000.00. MWST = CHF 243.00."},{typ:"abschnitt",label:"Teil B · Brutto aus Netto (8.1%)",farbe:"#1D4ED8"},{id:"b4-7-B1",typ:"kennzahl",label:"B1 · Brutto aus Netto",text:"Netto CHF 1'000 zzgl. 8.1% MWST. Brutto-Betrag (CHF)?",erwartet:1081,einheit:"CHF",toleranz:.5,loesung:"Brutto = 1'000 × 1.081 = CHF 1'081.00."},{id:"b4-7-B2",typ:"kennzahl",label:"B2 · Brutto aus Netto",text:"Netto CHF 2'500 zzgl. 8.1% MWST. Brutto-Betrag (CHF)?",erwartet:2702.5,einheit:"CHF",toleranz:.5,loesung:"Brutto = 2'500 × 1.081 = CHF 2'702.50."},{id:"b4-7-B3",typ:"kennzahl",label:"B3 · Brutto aus Netto",text:"Netto CHF 800 zzgl. 8.1% MWST. Brutto-Betrag (CHF)?",erwartet:864.8,einheit:"CHF",toleranz:.5,loesung:"Brutto = 800 × 1.081 = CHF 864.80."},{id:"b4-7-B4",typ:"kennzahl",label:"B4 · Brutto aus Netto",text:"Netto CHF 12'000 zzgl. 8.1% MWST. Brutto-Betrag (CHF)?",erwartet:12972,einheit:"CHF",toleranz:.5,loesung:"Brutto = 12'000 × 1.081 = CHF 12'972.00."},{typ:"abschnitt",label:"Teil C · MWST-Betrag isolieren (8.1%)",farbe:"#15803D"},{id:"b4-7-C1",typ:"kennzahl",label:"C1 · MWST aus Brutto",text:"Brutto CHF 1'081 inkl. 8.1% MWST. Wie hoch ist die MWST (CHF)?",erwartet:81,einheit:"CHF",toleranz:.5,loesung:"Netto = 1'081 ÷ 1.081 = 1'000. MWST = 1'081 − 1'000 = CHF 81.00."},{id:"b4-7-C2",typ:"kennzahl",label:"C2 · MWST aus Brutto",text:"Brutto CHF 4'324 inkl. 8.1% MWST. Wie hoch ist die MWST (CHF)?",erwartet:324,einheit:"CHF",toleranz:.5,loesung:"Netto = 4'324 ÷ 1.081 = 4'000. MWST = CHF 324.00."},{id:"b4-7-C3",typ:"kennzahl",label:"C3 · MWST aus Netto",text:"Netto CHF 6'000, Normalsatz 8.1%. Wie hoch ist die MWST (CHF)?",erwartet:486,einheit:"CHF",toleranz:.5,loesung:"MWST = 6'000 × 8.1% = CHF 486.00."},{typ:"abschnitt",label:"Teil D · Reduzierter Satz 2.6%",farbe:"#7E22CE"},{id:"b4-7-D1",typ:"kennzahl",label:"D1 · Netto aus Brutto",text:"Lebensmittel brutto CHF 1'026 inkl. 2.6% MWST. Netto-Betrag (CHF)?",erwartet:1000,einheit:"CHF",toleranz:.5,loesung:"Netto = 1'026 ÷ 1.026 = CHF 1'000.00. MWST = CHF 26.00."},{id:"b4-7-D2",typ:"kennzahl",label:"D2 · Brutto aus Netto",text:"Netto CHF 500 zzgl. 2.6% MWST. Brutto-Betrag (CHF)?",erwartet:513,einheit:"CHF",toleranz:.5,loesung:"Brutto = 500 × 1.026 = CHF 513.00."},{id:"b4-7-D3",typ:"kennzahl",label:"D3 · MWST aus Brutto",text:"Brutto CHF 2'052 inkl. 2.6% MWST. Wie hoch ist die MWST (CHF)?",erwartet:52,einheit:"CHF",toleranz:.5,loesung:"Netto = 2'052 ÷ 1.026 = 2'000. MWST = CHF 52.00."},{typ:"abschnitt",label:"Teil E · Sondersatz 3.8% (Beherbergung)",farbe:"#D97706"},{id:"b4-7-E1",typ:"kennzahl",label:"E1 · Brutto aus Netto",text:"Hotelübernachtung netto CHF 200 zzgl. 3.8% MWST. Brutto-Betrag (CHF)?",erwartet:207.6,einheit:"CHF",toleranz:.5,loesung:"Brutto = 200 × 1.038 = CHF 207.60."},{id:"b4-7-E2",typ:"kennzahl",label:"E2 · Netto aus Brutto",text:"Hotelrechnung brutto CHF 1'038 inkl. 3.8% MWST. Netto-Betrag (CHF)?",erwartet:1000,einheit:"CHF",toleranz:.5,loesung:"Netto = 1'038 ÷ 1.038 = CHF 1'000.00. MWST = CHF 38.00."},{id:"b4-7-E3",typ:"kennzahl",label:"E3 · MWST aus Brutto",text:"Hotelrechnung brutto CHF 519 inkl. 3.8% MWST. Wie hoch ist die MWST (CHF)?",erwartet:19,einheit:"CHF",toleranz:.5,loesung:"Netto = 519 ÷ 1.038 = 500. MWST = CHF 19.00."}]},b4_aufgabe8={title:"Aufgabe 8: Repetition · Buchungen mit MWST",subtitle:"Vorsteuer, Umsatzsteuer und Abrechnung mit der ESTV · Drill",tabLabel:"Repetition Buchen",context:"Buchungs-Repetition. Jede Rechnung wird brutto auf Forderung bzw. Verbindlichkeit gebucht, der Erfolg netto, die MWST separat (Vorsteuer als Aktivkonto, Umsatzsteuer als Passivkonto).",theorie:{title:"Kurz-Repetition: Die zwei Grundmuster",blocks:[{type:"formel",text:"Einkauf:  Aufwand (netto) + Vorsteuer = Verbindlichkeit (brutto)"},{type:"formel",text:"Verkauf:  Forderung (brutto) = Ertrag (netto) + Umsatzsteuer"},{type:"merksatz",text:"Vorsteuer ist ein Guthaben bei der ESTV (Aktiv), Umsatzsteuer eine Schuld (Passiv). Die Differenz wird periodisch abgerechnet."}]},faelle:[{typ:"abschnitt",label:"Teil A · Vorsteuer beim Einkauf (8.1%)",farbe:"#1B6B63",intro:"Bruttobetrag auf Verbindlichkeit/Bank, Aufwand netto, MWST auf Vorsteuer (Aktivkonto)."},{id:"b4-8-A1",label:"A1 · Wareneinkauf",text:"Wareneinkauf brutto CHF 2'162 (inkl. 8.1% MWST) auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:2000},{sollKeys:["vorsteuer"],habenKeys:["verbindlichkeiten"],betrag:162}]]},{id:"b4-8-A2",label:"A2 · Maschinenkauf",text:"Maschinenkauf brutto CHF 32'430 (inkl. 8.1% MWST), Zahlung über Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["maschinen"],habenKeys:["bank"],betrag:30000},{sollKeys:["vorsteuer"],habenKeys:["bank"],betrag:2430}]]},{id:"b4-8-A3",label:"A3 · Büromaterial bar",text:"Büromaterial brutto CHF 540.50 (inkl. 8.1% MWST), Barzahlung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["kasse"],betrag:500},{sollKeys:["vorsteuer"],habenKeys:["kasse"],betrag:40.5}]]},{typ:"abschnitt",label:"Teil B · Umsatzsteuer beim Verkauf (8.1%)",farbe:"#1D4ED8",intro:"Bruttobetrag auf Forderung/Bank, Ertrag netto, MWST auf Umsatzsteuer (Passivkonto)."},{id:"b4-8-B1",label:"B1 · Warenverkauf",text:"Warenverkauf brutto CHF 10'810 (inkl. 8.1% MWST) auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag","betriebsertrag"],betrag:10000},{sollKeys:["forderungen"],habenKeys:["mwstpflicht"],betrag:810}]]},{id:"b4-8-B2",label:"B2 · Dienstleistung",text:"Beratungsleistung brutto CHF 3'243 (inkl. 8.1% MWST), Zahlung über Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["dienstleistungsertrag"],betrag:3000},{sollKeys:["bank"],habenKeys:["mwstpflicht"],betrag:243}]]},{id:"b4-8-B3",label:"B3 · Verkauf auf Rechnung",text:"Verkauf brutto CHF 1'621.50 (inkl. 8.1% MWST) auf Rechnung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["forderungen"],habenKeys:["betriebsertrag","warenertrag"],betrag:1500},{sollKeys:["forderungen"],habenKeys:["mwstpflicht"],betrag:121.5}]]},{typ:"abschnitt",label:"Teil C · Reduzierter und Sondersatz",farbe:"#7E22CE"},{id:"b4-8-C1",label:"C1 · Lebensmittel 2.6%",text:"Lebensmittel-Einkauf brutto CHF 1'026 (inkl. 2.6% MWST), Barzahlung. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["kasse"],betrag:1000},{sollKeys:["vorsteuer"],habenKeys:["kasse"],betrag:26}]]},{id:"b4-8-C2",label:"C2 · Hotelübernachtung 3.8%",text:"Verkauf einer Hotelübernachtung brutto CHF 1'038 (inkl. 3.8% MWST), Zahlung über Bank. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["dienstleistungsertrag"],betrag:1000},{sollKeys:["bank"],habenKeys:["mwstpflicht"],betrag:38}]]},{typ:"abschnitt",label:"Teil D · Abrechnung mit der ESTV",farbe:"#A85930",intro:"Umsatzsteuer und Vorsteuer werden verrechnet, der Saldo (Zahllast) an die ESTV überwiesen."},{id:"b4-8-D1",typ:"kennzahl",label:"D1 · Zahllast berechnen",text:"Quartal: Umsatzsteuer-Saldo CHF 24'300, Vorsteuer-Saldo CHF 13'800. Zahllast an die ESTV (CHF)?",erwartet:10500,einheit:"CHF",toleranz:0,loesung:"Zahllast = 24'300 − 13'800 = CHF 10'500."},{id:"b4-8-D2",label:"D2 · Verrechnung der Konten",text:"Buche die Verrechnung von Umsatzsteuer und Vorsteuer (kleinerer Betrag CHF 13'800).",loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["vorsteuer"],betrag:13800}]]},{id:"b4-8-D3",label:"D3 · Zahlung an ESTV",text:"Der Restbetrag von CHF 10'500 wird an die ESTV überwiesen.",loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["bank"],betrag:10500}]]}]},b5_aufgabe1={title:"Aufgabe 1: Devisenmarkt und Umrechnungskurse",subtitle:"Devisen, Noten, FOREX und die verschiedenen Kursarten",tabLabel:"Aufgabe 1",context:"Wer mit dem Ausland handelt, rechnet in Fremdwährung ab \u2013 verbucht wird aber immer in Schweizer Franken. Diese Aufgabe legt die Grundlagen: Was sind Devisen, wie funktioniert der Devisenmarkt und welche Umrechnungskurse gibt es.",theorie:{title:"Theorie: Devisenmarkt und Kursarten",blocks:[{type:"text",text:"Schweizer Unternehmen kaufen und verkaufen weltweit, rechnen aber ihre Buchhaltung zwingend in Schweizer Franken (Art. 957a OR, Funktionalwährung CHF). Jeder Geschäftsfall in Fremdwährung muss deshalb in CHF umgerechnet werden. Massgebend ist der Wechselkurs zum Zeitpunkt des Geschäfts."},{type:"subtitle",text:"Devisenmarkt (FOREX)"},{type:"text",text:"Der Devisenmarkt (englisch Foreign Exchange, kurz FOREX) ist der weltweite Handelsplatz für Fremdwährungen. Er ist der grösste und liquideste Finanzmarkt der Welt und rund um die Uhr geöffnet. Hier bildet sich der Wechselkurs aus Angebot und Nachfrage."},{type:"subtitle",text:"Devisen und Noten"},{type:"list",items:["Devisen: Buchgeld in Fremdwährung (Bankguthaben, Forderungen). Für die Buchhaltung der Normalfall.","Noten (Sorten): Bargeld in Fremdwährung. Der Kurs ist schlechter als bei Devisen wegen höherer Handlingkosten."]},{type:"subtitle",text:"Die wichtigsten Kursarten"},{type:"list",items:["Tageskurs: tatsächlicher Kurs am Tag der Zahlung (von der Bank festgelegt). In der einfachen Methode ohne Fremdwährungskonten wird auch die laufende Verbuchung zum Tageskurs vorgenommen.","Buchkurs: fester interner Kurs, zu dem ein Fremdwährungskonto laufend geführt wird (Vierspalten-Methode).","Bilanzkurs: Kurs am 31.12. zur Bewertung offener Fremdwährungspositionen.","Briefkurs: Kurs beim Kauf von Devisen (wir kaufen Fremdwährung).","Geldkurs: Kurs beim Verkauf von Devisen (wir verkaufen Fremdwährung).","Mittelkurs: Durchschnitt aus Brief- und Geldkurs, häufig für die Verbuchung verwendet."]},{type:"vergleich",left:{title:"Wir kaufen Fremdwährung",text:"Zum Briefkurs (der teurere Kurs). Beispiel: Wir brauchen USD, um eine Lieferantenrechnung zu zahlen."},right:{title:"Wir verkaufen Fremdwährung",text:"Zum Geldkurs (der günstigere Kurs). Beispiel: Ein US-Kunde zahlt in USD, wir wechseln in CHF."}},{type:"beispiel",text:"Velowerk importiert Komponenten für USD 4'000. Tageskurs USD/CHF 0.90 (1 USD = CHF 0.90). Umrechnung: 4'000 \u00D7 0.90 = CHF 3'600. Genau dieser CHF-Betrag wird verbucht."},{type:"merksatz",text:"Gebucht wird immer in CHF. Aus Unternehmenssicht gilt: Fremdwährung kaufen zum Briefkurs, verkaufen zum Geldkurs. Die Differenz zwischen Brief und Geld ist die Marge der Bank."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Verständnis Devisenmarkt und Kursarten",farbe:"#1B6B63"},{id:"b5-1-A1",typ:"multiplechoice",label:"A1 \u00B7 Was sind Devisen?",text:"Was versteht man buchhalterisch unter Devisen?",antworten:["Buchgeld in Fremdwährung (Bankguthaben, Forderungen)","Bargeld (Münzen und Noten) in Fremdwährung","Edelmetalle wie Gold und Silber","Wertschriften in Fremdwährung"],korrekt:0,loesung:"Devisen sind Buchgeld in Fremdwährung, also Bankguthaben und Forderungen. Bargeld in Fremdwährung heisst Noten oder Sorten und hat einen schlechteren Kurs."},{id:"b5-1-A2",typ:"multiplechoice",label:"A2 \u00B7 Kauf von Fremdwährung",text:"Zu welchem Kurs kaufen wir als Unternehmen Fremdwährung (z.B. USD für eine Lieferantenzahlung)?",antworten:["Geldkurs","Briefkurs","Bilanzkurs","Durchschnittskurs"],korrekt:1,loesung:"Briefkurs. Aus Unternehmenssicht kaufen wir Fremdwährung zum (teureren) Briefkurs und verkaufen sie zum (günstigeren) Geldkurs. Die Differenz ist die Marge der Bank."},{id:"b5-1-A3",typ:"multiplechoice",label:"A3 \u00B7 Bewertung am Jahresende",text:"Welcher Kurs wird zur Bewertung offener Fremdwährungspositionen am 31.12. verwendet?",antworten:["Tageskurs","Buchkurs","Bilanzkurs","Briefkurs"],korrekt:2,loesung:"Bilanzkurs (auch Bilanzstichtagskurs). Offene Forderungen und Verbindlichkeiten in Fremdwährung werden am Bilanzstichtag zum Kurs vom 31.12. neu bewertet."},{id:"b5-1-A4",typ:"multiplechoice",label:"A4 \u00B7 Buchkurs",text:"Was ist der Buchkurs?",antworten:["Der Kurs am Bilanzstichtag","Der Durchschnitt aus Brief- und Geldkurs","Der von der SNB festgelegte amtliche Kurs","Ein fester interner Kurs für die laufende Kontoführung"],korrekt:3,loesung:"Der Buchkurs ist ein fester interner Kurs, zu dem ein Fremdwährungskonto laufend geführt wird. Er ist zentral für die Vierspalten-Fremdwährungsmethode."},{id:"b5-1-A5",typ:"multiplechoice",label:"A5 \u00B7 FOREX",text:"Was bezeichnet der Begriff FOREX?",antworten:["Den weltweiten Devisenmarkt","Die Schweizer Börse SIX","Eine Methode zur Absicherung","Die MWST auf Importe"],korrekt:0,loesung:"FOREX (Foreign Exchange) ist der weltweite Devisenmarkt \u2013 der grösste und liquideste Finanzmarkt der Welt, rund um die Uhr geöffnet."},{typ:"abschnitt",label:"Teil B \u00B7 Umrechnen Fremdwährung in CHF",farbe:"#1D4ED8",intro:"Umrechnung: Fremdwährungsbetrag \u00D7 Kurs = CHF-Betrag. Kursangabe USD/CHF 0.90 bedeutet: 1 USD = CHF 0.90."},{id:"b5-1-B1",typ:"kennzahl",label:"B1 \u00B7 USD in CHF",text:"Rechne USD 4'000 zum Tageskurs USD/CHF 0.90 in CHF um.",erwartet:3600,einheit:"CHF",toleranz:.5,loesung:"4'000 \u00D7 0.90 = CHF 3'600.00."},{id:"b5-1-B2",typ:"kennzahl",label:"B2 \u00B7 EUR in CHF",text:"Rechne EUR 2'500 zum Tageskurs EUR/CHF 0.96 in CHF um.",erwartet:2400,einheit:"CHF",toleranz:.5,loesung:"2'500 \u00D7 0.96 = CHF 2'400.00."},{id:"b5-1-B3",typ:"kennzahl",label:"B3 \u00B7 CHF in USD",text:"Wie viele USD erhält man für CHF 9'200 zum Kurs USD/CHF 0.92 (1 USD = CHF 0.92)?",erwartet:10000,einheit:"USD",toleranz:1,loesung:"9'200 \u00F7 0.92 = USD 10'000. Bei der Umrechnung von CHF in Fremdwährung wird durch den Kurs geteilt."},{typ:"abschnitt",label:"Teil C \u00B7 Reflexion",farbe:"#A85930"},{id:"b5-1-C1",typ:"interpretation",label:"C1 \u00B7 Devisen vs. Noten",text:"Worin unterscheiden sich Devisen und Noten, und warum ist der Kurs für Noten schlechter?",musterloesung:["Devisen sind Buchgeld in Fremdwährung (Bankguthaben, Überweisungen, Forderungen). Sie sind für den Geschäftsverkehr der Normalfall.","Noten (auch Sorten) sind physisches Bargeld in Fremdwährung (Geldscheine).","Der Notenkurs ist schlechter (für den Kunden teurer beim Kauf, billiger beim Verkauf), weil Bargeld höhere Kosten verursacht: Transport, Lagerung, Versicherung, Sicherheit, kein Zinsertrag.","Für die Buchhaltung relevant sind fast immer Devisenkurse, da Geschäftszahlungen über Bankkonten laufen."]}]};
b5_aufgabe2={title:"Aufgabe 2: Umrechnen \u00B7 Drill",subtitle:"Fremdwährung in CHF, CHF in Fremdwährung und Kursdifferenzen",tabLabel:"Aufgabe 2",context:"Reine Rechen-Repetition. Trainiere die Umrechnung in beide Richtungen und das Berechnen von Kursdifferenzen, bis es sitzt.",theorie:{title:"Kurz-Repetition: Die drei Rechnungen",blocks:[{type:"formel",text:"CHF = Fremdwährung \u00D7 Kurs   |   Fremdwährung = CHF \u00F7 Kurs   |   Kursdifferenz = CHF neu \u2212 CHF gebucht"},{type:"merksatz",text:"Kursangabe USD/CHF 0.90 heisst: 1 USD kostet CHF 0.90. Von Fremdwährung zu CHF wird mal-genommen, von CHF zu Fremdwährung geteilt."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Fremdwährung in CHF",farbe:"#1B6B63"},{id:"b5-2-A1",typ:"kennzahl",label:"A1 \u00B7 USD in CHF",text:"USD 7'500 zum Kurs 0.88. CHF-Betrag?",erwartet:6600,einheit:"CHF",toleranz:.5,loesung:"7'500 \u00D7 0.88 = CHF 6'600.00."},{id:"b5-2-A2",typ:"kennzahl",label:"A2 \u00B7 EUR in CHF",text:"EUR 12'000 zum Kurs 0.95. CHF-Betrag?",erwartet:11400,einheit:"CHF",toleranz:.5,loesung:"12'000 \u00D7 0.95 = CHF 11'400.00."},{id:"b5-2-A3",typ:"kennzahl",label:"A3 \u00B7 GBP in CHF",text:"GBP 3'000 zum Kurs 1.12. CHF-Betrag?",erwartet:3360,einheit:"CHF",toleranz:.5,loesung:"3'000 \u00D7 1.12 = CHF 3'360.00."},{typ:"abschnitt",label:"Teil B \u00B7 CHF in Fremdwährung",farbe:"#1D4ED8"},{id:"b5-2-B1",typ:"kennzahl",label:"B1 \u00B7 CHF in USD",text:"Wie viele USD erhält man für CHF 4'500 zum Kurs 0.90?",erwartet:5000,einheit:"USD",toleranz:1,loesung:"4'500 \u00F7 0.90 = USD 5'000."},{id:"b5-2-B2",typ:"kennzahl",label:"B2 \u00B7 CHF in EUR",text:"Wie viele EUR erhält man für CHF 9'600 zum Kurs 0.96?",erwartet:10000,einheit:"EUR",toleranz:1,loesung:"9'600 \u00F7 0.96 = EUR 10'000."},{typ:"abschnitt",label:"Teil C \u00B7 Kursdifferenzen",farbe:"#15803D",intro:"Eine Position wird zu einem Kurs gebucht und später zu einem anderen Kurs abgerechnet. Die Differenz in CHF ist der Kursgewinn oder Kursverlust."},{id:"b5-2-C1",typ:"kennzahl",label:"C1 \u00B7 CHF-Betrag bei Zahlung",text:"Eine Forderung USD 6'000 wurde zum Tageskurs 0.90 gebucht (CHF 5'400). Der Zahlungseingang erfolgt zum Kurs 0.94. Wie hoch ist der CHF-Betrag des Eingangs?",erwartet:5640,einheit:"CHF",toleranz:.5,loesung:"6'000 \u00D7 0.94 = CHF 5'640.00."},{id:"b5-2-C2",typ:"kennzahl",label:"C2 \u00B7 Kursdifferenz",text:"Wie hoch ist die Kursdifferenz aus C1 (CHF 5'640 erhalten, CHF 5'400 gebucht)?",erwartet:240,einheit:"CHF",toleranz:.5,loesung:"5'640 \u2212 5'400 = CHF 240. Da wir auf eine Forderung mehr CHF erhalten als gebucht, ist es ein Kursgewinn."},{id:"b5-2-C3",typ:"multiplechoice",label:"C3 \u00B7 Gewinn oder Verlust?",text:"Wir haben eine Verbindlichkeit in USD. Der Kurs steigt von 0.90 auf 0.94, bevor wir zahlen. Was entsteht?",antworten:["Kursgewinn","Keine Differenz","Kursverlust","Hängt vom Betrag ab"],korrekt:2,loesung:"Kursverlust. Bei einer Verbindlichkeit in Fremdwährung führt ein steigender Kurs zu einem Verlust, weil wir für die gleiche Fremdwährungsschuld mehr CHF aufwenden müssen."}]};
b5_aufgabe3={title:"Aufgabe 3: Verbuchung ohne Fremdwährungskonten",subtitle:"Einfache Methode \u00B7 Umrechnung zum Tageskurs, Kursdifferenz bei Zahlung",tabLabel:"Aufgabe 3",context:"Bei der einfachen Methode wird jeder Geschäftsfall sofort zum Tageskurs in CHF umgerechnet und verbucht. Die Kursdifferenz entsteht bei der Zahlung, wenn der Kurs vom Buchungskurs abweicht.",theorie:{title:"Theorie: Verbuchung ohne Fremdwährungskonten",blocks:[{type:"text",text:"Die einfachste Methode kommt ohne separate Fremdwährungskonten aus. Jeder Geschäftsfall wird im Moment der Buchung zum Tageskurs in CHF umgerechnet. Es wird also gar kein Fremdwährungsbetrag im Konto geführt, sondern direkt der CHF-Gegenwert."},{type:"subtitle",text:"Wann entsteht eine Kursdifferenz?"},{type:"text",text:"Solange Rechnung und Zahlung zum gleichen Kurs erfolgen, gibt es keine Differenz. Weicht der Kurs am Zahlungstag vom Buchungskurs ab, entsteht ein Kursgewinn oder Kursverlust. Dieser wird über die Erfolgsrechnung gebucht (Finanzergebnis)."},{type:"vergleich",left:{title:"Verbindlichkeit (wir schulden)",text:"Kurs steigt = Kursverlust (wir zahlen mehr CHF). Kurs sinkt = Kursgewinn (wir zahlen weniger CHF)."},right:{title:"Forderung (man schuldet uns)",text:"Kurs steigt = Kursgewinn (wir erhalten mehr CHF). Kurs sinkt = Kursverlust (wir erhalten weniger CHF)."}},{type:"beispiel",text:"Einkauf USD 5'000 zum Kurs 0.92: Warenaufwand / Verbindlichkeiten CHF 4'600. Zahlung später zum Kurs 0.95 (USD 5'000 = CHF 4'750): Verbindlichkeiten 4'600 + Kursverlust 150 / Bank 4'750."},{type:"merksatz",text:"Ohne Fremdwährungskonten: bei der Zahlung wird die ursprünglich gebuchte CHF-Schuld bzw. -Forderung ausgebucht, die Differenz zum effektiven CHF-Betrag läuft über Kursgewinn oder Kursverlust."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Verbindlichkeit in Fremdwährung",farbe:"#1B6B63",intro:"Wir kaufen Waren in USD auf Kredit und bezahlen später. Der Kurs steigt zwischen Einkauf und Zahlung."},{id:"b5-3-A1",label:"A1 \u00B7 Wareneinkauf",text:"Wareneinkauf USD 5'000 auf Kredit, Tageskurs 0.92.",loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:4600}]]},{id:"b5-3-A2",label:"A2 \u00B7 Zahlung mit Kursverlust",text:"Bezahlung der Verbindlichkeit USD 5'000 ab Bank, Tageskurs jetzt 0.95. Buche Ausgleich der Schuld und Kursdifferenz. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:4600},{sollKeys:["warenaufwand"],habenKeys:["bank"],betrag:150}]]},{typ:"abschnitt",label:"Teil B \u00B7 Forderung in Fremdwährung",farbe:"#1D4ED8",intro:"Wir verkaufen Waren in USD auf Kredit. Der Kurs steigt zwischen Rechnung und Zahlungseingang."},{id:"b5-3-B1",label:"B1 \u00B7 Warenverkauf",text:"Warenverkauf USD 8'000 auf Kredit, Tageskurs 0.90.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag","betriebsertrag"],betrag:7200}]]},{id:"b5-3-B2",label:"B2 \u00B7 Zahlungseingang mit Kursgewinn",text:"Zahlungseingang USD 8'000 auf die Bank, Tageskurs jetzt 0.93. Buche Eingang und Kursdifferenz. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:7200},{sollKeys:["bank"],habenKeys:["warenertrag","betriebsertrag"],betrag:240}]]},{typ:"abschnitt",label:"Teil C \u00B7 Reflexion",farbe:"#A85930"},{id:"b5-3-C1",typ:"interpretation",label:"C1 \u00B7 Wann Gewinn, wann Verlust?",text:"Erkläre in eigenen Worten, warum bei einer Verbindlichkeit ein steigender Kurs zum Verlust führt, bei einer Forderung aber zum Gewinn.",musterloesung:["Verbindlichkeit: Wir schulden einen festen Fremdwährungsbetrag (z.B. USD 5'000). Steigt der Kurs, kostet dieser Betrag mehr CHF. Wir müssen mehr CHF aufwenden als ursprünglich gebucht \u2192 Kursverlust.","Forderung: Man schuldet uns einen festen Fremdwährungsbetrag. Steigt der Kurs, erhalten wir beim Eingang mehr CHF als gebucht \u2192 Kursgewinn.","Spiegelbildlich gilt: Sinkt der Kurs, ist es bei der Verbindlichkeit ein Gewinn und bei der Forderung ein Verlust.","Merkhilfe: Bei der Forderung bewegt sich der Erfolg in die gleiche Richtung wie der Kurs, bei der Verbindlichkeit in die entgegengesetzte."]}]};
b5_aufgabe4={title:"Aufgabe 4: Vierspalten-Fremdwährungsmethode",subtitle:"Velowerk GmbH \u00B7 Konto Kreditoren USD führen und abschliessen",tabLabel:"Aufgabe 4",context:"Bei der Vierspalten-Methode wird ein Fremdwährungskonto mit vier Spalten geführt: Fremdwährung Soll, CHF Soll, Fremdwährung Haben, CHF Haben. Die Kursdifferenz zeigt sich beim Abschluss als CHF-Differenz, während die Fremdwährungsspalten ausgeglichen sind.",theorie:{title:"Theorie: Vierspalten-Fremdwährungsmethode",blocks:[{type:"text",text:"Wer regelmässig in Fremdwährung handelt, führt eigene Fremdwährungskonten (z.B. Kreditoren USD, Debitoren USD, Bank USD). Das Konto wird in der Fremdwährung UND in CHF geführt \u2013 daher die vier Spalten."},{type:"subtitle",text:"Aufbau des Kontos"},{type:"list",items:["Spalte 1: Fremdwährungsbetrag Soll (z.B. USD)","Spalte 2: CHF-Gegenwert Soll","Spalte 3: Fremdwährungsbetrag Haben (z.B. USD)","Spalte 4: CHF-Gegenwert Haben"]},{type:"subtitle",text:"Kursdifferenz beim Abschluss"},{type:"text",text:"Ist das Konto in der Fremdwährung ausgeglichen (Soll FW = Haben FW), die CHF-Spalten aber nicht, dann ist die CHF-Differenz die Kursdifferenz. Ein CHF-Überhang im Haben bei einer Verbindlichkeit bedeutet: wir haben weniger CHF bezahlt als geschuldet \u2192 Kursgewinn."},{type:"formel",text:"Kursdifferenz = CHF Haben \u2212 CHF Soll (bei ausgeglichener Fremdwährung)"},{type:"beispiel",text:"Kreditoren USD: Einkauf USD 10'000 zu 0.90 (Haben CHF 9'000). Zahlung USD 10'000 zu 0.88 (Soll CHF 8'800). Fremdwährung ist ausgeglichen, CHF-Differenz 200 \u2192 Buchung Kreditoren USD / Kursgewinn 200."},{type:"merksatz",text:"Die Vierspalten-Methode trennt sauber zwischen Fremdwährung und CHF. Die Kursdifferenz wird sichtbar, sobald die Fremdwährungsspalten ausgeglichen sind. Ausweis im Finanzergebnis der Erfolgsrechnung."}]},sachverhalt:{title:"Sachverhalt: Velowerk GmbH \u00B7 Konto Kreditoren USD",intro:"Velowerk importiert Velokomponenten aus den USA und führt dafür das Fremdwährungskonto Kreditoren USD nach der Vierspalten-Methode.",tabelle:{cols:["Datum","Vorgang","USD","Kurs","CHF"],rows:[["15.11.","Wareneinkauf auf Kredit","10'000","0.90","9'000"],["20.12.","Zahlung ab Bank","10'000","0.88","8'800"],["31.12.","Kursdifferenz (Abschluss)","\u2014","\u2014","?"]]}},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Buchungen",farbe:"#0F766E",intro:"Wir verbuchen Einkauf, Zahlung und den Abschluss des Fremdwährungskontos Kreditoren USD."},{id:"b5-4-A1",label:"A1 \u00B7 Wareneinkauf 15.11.",text:"Wareneinkauf USD 10'000 auf Kredit, Tageskurs 0.90.",loesungen:[[{sollKeys:["warenaufwand"],habenKeys:["verbindlichkeiten"],betrag:9000}]]},{id:"b5-4-A2",label:"A2 \u00B7 Zahlung 20.12.",text:"Bezahlung der Schuld USD 10'000 ab Bank, Tageskurs 0.88.",loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["bank"],betrag:8800}]]},{id:"b5-4-A3",label:"A3 \u00B7 Abschluss \u00B7 Kursdifferenz",text:"Das Konto Kreditoren USD ist in USD ausgeglichen, im CHF-Haben verbleibt ein Überhang von CHF 200. Buche die Kursdifferenz.",loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["warenaufwand"],betrag:200}]]},{typ:"abschnitt",label:"Teil B \u00B7 Berechnung und Reflexion",farbe:"#A85930"},{id:"b5-4-B1",typ:"kennzahl",label:"B1 \u00B7 Höhe der Kursdifferenz",text:"Das Konto Kreditoren USD zeigt im Haben CHF 9'000 (Einkauf zu 0.90) und im Soll CHF 8'800 (Zahlung zu 0.88). Wie hoch ist die Kursdifferenz (CHF)?",erwartet:200,einheit:"CHF",toleranz:0,loesung:"9'000 \u2212 8'800 = CHF 200. Wir haben für die gleiche USD-Schuld weniger CHF bezahlt \u2192 Kursgewinn von CHF 200."},{id:"b5-4-B2",typ:"interpretation",label:"B2 \u00B7 Vorteil der Vierspalten-Methode",text:"Welchen Vorteil bietet die Vierspalten-Methode gegenüber der Verbuchung ohne Fremdwährungskonten (Aufgabe 3)?",musterloesung:["Das Fremdwährungskonto zeigt jederzeit den offenen Bestand sowohl in Fremdwährung als auch in CHF \u2013 volle Transparenz pro Währung.","Die Kursdifferenz ergibt sich automatisch beim Abschluss aus der CHF-Differenz, sobald die Fremdwährungsspalten ausgeglichen sind. Man muss sie nicht pro Geschäftsfall einzeln berechnen.","Geeignet für Unternehmen mit vielen Fremdwährungsgeschäften, weil alle Bewegungen einer Währung auf einem Konto zusammenlaufen.","Nachteil: aufwändiger als die einfache Methode, weil pro Konto und Währung zwei Wertspalten geführt werden."]}]};
b5_aufgabe5={title:"Aufgabe 5: Währungsrisiken und Absicherung",subtitle:"Transaktions-, Translations- und ökonomisches Risiko \u00B7 Hedging",tabLabel:"Aufgabe 5",context:"Wer in Fremdwährung handelt, trägt ein Währungsrisiko. Diese Aufgabe unterscheidet die drei Risikoarten und zeigt, wie sich Unternehmen absichern.",theorie:{title:"Theorie: Währungsrisiken und Absicherung",blocks:[{type:"text",text:"Wechselkurse schwanken laufend. Für ein Unternehmen mit Fremdwährungsgeschäften entstehen daraus drei Arten von Risiken \u2013 sie unterscheiden sich darin, ob sie zahlungswirksam, buchhalterisch oder strategisch sind."},{type:"subtitle",text:"Die drei Währungsrisiken"},{type:"list",items:["Transaktionsrisiko: Risiko aus offenen Fremdwährungspositionen (Forderungen, Verbindlichkeiten) zwischen Rechnung und Zahlung. Direkt erfolgswirksam als Kursgewinn oder Kursverlust.","Translationsrisiko: Umrechnungsrisiko bei der Konsolidierung von Tochtergesellschaften in Fremdwährung in die Konzernbilanz. Buchhalterisch, nicht zahlungswirksam.","Ökonomisches Risiko: Langfristiges Risiko, dass Wechselkursänderungen die Wettbewerbsfähigkeit und künftige Cashflows beeinträchtigen. Strategisch, schwer messbar."]},{type:"subtitle",text:"Absicherungsgeschäfte (Hedging)"},{type:"list",items:["Devisentermingeschäft (Forward): den Kurs für eine künftige Zahlung heute fixieren.","Devisenoption: Recht (nicht Pflicht), zu einem fixen Kurs zu tauschen \u2013 gegen Prämie.","Natural Hedging: Einnahmen und Ausgaben in derselben Währung verrechnen \u2013 kostenlos.","Fremdwährungskonto: Beträge halten und erst bei gutem Kurs wechseln."]},{type:"merksatz",text:"Absicherung kostet Prämie oder Marge, reduziert aber die Planungsunsicherheit. Sie eliminiert vor allem das Transaktionsrisiko \u2013 das ökonomische Risiko bleibt grösstenteils bestehen."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Währungsrisiken zuordnen",farbe:"#1B6B63"},{id:"b5-5-A1",typ:"multiplechoice",label:"A1 \u00B7 Transaktionsrisiko",text:"Was beschreibt das Transaktionsrisiko?",antworten:["Die Umrechnung von Tochtergesellschaften in die Konzernbilanz","Die langfristige Wettbewerbsfähigkeit des Unternehmens","Das Risiko eines Zahlungsausfalls eines Kunden","Das Risiko aus offenen Fremdwährungspositionen zwischen Rechnung und Zahlung"],korrekt:3,loesung:"Das Transaktionsrisiko betrifft offene Fremdwährungspositionen (Forderungen, Verbindlichkeiten) zwischen Rechnung und Zahlung. Es ist direkt erfolgswirksam als Kursgewinn oder Kursverlust."},{id:"b5-5-A2",typ:"multiplechoice",label:"A2 \u00B7 Translationsrisiko",text:"Wann entsteht das Translationsrisiko?",antworten:["Bei jedem Einkauf im Ausland","Bei der Umrechnung von Tochtergesellschaften in die Konzernbilanz","Bei der Zahlung einer Fremdwährungsrechnung","Beim Bargeldwechsel am Bankschalter"],korrekt:1,loesung:"Das Translationsrisiko entsteht bei der Konsolidierung: ausländische Tochtergesellschaften müssen für die Konzernbilanz in CHF umgerechnet werden. Es ist buchhalterisch, nicht zahlungswirksam."},{id:"b5-5-A3",typ:"multiplechoice",label:"A3 \u00B7 Nicht zahlungswirksam",text:"Welches Risiko ist rein buchhalterisch und nicht zahlungswirksam?",antworten:["Translationsrisiko","Transaktionsrisiko","Ökonomisches Risiko","Alle drei sind zahlungswirksam"],korrekt:0,loesung:"Das Translationsrisiko. Es betrifft nur die Umrechnung in der Konzernbilanz und führt zu keinem echten Geldfluss. Transaktions- und ökonomisches Risiko wirken sich hingegen real aus."},{id:"b5-5-A4",typ:"multiplechoice",label:"A4 \u00B7 Devisentermingeschäft",text:"Was leistet ein Devisentermingeschäft (Forward)?",antworten:["Es ist ein Recht ohne Pflicht zum Tausch","Es fixiert heute den Kurs für eine künftige Zahlung","Es verlängert die Zahlungsfrist beim Lieferanten","Es reduziert die MWST auf Importe"],korrekt:1,loesung:"Ein Forward fixiert heute den Wechselkurs für eine bestimmte künftige Zahlung. Damit ist der CHF-Betrag im Voraus bekannt und das Transaktionsrisiko ausgeschaltet."},{id:"b5-5-A5",typ:"multiplechoice",label:"A5 \u00B7 Kostenlose Absicherung",text:"Welche Absicherung verursacht keine Prämie oder Gebühr?",antworten:["Devisenoption","Devisentermingeschäft","Natural Hedging","Kreditversicherung"],korrekt:2,loesung:"Natural Hedging. Indem Einnahmen und Ausgaben in derselben Währung verrechnet werden, reduziert sich das offene Risiko ohne zusätzliche Kosten."},{typ:"abschnitt",label:"Teil B \u00B7 Reflexion",farbe:"#A85930"},{id:"b5-5-B1",typ:"interpretation",label:"B1 \u00B7 Was Hedging leistet und was nicht",text:"Welches Risiko lässt sich durch ein Devisentermingeschäft gut absichern, welches bleibt grösstenteils bestehen? Begründe.",musterloesung:["Gut absicherbar ist das Transaktionsrisiko: Mit einem Forward wird der Kurs für eine konkrete künftige Zahlung fixiert. Der CHF-Betrag steht fest, Kursschwankungen bis zur Zahlung spielen keine Rolle mehr.","Das ökonomische Risiko bleibt grösstenteils bestehen: Es betrifft die langfristige Wettbewerbsfähigkeit (z.B. ein dauerhaft starker Franken verteuert Schweizer Exporte). Das lässt sich nicht mit einem einzelnen Termingeschäft absichern.","Auch das Translationsrisiko wird durch Termingeschäfte nur bedingt adressiert, da es buchhalterischer Natur ist.","Fazit: Hedging schafft Planungssicherheit für einzelne Geschäfte (Transaktionsebene), löst aber keine strukturellen, strategischen Währungsrisiken."]}]};
b5_aufgabe6={title:"Aufgabe 6: Synthese \u00B7 Forderung in Fremdwährung",subtitle:"Aqua Sea Diving GmbH \u00B7 Export in die USA mit Kursverlust",tabLabel:"Aufgabe 6",context:"Synthese zu Block 5: Die Aqua Sea Diving GmbH exportiert Tauchausrüstung in die USA und fakturiert in USD. Zwischen Rechnung und Zahlung sinkt der Kurs. Du verbuchst den Fall und ordnest ihn den Währungsrisiken zu.",theorie:{title:"Theorie: Was diese Aufgabe verbindet",blocks:[{type:"text",text:"Diese Aufgabe vereint die Themen von Block 5: Umrechnung zum Tageskurs, Verbuchung einer Fremdwährungsforderung, Berechnung der Kursdifferenz und die Einordnung ins Transaktionsrisiko."},{type:"vergleich",left:{title:"Forderung + Kurs sinkt",text:"Wir erhalten weniger CHF als gebucht \u2192 Kursverlust. Genau dieser Fall tritt hier ein."},right:{title:"Risiko-Einordnung",text:"Es handelt sich um ein Transaktionsrisiko: offene Forderung zwischen Rechnung und Zahlung, direkt erfolgswirksam."}},{type:"merksatz",text:"Wer diesen Fall sauber verbucht und einordnet, beherrscht den Kern von Block 5: Umrechnen, Kursdifferenz buchen, Risiko benennen."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Buchungen",farbe:"#7E22CE",intro:"Aqua Sea Diving verkauft Tauchausrüstung für USD 12'000 auf Kredit. Bei Rechnung Kurs 0.91, bei Zahlung Kurs 0.87."},{id:"b5-6-A1",label:"A1 \u00B7 Warenverkauf",text:"Verkauf von Tauchausrüstung USD 12'000 auf Kredit, Tageskurs 0.91.",loesungen:[[{sollKeys:["forderungen"],habenKeys:["warenertrag","betriebsertrag"],betrag:10920}]]},{id:"b5-6-A2",label:"A2 \u00B7 Zahlungseingang mit Kursverlust",text:"Zahlungseingang USD 12'000 auf die Bank, Tageskurs jetzt 0.87. Buche Eingang und Kursdifferenz. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["bank"],habenKeys:["forderungen"],betrag:10440},{sollKeys:["warenertrag","betriebsertrag"],habenKeys:["forderungen"],betrag:480}]]},{typ:"abschnitt",label:"Teil B \u00B7 Berechnung und Einordnung",farbe:"#A85930"},{id:"b5-6-B1",typ:"kennzahl",label:"B1 \u00B7 Höhe des Kursverlusts",text:"Die Forderung wurde mit CHF 10'920 gebucht (USD 12'000 \u00D7 0.91). Der Eingang beträgt USD 12'000 \u00D7 0.87. Wie hoch ist der Kursverlust (CHF)?",erwartet:480,einheit:"CHF",toleranz:.5,loesung:"Eingang = 12'000 \u00D7 0.87 = CHF 10'440. Kursverlust = 10'920 \u2212 10'440 = CHF 480. Da der Kurs auf einer Forderung gesunken ist, erhalten wir weniger CHF als gebucht."},{id:"b5-6-B2",typ:"multiplechoice",label:"B2 \u00B7 Welches Währungsrisiko?",text:"Welchem Währungsrisiko ist dieser Geschäftsfall zuzuordnen?",antworten:["Translationsrisiko","Ökonomisches Risiko","Kein Währungsrisiko","Transaktionsrisiko"],korrekt:3,loesung:"Transaktionsrisiko. Es geht um eine offene Forderung in Fremdwährung zwischen Rechnung und Zahlung. Die Kursänderung wirkt sich direkt erfolgswirksam aus (hier Kursverlust)."},{id:"b5-6-B3",typ:"interpretation",label:"B3 \u00B7 Wie hätte man sich absichern können?",text:"Wie hätte Aqua Sea Diving diesen Kursverlust vermeiden oder reduzieren können? Nenne mindestens zwei Möglichkeiten.",musterloesung:["Devisentermingeschäft (Forward): Bei Rechnungsstellung den Kurs 0.91 für den Zahlungseingang fixieren. Damit wäre der CHF-Betrag garantiert und der Verlust vermieden.","Natural Hedging: Wenn Aqua Sea Diving selbst Einkäufe in USD hat, könnte sie die USD-Einnahmen direkt für USD-Ausgaben verwenden, statt sie zu wechseln.","Kürzere Zahlungsfristen vereinbaren, um das Zeitfenster für Kursschwankungen zu verkleinern.","Fakturierung in CHF statt USD (sofern der Kunde das akzeptiert) \u2013 dann trägt der Kunde das Währungsrisiko.","Hinweis: Absicherung kostet je nach Instrument eine Prämie oder Marge. Bei kleinen Beträgen kann das Risiko bewusst getragen werden."]}]},b6_aufgabe1={title:"Aufgabe 1: Lohn und Sozialversicherungen",subtitle:"Bruttolohn, Abz\u00FCge, Nettolohn \u00B7 parit\u00E4tische und einseitige Beitr\u00E4ge",tabLabel:"Aufgabe 1",context:"Der Personalaufwand ist in vielen Unternehmen der gr\u00F6sste Aufwandsblock. Diese Aufgabe legt die Grundlagen: vom Bruttolohn zum Nettolohn, wer welche Sozialversicherungen tr\u00E4gt und wie sich Arbeitnehmer und Arbeitgeber die Beitr\u00E4ge teilen.",theorie:{title:"Theorie: Lohn und Sozialversicherungen",blocks:[{type:"text",text:"Wer Mitarbeitende besch\u00E4ftigt, zahlt nicht nur den Lohn, sondern auch Sozialversicherungsbeitr\u00E4ge. Ein Teil wird dem Arbeitnehmer vom Lohn abgezogen (Arbeitnehmeranteil), ein Teil tr\u00E4gt der Arbeitgeber zus\u00E4tzlich (Arbeitgeberanteil). Verbucht wird immer der volle Bruttolohn als Personalaufwand, die Abz\u00FCge werden als Verbindlichkeiten gegen\u00FCber den Sozialwerken erfasst."},{type:"subtitle",text:"Vom Bruttolohn zum Nettolohn"},{type:"text",text:"Der Bruttolohn ist der vereinbarte Lohn vor Abz\u00FCgen. Davon werden die Arbeitnehmerbeitr\u00E4ge abgezogen. Was \u00FCbrig bleibt und ausbezahlt wird, ist der Nettolohn."},{type:"formel",text:"Nettolohn = Bruttolohn \u2212 AHV/IV/EO \u2212 ALV \u2212 NBU \u2212 BVG (Arbeitnehmeranteil) \u2212 allf\u00E4llige Quellensteuer"},{type:"subtitle",text:"Parit\u00E4tische Beitr\u00E4ge (je 50%)"},{type:"list",items:["AHV/IV/EO: Alters-, Hinterlassenen-, Invaliden- und Erwerbsersatzversicherung. Total 10.6%, je 5.3% Arbeitnehmer und Arbeitgeber.","ALV: Arbeitslosenversicherung. Total 2.2%, je 1.1% Arbeitnehmer und Arbeitgeber."]},{type:"subtitle",text:"Einseitige Beitr\u00E4ge"},{type:"list",items:["Nur Arbeitnehmer: NBU (Nichtberufsunfallversicherung) sowie die Quellensteuer (nur bei bestimmten Personen).","Nur Arbeitgeber: BU (Berufsunfallversicherung), FAK (Familienausgleichskasse) und die Verwaltungskosten der Ausgleichskasse."]},{type:"subtitle",text:"BVG (2. S\u00E4ule)"},{type:"text",text:"Die berufliche Vorsorge (BVG, Pensionskasse) ist ab einem Jahreslohn von rund CHF 22'680 obligatorisch (Eintrittsschwelle, j\u00E4hrlich angepasst). Arbeitnehmer und Arbeitgeber teilen sich die Beitr\u00E4ge gem\u00E4ss Vorsorgereglement, wobei der Arbeitgeber mindestens die H\u00E4lfte tragen muss."},{type:"subtitle",text:"Quellensteuer"},{type:"text",text:"Bei ausl\u00E4ndischen Arbeitnehmenden ohne Niederlassungsbewilligung C wird die Einkommenssteuer direkt vom Lohn abgezogen (Quellensteuer) und vom Arbeitgeber ans Steueramt \u00FCberwiesen. Der Arbeitgeber haftet f\u00FCr die korrekte Ablieferung."},{type:"vergleich",left:{title:"Parit\u00E4tisch (50/50)",text:"AHV/IV/EO und ALV. Arbeitnehmer und Arbeitgeber zahlen je die H\u00E4lfte. Der Arbeitnehmeranteil wird vom Lohn abgezogen, der Arbeitgeberanteil kommt als zus\u00E4tzlicher Aufwand obendrauf."},right:{title:"Einseitig",text:"NBU und Quellensteuer tr\u00E4gt der Arbeitnehmer allein. BU, FAK und Verwaltungskosten tr\u00E4gt der Arbeitgeber allein. BVG wird gem\u00E4ss Reglement geteilt (AG mindestens 50%)."}},{type:"beispiel",text:"Bruttolohn CHF 6'000. Arbeitnehmerabz\u00FCge: AHV/IV/EO 5.3% = CHF 318, ALV 1.1% = CHF 66, NBU 1.4% = CHF 84, BVG-Anteil CHF 300. Summe Abz\u00FCge CHF 768. Nettolohn = 6'000 \u2212 768 = CHF 5'232. Zus\u00E4tzlich zahlt der Arbeitgeber seine eigenen Beitr\u00E4ge (AHV/IV/EO, ALV, BU, FAK, BVG)."},{type:"merksatz",text:"Verbucht wird immer der Bruttolohn als Personalaufwand. Die Arbeitnehmerabz\u00FCge mindern nicht den Aufwand, sondern werden zu Verbindlichkeiten gegen\u00FCber den Sozialwerken. Der Arbeitgeberanteil ist zus\u00E4tzlicher Aufwand (Sozialversicherungsaufwand)."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Verst\u00E4ndnis Sozialversicherungen",farbe:"#1B6B63"},{id:"b6-1-A1",typ:"multiplechoice",label:"A1 \u00B7 Parit\u00E4tische Beitr\u00E4ge",text:"Welche Sozialversicherungen werden parit\u00E4tisch, also je zur H\u00E4lfte von Arbeitnehmer und Arbeitgeber, getragen?",antworten:["AHV/IV/EO und ALV","NBU und FAK","Quellensteuer und BU","Nur die AHV"],korrekt:0,loesung:"AHV/IV/EO und ALV werden parit\u00E4tisch getragen: AHV/IV/EO total 10.6% (je 5.3%), ALV total 2.2% (je 1.1%). NBU tr\u00E4gt der Arbeitnehmer allein, BU und FAK der Arbeitgeber allein."},{id:"b6-1-A2",typ:"multiplechoice",label:"A2 \u00B7 Nichtberufsunfall",text:"Wer tr\u00E4gt \u00FCblicherweise die Pr\u00E4mie f\u00FCr die Nichtberufsunfallversicherung (NBU)?",antworten:["Der Arbeitgeber allein","Arbeitnehmer und Arbeitgeber je zur H\u00E4lfte","Der Arbeitnehmer allein","Die Ausgleichskasse"],korrekt:2,loesung:"Der Arbeitnehmer allein. Die NBU deckt Unf\u00E4lle in der Freizeit und wird vom Lohn abgezogen. Die Berufsunfallversicherung (BU) hingegen tr\u00E4gt der Arbeitgeber."},{id:"b6-1-A3",typ:"multiplechoice",label:"A3 \u00B7 Arbeitgeber allein",text:"Welche Beitr\u00E4ge tr\u00E4gt der Arbeitgeber allein?",antworten:["AHV-Arbeitnehmeranteil und NBU","BU (Berufsunfall) und FAK (Familienausgleichskasse)","ALV und Quellensteuer","BVG-Arbeitnehmeranteil"],korrekt:1,loesung:"BU und FAK tr\u00E4gt der Arbeitgeber allein, ebenso die Verwaltungskosten der Ausgleichskasse. Die FAK finanziert die Familienzulagen."},{id:"b6-1-A4",typ:"multiplechoice",label:"A4 \u00B7 Nettolohn",text:"Was versteht man unter dem Nettolohn?",antworten:["Den Lohn vor allen Abz\u00FCgen","Den Bruttolohn plus Arbeitgeberbeitr\u00E4ge","Den Bruttolohn minus die Arbeitnehmerabz\u00FCge (der ausbezahlte Betrag)","Nur die AHV-Beitr\u00E4ge"],korrekt:2,loesung:"Der Nettolohn ist der Bruttolohn abz\u00FCglich der Arbeitnehmerabz\u00FCge (AHV/IV/EO, ALV, NBU, BVG-Anteil, allf\u00E4llige Quellensteuer). Das ist der Betrag, der dem Mitarbeitenden tats\u00E4chlich ausbezahlt wird."},{id:"b6-1-A5",typ:"multiplechoice",label:"A5 \u00B7 Quellensteuer",text:"Wen betrifft die Quellensteuer und wie wird sie erhoben?",antworten:["Alle Arbeitnehmenden, einmal j\u00E4hrlich","Ausl\u00E4ndische Arbeitnehmende ohne Bewilligung C, direkt vom Lohn abgezogen","Nur Kaderangestellte, \u00FCber die Steuererkl\u00E4rung","Nur Arbeitgeber, als Gewinnsteuer"],korrekt:1,loesung:"Die Quellensteuer betrifft ausl\u00E4ndische Arbeitnehmende ohne Niederlassungsbewilligung C. Die Steuer wird direkt vom Lohn abgezogen und vom Arbeitgeber ans Steueramt abgeliefert. Der Arbeitgeber haftet f\u00FCr die korrekte Ablieferung."},{id:"b6-1-A6",typ:"multiplechoice",label:"A6 \u00B7 BVG-Obligatorium",text:"Ab welchem Jahreslohn ist die berufliche Vorsorge (BVG) grunds\u00E4tzlich obligatorisch?",antworten:["Ab dem ersten Franken","Ab rund CHF 22'680 (Eintrittsschwelle)","Ab CHF 100'000","Ab CHF 148'200"],korrekt:1,loesung:"Ab der BVG-Eintrittsschwelle von rund CHF 22'680 Jahreslohn (j\u00E4hrlich angepasst). Darunter besteht keine BVG-Pflicht. AHV/IV/EO und ALV greifen hingegen bereits ab dem ersten Franken."},{typ:"abschnitt",label:"Teil B \u00B7 Reflexion",farbe:"#A85930"},{id:"b6-1-B1",typ:"interpretation",label:"B1 \u00B7 Warum AN- und AG-Anteil trennen?",text:"Warum ist es f\u00FCr die Verbuchung wichtig, zwischen Arbeitnehmer- und Arbeitgeberanteil zu unterscheiden?",musterloesung:["Der Bruttolohn ist der gesamte Personalaufwand f\u00FCr die geleistete Arbeit und wird als Personalaufwand verbucht.","Der Arbeitnehmeranteil ist Teil des Bruttolohns. Er wird dem Mitarbeitenden abgezogen und entsteht nicht als zus\u00E4tzlicher Aufwand, sondern als Verbindlichkeit gegen\u00FCber den Sozialwerken.","Der Arbeitgeberanteil kommt zus\u00E4tzlich obendrauf und ist ein eigener Aufwand (Sozialversicherungsaufwand). Er erh\u00F6ht die effektiven Personalkosten \u00FCber den Bruttolohn hinaus.","Konsequenz: Die echten Personalkosten (Vollkosten) sind h\u00F6her als der Bruttolohn. Diese Lohnnebenkosten betragen oft 13 bis 15 Prozent des Bruttolohns.","Wer die Anteile vermischt, weist entweder den Aufwand falsch aus oder die Verbindlichkeiten gegen\u00FCber den Sozialwerken nicht korrekt."]},{id:"b6-1-B2",typ:"interpretation",label:"B2 \u00B7 Logik der Parit\u00E4t",text:"Was bedeutet \u00ABparit\u00E4tisch\u00BB und welche wirtschaftliche und sozialpolitische Logik steckt dahinter?",musterloesung:["Parit\u00E4tisch bedeutet, dass Arbeitnehmer und Arbeitgeber den Beitrag je zur H\u00E4lfte tragen (AHV/IV/EO, ALV).","Sozialpolitische Logik: Die Last der sozialen Sicherung wird zwischen Arbeit und Kapital geteilt. Beide Seiten profitieren vom System (sichere Renten, sozialer Frieden).","Wirtschaftliche Logik: Der Arbeitgeberanteil ist faktisch Teil der Lohnkosten. Aus Unternehmenssicht z\u00E4hlt nicht der Bruttolohn, sondern die Vollkosten inklusive Arbeitgeberbeitr\u00E4ge.","Nicht alles ist parit\u00E4tisch: NBU trifft das Freizeitrisiko des Arbeitnehmers, BU und FAK liegen in der Verantwortung des Arbeitgebers. Diese einseitige Zuordnung folgt dem Verursacher- und Schutzgedanken.","In der Lohnabrechnung muss daher pro Beitragsart klar sein, wer zahlt, damit Abz\u00FCge und Arbeitgeberaufwand korrekt erfasst werden."]}]},b6_aufgabe2={title:"Aufgabe 2: Brutto zu Netto \u00B7 Drill",subtitle:"Arbeitnehmerabz\u00FCge berechnen und den Nettolohn ermitteln",tabLabel:"Aufgabe 2",context:"Reine Rechen-Repetition. Trainiere die Berechnung der Arbeitnehmerabz\u00FCge und des Nettolohns, bis es sitzt. F\u00FCr diese Aufgabe gelten: AHV/IV/EO 5.3%, ALV 1.1%, NBU 1.4% (alles Arbeitnehmeranteile). BVG und Quellensteuer sind je als Betrag angegeben.",theorie:{title:"Kurz-Repetition: Die Rechnung",blocks:[{type:"formel",text:"Abzug = Bruttolohn \u00D7 Satz   |   Nettolohn = Bruttolohn \u2212 Summe aller Abz\u00FCge"},{type:"list",items:["AHV/IV/EO Arbeitnehmer: 5.3%","ALV Arbeitnehmer: 1.1%","NBU Arbeitnehmer: 1.4% (Beispielsatz)"]},{type:"merksatz",text:"Erst die einzelnen Abz\u00FCge rechnen, dann alle vom Bruttolohn abziehen. BVG und Quellensteuer sind feste Betr\u00E4ge gem\u00E4ss Angabe, keine Prozente vom Bruttolohn."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Einzelabz\u00FCge (Bruttolohn CHF 6'000)",farbe:"#1B6B63"},{id:"b6-2-A1",typ:"kennzahl",label:"A1 \u00B7 AHV/IV/EO-Abzug",text:"Bruttolohn CHF 6'000. Wie hoch ist der AHV/IV/EO-Abzug des Arbeitnehmers (5.3%)?",erwartet:318,einheit:"CHF",toleranz:.5,loesung:"6'000 \u00D7 5.3% = CHF 318.00."},{id:"b6-2-A2",typ:"kennzahl",label:"A2 \u00B7 ALV-Abzug",text:"Bruttolohn CHF 6'000. Wie hoch ist der ALV-Abzug des Arbeitnehmers (1.1%)?",erwartet:66,einheit:"CHF",toleranz:.5,loesung:"6'000 \u00D7 1.1% = CHF 66.00."},{id:"b6-2-A3",typ:"kennzahl",label:"A3 \u00B7 NBU-Abzug",text:"Bruttolohn CHF 6'000. Wie hoch ist der NBU-Abzug des Arbeitnehmers (1.4%)?",erwartet:84,einheit:"CHF",toleranz:.5,loesung:"6'000 \u00D7 1.4% = CHF 84.00."},{id:"b6-2-A4",typ:"kennzahl",label:"A4 \u00B7 Summe Sozialabz\u00FCge",text:"Wie hoch ist die Summe der Sozialabz\u00FCge AHV/IV/EO, ALV und NBU zusammen (CHF)?",erwartet:468,einheit:"CHF",toleranz:.5,loesung:"318 + 66 + 84 = CHF 468.00. Dieser Betrag wird sp\u00E4ter als Verbindlichkeit Sozialversicherungen gebucht."},{typ:"abschnitt",label:"Teil B \u00B7 Nettolohn (Bruttolohn CHF 6'000)",farbe:"#1D4ED8",intro:"Zus\u00E4tzlich zu den Sozialabz\u00FCgen werden ein BVG-Anteil von CHF 300 und eine Quellensteuer von CHF 480 abgezogen."},{id:"b6-2-B1",typ:"kennzahl",label:"B1 \u00B7 Summe aller Abz\u00FCge",text:"Summe aller Arbeitnehmerabz\u00FCge: Sozialabz\u00FCge CHF 468, BVG CHF 300, Quellensteuer CHF 480. Wie hoch ist die Summe (CHF)?",erwartet:1248,einheit:"CHF",toleranz:.5,loesung:"468 + 300 + 480 = CHF 1'248.00."},{id:"b6-2-B2",typ:"kennzahl",label:"B2 \u00B7 Nettolohn",text:"Wie hoch ist der Nettolohn (Bruttolohn 6'000 minus alle Abz\u00FCge 1'248)?",erwartet:4752,einheit:"CHF",toleranz:.5,loesung:"6'000 \u2212 1'248 = CHF 4'752.00. Das ist der ausbezahlte Betrag."},{typ:"abschnitt",label:"Teil C \u00B7 Zweiter Mitarbeitender (Bruttolohn CHF 8'000)",farbe:"#15803D",intro:"Gleiche S\u00E4tze. BVG-Anteil CHF 360, keine Quellensteuer."},{id:"b6-2-C1",typ:"kennzahl",label:"C1 \u00B7 Summe Sozialabz\u00FCge",text:"Bruttolohn CHF 8'000. Summe AHV/IV/EO (5.3%), ALV (1.1%) und NBU (1.4%) zusammen (CHF)?",erwartet:624,einheit:"CHF",toleranz:.5,loesung:"8'000 \u00D7 (5.3% + 1.1% + 1.4%) = 8'000 \u00D7 7.8% = CHF 624.00."},{id:"b6-2-C2",typ:"kennzahl",label:"C2 \u00B7 Nettolohn",text:"Nettolohn bei Bruttolohn 8'000, Sozialabz\u00FCge 624, BVG 360, keine Quellensteuer (CHF)?",erwartet:7016,einheit:"CHF",toleranz:.5,loesung:"8'000 \u2212 624 \u2212 360 = CHF 7'016.00."}]},b6_aufgabe3={title:"Aufgabe 3: Verbuchung der Lohnzahlung",subtitle:"Bruttolohn als Personalaufwand, Abz\u00FCge als Verbindlichkeiten",tabLabel:"Aufgabe 3",context:"Bei der Lohnzahlung wird der Bruttolohn als Personalaufwand belastet. Die Arbeitnehmerabz\u00FCge gehen als Verbindlichkeiten an die Sozialwerke, der Nettolohn wird ab Bank ausbezahlt. AHV/IV/EO, ALV und NBU werden zusammen als \u00ABVerbindlichkeiten Sozialversicherungen\u00BB gebucht, der BVG-Anteil als \u00ABVerbindlichkeiten Personalvorsorge\u00BB, die Quellensteuer separat.",theorie:{title:"Theorie: Buchung der Lohnzahlung",blocks:[{type:"text",text:"Die Lohnbuchung ist eine zusammengesetzte Buchung: ein Soll-Konto (Personalaufwand mit dem Bruttolohn) und mehrere Haben-Konten (die Verbindlichkeiten gegen\u00FCber den Sozialwerken sowie die Bank f\u00FCr den Nettolohn)."},{type:"formel",text:"Personalaufwand (brutto) = Verbindlichkeiten Sozialversicherungen + Verbindlichkeiten Personalvorsorge + Verbindlichkeiten Quellensteuer + Bank (netto)"},{type:"beispiel",text:"Bruttolohn CHF 6'000. Personalaufwand 6'000 an: Verbindlichkeiten Sozialversicherungen 468 (AHV/IV/EO 318 + ALV 66 + NBU 84), Verbindlichkeiten Personalvorsorge 300, Verbindlichkeiten Quellensteuer 480, Bank 4'752 (Nettolohn)."},{type:"merksatz",text:"Die Summe der Haben-Betr\u00E4ge entspricht immer genau dem Bruttolohn. Stimmt das nicht, ist ein Abzug falsch berechnet oder fehlt."}]},faelle:[{typ:"abschnitt",label:"Teil A \u00B7 Vollst\u00E4ndige Lohnbuchung (Bruttolohn CHF 6'000)",farbe:"#0F766E",intro:"Abz\u00FCge: AHV/IV/EO 318, ALV 66, NBU 84 (zusammen Sozialversicherungen 468), BVG-Anteil 300, Quellensteuer 480. Nettolohn 4'752
