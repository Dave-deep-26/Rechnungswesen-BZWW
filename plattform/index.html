n CHF 6'000 auf das Bankkonto.",anzahlBuchungen:1,loesungen:[[{sollKeys:["bank"],habenKeys:["anzahlungenkunden"],betrag:6000}]]},{id:"pt-1-B5",label:"B5",text:"Die Arbeitgeberbeiträge an die Sozialversicherungen von CHF 850 werden erfasst (noch keine Zahlung).",anzahlBuchungen:1,loesungen:[[{sollKeys:["sozialversicherungsaufwand"],habenKeys:["verbindlichkeitensozial"],betrag:850}]]},{id:"pt-1-B6",label:"B6",text:"Ein Lieferwagen wird zum Buchwert von CHF 8'000 per Bank verkauft. Anschaffungswert CHF 30'000, kumulierte Wertberichtigung CHF 22'000, indirekte Methode. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["wbfahrzeuge"],habenKeys:["fahrzeuge"],betrag:22000},{sollKeys:["bank"],habenKeys:["fahrzeuge"],betrag:8000}]]},{id:"pt-1-B7",label:"B7",text:"Ein Mieter überweist im Dezember 20_1 den Mietzins für Januar 20_2: CHF 2'400. Der Betrag wurde vollständig als Mietertrag verbucht. Abschlussbuchung per 31.12.20_1.",anzahlBuchungen:1,loesungen:[[{sollKeys:["mietertrag"],habenKeys:["transitorischepassiven"],betrag:2400}]]},{id:"pt-1-B8",label:"B8",text:"Zinsen von CHF 900 für das Jahr 20_1 werden erst am 31.3.20_2 gutgeschrieben. Abschlussbuchung per 31.12.20_1.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischeaktiven"],habenKeys:["zinsertrag"],betrag:900}]]},{id:"pt-1-B9",label:"B9",text:"Ein Kunde klagt wegen eines Rahmenbruchs. Der Anwalt hält eine Verurteilung für wahrscheinlich und schätzt die Belastung auf CHF 25'000.",anzahlBuchungen:1,loesungen:[[{sollKeys:["uebrigeraufwand"],habenKeys:["rueckstellungen"],betrag:25000}]]},{id:"pt-1-B10",label:"B10",text:"Abschreibung der Fahrzeuge CHF 9'600 nach der direkten Methode.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["fahrzeuge"],betrag:9600}]]},{id:"pt-1-B11",label:"B11",text:"Rücksendung mangelhafter Ware an den Lieferanten: netto CHF 1'500 plus 8.1% MWST. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["verbindlichkeiten"],habenKeys:["warenaufwand"],betrag:1500},{sollKeys:["verbindlichkeiten"],habenKeys:["vorsteuer"],betrag:121.5}]]},{id:"pt-1-B12",label:"B12",text:"Ein vor vier Jahren abgeschriebener Kunde überweist unerwartet CHF 380 auf das Bankkonto.",anzahlBuchungen:1,loesungen:[[{sollKeys:["bank"],habenKeys:["aoertrag","verlusteausforderungen","uebrigerertrag"],betrag:380}]]}]};pt_aufgabe2={title:"Aufgabe 2: Der Abschlussfall Velowerk 20_1",subtitle:"Ein durchgehender Jahresabschluss über alle Themen",tabLabel:"Abschlussfall",context:"Ein einziger Fall, acht Abschlussbuchungen, vier Auswertungsfragen. Genau so ist eine Abschlussprüfung aufgebaut: Die Themen greifen ineinander und ein Fehler am Anfang zieht sich durch.",theorie:{title:"Auszug aus der Rohbilanz per 31.12.20_1 (vor Abschlussbuchungen)",blocks:[{type:"list",items:["Nettoerlös CHF 1'800'000 · Warenaufwand CHF 1'080'000 · Personalaufwand CHF 420'000","Forderungen L+L CHF 240'000, davon EUR-Forderung von EUR 20'000 zum Kurs 0.94 bilanziert","Maschinen (Anschaffungswert, Kauf 1.1.20_1) CHF 120'000, Wertberichtigung CHF 0","Fahrzeuge (Anschaffungswert) CHF 48'000, Wertberichtigung Fahrzeuge CHF 9'600","Vorsteuer CHF 96'000 · Umsatzsteuer CHF 145'800","Versicherungsprämie: am 1.10.20_1 CHF 3'600 für zwölf Monate bezahlt"]},{type:"merksatz",text:"Arbeite die Buchungen in der vorgegebenen Reihenfolge durch. Die Kennzahlen in Teil B bauen auf deinen Ergebnissen aus Teil A auf."}]},faelle:[{typ:"abschnitt",label:"Teil A · Die acht Abschlussbuchungen",farbe:"#1B6B63",intro:"Alle Buchungen per 31.12.20_1. Indirekte Abschreibungsmethode."},{id:"pt-2-A1",label:"A1 · Wertberichtigung Forderungen",text:"Auf den Forderungen von CHF 240'000 wird pauschal eine Wertberichtigung von 5 Prozent gebildet.",anzahlBuchungen:1,loesungen:[[{sollKeys:["verlusteausforderungen"],habenKeys:["wbforderungen"],betrag:12000}]]},{id:"pt-2-A2",label:"A2 · Bewertung der EUR-Forderung",text:"Die EUR-Forderung von EUR 20'000 ist zum Kurs 0.94 bilanziert. Der Stichtagskurs beträgt 0.92. Verbuche die Bewertung zum Bilanzstichtag.",anzahlBuchungen:1,loesungen:[[{sollKeys:["kursverlust"],habenKeys:["forderungen"],betrag:400}]]},{id:"pt-2-A3",label:"A3 · Versicherungsprämie abgrenzen",text:"Von der am 1.10.20_1 bezahlten Jahresprämie von CHF 3'600 gehören neun Monate ins Jahr 20_2. Verbuche die Abgrenzung.",anzahlBuchungen:1,loesungen:[[{sollKeys:["transitorischeaktiven"],habenKeys:["versicherungsaufwand"],betrag:2700}]]},{id:"pt-2-A4",label:"A4 · Ausstehende Stromrechnung",text:"Die Stromrechnung für Dezember 20_1 über CHF 3'200 trifft erst im Januar 20_2 ein. Verbuche die Abgrenzung.",anzahlBuchungen:1,loesungen:[[{sollKeys:["uebrigeraufwand"],habenKeys:["transitorischepassiven"],betrag:3200}]]},{id:"pt-2-A5",label:"A5 · Garantierückstellung",text:"Erfahrungsgemäss fallen 2 Prozent des Nettoerlöses als Garantiekosten an. Bilde die Rückstellung als Ertragsminderung.",anzahlBuchungen:1,loesungen:[[{sollKeys:["verkaufsertrag"],habenKeys:["rueckstellungen"],betrag:36000}]]},{id:"pt-2-A6",label:"A6 · Abschreibung Maschinen",text:"Die Maschinen werden linear über fünf Jahre abgeschrieben, ohne Restwert. Verbuche indirekt.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["wbmaschinen"],betrag:24000}]]},{id:"pt-2-A7",label:"A7 · Abschreibung Fahrzeuge",text:"Die Fahrzeuge werden degressiv mit 25 Prozent vom Buchwert abgeschrieben. Buchwert vor der Abschreibung: CHF 38'400. Verbuche indirekt.",anzahlBuchungen:1,loesungen:[[{sollKeys:["abschreibungen"],habenKeys:["wbfahrzeuge"],betrag:9600}]]},{id:"pt-2-A8",label:"A8 · MWST-Abrechnung mit der ESTV",text:"Die Umsatzsteuer von CHF 145'800 wird mit der Vorsteuer von CHF 96'000 verrechnet, der Saldo wird per Bank überwiesen. (2 Buchungen)",anzahlBuchungen:2,loesungen:[[{sollKeys:["mwstpflicht"],habenKeys:["vorsteuer"],betrag:96000},{sollKeys:["mwstpflicht"],habenKeys:["bank"],betrag:49800}]]},{typ:"abschnitt",label:"Teil B · Auswertung",farbe:"#1D4ED8",intro:"Nutze deine Ergebnisse aus Teil A."},{id:"pt-2-B1",typ:"kennzahl",label:"B1 · Buchwert Maschinen",text:"Wie hoch ist der Buchwert der Maschinen per 31.12.20_1 (CHF)?",erwartet:96000,einheit:"CHF",toleranz:.5,loesung:"Anschaffungswert 120'000 minus Wertberichtigung 24'000 = CHF 96'000."},{id:"pt-2-B2",typ:"kennzahl",label:"B2 · Buchwert Fahrzeuge",text:"Wie hoch ist der Buchwert der Fahrzeuge per 31.12.20_1 (CHF)?",erwartet:28800,einheit:"CHF",toleranz:.5,loesung:"Anschaffungswert 48'000 minus Wertberichtigung 9'600 (Vorjahr) minus 9'600 (20_1) = CHF 28'800."},{id:"pt-2-B3",typ:"kennzahl",label:"B3 · Ergebniswirkung der Buchungen A1 bis A7",text:"Um wie viele CHF sinkt das Jahresergebnis 20_1 durch die Buchungen A1 bis A7 insgesamt?",erwartet:82500,einheit:"CHF",toleranz:.5,loesung:"Mehraufwand: 12'000 + 400 + 3'200 + 36'000 + 24'000 + 9'600 = 85'200. Die Abgrenzung A3 vermindert den Aufwand um 2'700. Nettowirkung: 85'200 minus 2'700 = CHF 82'500 tieferes Ergebnis."},{id:"pt-2-B4",typ:"kennzahl",label:"B4 · Zahlung an die ESTV",text:"Wie hoch ist die Zahlung an die ESTV (CHF)?",erwartet:49800,einheit:"CHF",toleranz:.5,loesung:"Umsatzsteuer 145'800 minus Vorsteuer 96'000 = CHF 49'800."},{id:"pt-2-B5",typ:"interpretation",label:"B5 · Beurteilung",text:"Die Geschäftsleitung möchte die Garantierückstellung auf CHF 90'000 erhöhen, um Steuern zu sparen. Nimm in drei Punkten Stellung.",musterloesung:["Stille Reserve: Die Differenz von CHF 54'000 zum begründbaren Betrag ist eine stille Reserve. Fremdkapital zu hoch, Eigenkapital und Gewinn zu tief ausgewiesen.","Nur Verschiebung: Wird die Rückstellung später nicht gebraucht, erhöht die Auflösung den Gewinn des Folgejahres. Der Steuereffekt wird verschoben, nicht eingespart.","Steuerliches Risiko: Geschäftsmässig nicht begründete Rückstellungen werden von der Steuerbehörde aufgerechnet. Handelsrechtlich zulässig (OR 960e Abs. 4), steuerrechtlich nicht anerkannt.","Aussagekraft: Die Jahresrechnung verliert an Informationswert für Bank, Investoren und die Geschäftsleitung selbst."]}]};pt_aufgabe3={title:"Aufgabe 3: Fehlersuche",subtitle:"15 gebuchte Fälle beurteilen und korrigieren",tabLabel:"Fehlersuche",context:"Ein Buchungssatz ist gegeben. Ist er richtig oder falsch? Diese Aufgabe trainiert eine andere Fähigkeit als das selbständige Buchen und deckt Wissenslücken auf, die beim eigenen Buchen verborgen bleiben.",theorie:{title:"Worauf du besonders achtest",blocks:[{type:"list",items:["Verwendung einer Rückstellung geht gegen die Rückstellung, nicht gegen den Aufwand oder den Ertrag.","Abgrenzung oder Rückstellung? Betrag bekannt bedeutet Abgrenzung.","Bei MWST immer netto in den Erfolg, die Steuer separat.","Anzahlungen sind Bestandeskonten, kein Aufwand und kein Ertrag.","Bei indirekter Abschreibung wird beim Abgang zuerst die Wertberichtigung ausgebucht."]}]},faelle:[{typ:"abschnitt",label:"Teil A · Rückstellungen und Abschreibungen",farbe:"#1B6B63"},{id:"pt-3-A1",typ:"multiplechoice",label:"A1",text:"Velowerk bezahlt einen Garantiefall von CHF 8'000 per Bank und bucht: Verkaufsertrag / Bank. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Rückstellungen / Bank","Falsch, richtig wäre: Bank / Rückstellungen","Falsch, richtig wäre: Verkaufsertrag / Rückstellungen"],korrekt:1,loesung:"Falsch. Die Belastung wurde bereits im Jahr der Bildung erfasst, dort wurde der Verkaufsertrag gekürzt. Die Zahlung belastet nun die Rückstellung: Rückstellungen / Bank. Sonst würde dieselbe Belastung zweimal in der Erfolgsrechnung erscheinen."},{id:"pt-3-A2",typ:"multiplechoice",label:"A2",text:"Eine nicht mehr benötigte Garantierückstellung von CHF 5'000 wird gebucht als: Rückstellungen / Garantieaufwand. Beurteile.",antworten:["Falsch, richtig wäre: Rückstellungen / Verkaufsertrag","Richtig gebucht","Falsch, richtig wäre: Verkaufsertrag / Rückstellungen","Falsch, es braucht keine Buchung"],korrekt:0,loesung:"Falsch. Die Garantierückstellung wurde als Ertragsminderung gebildet, also wird sie auch über den Verkaufsertrag aufgelöst: Rückstellungen / Verkaufsertrag. Bei Prozess und Steuerrückstellungen, die über den Aufwand gebildet wurden, erfolgt die Auflösung über den übrigen betrieblichen Ertrag."},{id:"pt-3-A3",typ:"multiplechoice",label:"A3",text:"Die Abschreibung der Maschinen von CHF 24'000 soll indirekt verbucht werden. Gebucht wurde: Abschreibungen / Maschinen. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Maschinen / Abschreibungen","Falsch, richtig wäre: Abschreibungen / Wertberichtigung Maschinen","Falsch, richtig wäre: Wertberichtigung Maschinen / Maschinen"],korrekt:2,loesung:"Falsch. Das ist die direkte Methode. Indirekt bleibt das Anlagekonto beim Anschaffungswert stehen und die Abschreibung läuft über das Wertberichtigungskonto."},{id:"pt-3-A4",typ:"multiplechoice",label:"A4",text:"Für den geplanten Umbau der Werkstatt im Jahr 20_2 (Kostenschätzung CHF 60'000) wird gebucht: Übriger Betriebsaufwand / Rückstellungen. Beurteile.",antworten:["Richtig gebucht, das Vorsichtsprinzip verlangt es","Falsch, es braucht keine Buchung: keine Verpflichtung gegenüber Dritten","Falsch, richtig wäre eine passive Rechnungsabgrenzung","Falsch, richtig wäre: Rückstellungen / Übriger Betriebsaufwand"],korrekt:1,loesung:"Falsch. Ein eigener Investitionsentscheid ist keine Verpflichtung gegenüber Dritten und jederzeit abänderbar. Es entsteht keine Rückstellung."},{id:"pt-3-A5",typ:"multiplechoice",label:"A5",text:"Ein Lieferwagen mit Anschaffungswert CHF 30'000 und Wertberichtigung CHF 22'000 wird zum Buchwert von CHF 8'000 verkauft. Gebucht wurde nur: Bank / Fahrzeuge 8'000. Beurteile.",antworten:["Richtig gebucht","Falsch, der Betrag müsste CHF 30'000 lauten","Falsch, es fehlt die Ausbuchung: Wertberichtigung Fahrzeuge / Fahrzeuge 22'000","Falsch, richtig wäre: Fahrzeuge / Bank 8'000"],korrekt:2,loesung:"Unvollständig. Ohne Ausbuchung der Wertberichtigung bleiben auf dem Anlagekonto CHF 22'000 und auf dem Wertberichtigungskonto CHF 22'000 für ein nicht mehr vorhandenes Fahrzeug stehen."},{id:"pt-3-A6",typ:"multiplechoice",label:"A6",text:"Die geschätzten, noch nicht veranlagten Gewinnsteuern von CHF 18'000 werden im Eigenkapital als Reserve ausgewiesen. Beurteile.",antworten:["Richtig, Steuern sind Gewinnverwendung","Falsch, die Position gehört als Rückstellung ins Fremdkapital","Falsch, es braucht keine Buchung","Falsch, richtig wäre eine aktive Rechnungsabgrenzung"],korrekt:1,loesung:"Falsch. Es besteht eine Verpflichtung gegenüber dem Steueramt, die Höhe ist geschätzt. Das ist eine Rückstellung im Fremdkapital: Direkte Steuern / Rückstellungen."},{typ:"abschnitt",label:"Teil B · Abgrenzung, MWST, Fremdwährung, Lohn",farbe:"#1D4ED8"},{id:"pt-3-B1",typ:"multiplechoice",label:"B1",text:"Die im Dezember 20_1 vorausbezahlte Miete für Januar 20_2 von CHF 4'500 wird gebucht als: Mietaufwand / Transitorische Aktiven. Beurteile.",antworten:["Richtig gebucht","Falsch, die Konten sind vertauscht: Transitorische Aktiven / Mietaufwand","Falsch, richtig wäre: Mietaufwand / Transitorische Passiven","Falsch, es braucht keine Buchung"],korrekt:1,loesung:"Falsch. Der Aufwand des alten Jahres wird vermindert und ein Guthaben aktiviert: Transitorische Aktiven / Mietaufwand."},{id:"pt-3-B2",typ:"multiplechoice",label:"B2",text:"Die Stromrechnung für Dezember über CHF 3'200 trifft im Januar ein. Gebucht wurde: Übriger Betriebsaufwand / Rückstellungen. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Übriger Betriebsaufwand / Transitorische Passiven","Falsch, richtig wäre: Transitorische Aktiven / Übriger Betriebsaufwand","Falsch, es braucht keine Buchung"],korrekt:1,loesung:"Falsch. Betrag und Verpflichtung sind bekannt, also Rechnungsabgrenzung statt Rückstellung. Eine Rückstellung setzt Ungewissheit bei Höhe oder Fälligkeit voraus."},{id:"pt-3-B3",typ:"multiplechoice",label:"B3",text:"Wareneinkauf brutto CHF 5'405 inkl. 8.1% MWST auf Rechnung. Gebucht wurde: Warenaufwand / Verbindlichkeiten 5'405. Beurteile.",antworten:["Richtig gebucht","Falsch, der Warenaufwand beträgt CHF 5'000, die Vorsteuer CHF 405","Falsch, der Warenaufwand beträgt CHF 4'967, die Vorsteuer CHF 438","Falsch, richtig wäre: Verbindlichkeiten / Warenaufwand 5'405"],korrekt:1,loesung:"Falsch. In den Erfolg gehört nur der Nettobetrag. 5'405 geteilt durch 1.081 = 5'000, MWST 405 auf das Vorsteuerkonto."},{id:"pt-3-B4",typ:"multiplechoice",label:"B4",text:"Ein Kunde leistet eine Anzahlung von CHF 6'000 per Bank. Gebucht wurde: Bank / Warenertrag. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Bank / Anzahlungen von Kunden","Falsch, richtig wäre: Anzahlungen von Kunden / Bank","Falsch, richtig wäre: Bank / Forderungen"],korrekt:1,loesung:"Falsch. Die Leistung ist noch nicht erbracht, es liegt kein realisierter Ertrag vor. Die Anzahlung ist eine Verpflichtung: Bank / Anzahlungen von Kunden."},{id:"pt-3-B5",typ:"multiplechoice",label:"B5",text:"Eine EUR-Verbindlichkeit von CHF 3'800 wird zum Kurs 0.97 mit CHF 3'880 bezahlt. Gebucht wurde: Verbindlichkeiten / Bank 3'880. Beurteile.",antworten:["Richtig gebucht","Falsch, die Differenz von CHF 80 gehört auf Kursverlust","Falsch, die Differenz von CHF 80 gehört auf Warenaufwand","Falsch, die Differenz von CHF 80 gehört auf Kursgewinn"],korrekt:1,loesung:"Falsch. Die Verbindlichkeit steht mit CHF 3'800 in den Büchern und wird mit diesem Betrag ausgebucht. Die Differenz von CHF 80 ist ein Kursverlust."},{id:"pt-3-B6",typ:"multiplechoice",label:"B6",text:"Die Arbeitgeberbeiträge an die Sozialversicherungen von CHF 850 werden gebucht als: Personalaufwand / Bank. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Sozialversicherungsaufwand / Verbindlichkeiten Sozialversicherungen","Falsch, richtig wäre: Verbindlichkeiten Sozialversicherungen / Bank","Falsch, es braucht keine Buchung, der Beitrag ist im Bruttolohn enthalten"],korrekt:1,loesung:"Falsch. Der Arbeitgeberbeitrag ist ein eigener Aufwand und wird noch nicht bezahlt. Erst die spätere Zahlung lautet: Verbindlichkeiten Sozialversicherungen / Bank."},{id:"pt-3-B7",typ:"multiplechoice",label:"B7",text:"Auf den Forderungen von CHF 240'000 wird ein Delkredere von 5 Prozent gebildet. Gebucht wurde: Forderungen / Wertberichtigung Forderungen 12'000. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Verlust aus Forderungen / Wertberichtigung Forderungen","Falsch, richtig wäre: Wertberichtigung Forderungen / Forderungen","Falsch, der Betrag müsste CHF 12'631 lauten"],korrekt:1,loesung:"Falsch. Die Bildung der Wertberichtigung ist erfolgswirksam und belastet den Verlust aus Forderungen. Das Forderungskonto bleibt unverändert."},{id:"pt-3-B8",typ:"multiplechoice",label:"B8",text:"Ein Kunde bezahlt eine Rechnung von CHF 10'000 unter Abzug von 2 Prozent Skonto. Gebucht wurde: Bank / Forderungen 9'800. Beurteile.",antworten:["Richtig gebucht","Unvollständig, es fehlt: Erlösminderungen / Forderungen 200","Falsch, der Betrag müsste CHF 10'000 lauten","Unvollständig, es fehlt: Forderungen / Skontoertrag 200"],korrekt:1,loesung:"Unvollständig. Ohne die zweite Buchung bleiben CHF 200 als offene Forderung stehen, obwohl der Kunde nichts mehr schuldet. Das Skonto ist eine Erlösminderung."},{id:"pt-3-B9",typ:"multiplechoice",label:"B9",text:"Der Mietzins für Januar 20_2 von CHF 2'400 ist im Dezember 20_1 eingegangen und vollständig als Mietertrag verbucht. Abschlussbuchung: Transitorische Aktiven / Mietertrag. Beurteile.",antworten:["Richtig gebucht","Falsch, richtig wäre: Mietertrag / Transitorische Passiven","Falsch, richtig wäre: Mietertrag / Transitorische Aktiven","Falsch, es braucht keine Buchung"],korrekt:1,loesung:"Falsch. Wir haben Geld erhalten und schulden noch die Leistung. Das ist eine Verpflichtung, also eine transitorische Passive: Mietertrag / Transitorische Passiven."}]};pt_aufgabe4={title:"Aufgabe 4: Kennzahlen im Zeitdruck",subtitle:"16 Rechnungen über alle Themen · Drill",tabLabel:"Kennzahlen",context:"Reines Rechentraining, gemischt über alle Blöcke. Ziel ist Sicherheit und Tempo: Diese Rechnungen dürfen in der Prüfung keine Denkzeit kosten. Rechne ohne Taschenrechner-Pausen durch und runde auf Rappen.",theorie:{title:"Die Formeln auf einen Blick",blocks:[{type:"formel",text:"Netto = Brutto ÷ (1 + Satz)   |   MWST = Brutto − Netto   |   MWST-Schuld = Umsatzsteuer − Vorsteuer"},{type:"formel",text:"CHF = Fremdwährung × Kurs   |   Nettolohn = Bruttolohn − Summe Abzüge"},{type:"formel",text:"Linear = Anschaffungswert ÷ Nutzungsdauer   |   Degressiv = Buchwert × Satz"},{type:"formel",text:"Stille Reserve = Marktwert (oder interner Wert) − Buchwert   |   EBITDA = EBIT + Abschreibungen"}]},faelle:[{typ:"abschnitt",label:"Teil A · MWST, Fremdwährung, Lohn",farbe:"#1B6B63"},{id:"pt-4-A1",typ:"kennzahl",label:"A1",text:"Bruttobetrag CHF 5'405 inkl. 8.1% MWST. Wie hoch ist der MWST-Betrag (CHF)?",erwartet:405,einheit:"CHF",toleranz:.5,loesung:"Netto = 5'405 ÷ 1.081 = 5'000. MWST = CHF 405."},{id:"pt-4-A2",typ:"kennzahl",label:"A2",text:"Nettobetrag CHF 8'000. Wie hoch ist der Bruttobetrag bei 8.1% MWST (CHF)?",erwartet:8648,einheit:"CHF",toleranz:.5,loesung:"8'000 × 1.081 = CHF 8'648."},{id:"pt-4-A3",typ:"kennzahl",label:"A3",text:"Umsatzsteuer CHF 64'800, Vorsteuer CHF 38'900. Wie hoch ist die Zahlung an die ESTV (CHF)?",erwartet:25900,einheit:"CHF",toleranz:.5,loesung:"64'800 − 38'900 = CHF 25'900."},{id:"pt-4-A4",typ:"kennzahl",label:"A4",text:"Bruttoumsatz CHF 250'000, Saldosteuersatz 5.1%. Wie hoch ist die MWST-Schuld (CHF)?",erwartet:12750,einheit:"CHF",toleranz:.5,loesung:"250'000 × 5.1% = CHF 12'750. Bei der Saldosteuersatzmethode wird der Satz direkt auf den Bruttoumsatz angewendet, ein Vorsteuerabzug entfällt."},{id:"pt-4-A5",typ:"kennzahl",label:"A5",text:"Rechnung über EUR 12'500 zum Kurs 0.9450. Wie hoch ist der Betrag in CHF?",erwartet:11812.5,einheit:"CHF",toleranz:.5,loesung:"12'500 × 0.9450 = CHF 11'812.50."},{id:"pt-4-A6",typ:"kennzahl",label:"A6",text:"Eine Forderung von EUR 20'000 ist zum Kurs 0.94 bilanziert. Stichtagskurs 0.92. Wie hoch ist die Kursdifferenz (CHF)?",erwartet:400,einheit:"CHF",toleranz:.5,loesung:"20'000 × 0.94 = 18'800. 20'000 × 0.92 = 18'400. Differenz CHF 400, ein Kursverlust."},{id:"pt-4-A7",typ:"kennzahl",label:"A7",text:"Bruttolohn CHF 7'200. Abzüge: AHV/IV/EO 5.3%, ALV 1.1%, NBU 1.4%. Wie hoch ist der Nettolohn (CHF)?",erwartet:6638.4,einheit:"CHF",toleranz:.5,loesung:"Total Abzugssatz 7.8%. 7'200 × 7.8% = 561.60. Nettolohn = 7'200 − 561.60 = CHF 6'638.40."},{id:"pt-4-A8",typ:"kennzahl",label:"A8",text:"Die Jahresmiete von CHF 18'000 wurde am 1.11.20_1 für zwölf Monate bezahlt. Wie hoch ist die aktive Rechnungsabgrenzung per 31.12.20_1 (CHF)?",erwartet:15000,einheit:"CHF",toleranz:.5,loesung:"Zehn von zwölf Monaten gehören ins Jahr 20_2: 18'000 ÷ 12 × 10 = CHF 15'000."},{typ:"abschnitt",label:"Teil B · Abschreibungen, Rückstellungen, stille Reserven",farbe:"#1D4ED8"},{id:"pt-4-B1",typ:"kennzahl",label:"B1",text:"Anschaffungswert CHF 90'000, Nutzungsdauer 6 Jahre, linear, kein Restwert. Wie hoch ist die Jahresabschreibung (CHF)?",erwartet:15000,einheit:"CHF",toleranz:.5,loesung:"90'000 ÷ 6 = CHF 15'000."},{id:"pt-4-B2",typ:"kennzahl",label:"B2",text:"Anschaffungswert CHF 120'000, Nutzungsdauer 5 Jahre, linear. Wie hoch ist der Buchwert nach zwei Jahren (CHF)?",erwartet:72000,einheit:"CHF",toleranz:.5,loesung:"Jahresabschreibung 24'000. Nach zwei Jahren: 120'000 − 48'000 = CHF 72'000."},{id:"pt-4-B3",typ:"kennzahl",label:"B3",text:"Anschaffungswert CHF 200'000, degressiv 30%. Wie hoch ist die Abschreibung im dritten Jahr (CHF)?",erwartet:29400,einheit:"CHF",toleranz:.5,loesung:"Jahr 1: 60'000, Buchwert 140'000. Jahr 2: 42'000, Buchwert 98'000. Jahr 3: 98'000 × 30% = CHF 29'400."},{id:"pt-4-B4",typ:"kennzahl",label:"B4",text:"Anschaffungswert CHF 60'000, Restwert CHF 10'000, Nutzungsdauer 5 Jahre, linear. Wie hoch ist die Jahresabschreibung (CHF)?",erwartet:10000,einheit:"CHF",toleranz:.5,loesung:"(60'000 − 10'000) ÷ 5 = CHF 10'000. Der Restwert wird nicht abgeschrieben."},{id:"pt-4-B5",typ:"kennzahl",label:"B5",text:"Bestand der Rückstellung CHF 40'000, Verwendung im Jahr CHF 28'000, Neubedarf per 31.12. CHF 30'000. Wie hoch ist die Nachbildung (CHF)?",erwartet:18000,einheit:"CHF",toleranz:.5,loesung:"Restbestand 40'000 − 28'000 = 12'000. Neubedarf 30'000. Nachbildung = CHF 18'000."},{id:"pt-4-B6",typ:"kennzahl",label:"B6",text:"Eine Maschine steht mit CHF 28'812 in der Bilanz, der Marktwert beträgt CHF 55'000. Wie hoch ist die stille Reserve (CHF)?",erwartet:26188,einheit:"CHF",toleranz:.5,loesung:"55'000 − 28'812 = CHF 26'188."},{id:"pt-4-B7",typ:"kennzahl",label:"B7",text:"Externer Gewinn CHF 100'000, im Geschäftsjahr wurden stille Reserven von CHF 20'000 gebildet. Wie hoch ist der interne Gewinn (CHF)?",erwartet:120000,einheit:"CHF",toleranz:.5,loesung:"Die Bildung stiller Reserven hat den externen Gewinn vermindert. Intern: 100'000 + 20'000 = CHF 120'000."},{id:"pt-4-B8",typ:"kennzahl",label:"B8",text:"Betriebsertrag CHF 800'000, Betriebsaufwand ohne Abschreibungen CHF 650'000, Abschreibungen CHF 60'000. Wie hoch ist der EBIT (CHF)?",erwartet:90000,einheit:"CHF",toleranz:.5,loesung:"800'000 − 650'000 − 60'000 = CHF 90'000. Der EBITDA läge bei CHF 150'000."}]};bloecke=[{id:"block1",label:"Block 1",title:"Grunds\xE4tze und Bewertung",description:"GoB, Grunds\xE4tze der Rechnungslegung, Vorsicht, Bewertungsmassst\xE4be, stille Reserven",aufgaben:[b1_aufgabe1,b1_aufgabe2,b1_aufgabe3,b1_aufgabe4,b1_aufgabe5]},{id:"block2",label:"Block 2",title:"Forderungen und Verbindlichkeiten",description:"Verlustf\xE4lle, Wertberichtigungen, Anzahlungen, Kunden- und Lieferantenanalyse",aufgaben:[b2_aufgabe1,b2_aufgabe2,b2_aufgabe3,b2_aufgabe4,b2_aufgabe5,b2_aufgabe6]},{id:"block3",label:"Block 3",title:"Warenhandel, Dienstleistung, Produktion",description:"Methoden mit/ohne Inventur, FIFO/LIFO/Durchschnitt, Dienstleistungs- und Produktionsbetriebe",aufgaben:[b3_aufgabe1,b3_aufgabe2,b3_aufgabe3,b3_aufgabe4,b3_aufgabe5,b3_auf bloecke[0].aufgaben[2].theorie.blocks[5].text="Rückstellungen und Verbindlichkeiten";
bloecke[0].aufgaben[2].theorie.blocks[6].text="Verbindlichkeiten werden zum Nennwert eingesetzt. Rückstellungen sind nach Art. 960e OR für erwartete Mittelabflüsse zu bilden und anhand der bestmöglichen Schätzung zu bemessen. Das Vorsichtsprinzip rechtfertigt nicht automatisch den höchstmöglichen Betrag.";
bloecke[0].aufgaben[2].theorie.blocks[9].text="Vorsicht ist in der Schweizer Rechnungslegung wichtig: erkennbare Risiken und Verluste werden berücksichtigt, nicht realisierte Gewinne dagegen zurückhaltend erfasst. Niederstwertprinzip und sachgerechte Rückstellungen können stille Reserven entstehen lassen.";
const b13a4=findPlatformItem("b1-3-A4");
b13a4.antworten[2]="CHF 500'000 (Maximalbetrag)";
b13a4.korrekt=1;
b13a4.loesung="CHF 350'000 als vereinfachte bestmögliche Schätzung bei gleich wahrscheinlichen Beträgen. Art. 960e OR verlangt die Rückstellung für den erwarteten Mittelabfluss; der Höchstbetrag ist nicht automatisch vorgeschrieben. In der Praxis sind Wahrscheinlichkeiten und verfügbare Informationen zu dokumentieren.";
const b14a1=findPlatformItem("b1-4-A1");
b14a1.erwartet=81900;
b14a1.loesung="80'000 − 2% (= 1'600) + 1'500 Transport + 2'000 Montage = CHF 81'900. Die Schulung von CHF 800 betrifft die Mitarbeitenden und wird als Periodenaufwand behandelt, nicht als Bestandteil der Maschine aktiviert.";
const b32e3=findPlatformItem("b3-2-E3");
b32e3.musterloesung[2]="Konsequenz bei einer Kotierung an SIX: Der zulässige Rechnungslegungsstandard hängt vom regulatorischen Standard ab. Möglich sind je nach Segment IFRS, US GAAP, Swiss GAAP FER oder der bankengesetzliche Standard; eine pauschale IFRS-Pflicht besteht nicht. Unter IFRS wäre LIFO ausgeschlossen.";

bloecke[3].aufgaben[0].theorie.blocks[6].left.text="Standardmethode. Vorsteuer und Umsatzsteuer werden detailliert verbucht; regulär wird quartalsweise abgerechnet. Seit 2025 kann bei erfüllten Voraussetzungen eine jährliche Abrechnung beantragt werden.";
bloecke[3].aufgaben[0].theorie.blocks[6].right.text="Vereinfacht: Ein bewilligter branchenspezifischer Saldosteuersatz wird auf den Bruttoumsatz angewendet. Grenzen: höchstens CHF 5,024 Mio. steuerbarer Jahresumsatz und CHF 108'000 Steuer pro Jahr. Regulär halbjährlich; eine jährliche Abrechnung kann unter zusätzlichen Voraussetzungen beantragt werden. Beim Methodenwechsel sind Fristen und seit 2025 auch Korrekturen auf Zeitwerten zu beachten.";
bloecke[3].aufgaben[0].theorie.blocks[8].text="MWST ist für das Unternehmen grundsätzlich ein durchlaufender Posten: beim Verkauf entsteht eine Schuld, beim Einkauf kann Vorsteuer abziehbar sein. Abgerechnet wird je nach Methode und bewilligter Periodizität. Die wirtschaftliche Belastung trägt grundsätzlich der Endkonsum.";
bloecke[3].aufgaben[0].faelle[5].loesung="Weniger administrativer Aufwand. Bei der Saldosteuersatzmethode muss die Vorsteuer nicht separat ermittelt werden; regulär wird halbjährlich statt quartalsweise abgerechnet. Seit 2025 ist bei erfüllten Voraussetzungen auch eine jährliche MWST-Abrechnung möglich.";
bloecke[3].aufgaben[3].context="Regulär wird bei der effektiven Methode quartalsweise und bei der Saldosteuersatzmethode halbjährlich abgerechnet. Seit 2025 können berechtigte Unternehmen auf Antrag jährlich abrechnen.";
bloecke[3].aufgaben[3].theorie.blocks[3].text="Positiver Saldo = wir schulden der ESTV. Negativer Saldo = die ESTV hat ein Guthaben zu erstatten oder anzurechnen. Bei regulärer quartalsweiser Abrechnung ist die Abrechnung innert 60 Tagen nach Periodenende einzureichen.";
bloecke[3].aufgaben[3].theorie.blocks[7].text="Bei der Saldosteuersatzmethode entfällt die separate Ermittlung der Vorsteuer. Stattdessen wird ein bewilligter Branchensatz auf den Bruttoumsatz angewendet (z. B. 2,1% für Sportartikelhandel oder 6,2% für Treuhandbüros, Stand 2025/2026). Das ist administrativ einfacher, kann je nach Vorsteuer- und Investitionsvolumen aber günstiger oder teurer sein als die effektive Methode.";
bloecke[3].aufgaben[3].theorie.blocks[8].left.text="Vorteil: effektiver Vorsteuerabzug. Nachteil: höherer Detailaufwand. Geeignet für vorsteuerintensive Unternehmen. Regulär quartalsweise; jährliche Abrechnung auf Antrag möglich.";
bloecke[3].aufgaben[3].theorie.blocks[8].right.text="Vorteil: vereinfachte Vorsteuerermittlung. Regulär halbjährlich; jährliche Abrechnung auf Antrag möglich. Die Methode ist an Umsatz- und Steuergrenzen gebunden; Methodenwechsel können Korrekturen auslösen.";
bloecke[3].aufgaben[3].theorie.blocks[10].text="Reguläre Periodizität: effektiv quartalsweise, Saldosteuersatz halbjährlich. Seit 2025 ist für berechtigte Unternehmen eine jährliche Abrechnung auf Antrag möglich. Die Methodenwahl und ein späterer Wechsel können Korrekturen auf Zeitwerten auslösen; bei wesentlichen Beträgen ist fachliche Beratung sinnvoll.";
bloecke[3].aufgaben[4].theorie.blocks[7].left.text="Detailliert mit effektivem Vorsteuerabzug. Regulär quartalsweise, auf Antrag gegebenenfalls jährlich. Geeignet für vorsteuerintensive Unternehmen und uneingeschränkt nach oben offen.";

function WBTabelleCard({ fall, state, setState }) {
  const h = React.createElement;
  const values = Array.isArray(state.werte) && state.werte.length === fall.zeilen.length
    ? state.werte
    : fall.zeilen.map(() => "");
  const total = state.total ?? "";
  const ready = values.every(value => String(value).trim() !== "") && String(total).trim() !== "";

  function updateValue(index, value) {
    const next = [...values];
    next[index] = value;
    setState({ ...state, werte: next, checked: false, correct: false });
  }

  function updateTotal(value) {
    setState({ ...state, total: value, checked: false, correct: false });
  }

  function checkTable() {
    const rowsCorrect = values.every((value, index) => {
      const number = toNum(value);
      return !Number.isNaN(number) && Math.abs(number - fall.zeilen[index].erwartet) <= 0.5;
    });
    const totalNumber = toNum(total);
    const totalCorrect = !Number.isNaN(totalNumber) && Math.abs(totalNumber - fall.erwartetTotal) <= 0.5;
    setState({ ...state, werte: values, total, checked: true, correct: rowsCorrect && totalCorrect });
  }

  function resetTable() {
    setState({ werte: fall.zeilen.map(() => ""), total: "", checked: false, correct: false });
  }

  const rows = fall.zeilen.map((row, index) => h("tr", {
    key: row.klasse,
    className: "border-t border-stone-100"
  },
    h("td", { className: "px-3 py-2 text-stone-700" }, row.klasse),
    h("td", { className: "px-3 py-2 text-right font-mono" }, "CHF ", row.betrag.toLocaleString("de-CH")),
    h("td", { className: "px-3 py-2 text-right font-mono" }, row.satz, "%"),
    h("td", { className: "px-3 py-2" }, h("input", {
      type: "text",
      inputMode: "decimal",
      autoComplete: "off",
      "aria-label": "Wertberichtigung " + row.klasse,
      placeholder: "CHF",
      value: values[index],
      onChange: event => updateValue(index, event.target.value),
      disabled: state.checked && state.correct,
      className: "w-full px-3 py-2 border border-stone-300 rounded-md text-right font-mono"
    }))
  ));

  rows.push(h("tr", { key: "total", className: "border-t border-stone-300 font-bold" },
    h("td", { className: "px-3 py-2", colSpan: 3 }, "Total"),
    h("td", { className: "px-3 py-2" }, h("input", {
      type: "text",
      inputMode: "decimal",
      autoComplete: "off",
      "aria-label": "Wertberichtigung Total",
      placeholder: "CHF",
      value: total,
      onChange: event => updateTotal(event.target.value),
      disabled: state.checked && state.correct,
      className: "w-full px-3 py-2 border border-stone-300 rounded-md text-right font-mono"
    }))
  ));

  const status = state.checked
    ? h("span", {
        className: state.correct ? "text-emerald-700 font-semibold" : "text-rose-700 font-semibold",
        role: "status"
      }, state.correct ? "Richtig" : "Noch nicht richtig")
    : null;

  return h("div", {
    className: "bg-white rounded-lg border " +
      (state.checked ? (state.correct ? "border-emerald-400" : "border-rose-400") : "border-stone-200") +
      " shadow-sm p-5 mb-4 transition-all"
  },
    h("div", { className: "flex items-start justify-between mb-3" },
      h("div", { className: "flex-1" },
        h("span", { className: "text-xs font-semibold tracking-widest text-[#1B6B63] uppercase" }, fall.label),
        h("p", { className: "text-stone-800 text-sm leading-relaxed mt-1" }, fall.text)
      ),
      status
    ),
    h("div", { className: "overflow-x-auto" },
      h("table", { className: "w-full text-sm" },
        h("thead", null,
          h("tr", null,
            h("th", { className: "px-3 py-2 text-left" }, "Fälligkeitsklasse"),
            h("th", { className: "px-3 py-2 text-right" }, "Forderung"),
            h("th", { className: "px-3 py-2 text-right" }, "Satz"),
            h("th", { className: "px-3 py-2 text-right" }, "Wertberichtigung")
          )
        ),
        h("tbody", null, rows)
      )
    ),
    h("div", { className: "flex flex-wrap gap-2 mt-4 no-print" },
      !state.correct && h("button", {
        type: "button",
        onClick: checkTable,
        disabled: !ready,
        className: "px-4 py-2 bg-[#1B6B63] text-white text-sm font-medium rounded-md disabled:opacity-30"
      }, "Prüfen"),
      state.checked && h("button", {
        type: "button",
        onClick: resetTable,
        className: "px-4 py-2 bg-stone-100 text-stone-700 text-sm font-medium rounded-md"
      }, "Zurücksetzen")
    ),
    state.checked && !state.correct && h("p", { className: "text-sm text-rose-700 mt-3" },
      "Prüfe jede Zeile und das Total. Zulässige Rundungsdifferenz: CHF 0.50."
    ),
    state.checked && h("p", { className: "text-sm text-stone-700 mt-3" },
      "Kontrolltotal: CHF ", fall.erwartetTotal.toLocaleString("de-CH")
    )
  );
}

<script>
  (function () {
    var STORAGE_KEY = 'finanzbuchhaltung-plattform-v2';
    var reset = document.getElementById('platform-reset-progress');
    if (reset) reset.addEventListener('click', function () {
      if (window.confirm('Wirklich den gesamten Lernfortschritt löschen? Das gilt für dein Konto auf allen Geräten.')) {
        localStorage.removeItem(STORAGE_KEY);
        var leer = { version: 2, block: 0, task: 0, progress: {} };
        var fertig = function () { window.location.reload(); };
        if (window.Zugang) Zugang.fortschrittSpeichern(STORAGE_KEY, leer).then(fertig, fertig);
        else fertig();
      }
    });

    function improveAccessibility() {
      document.querySelectorAll('button:not([type])').forEach(function (button) { button.type = 'button'; });
      document.querySelectorAll('input[placeholder]:not([aria-label])').forEach(function (input) {
        input.setAttribute('aria-label', input.getAttribute('placeholder'));
      });
      document.querySelectorAll('button').forEach(function (button) {
        var text = button.textContent.trim();
        if (text.endsWith('Verbergen')) button.setAttribute('aria-expanded', 'true');
        else if (text.endsWith('Anzeigen')) button.setAttribute('aria-expanded', 'false');
      });
      var progressLabel = Array.from(document.querySelectorAll('p')).find(function (node) { return node.textContent.trim() === 'Gesamtfortschritt'; });
      if (progressLabel && progressLabel.parentElement) {
        progressLabel.parentElement.setAttribute('role', 'status');
        progressLabel.parentElement.setAttribute('aria-live', 'polite');
      }
      document.querySelectorAll('div.border-emerald-400, div.border-rose-400').forEach(function (card) {
        if (card.querySelector('[data-result-announcement]')) return;
        var result = document.createElement('span');
        result.className = 'sr-only';
        result.dataset.resultAnnouncement = 'true';
        result.textContent = card.classList.contains('border-emerald-400') ? 'Antwort richtig.' : 'Antwort noch nicht richtig.';
        result.setAttribute('role', 'status');
        card.prepend(result);
      });
    }
    var observer = new MutationObserver(improveAccessibility);
    observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    improveAccessibility();

    window.addEventListener('online', function () {
      var status = document.getElementById('rewe-tutor-status');
      if (status) status.textContent = 'Internetverbindung wiederhergestellt.';
    });
    window.addEventListener('offline', function () {
      var status = document.getElementById('rewe-tutor-status');
      if (status) status.textContent = 'Offline: Der Tutor ist nicht verfügbar; die Übungen funktionieren weiter.';
    });

    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (error) {
          console.warn('Offline-Unterstützung konnte nicht aktiviert werden.', error);
        });
      });
    }
  })();
</script>
<script>
  (function () {
    var KEY = 'finanzbuchhaltung-plattform-v2';
    var root = document.getElementById('root');
    var timer = null, ausstehend = null;

    // savePlatformState ruft das bei jeder Änderung auf. Lokal ist es dann schon, hier geht es gebündelt an den Server.
    window.plattformFortschrittMelden = function (daten) {
      if (!window.Zugang) return;
      ausstehend = daten;
      clearTimeout(timer);
      timer = setTimeout(senden, 1500);
    };
    function senden() {
      clearTimeout(timer); timer = null;
      if (!ausstehend || !window.Zugang) return;
      var d = ausstehend; ausstehend = null;
      Zugang.fortschrittSpeichern(KEY, d);
    }
    window.addEventListener('pagehide', senden);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') senden(); });

    function anzeigen(status) {
      var wer = document.getElementById('platform-user');
      var logout = document.getElementById('platform-logout');
      if (wer && status && status.email) wer.textContent = ' · Angemeldet als ' + status.email;
      if (logout) {
        logout.hidden = false;
        logout.addEventListener('click', function () {
          senden();
          var weiter = function () { try { localStorage.removeItem(KEY); } catch (e) {} window.location.reload(); };
          if (window.Zugang) Zugang.abmelden().then(weiter, weiter); else weiter();
        });
      }
    }

    function gepufferterStatus() {
      try { var p = JSON.parse(localStorage.getItem('zugang:status')); return p && p.status; } catch (e) { return null; }
    }

    function meldung(text) {
      root.innerHTML = '<div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif">'
        + '<div style="max-width:420px;background:#fff;border:1px solid #E5E1DB;border-radius:14px;padding:24px;color:#1F2937;line-height:1.5">' + text
        + '<p style="margin:16px 0 0"><button type="button" onclick="location.reload()" style="background:#C2185B;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer">Neu laden</button></p></div></div>';
    }

    async function start() {
      if (!window.Zugang || !window.supabase) {
        // Skripte nicht geladen, z.B. offline ohne Cache. Wer angemeldet war, arbeitet lokal weiter.
        var st = gepufferterStatus();
        if (st && st.aktiv) { anzeigen(st); window.plattformStarten(); return; }
        meldung('<strong>Keine Verbindung.</strong><br>Für die erste Anmeldung brauchst du Internet. Danach funktioniert die Plattform auch offline.');
        return;
      }
      try {
        var status = await Zugang.zugangPruefen();
        var daten = await Zugang.fortschrittLaden(KEY, null);
        try {
          if (daten) localStorage.setItem(KEY, JSON.stringify(daten));
          else localStorage.removeItem(KEY); // neues Konto: kein Fortschritt eines anderen Kontos von diesem Gerät
        } catch (e) { /* egal */ }
        anzeigen(status);
        window.plattformStarten();
      } catch (e) {
        console.error(e);
        meldung('<strong>Anmeldung nicht möglich.</strong><br>' + (e && e.message ? e.message : ''));
      }
    }
    start();
  })();
</script>
</body>
</html>
